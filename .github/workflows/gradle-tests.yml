name: Gradle tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install frontend tooling
        run: npm ci

      - name: Rebuild CSS
        run: npm run build:css

      - name: Verify generated CSS is committed
        run: git diff --exit-code -- src/main/resources/static/css/app.css

      - name: Run tests
        run: ./gradlew test
