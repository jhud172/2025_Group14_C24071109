spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.security.jdbc.users-by-username-query=select username, password, enabled from users where username=?
spring.security.jdbc.authorities-by-username-query=select username, authority from user_authorities where username=?

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.schema-locations=classpath:schema.sql,classpath:migrations/20260217_add_calendar_view_preference.sql,classpath:migrations/20260223_add_vault_enhancements.sql,classpath:migrations/20260228_add_workout_template_system.sql,classpath:migrations/20260302_add_sticker_calendar.sql

spring.sql.init.data-locations=classpath:data/*.sql

debug=true
server.port=${PORT:8080}

# API key for OpenAI chat integration. Provide via environment variable OPENAI_API_KEY.
openai.api.key=${OPENAI_API_KEY:}
