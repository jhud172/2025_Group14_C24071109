spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=update

# Use in-memory H2 database to avoid file locking issues
spring.datasource.url=jdbc:h2:mem:localdb;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data/*.sql

# Use local port unless overridden
server.port=${PORT:8080}

app.dev-mode=${DEV_MODE:false}

debug=true
logging.level.org.springframework.boot.autoconfigure=DEBUG
logging.level.org.springframework.boot.devtools=DEBUG
logging.level.uk.ac.cf._5.group14.BehaviourChangeGroupProject.ScheduleData.CalendarController=DEBUG
logging.level.uk.ac.cf._5.group14.BehaviourChangeGroupProject.CalendarData.CalendarTaskServiceImpl=DEBUG
logging.level.uk.ac.cf._5.group14.BehaviourChangeGroupProject.Verification=DEBUG

# SMS verification delivery (set APP_SMS_PROVIDER=twilio to send real SMS)
app.sms.provider=${APP_SMS_PROVIDER:console}
app.sms.fail-on-error=${APP_SMS_FAIL_ON_ERROR:false}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}
app.sms.twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}

# Multipart limits (profile image upload)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB