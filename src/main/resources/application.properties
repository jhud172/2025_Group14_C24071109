spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# HikariCP connection pool configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=HikariPool-Calendar

spring.security.jdbc.users-by-username-query=select username, password, enabled from users where username=?
spring.security.jdbc.authorities-by-username-query=select username, authority from user_authorities where username=?

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.sql.init.data-locations=classpath:data/*.sql

debug=false
logging.level.root=INFO
logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.org.springframework.boot.devtools=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.uk.ac.cf._5.group14=INFO
server.port=${PORT:8080}

# API key for OpenAI chat integration. Provide via environment variable OPENAI_API_KEY.
openai.api.key=${OPENAI_API_KEY:}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Base URL used in emails (override in production)
app.site.base-url=${APP_BASE_URL:http://localhost:8080}
# Optional from address for email
app.email.from=${APP_EMAIL_FROM:}

# Daily protein nudge schedule (local server time)
app.notifications.proteinNudgeCron=0 0 18 * * *