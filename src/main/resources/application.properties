spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.security.jdbc.users-by-username-query=select username, password, enabled from users where username=?
spring.security.jdbc.authorities-by-username-query=select username, authority from user_authorities where username=?

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.sql.init.data-locations=classpath:data/*.sql

debug=true
server.port=${PORT:8080}

# API key for OpenAI chat integration. Provide via environment variable OPENAI_API_KEY.
openai.api.key=${OPENAI_API_KEY:}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Base URL used in emails (override in production)
app.site.base-url=${APP_BASE_URL:http://localhost:8080}
# Optional from address for email
app.email.from=${APP_EMAIL_FROM:}
