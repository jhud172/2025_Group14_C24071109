<th:block xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
          th:replace="~{base :: layout('Client Dashboard', null, ~{::content}, ~{::pageScripts})}">

    <div th:fragment="content">
        <section sec:authorize="isAuthenticated()"
                 class="cd-dashboard-page mx-auto w-full max-w-7xl px-4 pb-6 pt-0 sm:px-6 lg:px-8 2xl:max-w-full 2xl:px-8"
                 data-dashboard-role="CLIENT"
                 th:attrappend="data-dashboard-immersive=${dashboardAmbience != null and dashboardAmbience.enabled ? 'true' : 'false'},
                                data-dashboard-weather=${dashboardAmbience != null ? dashboardAmbience.weather : 'auto'},
                                data-dashboard-temperature-unit=${dashboardAmbience != null ? dashboardAmbience.temperatureUnit : 'CELSIUS'},
                                data-dashboard-weather-display-mode=${dashboardAmbience != null ? dashboardAmbience.displayMode : 'VISUAL'},
                                data-dashboard-time-display-format=${dashboardTimeDisplayFormat != null ? dashboardTimeDisplayFormat : 'TWELVE_HOUR'}">

            <div class="cd-dashboard-mobile-controls" aria-label="Dashboard side panels">
                <button type="button"
                        class="cd-dashboard-edge-trigger cd-dashboard-edge-trigger--left"
                        data-dashboard-drawer-trigger="left"
                        aria-controls="dashboardLeftRail"
                        aria-expanded="false"
                        aria-label="Open dashboard tools">
                    <span class="cd-dashboard-edge-trigger__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M4 12h16"/>
                            <path d="M12 4v16"/>
                            <circle cx="12" cy="12" r="8"/>
                        </svg>
                    </span>
                    <span class="cd-dashboard-edge-trigger__label">Tools</span>
                </button>
                <button type="button"
                        class="cd-dashboard-edge-trigger cd-dashboard-edge-trigger--right"
                        data-dashboard-drawer-trigger="right"
                        aria-controls="dashboardRightRail"
                        aria-expanded="false"
                        aria-label="Open support and profile">
                    <span class="cd-dashboard-edge-trigger__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M12 3l7 4v5c0 4.3-2.8 7.5-7 9-4.2-1.5-7-4.7-7-9V7l7-4Z"/>
                            <path d="M9.5 12.5 11 14l3.5-4"/>
                        </svg>
                    </span>
                    <span class="cd-dashboard-edge-trigger__label">Support</span>
                </button>
            </div>

            <div class="cd-dashboard-drawer-backdrop" data-dashboard-drawer-backdrop aria-hidden="true" hidden></div>

            <div id="dashboardRoot" class="cd-dashboard-shell">
                <aside id="dashboardLeftRail"
                       aria-label="Explore platform"
                       data-dashboard-left-rail
                       data-dashboard-drawer="left"
                       class="cd-dashboard-rail cd-dashboard-rail--left">
                    <div class="cd-dashboard-rail__panel" tabindex="-1">
                        <div class="cd-dashboard-rail__mobile-header">
                            <div class="cd-dashboard-rail__mobile-copy">
                                <p class="cd-kicker">Dashboard Tools</p>
                                <p class="cd-dashboard-rail__mobile-title">Explore, coaching, and goals</p>
                            </div>
                            <button type="button"
                                    class="cd-dashboard-rail__close"
                                    data-dashboard-drawer-close
                                    aria-label="Close dashboard tools">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                    <path d="M8 8l8 8M16 8l-8 8"/>
                                </svg>
                            </button>
                        </div>
                        <div class="cd-dashboard-rail__content">
                            <th:block th:replace="~{dashboard/fragments/client-dashboard-shell :: leftRail}"></th:block>
                        </div>
                    </div>
                </aside>

                <main class="cd-dashboard-main">
                    <th:block th:replace="~{dashboard/fragments/client-dashboard-shell :: mainColumn}"></th:block>
                </main>

                <aside id="dashboardRightRail"
                       aria-label="Help and trust"
                       data-dashboard-right-rail
                       data-dashboard-drawer="right"
                       class="cd-dashboard-rail cd-dashboard-rail--right">
                    <div class="cd-dashboard-rail__panel" tabindex="-1">
                        <div class="cd-dashboard-rail__mobile-header">
                            <div class="cd-dashboard-rail__mobile-copy">
                                <p class="cd-kicker">Support and Profile</p>
                                <p class="cd-dashboard-rail__mobile-title">Help, trust, and your account snapshot</p>
                            </div>
                            <button type="button"
                                    class="cd-dashboard-rail__close"
                                    data-dashboard-drawer-close
                                    aria-label="Close support and profile">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                    <path d="M8 8l8 8M16 8l-8 8"/>
                                </svg>
                            </button>
                        </div>
                        <div class="cd-dashboard-rail__content">
                            <th:block th:replace="~{dashboard/fragments/client-dashboard-shell :: rightRail}"></th:block>
                        </div>
                    </div>
                </aside>
            </div>
        </section>
    </div>

    <th:block th:fragment="pageScripts">
        <script th:src="@{/js/dashboard/client-dashboard-page.js(v='20260316a')}" defer></script>
    </th:block>
</th:block>
