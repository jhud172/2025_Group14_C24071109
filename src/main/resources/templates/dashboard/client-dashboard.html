<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Dashboard', null, ~{::content}, null)}">

    <div th:fragment="content">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <!-- Hero Header -->
            <div class="mb-8 card-neon p-6">
                <div class="neon-bar mb-4"></div>
                <div class="flex items-center justify-between gap-4">
                    <div>
                        <h1 class="text-3xl font-bold gradient-text">Client Dashboard</h1>
                        <p class="mt-2 text-sm text-slate-400">Your day at a glance.</p>
                    </div>
                    <div class="hidden sm:flex items-center gap-2 px-4 py-2 rounded-full border border-neon-green/40 bg-neon-green/10">
                        <span class="h-3 w-3 rounded-full bg-neon-green animate-pulse-neon"></span>
                        <span class="text-sm font-semibold text-neon-green">Active</span>
                    </div>
                </div>
            </div>

            <div class="mt-6 grid gap-4 lg:grid-cols-3">
                <!-- Today Overview Card -->
                <div class="card-neon card--cyan">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="p-2 rounded-lg bg-neon-cyan/10 border border-neon-cyan/30">
                            <svg class="h-6 w-6 text-neon-cyan" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                            </svg>
                        </div>
                        <h2 class="text-sm font-semibold text-neon-cyan">Today Overview</h2>
                    </div>
                    <div class="mt-4 grid gap-3 text-sm">
                        <div class="flex items-center justify-between p-3 rounded-lg bg-cyber-800/50 border border-cyber-700">
                            <span class="text-slate-400">Tasks due</span>
                            <span class="font-bold text-2xl text-neon-cyan" th:text="${summary.tasksDueToday}">0</span>
                        </div>
                        <div class="flex items-center justify-between p-3 rounded-lg bg-cyber-800/50 border border-cyber-700">
                            <span class="text-slate-400">Workouts due</span>
                            <span class="font-bold text-2xl text-neon-purple" th:text="${summary.workoutsDueToday}">0</span>
                        </div>
                    </div>
                    <div class="mt-4 flex flex-wrap gap-2">
                        <a th:href="@{/calendar/day/{date}(date=${#temporals.format(summary.today, 'yyyy-MM-dd')})}"
                           class="btn btn--primary btn--sm flex-1">
                            Quick complete
                        </a>
                        <a th:href="@{/calendar/day/{date}(date=${#temporals.format(summary.today, 'yyyy-MM-dd')})}"
                           class="btn btn--secondary btn--sm flex-1">
                            Add task
                        </a>
                    </div>
                </div>

                <!-- Mini Week View Card -->
                <div class="card-neon card--purple">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="p-2 rounded-lg bg-neon-purple/10 border border-neon-purple/30">
                                <svg class="h-6 w-6 text-neon-purple" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                            </div>
                            <h2 class="text-sm font-semibold text-neon-purple">Mini Week View</h2>
                        </div>
                        <a th:href="@{/calendar}" class="text-xs font-semibold text-slate-400 hover:text-neon-purple transition-colors">Open calendar</a>
                    </div>
                    <div class="mt-4 grid grid-cols-7 gap-2">
                        <div th:each="day : ${summary.week}"
                             class="flex flex-col items-center rounded-xl px-2 py-3 text-xs transition-all duration-300 border"
                             th:classappend="${day.today} ? ' bg-gradient-to-br from-neon-purple to-neon-pink text-white border-neon-purple shadow-neon-purple' : ' bg-cyber-800/50 text-slate-400 border-cyber-700 hover:border-neon-purple/30'">
                            <span class="font-semibold" th:text="${day.label}">Mon</span>
                            <span class="text-sm font-bold" th:text="${day.dayNumber}">12</span>
                            <span class="mt-1 text-[10px] opacity-80" th:text="${day.tasksCount + day.workoutsCount}">0</span>
                        </div>
                    </div>
                </div>

                <!-- Quick Buttons Card -->
                <div class="card-neon card--green">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="p-2 rounded-lg bg-neon-green/10 border border-neon-green/30">
                            <svg class="h-6 w-6 text-neon-green" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                            </svg>
                        </div>
                        <h2 class="text-sm font-semibold text-neon-green">Quick Actions</h2>
                    </div>
                    <div class="mt-4 grid gap-2 text-sm">
                        <a th:href="@{/calendar/day/{date}(date=${#temporals.format(summary.today, 'yyyy-MM-dd')})}"
                           class="flex items-center justify-between p-3 rounded-lg bg-cyber-800/50 border border-cyber-700 hover:border-neon-green/50 hover:bg-neon-green/5 transition-all duration-300 group">
                            <span class="font-semibold text-slate-300 group-hover:text-neon-green">Add Task</span>
                            <span class="text-xs text-slate-500">Today</span>
                        </a>
                        <a th:href="@{/workout}"
                           class="flex items-center justify-between p-3 rounded-lg bg-cyber-800/50 border border-cyber-700 hover:border-neon-green/50 hover:bg-neon-green/5 transition-all duration-300 group">
                            <span class="font-semibold text-slate-300 group-hover:text-neon-green">Add Workout</span>
                            <span class="text-xs text-slate-500">Program</span>
                        </a>
                        <a th:href="@{/calendar}"
                           class="flex items-center justify-between p-3 rounded-lg bg-cyber-800/50 border border-cyber-700 hover:border-neon-green/50 hover:bg-neon-green/5 transition-all duration-300 group">
                            <span class="font-semibold text-slate-300 group-hover:text-neon-green">Open Calendar</span>
                            <span class="text-xs text-slate-500">Week</span>
                        </a>
                        <a th:href="@{/vault}"
                           class="flex items-center justify-between p-3 rounded-lg bg-cyber-800/50 border border-cyber-700 hover:border-neon-green/50 hover:bg-neon-green/5 transition-all duration-300 group">
                            <span class="font-semibold text-slate-300 group-hover:text-neon-green">Open Vault</span>
                            <span class="text-xs text-slate-500">Notes</span>
                        </a>
                        <a th:href="@{/inbox}"
                           class="flex items-center justify-between p-3 rounded-lg bg-cyber-800/50 border border-cyber-700 hover:border-neon-green/50 hover:bg-neon-green/5 transition-all duration-300 group">
                            <span class="font-semibold text-slate-300 group-hover:text-neon-green">Message</span>
                            <span class="text-xs text-slate-500">Inbox</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</th:block>
