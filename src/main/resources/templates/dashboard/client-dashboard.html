<th:block xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
          th:replace="~{base :: layout('Client Dashboard', null, ~{::content}, ~{::pageScripts})}">

    <div th:fragment="content">
        <section sec:authorize="isAuthenticated()"
                 class="mx-auto w-full max-w-7xl px-4 pb-6 pt-0 sm:px-6 lg:px-8 2xl:max-w-full 2xl:px-8"
                 data-dashboard-role="CLIENT">

            <div id="dashboardRoot" class="grid grid-cols-1 gap-4 min-[1028px]:grid-cols-12 min-[1028px]:gap-5 2xl:gap-8">
                <aside aria-label="Explore platform"
                       data-dashboard-left-rail
                       class="order-2 space-y-4 min-[1028px]:order-1 min-[1028px]:col-span-3 min-[1028px]:self-start min-[1028px]:sticky min-[1028px]:top-24 min-[1028px]:h-fit">
                    <th:block th:replace="~{dashboard/fragments/client-dashboard-shell :: leftRail}"></th:block>
                </aside>

                <main class="order-1 space-y-4 min-[1028px]:order-2 min-[1028px]:col-span-6">
                    <th:block th:replace="~{dashboard/fragments/client-dashboard-shell :: mainColumn}"></th:block>
                </main>

                <aside aria-label="Help and trust"
                       data-dashboard-right-rail
                       class="order-3 space-y-4 min-[1028px]:col-span-3 min-[1028px]:self-start min-[1028px]:sticky min-[1028px]:top-24 min-[1028px]:h-fit">
                    <th:block th:replace="~{dashboard/fragments/client-dashboard-shell :: rightRail}"></th:block>
                </aside>
            </div>
        </section>
    </div>

    <th:block th:fragment="pageScripts">
        <script th:src="@{/js/dashboard/client-dashboard-page.js(v='20260313')}" defer></script>
    </th:block>
</th:block>
