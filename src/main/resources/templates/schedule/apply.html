<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Apply Schedule', null, ~{::content}, null)}">

<div th:fragment="content">
    <div class="mx-auto w-full max-w-3xl px-4 sm:px-6 lg:px-8 py-6">
        <!-- Breadcrumb -->
        <nav class="flex items-center gap-2 text-sm mb-6">
            <a href="/schedules" class="transition-colors duration-200"
               style="color:rgba(148,163,184,0.7)"
               onmouseover="this.style.color='#00f3ff'" onmouseout="this.style.color='rgba(148,163,184,0.7)'">
                ← Schedules
            </a>
            <span style="color:rgba(148,163,184,0.4)">›</span>
            <span style="color:rgba(0,243,255,0.8)">Apply Schedule</span>
        </nav>

        <div class="flex flex-col gap-2 mb-6">
            <h1 class="text-2xl font-bold tracking-tight" style="color:#f1f5f9">Apply schedule</h1>
            <p class="text-sm" style="color:rgba(148,163,184,0.8)">
                Applying: <span class="font-semibold" style="color:#00f3ff;text-shadow:0 0 8px rgba(0,243,255,0.4)" th:text="${schedule.name}"></span>
            </p>
        </div>

        <section class="rounded-2xl p-6"
                 style="background:rgba(26,26,46,0.65);backdrop-filter:blur(12px);border:1px solid rgba(0,243,255,0.2);box-shadow:0 0 20px rgba(0,243,255,0.06)">
            <form th:action="@{'/schedules/' + ${schedule.id} + '/apply'}" method="post" class="space-y-5">
                <input type="hidden" th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <div>
                    <label class="block text-sm font-semibold mb-1.5" style="color:rgba(226,232,240,0.85)">Start date</label>
                    <input type="date" name="startDate" required
                           class="w-full px-4 py-2.5 rounded-xl transition-all duration-200"
                           style="background:rgba(17,24,39,0.8);border:1px solid rgba(0,243,255,0.2);color:#e2e8f0;outline:none"
                           onfocus="this.style.borderColor='rgba(0,243,255,0.5)';this.style.boxShadow='0 0 12px rgba(0,243,255,0.12)'"
                           onblur="this.style.borderColor='rgba(0,243,255,0.2)';this.style.boxShadow=''"/>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1.5" style="color:rgba(226,232,240,0.85)">Number of weeks</label>
                    <input type="number" name="weeks" value="4" min="1"
                           class="w-full px-4 py-2.5 rounded-xl transition-all duration-200"
                           style="background:rgba(17,24,39,0.8);border:1px solid rgba(0,243,255,0.2);color:#e2e8f0;outline:none"
                           onfocus="this.style.borderColor='rgba(0,243,255,0.5)';this.style.boxShadow='0 0 12px rgba(0,243,255,0.12)'"
                           onblur="this.style.borderColor='rgba(0,243,255,0.2)';this.style.boxShadow=''"/>
                </div>

                <div class="pt-2">
                    <button class="inline-flex items-center justify-center px-5 py-2.5 rounded-xl font-semibold text-sm transition-all duration-200"
                            style="background:linear-gradient(135deg,rgba(0,243,255,0.2),rgba(0,243,255,0.1));border:1px solid rgba(0,243,255,0.45);color:#00f3ff;box-shadow:0 0 10px rgba(0,243,255,0.12)"
                            onmouseover="this.style.boxShadow='0 0 20px rgba(0,243,255,0.25)';this.style.borderColor='rgba(0,243,255,0.7)';this.style.transform='translateY(-1px)'"
                            onmouseout="this.style.boxShadow='0 0 10px rgba(0,243,255,0.12)';this.style.borderColor='rgba(0,243,255,0.45)';this.style.transform=''">
                        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        Apply schedule
                    </button>
                </div>
            </form>
        </section>
    </div>
</div>

</th:block>
