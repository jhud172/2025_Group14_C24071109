<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Build Schedule', null, ~{::content}, ~{::pageScripts})}">

<div th:fragment="content">
    <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8 py-6">
        <div class="flex flex-col gap-2">
            <h1 class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-slate-100">Build your weekly workout schedule</h1>
            <p class="text-sm text-slate-700 dark:text-slate-200">Drag workouts onto days, then save.</p>
        </div>

        <form id="saveForm" method="post" action="/schedules/builder/save" class="mt-6">
            <div class="rounded-2xl border border-slate-200 bg-white/80 p-5 shadow-sm backdrop-blur dark:border-slate-800 dark:bg-slate-900/50">
                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 sm:items-end">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-200">Schedule name</label>
                        <input type="text" name="name" required placeholder="e.g. Push / Pull / Legs"
                               class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100"/>
                    </div>
                    <div class="flex items-center justify-start sm:justify-end">
                        <button form="saveForm" type="submit"
                                class="inline-flex items-center justify-center rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500">
                            Save schedule
                        </button>
                    </div>
                </div>

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="payload" id="payloadField"/>
            </div>
        </form>

        <div class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-12">
            <section class="lg:col-span-3 rounded-2xl border border-slate-200 bg-white/80 p-4 shadow-sm backdrop-blur dark:border-slate-800 dark:bg-slate-900/50">
                <div class="flex items-center justify-between gap-3">
                    <h2 class="text-base font-semibold text-slate-900 dark:text-slate-100">Your workouts</h2>
                    <a href="/workout"
                       class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-blue-600 text-white shadow-sm hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
                       aria-label="Create a workout">+</a>
                </div>

                <div class="mt-4">
                    <label class="sr-only" for="workout-search">Search workouts</label>
                    <input id="workout-search" type="text" placeholder="Search workouts..."
                           class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100"/>
                </div>

                <div id="workout-list" class="mt-4 space-y-2 overflow-y-auto pr-1 max-h-[500px]">
                    <div th:each="w : ${workouts}"
                         class="workout-item draggable-ex cursor-move rounded-xl border border-blue-200 bg-blue-50 p-2 shadow-sm transition hover:bg-blue-100 dark:border-slate-800 dark:bg-slate-950/40"
                         draggable="true"
                         th:attr="data-id=${w.id},data-name=${w.name}">
                        <span class="text-sm font-semibold text-blue-800 dark:text-blue-300" th:text="${w.name}"></span>
                    </div>
                </div>
            </section>

            <section class="lg:col-span-9">
                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-7">
                    <div th:each="day : ${days}"
                         class="day-column rounded-2xl border border-slate-200 bg-white/80 p-3 shadow-sm backdrop-blur dark:border-slate-800 dark:bg-slate-900/50"
                         th:attr="data-day=${day}">
                        <h3 class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="${day}"></h3>
                        <div class="drop-zone mt-2 min-h-[240px] flex-1 space-y-2 rounded-xl border-2 border-dashed border-slate-300 bg-white/60 p-2 transition dark:border-slate-700 dark:bg-slate-950/30"></div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

<div th:fragment="pageScripts">
    <script src="/js/schedule-builder.js"></script>
</div>

</th:block>
