<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Development Mode', ~{::pageStyles}, ~{::content}, ~{::pageScripts})}">

    <th:block th:fragment="pageStyles">
        <!-- auth.css is now included in app.css via tailwind.css -->
    </th:block>

    <div th:fragment="content" class="auth-container animate-fade-in">
        <div class="auth-card">
            <div class="auth-accent-bar" style="background: linear-gradient(90deg, #f59e0b, #10b981);"></div>

            <div class="mb-6 mt-8 text-center">
                <!-- Dev Mode badge -->
                <div style="margin-bottom:16px;">
                    <span style="display:inline-flex;align-items:center;gap:6px;background:#fef3c7;border:1px solid #fde68a;color:#92400e;padding:4px 14px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;">
                        <span style="width:6px;height:6px;border-radius:50%;background:#f59e0b;display:inline-block;animation:dmPulse 2s ease-in-out infinite;"></span>
                        Development Mode
                    </span>
                </div>
                <h1 class="auth-heading">Dev Mode Active</h1>
                <p class="auth-subheading">You can sign in or browse the application without authentication.</p>
            </div>

            <!-- Options -->
            <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:8px;">
                <a href="/login?devLogin=1"
                   style="display:flex;align-items:center;gap:12px;padding:14px 18px;background:#f0fdf4;border:1.5px solid #a7f3d0;border-radius:12px;text-decoration:none;color:#065f46;transition:border-color .2s,box-shadow .2s;"
                   onmouseover="this.style.borderColor='#10b981';this.style.boxShadow='0 4px 14px rgba(16,185,129,.12)'"
                   onmouseout="this.style.borderColor='#a7f3d0';this.style.boxShadow='none'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                    <div>
                        <div style="font-weight:600;font-size:14px;">Continue to Login</div>
                        <div style="font-size:12px;color:#6b7280;margin-top:1px;">Sign in with an existing account</div>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
                </a>

                <a href="/dev-mode"
                   style="display:flex;align-items:center;gap:12px;padding:14px 18px;background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:12px;text-decoration:none;color:#1e40af;transition:border-color .2s,box-shadow .2s;"
                   onmouseover="this.style.borderColor='#3b82f6';this.style.boxShadow='0 4px 14px rgba(59,130,246,.12)'"
                   onmouseout="this.style.borderColor='#bfdbfe';this.style.boxShadow='none'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
                    <div>
                        <div style="font-weight:600;font-size:14px;">Browse Dev Hub</div>
                        <div style="font-size:12px;color:#6b7280;margin-top:1px;">Explore pages without logging in</div>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
                </a>

                <a href="/"
                   style="display:flex;align-items:center;gap:12px;padding:14px 18px;background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:12px;text-decoration:none;color:#374151;transition:border-color .2s;"
                   onmouseover="this.style.borderColor='#d1d5db'"
                   onmouseout="this.style.borderColor='#e5e7eb'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <div>
                        <div style="font-weight:600;font-size:14px;">Return to Home</div>
                        <div style="font-size:12px;color:#6b7280;margin-top:1px;">Go back to the landing page</div>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
                </a>
            </div>

        </div>
    </div>

    <th:block th:fragment="pageScripts">
        <style>@keyframes dmPulse{0%,100%{opacity:1}50%{opacity:.4}}</style>
    </th:block>

</th:block>
