<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Reset Password', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-md px-4 py-10 sm:px-6 lg:px-8 animate-fade-in">
        <!-- Decorative neon glow elements -->
        <div class="absolute inset-0 pointer-events-none overflow-hidden">
            <div class="absolute -top-40 -right-40 w-80 h-80 bg-neon-cyan/10 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-neon-purple/10 rounded-full blur-3xl"></div>
        </div>

        <div class="relative card-neon p-6 sm:p-8">
            <!-- Neon accent line -->
            <div class="neon-bar mb-6"></div>

            <div class="mb-6">
                <h1 class="text-3xl font-bold tracking-tight gradient-text" th:text="#{auth.reset.title}">Set a new password</h1>
                <p class="mt-2 text-sm text-slate-400" th:text="#{auth.reset.subtitle}">Choose a strong password to secure your account.</p>
            </div>

            <div th:if="${!tokenValid}" class="mb-4 rounded-2xl border border-red-500/40 bg-red-500/10 px-4 py-3 text-sm text-red-400" role="alert">
                <span th:text="#{auth.reset.invalid}">This reset link is invalid or has expired. Please request a new link.</span>
            </div>

            <form th:if="${tokenValid}" th:action="@{/reset-password(token=${token})}" th:object="${resetPasswordForm}" method="post" class="space-y-4">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div th:if="${#fields.hasAnyErrors()}" class="mb-4 rounded-2xl border border-red-500/40 bg-red-500/10 px-4 py-3 text-sm text-red-400" role="alert">
                    <span th:text="#{auth.form.fixErrors}">Please correct the highlighted fields below.</span>
                </div>

                <div>
                    <label for="password" class="field__label" th:text="#{auth.reset.password}">New password</label>
                    <input
                        type="password"
                        id="password"
                        th:field="*{password}"
                        required
                        autocomplete="new-password"
                        class="field__input" />
                    <p class="mt-1 text-xs text-slate-500" th:text="#{auth.reset.passwordHint}">Min 8, with upper, lower, number, and special character.</p>
                    <div th:if="${#fields.hasErrors('password')}" class="mt-1 text-sm text-red-400">
                        <span th:errors="*{password}"></span>
                    </div>
                </div>

                <div>
                    <label for="confirmPassword" class="field__label" th:text="#{auth.reset.confirm}">Confirm password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        th:field="*{confirmPassword}"
                        required
                        autocomplete="new-password"
                        class="field__input" />
                    <div th:if="${#fields.hasErrors('confirmPassword')}" class="mt-1 text-sm text-red-400">
                        <span th:errors="*{confirmPassword}"></span>
                    </div>
                </div>

                <button
                    type="submit"
                    class="btn btn--primary btn--md w-full">
                    <span th:text="#{auth.reset.submit}">Reset password</span>
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </button>
            </form>

            <div th:if="${!tokenValid}" class="mt-4 text-center text-sm text-slate-400">
                <a th:href="@{/forgot-password}" class="font-semibold text-neon-cyan hover:text-neon-purple transition-colors underline underline-offset-4" th:text="#{auth.reset.requestNew}">Request a new reset link</a>
            </div>
        </div>
    </div>

</th:block>
