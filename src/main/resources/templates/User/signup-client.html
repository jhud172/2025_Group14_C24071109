<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Client Sign Up', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-2xl px-4 py-10 sm:px-6 lg:px-8 animate-fade-in">
        <!-- Decorative neon glow elements -->
        <div class="absolute inset-0 pointer-events-none overflow-hidden">
            <div class="absolute -top-40 -right-40 w-80 h-80 bg-neon-cyan/10 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-neon-purple/10 rounded-full blur-3xl"></div>
        </div>

        <div class="relative card-neon p-6 sm:p-8">
            <!-- Neon accent line -->
            <div class="neon-bar mb-6"></div>

            <div class="mb-6">
                <h1 class="text-3xl font-bold tracking-tight gradient-text">Create your client account</h1>
                <p class="mt-2 text-sm text-slate-400">Personalize your profile and start booking trainers.</p>
            </div>

            <form th:action="@{/signup/client}" th:object="${signupForm}" method="post" class="space-y-5">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div th:if="${#fields.hasAnyErrors()}" class="mb-4 rounded-2xl border border-red-500/40 bg-red-500/10 px-4 py-3 text-sm text-red-400" role="alert">
                    Please correct the highlighted fields below.
                </div>

                <div>
                    <label for="email" class="field__label">Email Address *</label>
                    <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        required
                        autocomplete="email"
                        class="field__input" />
                    <div th:if="${#fields.hasErrors('email')}" class="mt-1 text-sm text-red-400">
                        <span th:errors="*{email}"></span>
                    </div>
                </div>

                <div>
                    <label for="username" class="field__label">Username *</label>
                    <input
                        type="text"
                        id="username"
                        th:field="*{username}"
                        required
                        autocomplete="username"
                        class="field__input" />
                    <p class="mt-1 text-xs text-slate-500">3–20 characters. Letters, numbers, underscore only.</p>
                    <div th:if="${#fields.hasErrors('username')}" class="mt-1 text-sm text-red-400">
                        <span th:errors="*{username}"></span>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label for="password" class="field__label">Password *</label>
                        <input
                            type="password"
                            id="password"
                            th:field="*{password}"
                            required
                            autocomplete="new-password"
                            class="field__input" />
                        <p class="mt-1 text-xs text-slate-500">Min 8, with upper, lower, number, and special character.</p>
                        <div th:if="${#fields.hasErrors('password')}" class="mt-1 text-sm text-red-400">
                            <span th:errors="*{password}"></span>
                        </div>
                    </div>

                    <div>
                        <label for="confirmPassword" class="field__label">Confirm Password *</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            th:field="*{confirmPassword}"
                            required
                            autocomplete="new-password"
                            class="field__input" />
                        <div th:if="${#fields.hasErrors('confirmPassword')}" class="mt-1 text-sm text-red-400">
                            <span th:errors="*{confirmPassword}"></span>
                        </div>
                    </div>
                </div>

                <button
                    type="submit"
                    class="btn btn--primary btn--md w-full">
                    <span>Sign up as client</span>
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                    </svg>
                </button>

                <p class="text-center text-sm text-slate-400">
                    Already have an account?
                    <a th:href="@{/login}" class="font-semibold text-neon-cyan hover:text-neon-purple transition-colors underline underline-offset-4">Log in</a>
                </p>
            </form>
        </div>
    </div>

</th:block>
