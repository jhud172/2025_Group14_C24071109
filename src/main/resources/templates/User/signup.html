<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Sign Up', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-2xl px-4 py-10 sm:px-6 lg:px-8">
        <div class="rounded-3xl border border-slate-200 bg-white p-6 sm:p-8">
            <div class="mb-6">
                <h1 class="text-2xl font-semibold tracking-tight text-slate-900" th:text="#{auth.signup.title}">Create account</h1>
                <p class="mt-1 text-sm text-slate-600" th:text="#{auth.signup.subtitle}">Set up your details to get started.</p>
            </div>

            <form th:action="@{/signup}" th:object="${signupForm}" method="post" class="space-y-5">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div th:if="${#fields.hasAnyErrors()}" class="rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800" role="alert" th:text="#{auth.form.fixErrors}">
                    Please correct the highlighted fields below.
                </div>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label for="firstName" class="block text-sm font-medium text-slate-800" th:text="#{auth.firstName}">First Name *</label>
                        <input
                            type="text"
                            id="firstName"
                            th:field="*{firstName}"
                            required
                            autocomplete="given-name"
                            class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/20"
                            th:classappend="${#fields.hasErrors('firstName')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''" />
                        <div th:if="${#fields.hasErrors('firstName')}" class="mt-1 text-sm text-rose-700">
                            <span th:errors="*{firstName}"></span>
                        </div>
                    </div>

                    <div>
                        <label for="lastName" class="block text-sm font-medium text-slate-800" th:text="#{auth.lastName}">Last Name *</label>
                        <input
                            type="text"
                            id="lastName"
                            th:field="*{lastName}"
                            required
                            autocomplete="family-name"
                            class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/20"
                            th:classappend="${#fields.hasErrors('lastName')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''" />
                        <div th:if="${#fields.hasErrors('lastName')}" class="mt-1 text-sm text-rose-700">
                            <span th:errors="*{lastName}"></span>
                        </div>
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-slate-800" th:text="#{auth.email}">Email Address *</label>
                    <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        required
                        autocomplete="email"
                        class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/20"
                        th:classappend="${#fields.hasErrors('email')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''" />
                    <div th:if="${#fields.hasErrors('email')}" class="mt-1 text-sm text-rose-700">
                        <span th:errors="*{email}"></span>
                    </div>
                </div>

                <div>
                    <label for="username" class="block text-sm font-medium text-slate-800" th:text="#{auth.username}">Username *</label>
                    <input
                        type="text"
                        id="username"
                        th:field="*{username}"
                        required
                        autocomplete="username"
                        class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/20"
                        th:classappend="${#fields.hasErrors('username')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''" />
                    <p class="mt-1 text-sm text-slate-600" th:text="#{auth.username.hint}">3–20 characters. Letters, numbers, underscore only.</p>
                    <div th:if="${#fields.hasErrors('username')}" class="mt-1 text-sm text-rose-700">
                        <span th:errors="*{username}"></span>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-800" th:text="#{auth.password}">Password *</label>
                        <input
                            type="password"
                            id="password"
                            th:field="*{password}"
                            required
                            autocomplete="new-password"
                            class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/20"
                            th:classappend="${#fields.hasErrors('password')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''" />
                        <p class="mt-1 text-sm text-slate-600" th:text="#{auth.password.hint}">Min 8, with upper, lower, number, and special character.</p>
                        <div th:if="${#fields.hasErrors('password')}" class="mt-1 text-sm text-rose-700">
                            <span th:errors="*{password}"></span>
                        </div>
                    </div>

                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-slate-800" th:text="#{auth.confirmPassword}">Confirm Password *</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            th:field="*{confirmPassword}"
                            required
                            autocomplete="new-password"
                            class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/20"
                            th:classappend="${#fields.hasErrors('confirmPassword')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''" />
                        <div th:if="${#fields.hasErrors('confirmPassword')}" class="mt-1 text-sm text-rose-700">
                            <span th:errors="*{confirmPassword}"></span>
                        </div>
                    </div>
                </div>

                <button
                    type="submit"
                    class="inline-flex w-full min-h-11 items-center justify-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-900/30 focus-visible:ring-offset-2 focus-visible:ring-offset-white">
                    <span th:text="#{auth.signup.submit}">Sign up</span>
                </button>

                <p class="text-center text-sm text-slate-600">
                    Already have an account?
                    <a th:href="@{/login}" class="font-semibold text-slate-900 underline underline-offset-4 hover:text-slate-700">Log in</a>
                </p>
            </form>
        </div>
    </div>

</th:block>
