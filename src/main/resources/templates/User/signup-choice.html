<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Sign Up', null, ~{::content}, null)}">

    <div th:fragment="content" class="auth-container auth-container--wide animate-fade-in">
        <div class="auth-card">
            <div class="auth-accent-bar"></div>

            <div class="mb-8 mt-6">
                <h1 class="auth-heading text-center" th:text="#{auth.signupChoice.title}">Choose your account type</h1>
                <p class="auth-subheading text-center" th:text="#{auth.signupChoice.subtitle}">Select how you plan to use Healthy Habits.</p>
            </div>

            <div class="grid gap-6 md:grid-cols-3">
                <a th:href="@{/signup/client}" class="auth-choice-card">
                    <div class="flex flex-col gap-4">
                        <div class="auth-choice-card__icon auth-choice-card__icon--client">C</div>
                        <div>
                            <h2 class="auth-choice-card__title" th:text="#{auth.role.client}">Client</h2>
                            <p class="auth-choice-card__description" th:text="#{auth.signupChoice.client}">Book trainers and track progress.</p>
                        </div>
                    </div>
                </a>

                <a th:href="@{/signup/trainer}" class="auth-choice-card">
                    <div class="flex flex-col gap-4">
                        <div class="auth-choice-card__icon auth-choice-card__icon--trainer">T</div>
                        <div>
                            <h2 class="auth-choice-card__title" th:text="#{auth.role.trainer}">Trainer</h2>
                            <p class="auth-choice-card__description" th:text="#{auth.signupChoice.trainer}">Showcase your profile and clients.</p>
                        </div>
                    </div>
                </a>

                <a th:href="@{/signup/gym}" class="auth-choice-card">
                    <div class="flex flex-col gap-4">
                        <div class="auth-choice-card__icon auth-choice-card__icon--gym">G</div>
                        <div>
                            <h2 class="auth-choice-card__title" th:text="#{auth.role.gym}">Gym</h2>
                            <p class="auth-choice-card__description" th:text="#{auth.signupChoice.gym}">Manage your gym and trainers.</p>
                        </div>
                    </div>
                </a>
            </div>

            <p class="mt-8 text-center text-sm text-gray-600">
                <span th:text="#{auth.login.haveAccount}">Already have an account?</span>
                <a th:href="@{/login}" class="auth-link" th:text="#{auth.login.submit}">Log in</a>
            </p>
        </div>
    </div>

</th:block>
