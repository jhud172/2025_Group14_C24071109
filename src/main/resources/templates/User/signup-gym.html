<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Gym Sign Up', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-3xl px-4 py-10 sm:px-6 lg:px-8 animate-fade-in">
        <!-- Decorative neon glow elements -->
        <div class="absolute inset-0 pointer-events-none overflow-hidden">
            <div class="absolute -top-40 -right-40 w-80 h-80 bg-neon-cyan/10 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-neon-purple/10 rounded-full blur-3xl"></div>
        </div>

        <div class="relative card-neon p-6 sm:p-8">
            <!-- Neon accent line -->
            <div class="neon-bar mb-6"></div>

            <div class="mb-6">
                <h1 class="text-3xl font-bold tracking-tight gradient-text">Create your gym account</h1>
                <p class="mt-2 text-sm text-slate-400">Set up your gym profile and admin access.</p>
            </div>

            <form th:action="@{/signup/gym}" th:object="${signupForm}" method="post" class="space-y-5">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div th:if="${#fields.hasAnyErrors()}" class="mb-4 rounded-2xl border border-red-500/40 bg-red-500/10 px-4 py-3 text-sm text-red-400" role="alert">
                    Please correct the highlighted fields below.
                </div>

                <div>
                    <label for="gymName" class="field__label">Gym name *</label>
                    <input
                        type="text"
                        id="gymName"
                        th:field="*{gymName}"
                        required
                        class="field__input" />
                    <div th:if="${#fields.hasErrors('gymName')}" class="mt-1 text-sm text-red-400">
                        <span th:errors="*{gymName}"></span>
                    </div>
                </div>

                <div>
                    <label for="contactName" class="field__label">Primary contact name *</label>
                    <input
                        type="text"
                        id="contactName"
                        th:field="*{contactName}"
                        required
                        autocomplete="name"
                        class="field__input" />
                    <div th:if="${#fields.hasErrors('contactName')}" class="mt-1 text-sm text-red-400">
                        <span th:errors="*{contactName}"></span>
                    </div>
                </div>

                <div>
                    <label for="adminEmail" class="field__label">Admin email *</label>
                    <input
                        type="email"
                        id="adminEmail"
                        th:field="*{adminEmail}"
                        required
                        autocomplete="email"
                        class="field__input" />
                    <div th:if="${#fields.hasErrors('adminEmail')}" class="mt-1 text-sm text-red-400">
                        <span th:errors="*{adminEmail}"></span>
                    </div>
                </div>

                <div>
                    <label for="contactPhone" class="field__label">Contact phone *</label>
                    <input
                        type="tel"
                        id="contactPhone"
                        th:field="*{contactPhone}"
                        required
                        autocomplete="tel"
                        class="field__input" />
                    <div th:if="${#fields.hasErrors('contactPhone')}" class="mt-1 text-sm text-red-400">
                        <span th:errors="*{contactPhone}"></span>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label for="address" class="field__label">Street address *</label>
                        <input
                            type="text"
                            id="address"
                            th:field="*{address}"
                            required
                            autocomplete="street-address"
                            class="field__input" />
                        <div th:if="${#fields.hasErrors('address')}" class="mt-1 text-sm text-red-400">
                            <span th:errors="*{address}"></span>
                        </div>
                    </div>

                    <div>
                        <label for="city" class="field__label">City *</label>
                        <input
                            type="text"
                            id="city"
                            th:field="*{city}"
                            required
                            autocomplete="address-level2"
                            class="field__input" />
                        <div th:if="${#fields.hasErrors('city')}" class="mt-1 text-sm text-red-400">
                            <span th:errors="*{city}"></span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label for="password" class="field__label">Password *</label>
                        <input
                            type="password"
                            id="password"
                            th:field="*{password}"
                            required
                            autocomplete="new-password"
                            class="field__input" />
                        <p class="mt-1 text-xs text-slate-500">Min 8, with upper, lower, number, and special character.</p>
                        <div th:if="${#fields.hasErrors('password')}" class="mt-1 text-sm text-red-400">
                            <span th:errors="*{password}"></span>
                        </div>
                    </div>

                    <div>
                        <label for="confirmPassword" class="field__label">Confirm Password *</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            th:field="*{confirmPassword}"
                            required
                            autocomplete="new-password"
                            class="field__input" />
                        <div th:if="${#fields.hasErrors('confirmPassword')}" class="mt-1 text-sm text-red-400">
                            <span th:errors="*{confirmPassword}"></span>
                        </div>
                    </div>
                </div>

                <button
                    type="submit"
                    class="btn btn--primary btn--md w-full">
                    <span>Sign up as gym</span>
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                    </svg>
                </button>

                <p class="text-center text-sm text-slate-400">
                    Already have an account?
                    <a th:href="@{/login}" class="font-semibold text-neon-cyan hover:text-neon-purple transition-colors underline underline-offset-4">Log in</a>
                </p>
            </form>
        </div>
    </div>

</th:block>
