<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Forgot Password', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-md px-4 py-10 sm:px-6 lg:px-8">
        <div class="rounded-3xl border border-slate-200 bg-white p-6 sm:p-8">
            <div class="mb-6">
                <h1 class="text-2xl font-semibold tracking-tight text-slate-900" th:text="#{auth.forgot.title}">Reset your password</h1>
                <p class="mt-1 text-sm text-slate-600" th:text="#{auth.forgot.subtitle}">We'll send a reset link if an account exists.</p>
            </div>

            <div th:if="${sent}" class="mb-4 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800" role="alert">
                <span th:text="#{auth.forgot.sent}">If an account exists for that email, a reset link has been sent.</span>
            </div>

            <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post" class="space-y-4">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div th:if="${#fields.hasAnyErrors()}" class="rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800" role="alert">
                    <span th:text="#{auth.form.fixErrors}">Please correct the highlighted fields below.</span>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-slate-800" th:text="#{auth.email}">Email address</label>
                    <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        required
                        autocomplete="email"
                        class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/20"
                        th:classappend="${#fields.hasErrors('email')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''" />
                    <div th:if="${#fields.hasErrors('email')}" class="mt-1 text-sm text-rose-700">
                        <span th:errors="*{email}"></span>
                    </div>
                </div>

                <button
                    type="submit"
                    class="inline-flex w-full min-h-11 items-center justify-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-900/30 focus-visible:ring-offset-2 focus-visible:ring-offset-white">
                    <span th:text="#{auth.forgot.submit}">Send reset link</span>
                </button>

                <p class="text-center text-sm text-slate-600">
                    <span th:text="#{auth.forgot.remembered}">Remembered your password?</span>
                    <a th:href="@{/login}" class="font-semibold text-slate-900 underline underline-offset-4 hover:text-slate-700" th:text="#{auth.login.submit}">Log in</a>
                </p>
            </form>
        </div>
    </div>

</th:block>
