<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Forgot Password', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-md px-4 py-10 sm:px-6 lg:px-8 animate-fade-in">
        <!-- Decorative neon glow elements -->
        <div class="absolute inset-0 pointer-events-none overflow-hidden">
            <div class="absolute -top-40 -right-40 w-80 h-80 bg-neon-cyan/10 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-neon-purple/10 rounded-full blur-3xl"></div>
        </div>

        <div class="relative card-neon p-6 sm:p-8">
            <!-- Neon accent line -->
            <div class="neon-bar mb-6"></div>

            <div class="mb-6">
                <h1 class="text-3xl font-bold tracking-tight gradient-text" th:text="#{auth.forgot.title}">Reset your password</h1>
                <p class="mt-2 text-sm text-slate-400" th:text="#{auth.forgot.subtitle}">We'll send a reset link if an account exists.</p>
            </div>

            <div th:if="${sent}" class="mb-4 rounded-2xl border border-neon-green/40 bg-neon-green/10 px-4 py-3 text-sm text-neon-green" role="alert">
                <span th:text="#{auth.forgot.sent}">If an account exists for that email, a reset link has been sent.</span>
            </div>

            <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post" class="space-y-4">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div th:if="${#fields.hasAnyErrors()}" class="mb-4 rounded-2xl border border-red-500/40 bg-red-500/10 px-4 py-3 text-sm text-red-400" role="alert">
                    <span th:text="#{auth.form.fixErrors}">Please correct the highlighted fields below.</span>
                </div>

                <div>
                    <label for="email" class="field__label" th:text="#{auth.email}">Email address</label>
                    <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        required
                        autocomplete="email"
                        class="field__input" />
                    <div th:if="${#fields.hasErrors('email')}" class="mt-1 text-sm text-red-400">
                        <span th:errors="*{email}"></span>
                    </div>
                </div>

                <button
                    type="submit"
                    class="btn btn--primary btn--md w-full">
                    <span th:text="#{auth.forgot.submit}">Send reset link</span>
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                    </svg>
                </button>

                <p class="text-center text-sm text-slate-400">
                    <span th:text="#{auth.forgot.remembered}">Remembered your password?</span>
                    <a th:href="@{/login}" class="font-semibold text-neon-cyan hover:text-neon-purple transition-colors underline underline-offset-4" th:text="#{auth.login.submit}">Log in</a>
                </p>
            </form>
        </div>
    </div>

</th:block>
