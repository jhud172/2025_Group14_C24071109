<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${workoutSession.nameSnapshot}, ~{::styles}, ~{::content}, ~{::pageScripts})}">

<div th:fragment="styles">
    <style>
        .wp-set-row.saving { opacity: 0.6; pointer-events: none; }
        .wp-set-row.saved-flash { animation: savedFlash 0.5s ease; }
        @keyframes savedFlash { 0%,100%{ background:transparent } 50%{ background:rgba(16,185,129,.12) } }
    </style>
</div>

<div th:fragment="content">
<div class="wp-player">

    <!-- Header -->
    <div class="wp-player-header">
        <div class="min-w-0">
            <p class="text-xs font-semibold uppercase tracking-widest text-emerald-600 dark:text-emerald-400">Active workout</p>
            <h1 class="wp-player-title truncate" th:text="${workoutSession.nameSnapshot}">Workout</h1>
        </div>
        <a th:href="@{'/workout-session/' + ${workoutSession.id} + '/completion?day=' + ${workoutSession.date}}"
           class="wp-player-back">
            <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
            Overview
        </a>
    </div>

    <!-- Progress bar -->
    <div class="wp-progress-bar-track" id="wp-progress-track">
        <div class="wp-progress-bar-fill" id="wp-progress-fill" style="width:0%"></div>
    </div>

    <!-- Summary -->
    <div class="wp-summary">
        <div class="wp-summary-card">
            <div class="wp-summary-value" id="wp-total-volume">0</div>
            <div class="wp-summary-label">kg volume</div>
        </div>
        <div class="wp-summary-card">
            <div class="wp-summary-value" id="wp-sets-done">0</div>
            <div class="wp-summary-label">sets done</div>
        </div>
        <div class="wp-summary-card">
            <div class="wp-summary-value" id="wp-elapsed">00:00</div>
            <div class="wp-summary-label">elapsed</div>
        </div>
    </div>

    <!-- Exercise cards -->
    <div id="wp-exercises-container">
        <div th:each="es, esIter : ${exerciseSessions}"
             class="wp-exercise-card"
             th:classappend="${es.completed} ? ' is-completed' : ''"
             th:attr="data-exercise-session-id=${es.id},
                      data-exercise-name=${es.exercise.name},
                      data-exercise-category=${es.exercise.category},
                      data-exercise-type=${es.exercise.type},
                      data-order-index=${es.orderIndex},
                      data-mode=${es.mode != null ? es.mode : 'NORMAL'},
                      data-group-key=${es.groupKey != null ? es.groupKey : ''}">

            <!-- Card header -->
            <div class="wp-exercise-card-header">
                <!-- Reorder buttons -->
                <div class="flex flex-col gap-0.5 shrink-0">
                    <button type="button" class="wp-reorder-btn" data-reorder="up"
                            th:disabled="${esIter.first}" aria-label="Move up">
                        <svg class="h-3 w-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5"/></svg>
                    </button>
                    <button type="button" class="wp-reorder-btn" data-reorder="down"
                            th:disabled="${esIter.last}" aria-label="Move down">
                        <svg class="h-3 w-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
                    </button>
                </div>
                <div class="flex-1 min-w-0">
                    <span class="wp-exercise-name" th:text="${es.exercise.name}">Exercise</span>
                </div>
                <span th:if="${es.mode == 'SUPERSET'}"
                      class="wp-exercise-category-badge wp-preflight-exercise-badge-superset"
                      title="Superset">SS</span>
                <span th:if="${es.mode == 'DROPSET'}"
                      class="wp-exercise-category-badge wp-preflight-exercise-badge-dropset"
                      title="Dropset">DS</span>
                <span class="wp-exercise-category-badge"
                      th:with="cat=${es.exercise.category}"
                      th:classappend="${cat == 'Cardio'} ? ' wp-preflight-exercise-badge-cardio' : (${cat == 'Core'} ? ' wp-preflight-exercise-badge-core' : (${cat == 'Strength'} ? ' wp-preflight-exercise-badge-strength' : ' wp-preflight-exercise-badge-default'))"
                      th:text="${cat}">Category</span>
                <!-- Completion indicator -->
                <svg th:if="${es.completed}" class="h-5 w-5 shrink-0 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>

            <!-- Timer panel (shown for Cardio/Core/timed exercises) -->
            <div class="wp-timer-panel"
                 th:if="${es.exercise.category == 'Cardio' or es.exercise.category == 'Core' or es.exercise.type == 'cardio'}">
                <div class="flex-1">
                    <p class="text-[10px] font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Timer</p>
                    <div class="wp-timer-display" data-timer-display>00:00</div>
                </div>
                <div class="flex items-center gap-2 flex-wrap">
                    <input type="number" min="1" max="3600" placeholder="secs"
                           class="wp-timer-input" data-timer-input aria-label="Timer duration in seconds" />
                    <button type="button" class="wp-timer-start" data-timer-start>Start</button>
                    <button type="button" class="wp-timer-stop hidden" data-timer-stop>Stop</button>
                    <button type="button" class="wp-timer-reset" data-timer-reset>Reset</button>
                </div>
            </div>

            <!-- Sets table -->
            <div class="overflow-x-auto">
                <table class="wp-set-table">
                    <thead>
                        <tr>
                            <th class="wp-set-th w-8">#</th>
                            <th class="wp-set-th">Weight (kg)</th>
                            <th class="wp-set-th">Reps</th>
                            <th class="wp-set-th">Notes</th>
                            <th class="wp-set-th w-20">Type</th>
                            <th class="wp-set-th w-10 text-center">Done</th>
                            <th class="wp-set-th w-8"></th>
                        </tr>
                    </thead>
                    <tbody data-set-tbody>
                        <tr th:each="s : ${es.setLogs}"
                            class="wp-set-row"
                            th:classappend="${s.completed} ? ' is-done' : ''"
                            th:attr="data-set-id=${s.id},
                                     data-set-type=${s.setType != null ? s.setType : 'NORMAL'},
                                     data-completed=${s.completed}">
                            <td class="wp-set-num" data-set-num th:text="${s.setNumber}">1</td>
                            <td class="px-2 py-2">
                                <input type="number" step="0.5" min="0"
                                       th:value="${s.weight}"
                                       class="wp-set-input" data-field="weight"
                                       aria-label="Weight" />
                            </td>
                            <td class="px-2 py-2">
                                <input type="number" min="0"
                                       th:value="${s.reps}"
                                       class="wp-set-input" data-field="reps"
                                       aria-label="Reps" />
                            </td>
                            <td class="px-2 py-2">
                                <input type="text"
                                       th:value="${s.notes}"
                                       class="wp-set-input" data-field="notes"
                                       placeholder="notes"
                                       aria-label="Notes" />
                            </td>
                            <td class="px-2 py-2">
                                <select class="wp-set-type-select" data-field="setType" aria-label="Set type">
                                    <option value="NORMAL" th:selected="${s.setType == null or s.setType == 'NORMAL'}">Normal</option>
                                    <option value="SUPERSET" th:selected="${s.setType == 'SUPERSET'}">Superset</option>
                                    <option value="DROPSET" th:selected="${s.setType == 'DROPSET'}">Dropset</option>
                                </select>
                            </td>
                            <td class="px-2 py-2 text-center">
                                <input type="checkbox" class="wp-set-done-checkbox" data-field="completed"
                                       th:checked="${s.completed}" aria-label="Mark set done" />
                            </td>
                            <td class="px-1 py-2 text-right">
                                <button type="button" class="wp-set-delete-btn" data-delete-set
                                        aria-label="Delete set">
                                    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Add set / drop set -->
            <div class="px-4 py-3 flex flex-wrap gap-2">
                <button type="button" class="wp-add-set-btn" data-add-set>
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                    Add set
                </button>
                <button type="button" class="wp-add-set-btn" data-add-drop-set aria-label="Add drop set">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
                    Drop set
                </button>
                <button type="button" class="wp-add-set-btn" data-set-superset aria-label="Convert to superset">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5"/></svg>
                    Superset
                </button>
            </div>
        </div>
    </div>

    <!-- Add Exercise panel -->
    <div class="wp-add-exercise-panel">
        <button type="button" class="wp-add-exercise-toggle" id="wp-add-ex-toggle" aria-expanded="false">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
            Add Exercise
        </button>
        <div class="hidden px-5 pb-4" id="wp-add-ex-body">
            <!-- Insertion position -->
            <div class="mb-3 flex flex-wrap gap-3 text-sm">
                <label class="flex items-center gap-1.5 cursor-pointer">
                    <input type="radio" name="wp-add-ex-position" value="end" checked class="accent-emerald-500" />
                    Add to end
                </label>
                <label class="flex items-center gap-1.5 cursor-pointer">
                    <input type="radio" name="wp-add-ex-position" value="after" class="accent-emerald-500" />
                    After current
                </label>
                <label class="flex items-center gap-1.5 cursor-pointer">
                    <input type="radio" name="wp-add-ex-position" value="superset" class="accent-emerald-500" />
                    Superset with current
                </label>
            </div>
            <input type="text" class="wp-add-exercise-search mb-3" id="wp-add-ex-search"
                   placeholder="Search exercises..." autocomplete="off" />
            <div class="max-h-56 overflow-y-auto space-y-1" id="wp-add-ex-list">
                <div th:each="ex : ${allExercises}"
                     class="wp-exercise-option"
                     th:attr="data-exercise-id=${ex.id},
                              data-exercise-name=${ex.name},
                              data-exercise-category=${ex.category}">
                    <div>
                        <div class="wp-exercise-option-name" th:text="${ex.name}">Exercise</div>
                        <div class="wp-exercise-option-cat" th:text="${ex.category}">Category</div>
                    </div>
                    <svg class="h-4 w-4 text-emerald-600 opacity-0 transition group-hover:opacity-100" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                </div>
            </div>
        </div>
    </div>

    <!-- Spacer for sticky bar -->
    <div class="h-4"></div>
</div>

<!-- Sticky finish bar -->
<div class="wp-finish-bar">
    <div>
        <div class="wp-finish-volume">Volume: <span class="wp-finish-volume-val" id="wp-volume-footer">0 kg×reps</span></div>
        <div class="text-xs text-slate-500 dark:text-slate-400" id="wp-sets-footer">0 sets done</div>
    </div>
    <div class="flex flex-col items-end gap-1">
        <a th:href="@{'/calendar/day/' + ${workoutSession.date}}"
           class="wp-finish-btn">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Finish Workout
        </a>
        <span class="text-[10px] text-slate-400 dark:text-slate-500">You can finish even with incomplete sets</span>
    </div>
</div>

</div>

<div th:fragment="pageScripts">
    <script>
        window.__wpBootstrap = {
            sessionId: /*[[${workoutSession.id}]]*/ 0,
            csrfHeader: /*[[${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}]]*/ 'X-CSRF-TOKEN',
            csrfToken: /*[[${_csrf != null ? _csrf.token : ''}]]*/ ''
        };
    </script>
    <script src="/js/workouts/workout-player.js" defer></script>
</div>

</th:block>
