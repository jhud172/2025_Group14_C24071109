<th:block xmlns:th="http://www.thymeleaf.org"
          th:with="pageTitle=${'Workout completion — ' + workoutSession.nameSnapshot}"
          th:replace="~{base :: layout(${pageTitle}, null, ~{::content}, null)}">

<div th:fragment="content">
    <div class="mx-auto w-full max-w-3xl px-4 sm:px-6 lg:px-8 py-6">
        <header class="mb-6 rounded-2xl border border-slate-200 bg-white/70 px-5 py-4 shadow-sm backdrop-blur dark:border-slate-800 dark:bg-slate-900/50">
            <p class="text-sm font-medium text-slate-600 dark:text-slate-300">Scheduled Workout</p>
            <h1 class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-slate-100 sm:text-3xl" th:text="${workoutSession.nameSnapshot}">
                Workout completion
            </h1>
            <p class="mt-2 text-sm text-slate-600 dark:text-slate-300">
                Day: <span th:text="${day}"></span>
            </p>
        </header>

        <div class="rounded-2xl border border-slate-200 bg-white/90 p-5 shadow-sm backdrop-blur dark:border-slate-800 dark:bg-slate-900/50">
            <p class="text-sm text-slate-600 dark:text-slate-300" th:text="${workoutSession.workout != null ? workoutSession.workout.notes : ''}">Workout notes</p>

            <div class="mt-6 flex flex-wrap gap-3">
                <a th:href="@{'/workout-session/' + ${workoutSession.id}}"
                   class="inline-flex items-center justify-center rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                    Open workout
                </a>

                <a th:href="@{'/calendar/day/' + ${day}}"
                   class="inline-flex items-center justify-center rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-900 shadow-sm hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100 dark:hover:bg-slate-900">
                    Back to day
                </a>
            </div>
        </div>
    </div>
</div>

</th:block>
