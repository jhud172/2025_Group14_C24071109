<th:block xmlns:th="http://www.thymeleaf.org"
          th:with="pageTitle=${'Ready — ' + workoutSession.nameSnapshot}"
          th:replace="~{base :: layout(${pageTitle}, null, ~{::content}, null)}">

<div th:fragment="content">
    <div class="wp-preflight">

        <!-- Header -->
        <div class="wp-preflight-header">
            <p class="wp-preflight-label">
                <svg class="inline-block mr-1 h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/></svg>
                Ready to train
            </p>
            <h1 class="wp-preflight-title" th:text="${workoutSession.nameSnapshot}">Workout</h1>
            <p class="wp-preflight-meta">
                <span th:text="${day}">Today</span>
                &bull;
                <span th:text="${#lists.size(exerciseSessions)} + ' exercise' + (${#lists.size(exerciseSessions)} == 1 ? '' : 's')">0 exercises</span>
            </p>
            <p th:if="${workoutSession.workout != null and workoutSession.workout.notes != null and !workoutSession.workout.notes.isEmpty()}"
               class="mt-2 text-sm text-slate-600 dark:text-slate-300" th:text="${workoutSession.workout.notes}"></p>
        </div>

        <!-- Exercise overview -->
        <div class="wp-preflight-exercises" th:if="${!#lists.isEmpty(exerciseSessions)}">
            <div class="border-b border-slate-100 px-5 py-3 dark:border-slate-800">
                <p class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Exercises</p>
            </div>
            <div th:each="es, iter : ${exerciseSessions}" class="wp-preflight-exercise-row">
                <span class="wp-preflight-exercise-idx" th:text="${iter.index + 1}">1</span>
                <span class="wp-preflight-exercise-name" th:text="${es.exercise.name}">Exercise</span>
                <span th:with="cat=${es.exercise.category}"
                      class="wp-preflight-exercise-badge"
                      th:classappend="${cat == 'Cardio'} ? ' wp-preflight-exercise-badge-cardio' : (${cat == 'Core'} ? ' wp-preflight-exercise-badge-core' : (${cat == 'Strength'} ? ' wp-preflight-exercise-badge-strength' : ' wp-preflight-exercise-badge-default'))"
                      th:text="${cat}">Category</span>
            </div>
        </div>

        <div class="wp-preflight-exercises" th:if="${#lists.isEmpty(exerciseSessions)}">
            <p class="px-5 py-4 text-sm text-slate-500 dark:text-slate-400">No exercises have been added to this workout yet.</p>
        </div>

        <!-- CTA -->
        <div class="flex flex-col gap-3">
            <a th:href="@{'/workout-session/' + ${workoutSession.id}}" class="wp-start-btn">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 010 1.972l-11.54 6.347a1.125 1.125 0 01-1.667-.986V5.653z"/></svg>
                Start Workout
            </a>
            <a th:href="@{'/calendar/day/' + ${day}}"
               class="inline-flex w-full items-center justify-center gap-2 rounded-2xl border border-slate-200 bg-white px-6 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:bg-slate-800">
                Back to day
            </a>
        </div>
    </div>
</div>

</th:block>
