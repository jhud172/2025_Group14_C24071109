<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${pageTitle} ?: 'Check-in Review', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 lg:px-8">
        <div class="rounded-2xl border border-white/10 bg-white/5 p-6">
            <div class="flex flex-wrap items-start justify-between gap-4">
                <div>
                    <p class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400">Trainer review</p>
                    <h1 class="mt-1 text-2xl font-semibold text-slate-900 dark:text-slate-100">Weekly check-in</h1>
                    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300" th:text="${'Week of ' + checkIn.weekStartDate}"></p>
                </div>
                <span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs ring-1 ring-white/10"
                      th:classappend="${checkIn.status.name() == 'RESPONDED'} ? ' bg-emerald-400/10 text-emerald-300' : ' bg-slate-400/10 text-slate-300'"
                      th:text="${checkIn.status}"></span>
            </div>

            <section class="mt-6">
                <h2 class="text-sm font-semibold text-slate-900 dark:text-slate-100">Responses</h2>
                <div th:if="${#lists.isEmpty(responses)}" class="mt-3 text-sm text-slate-600 dark:text-slate-300">No responses captured.</div>
                <div th:if="${!#lists.isEmpty(responses)}" class="mt-3 space-y-3">
                    <div th:each="resp : ${responses}" class="rounded-xl border border-white/10 bg-white/5 p-4">
                        <div class="text-xs uppercase text-slate-500" th:text="${resp.prompt}"></div>
                        <div class="mt-2 text-sm text-slate-900 dark:text-slate-100" th:text="${resp.answer}"></div>
                    </div>
                </div>
            </section>

            <section class="mt-6">
                <h2 class="text-sm font-semibold text-slate-900 dark:text-slate-100">Coach response</h2>
                <form class="mt-3 space-y-3" th:action="@{/checkins/trainer-review/{id}(id=${checkIn.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <textarea name="trainerResponse" rows="3" placeholder="Response" class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100"
                              th:text="${checkIn.trainerResponse}"></textarea>
                    <textarea name="nextWeekFocus" rows="2" placeholder="Next week focus" class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100"
                              th:text="${checkIn.nextWeekFocus}"></textarea>
                    <select name="goalId" class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100">
                        <option value="">Attach to goal (optional)</option>
                        <option th:each="g : ${goals}" th:value="${g.id}" th:selected="${checkIn.goalId != null && checkIn.goalId == g.id}" th:text="${g.title}"></option>
                    </select>
                    <button type="submit" class="inline-flex items-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">Save response</button>
                </form>
            </section>
        </div>
    </div>

</th:block>
