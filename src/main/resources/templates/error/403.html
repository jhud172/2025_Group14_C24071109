<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('403 - Access Denied', null, ~{::content}, null)}">

<div th:fragment="content">
    <div class="flex items-center justify-center min-h-[60vh] px-4">
        <div class="max-w-md w-full bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-100">
            <div class="p-8 text-center">
                <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i class="fas fa-lock text-2xl"></i>
                </div>
                
                <h1 class="text-2xl font-bold text-gray-900 mb-2">Access Denied</h1>
                <p class="text-gray-600 mb-6">
                     <span th:text="${errorMessage} ?: 'You do not have permission to access this page.'"></span>
                </p>

                <div class="space-y-3">
                    <a href="/" class="block w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg transition-colors">
                        Go to Dashboard
                    </a>
                    <button onclick="history.back()" class="block w-full py-3 px-4 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium rounded-lg transition-colors">
                        Go Back
                    </button>
                </div>
            </div>
            <div class="bg-gray-50 px-8 py-4 border-t border-gray-100 text-center">
                <p class="text-xs text-gray-500">Error 403 Forbidden</p>
            </div>
        </div>
    </div>
</div>

</th:block>
