<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('500 - Server Error', null, ~{::content}, null)}">

<div th:fragment="content">
    <div class="flex items-center justify-center min-h-[60vh] px-4">
        <div class="max-w-md w-full bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-100">
            <div class="p-8 text-center">
                <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i class="fas fa-server text-2xl"></i>
                </div>
                
                <h1 class="text-4xl font-bold text-gray-900 mb-2">500</h1>
                <h2 class="text-xl font-semibold text-gray-700 mb-2">Server Error</h2>
                <p class="text-gray-600 mb-6">
                    Oops! Something went wrong on our end. Our team has been notified.
                </p>

                <div class="space-y-3">
                    <a href="/" class="block w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg transition-colors">
                        <i class="fas fa-home mr-2"></i>Go to Dashboard
                    </a>
                    <button type="button" data-history-back class="block w-full py-3 px-4 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium rounded-lg transition-colors">
                        <i class="fas fa-arrow-left mr-2"></i>Go Back
                    </button>
                </div>

                <div class="mt-6 p-4 bg-amber-50 rounded-lg border border-amber-200">
                    <p class="text-xs text-amber-700">
                        <strong>What you can try:</strong>
                    </p>
                    <ul class="mt-2 space-y-1 text-xs text-amber-600 text-left">
                        <li>• Refresh the page</li>
                        <li>• Clear your browser cache</li>
                        <li>• Try again in a few moments</li>
                    </ul>
                </div>
            </div>
            <div class="bg-gray-50 px-8 py-4 border-t border-gray-100 text-center">
                <p class="text-xs text-gray-500">Error 500 Internal Server Error</p>
            </div>
        </div>
    </div>
</div>

</th:block>
