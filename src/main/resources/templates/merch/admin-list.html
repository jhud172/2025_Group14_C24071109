<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Admin – Merch Products', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-5xl px-4 py-10 sm:px-6 lg:px-8">

        <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
            <h1 class="text-2xl font-bold gradient-text">Merch Products</h1>
            <a th:href="@{/admin/merch/new}" class="btn btn--primary text-sm">+ Add Product</a>
        </div>

        <!-- Flash messages -->
        <div th:if="${successMessage}"
             class="mb-4 rounded-lg border border-neon-green/40 bg-neon-green/10 p-3 text-sm text-neon-green"
             th:text="${successMessage}"></div>
        <div th:if="${errorMessage}"
             class="mb-4 rounded-lg border border-red-500/40 bg-red-500/10 p-3 text-sm text-red-400"
             th:text="${errorMessage}"></div>

        <!-- Products table -->
        <div th:if="${#lists.isEmpty(products)}"
             class="card-neon card--cyan p-8 text-center text-slate-400">
            No products yet. Click "Add Product" to get started.
        </div>

        <div th:if="${!#lists.isEmpty(products)}" class="card-neon card--cyan overflow-hidden">
            <table class="w-full text-sm">
                <thead class="border-b border-slate-700/50">
                    <tr class="text-xs uppercase tracking-wide text-slate-500">
                        <th class="px-4 py-3 text-left">Image</th>
                        <th class="px-4 py-3 text-left">Name</th>
                        <th class="px-4 py-3 text-left">Category</th>
                        <th class="px-4 py-3 text-right">Price</th>
                        <th class="px-4 py-3 text-right">Stock</th>
                        <th class="px-4 py-3 text-center">Active</th>
                        <th class="px-4 py-3 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}"
                        class="border-b border-slate-700/30 last:border-0 hover:bg-slate-800/30 transition-colors">
                        <!-- Image -->
                        <td class="px-4 py-3">
                            <img th:if="${product.imageUrl != null}"
                                 th:src="${product.imageUrl}"
                                 th:alt="${product.name}"
                                 class="h-10 w-10 rounded object-cover" />
                            <span th:if="${product.imageUrl == null}"
                                  class="inline-flex h-10 w-10 items-center justify-center rounded bg-slate-700 text-slate-500 text-xs">N/A</span>
                        </td>
                        <!-- Name -->
                        <td class="px-4 py-3 font-medium text-white" th:text="${product.name}">Name</td>
                        <!-- Category -->
                        <td class="px-4 py-3 text-slate-400" th:text="${product.category ?: '—'}">Cat</td>
                        <!-- Price -->
                        <td class="px-4 py-3 text-right text-neon-cyan font-semibold"
                            th:text="'£' + ${#numbers.formatDecimal(product.price, 1, 2)}">£0.00</td>
                        <!-- Stock -->
                        <td class="px-4 py-3 text-right"
                            th:classappend="${product.stockQuantity == 0} ? 'text-red-400' : 'text-slate-300'"
                            th:text="${product.stockQuantity}">0</td>
                        <!-- Active -->
                        <td class="px-4 py-3 text-center">
                            <span th:if="${product.active}"
                                  class="inline-flex items-center rounded-full bg-neon-green/10 border border-neon-green/30 px-2 py-0.5 text-xs text-neon-green">Active</span>
                            <span th:if="${!product.active}"
                                  class="inline-flex items-center rounded-full bg-slate-700/50 border border-slate-600 px-2 py-0.5 text-xs text-slate-500">Inactive</span>
                        </td>
                        <!-- Actions -->
                        <td class="px-4 py-3 text-right">
                            <div class="flex items-center justify-end gap-2">
                                <a th:href="@{/admin/merch/{id}/edit(id=${product.id})}"
                                   class="btn btn--secondary text-xs px-3 py-1">Edit</a>
                                <form th:action="@{/admin/merch/{id}/delete(id=${product.id})}"
                                      method="post"
                                      onsubmit="return confirm('Delete this product? Any confirmed orders will be marked for refund.');">
                                    <button type="submit" class="btn text-xs px-3 py-1 bg-red-900/40 border border-red-700/50 text-red-400 hover:bg-red-800/60">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-4">
            <a th:href="@{/merch}" class="text-sm text-neon-cyan hover:underline">← View public shop</a>
        </div>
    </div>

</th:block>
