<th:block th:replace="~{base :: layout('Health Record Details', null, ~{::content}, null)}">

    <div th:fragment="content" class="detail-container">
        <!-- Header with key metadata at top -->
        <div class="detail-header">
            <div class="detail-header-content">
                <div class="detail-header-meta">
                    <p class="detail-label">Health Record</p>
                    <h1 class="detail-title">Health record details</h1>
                    <p class="detail-subtitle">Review a specific record.</p>
                </div>
                <!-- Primary actions - sticky on larger screens -->
                <div class="detail-actions-sticky">
                    <a href="/health-record/list" class="detail-btn-secondary">Back to list</a>
                </div>
            </div>
        </div>

        <!-- Structured content sections -->
        <div class="detail-sections">
            <section class="detail-section">
                <div class="detail-section-content">
                    <p class="detail-metadata-label">Date recorded</p>
                    <p class="detail-metadata-value" th:text="${record.baselineDate}"></p>
                </div>
            </section>

            <div class="detail-grid-2">
                <section class="detail-section">
                    <h2 class="detail-section-title">Cardiovascular</h2>
                    <div class="detail-section-content">
                        <div class="detail-metadata">
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label">Blood pressure</p>
                                <p class="detail-metadata-value">
                                    <span th:text="${record.systolicBloodPressure}"></span> / <span th:text="${record.diastolicBloodPressure}"></span> mmHg
                                </p>
                            </div>
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label">Cholesterol</p>
                                <p class="detail-metadata-value"><span th:text="${record.cholesterol}"></span> mmol/L</p>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="detail-section">
                    <h2 class="detail-section-title">Body measurements</h2>
                    <div class="detail-section-content">
                        <div class="detail-metadata">
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label">Weight</p>
                                <p class="detail-metadata-value"><span th:text="${record.weightKg}"></span> kg</p>
                            </div>
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label">Height</p>
                                <p class="detail-metadata-value"><span th:text="${record.heightCm}"></span> cm</p>
                            </div>
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label">Waist</p>
                                <p class="detail-metadata-value"><span th:text="${record.waistCm}"></span> cm</p>
                            </div>
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label">BMI</p>
                                <p class="detail-metadata-value" th:text="${record.bmi}"></p>
                            </div>
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label">Waist/height ratio</p>
                                <p class="detail-metadata-value" th:text="${record.waistHeightRatio}"></p>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="detail-section">
                    <h2 class="detail-section-title">Activity</h2>
                    <div class="detail-section-content">
                        <div class="detail-metadata-item">
                            <p class="detail-metadata-label">Activity level</p>
                            <p class="detail-metadata-value" th:text="${record.activityLevel}"></p>
                        </div>
                    </div>
                </section>

                <section class="detail-section">
                    <h2 class="detail-section-title">Physical conditions</h2>
                    <div class="detail-section-content">
                        <div th:if="${#lists.isEmpty(record.physicalConditions)}" class="detail-empty">None recorded</div>
                        <ul th:if="${!#lists.isEmpty(record.physicalConditions)}" class="list-disc list-inside space-y-1 text-sm text-slate-700 dark:text-slate-300">
                            <li th:each="pc : ${record.physicalConditions}" th:text="${pc.name}"></li>
                        </ul>
                    </div>
                </section>
            </div>
        </div>
    </div>
</th:block>
