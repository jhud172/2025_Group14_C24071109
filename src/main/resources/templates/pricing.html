<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Pricing', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-6xl px-4 py-10 sm:px-6 lg:px-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-semibold gradient-text">Platform Premium</h1>
            <p class="mt-2 text-sm text-slate-400">Upgrade your Healthy Habits experience with premium dashboards and insights.</p>
        </div>

        <div class="mt-8 grid gap-6 md:grid-cols-2">
            <div th:each="plan : ${plans}" class="card-neon p-6 transition-all duration-300"
                 th:classappend="${plan.plan.name() == 'YEARLY'} ? ' card--purple shadow-glow-lg' : ' card--cyan'">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-semibold" 
                        th:classappend="${plan.plan.name() == 'YEARLY'} ? 'text-neon-purple' : 'text-neon-cyan'"
                        th:text="${plan.displayName}">Monthly</h2>
                    <span class="rounded-full px-3 py-1 text-xs font-semibold border"
                          th:classappend="${plan.plan.name() == 'YEARLY'} ? 'bg-neon-purple/10 border-neon-purple/40 text-neon-purple' : 'bg-neon-cyan/10 border-neon-cyan/40 text-neon-cyan'"
                          th:text="${plan.badge}">Most flexible</span>
                </div>
                <p class="mt-2 text-3xl font-bold gradient-text" th:text="${plan.priceLabel}">£12 / month</p>
                <ul class="mt-4 space-y-2 text-sm text-slate-300">
                    <li th:each="benefit : ${plan.benefits}" class="flex items-start gap-2">
                        <svg class="h-5 w-5 mt-0.5 flex-shrink-0" 
                             th:classappend="${plan.plan.name() == 'YEARLY'} ? 'text-neon-purple' : 'text-neon-cyan'"
                             fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        <span th:text="${benefit}">Premium dashboards</span>
                    </li>
                </ul>
                <a th:href="@{/pricing/checkout(plan=${plan.plan})}"
                   class="mt-6 btn w-full"
                   th:classappend="${plan.plan.name() == 'YEARLY'} ? 'btn--primary' : 'btn--secondary'">
                    Choose plan
                </a>
            </div>
        </div>

        <div class="mt-10 card-neon card--green p-6">
            <div class="flex items-start gap-3">
                <div class="p-2 rounded-lg bg-neon-green/10 border border-neon-green/30">
                    <svg class="h-5 w-5 text-neon-green" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <p class="text-sm text-slate-300">Platform Premium is separate from any gym memberships. You can manage or cancel at the end of your billing period.</p>
            </div>
        </div>
    </div>

</th:block>
