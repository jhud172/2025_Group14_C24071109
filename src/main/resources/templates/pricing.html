<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Pricing', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-6xl px-4 py-10 sm:px-6 lg:px-8">
        <div class="text-center">
            <h1 class="text-3xl font-semibold tracking-tight text-slate-900">Platform Premium</h1>
            <p class="mt-2 text-sm text-slate-600">Upgrade your Healthy Habits experience with premium dashboards and insights.</p>
        </div>

        <div class="mt-8 grid gap-6 md:grid-cols-2">
            <div th:each="plan : ${plans}" class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm"
                 th:classappend="${plan.plan.name() == 'YEARLY'} ? ' ring-2 ring-slate-900' : ''">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-semibold text-slate-900" th:text="${plan.displayName}">Monthly</h2>
                    <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600" th:text="${plan.badge}">Most flexible</span>
                </div>
                <p class="mt-2 text-3xl font-bold text-slate-900" th:text="${plan.priceLabel}">£12 / month</p>
                <ul class="mt-4 space-y-2 text-sm text-slate-600">
                    <li th:each="benefit : ${plan.benefits}" th:text="${benefit}">Premium dashboards</li>
                </ul>
                <a th:href="@{/pricing/checkout(plan=${plan.plan})}"
                   class="mt-6 inline-flex w-full items-center justify-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800"
                   th:classappend="${plan.plan.name() == 'YEARLY'} ? ' bg-indigo-600 hover:bg-indigo-500' : ''">
                    Choose plan
                </a>
            </div>
        </div>

        <div class="mt-10 rounded-2xl border border-slate-200 bg-slate-50 p-6 text-sm text-slate-600">
            <p>Platform Premium is separate from any gym memberships. You can manage or cancel at the end of your billing period.</p>
        </div>
    </div>

</th:block>
