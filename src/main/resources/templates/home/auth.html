<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Home', null, ~{::content}, ~{dashboard/client-dashboard :: pageScripts})}">

    <div th:fragment="content">
        <div class="mx-auto w-full max-w-6xl px-4 pt-6 sm:px-6 lg:px-8">
            <div th:if="${param.loggedout}" class="mb-4 card-neon card--cyan p-4">
                <div class="flex items-center gap-3">
                    <div class="p-2 rounded-lg bg-neon-cyan/10 border border-neon-cyan/30">
                        <svg class="h-5 w-5 text-neon-cyan" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <span class="text-sm text-slate-200">You've been logged out.</span>
                </div>
            </div>
            <div th:if="${param.expired}" class="mb-4 card-neon card--purple p-4">
                <div class="flex items-center gap-3">
                    <div class="p-2 rounded-lg bg-neon-purple/10 border border-neon-purple/30">
                        <svg class="h-5 w-5 text-neon-purple" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <span class="text-sm text-slate-200">Your session has expired. Please sign in again.</span>
                </div>
            </div>
        </div>
        <div th:replace="~{dashboard/client-dashboard :: contentMain}"></div>
    </div>

</th:block>
