<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Apply Schedule', null, ~{::content}, null)}">

<div th:fragment="content">
    <div class="schedule-apply-page mx-auto w-full max-w-3xl px-4 py-6 sm:px-6 lg:px-8">
        <nav class="mb-6 flex items-center gap-2 text-sm">
            <a href="/schedules" class="schedule-apply-breadcrumb-link">&larr; Schedules</a>
            <span class="schedule-apply-breadcrumb-separator">&rsaquo;</span>
            <span class="schedule-apply-breadcrumb-current">Apply Schedule</span>
        </nav>

        <div class="mb-6 flex flex-col gap-2">
            <h1 class="schedule-apply-title text-2xl font-bold tracking-tight">Apply schedule</h1>
            <p class="schedule-apply-subtitle text-sm">
                Applying: <span class="schedule-apply-glow-text font-semibold" th:text="${schedule.name}"></span>
            </p>
        </div>

        <section class="schedule-apply-panel rounded-2xl p-6">
            <form th:action="@{'/schedules/' + ${schedule.id} + '/apply'}" method="post" class="space-y-5">
                <input type="hidden" th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <div>
                    <label class="schedule-apply-label mb-1.5 block text-sm font-semibold">Start date</label>
                    <input type="date" name="startDate" required
                           class="schedule-apply-input w-full rounded-xl px-4 py-2.5"/>
                </div>

                <div>
                    <label class="schedule-apply-label mb-1.5 block text-sm font-semibold">Number of weeks</label>
                    <input type="number" name="weeks" value="4" min="1"
                           class="schedule-apply-input w-full rounded-xl px-4 py-2.5"/>
                </div>

                <div class="pt-2">
                    <button class="schedule-apply-btn inline-flex items-center justify-center rounded-xl px-5 py-2.5 text-sm font-semibold">
                        <svg class="mr-1.5 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        Apply schedule
                    </button>
                </div>
            </form>
        </section>
    </div>
</div>

</th:block>
