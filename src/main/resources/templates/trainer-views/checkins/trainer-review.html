<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${pageTitle} ?: 'Check-in Review', null, ~{::content}, null)}">

    <div th:fragment="content" class="detail-container">
        <!-- Header with key metadata at top -->
        <div class="detail-header">
            <div class="detail-header-content">
                <div class="detail-header-meta">
                    <p class="detail-label">Trainer review</p>
                    <h1 class="detail-title">Weekly check-in</h1>
                    <p class="detail-subtitle" th:text="${'Week of ' + checkIn.weekStartDate}"></p>
                </div>
                <!-- Status badge in header -->
                <div class="detail-actions-sticky">
                    <span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs ring-1 ring-white/10"
                          th:classappend="${checkIn.status.name() == 'RESPONDED'} ? ' bg-emerald-400/10 text-emerald-300' : ' bg-slate-400/10 text-slate-300'"
                          th:text="${checkIn.status}"></span>
                </div>
            </div>
        </div>

        <!-- Structured content sections -->
        <div class="detail-sections">
            <div class="detail-grid-2">
                <!-- Responses Section -->
                <section class="detail-section">
                    <h2 class="detail-section-title">Responses</h2>
                    <div class="detail-section-content">
                        <div th:if="${#lists.isEmpty(responses)}" class="detail-empty">No responses captured.</div>
                        <div th:if="${!#lists.isEmpty(responses)}" class="space-y-3">
                            <div th:each="resp : ${responses}" class="rounded-xl border border-white/10 bg-white/5 p-4">
                                <div class="text-xs uppercase text-slate-500" th:text="${resp.prompt}"></div>
                                <div class="mt-2 text-sm text-slate-900 dark:text-slate-100" th:text="${resp.answer}"></div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Coach Response Section -->
                <section class="detail-section">
                    <h2 class="detail-section-title">Coach response</h2>
                    <div class="detail-section-content">
                        <form class="space-y-3" th:action="@{/checkins/trainer-review/{id}(id=${checkIn.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div>
                                <label class="detail-metadata-label">Response</label>
                                <textarea name="trainerResponse" rows="3" placeholder="Response" class="mt-1 w-full rounded-xl border border-slate-200 dark:border-white/15 bg-white dark:bg-white/5 px-3 py-2 text-sm text-slate-700 dark:text-slate-200"
                                          th:text="${checkIn.trainerResponse}"></textarea>
                            </div>
                            <div>
                                <label class="detail-metadata-label">Next week focus</label>
                                <textarea name="nextWeekFocus" rows="2" placeholder="Next week focus" class="mt-1 w-full rounded-xl border border-slate-200 dark:border-white/15 bg-white dark:bg-white/5 px-3 py-2 text-sm text-slate-700 dark:text-slate-200"
                                          th:text="${checkIn.nextWeekFocus}"></textarea>
                            </div>
                            <div>
                                <label class="detail-metadata-label">Attach to goal</label>
                                <select name="goalId" class="mt-1 w-full rounded-xl border border-slate-200 dark:border-white/15 bg-white dark:bg-white/5 px-3 py-2 text-sm text-slate-700 dark:text-slate-200">
                                    <option value="">Attach to goal (optional)</option>
                                    <option th:each="g : ${goals}" th:value="${g.id}" th:selected="${checkIn.goalId != null && checkIn.goalId == g.id}" th:text="${g.title}"></option>
                                </select>
                            </div>
                            <button type="submit" class="detail-btn-primary">Save response</button>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </div>

</th:block>
