<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${note != null and note.id != null} ? 'Edit Note' : 'New Note', ~{::styles}, ~{::content}, ~{::pageScripts})}">

<div th:fragment="styles">
</div>

<div th:fragment="content">
    <div class="mx-auto w-full max-w-5xl px-4 sm:px-6 lg:px-8">
        <div th:replace="~{fragments/username-logout :: usernameLogout}"></div>

        <div class="mt-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-slate-900" th:text="${note != null and note.id != null} ? 'Edit Note' : 'New Note'">New Note</h1>
                    <p class="mt-1 text-sm text-slate-600">Use the toolbar to format your note.</p>
                </div>
                <div class="flex gap-2">
                    <a class="inline-flex items-center justify-center rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-900 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900/10"
                       th:if="${folder != null}" th:href="@{/notes/folders/{id}(id=${folder.id})}">Cancel</a>
                    <a class="inline-flex items-center justify-center rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-900 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900/10"
                       th:if="${folder == null}" th:href="@{/notes}">Cancel</a>
                </div>
            </div>

            <form th:action="${note != null and note.id != null} ? @{/notes/{id}/edit(id=${note.id})} : @{/notes/folders/{id}/new(id=${folder.id})}"
                  method="post" id="noteForm" class="mt-6 space-y-6">

            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div>
                    <label class="block text-sm font-medium text-slate-700" for="noteTitle">Title</label>
                    <input id="noteTitle" type="text" name="title" placeholder="Title" maxlength="120" th:value="${note != null ? note.title : ''}" required
                           class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10">
                </div>

                <div>
                    <div class="flex items-center justify-between gap-3">
                        <span class="text-sm font-medium text-slate-700">Colour</span>
                        <input type="hidden" name="noteColour" id="noteColour" value="slate">
                    </div>

                    <div class="mt-2 flex flex-wrap gap-2">
                        <button type="button" class="chip rounded-md border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900/10 [&.active]:bg-slate-900 [&.active]:text-white" data-note-colour="slate">Slate</button>
                        <button type="button" class="chip rounded-md border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900/10 [&.active]:bg-slate-900 [&.active]:text-white" data-note-colour="purple">Purple</button>
                        <button type="button" class="chip rounded-md border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900/10 [&.active]:bg-slate-900 [&.active]:text-white" data-note-colour="cyan">Cyan</button>
                        <button type="button" class="chip rounded-md border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900/10 [&.active]:bg-slate-900 [&.active]:text-white" data-note-colour="green">Green</button>
                        <button type="button" class="chip rounded-md border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900/10 [&.active]:bg-slate-900 [&.active]:text-white" data-note-colour="pink">Pink</button>
                    </div>
                </div>

                <div class="rounded-lg border border-slate-200 bg-slate-50 p-2" role="toolbar" aria-label="Note formatting toolbar">
                    <div class="flex flex-wrap items-center gap-2">
                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>

                        <span class="mx-1 h-5 w-px bg-slate-200"></span>

                        <select class="tool-select rounded-md border border-slate-200 bg-white px-2 py-1.5 text-xs font-semibold text-slate-900 shadow-sm" id="headingSelect" title="Heading style">
                            <option value="p">Normal</option>
                            <option value="h1">Heading 1</option>
                            <option value="h2">Heading 2</option>
                            <option value="h3">Heading 3</option>
                            <option value="blockquote">Quote</option>
                        </select>

                        <select class="tool-select rounded-md border border-slate-200 bg-white px-2 py-1.5 text-xs font-semibold text-slate-900 shadow-sm" id="fontSizeSelect" title="Font size">
                            <option value="2">Small</option>
                            <option value="3" selected>Normal</option>
                            <option value="4">Large</option>
                            <option value="5">XL</option>
                        </select>

                        <span class="mx-1 h-5 w-px bg-slate-200"></span>

                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" data-cmd="insertUnorderedList" title="Bullets">• List</button>
                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" data-cmd="insertOrderedList" title="Numbered">1. List</button>

                        <span class="mx-1 h-5 w-px bg-slate-200"></span>

                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" data-align="left" title="Align left">⟸</button>
                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" data-align="center" title="Align centre">≡</button>
                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" data-align="right" title="Align right">⟹</button>

                        <span class="mx-1 h-5 w-px bg-slate-200"></span>

                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" id="linkBtn" title="Insert link">🔗 Link</button>
                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" id="highlightBtn" title="Highlight">🖍</button>
                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" id="clearBtn" title="Clear formatting">Clear</button>
                    </div>
                </div>

                <div id="editorShell" class="rounded-lg border border-slate-200 bg-white shadow-sm">
                    <div class="editor min-h-80 p-4 text-sm leading-6 text-slate-800 focus:outline-none"
                         id="editor" contenteditable="true" spellcheck="true" data-placeholder="Write your note…"
                         th:utext="${note != null ? note.content : ''}"
                         style="white-space: pre-wrap;"></div>
                </div>

            <input type="hidden" name="content" id="contentHtml">

                <div class="flex flex-col-reverse gap-2 sm:flex-row sm:items-center sm:justify-end">
                    <button class="inline-flex items-center justify-center rounded-md bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900/10" type="submit">Save</button>
                </div>

            </form>
        </div>
    </div>
</div>

<div th:fragment="pageScripts">
    <script src="/js/note-editor.js" defer></script>
</div>

</th:block>
