<th:block th:replace="~{base :: layout('Health Record Details', null, ~{::content}, null)}">

    <div th:fragment="content">
        <div class="mx-auto w-full max-w-4xl px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex flex-col gap-2">
                <h1 class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-slate-100">Health record details</h1>
                <p class="text-sm text-slate-700 dark:text-slate-200">Review a specific record.</p>
            </div>

            <section class="mt-6 rounded-2xl border border-slate-200 bg-white/80 p-6 shadow-sm backdrop-blur dark:border-slate-800 dark:bg-slate-900/50">
                <div class="text-sm text-slate-700 dark:text-slate-200">
                    <span class="font-semibold text-slate-900 dark:text-slate-100">Date recorded:</span>
                    <span th:text="${record.baselineDate}"></span>
                </div>

                <div class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-2">
                    <div class="space-y-6">
                        <div class="rounded-xl border border-slate-200 bg-white/70 p-4 dark:border-slate-800 dark:bg-slate-950/30">
                            <h3 class="text-sm font-semibold text-slate-900 dark:text-slate-100">Cardiovascular</h3>
                            <div class="mt-3 space-y-2 text-sm text-slate-700 dark:text-slate-200">
                                <p>
                                    <span class="font-semibold text-slate-900 dark:text-slate-100">Blood pressure:</span>
                                    <span th:text="${record.systolicBloodPressure}"></span> / <span th:text="${record.diastolicBloodPressure}"></span> mmHg
                                </p>
                                <p><span class="font-semibold text-slate-900 dark:text-slate-100">Cholesterol:</span> <span th:text="${record.cholesterol}"></span> mmol/L</p>
                            </div>
                        </div>

                        <div class="rounded-xl border border-slate-200 bg-white/70 p-4 dark:border-slate-800 dark:bg-slate-950/30">
                            <h3 class="text-sm font-semibold text-slate-900 dark:text-slate-100">Body measurements</h3>
                            <div class="mt-3 space-y-2 text-sm text-slate-700 dark:text-slate-200">
                                <p><span class="font-semibold text-slate-900 dark:text-slate-100">Weight:</span> <span th:text="${record.weightKg}"></span> kg</p>
                                <p><span class="font-semibold text-slate-900 dark:text-slate-100">Height:</span> <span th:text="${record.heightCm}"></span> cm</p>
                                <p><span class="font-semibold text-slate-900 dark:text-slate-100">Waist:</span> <span th:text="${record.waistCm}"></span> cm</p>
                                <p><span class="font-semibold text-slate-900 dark:text-slate-100">BMI:</span> <span th:text="${record.bmi}"></span></p>
                                <p><span class="font-semibold text-slate-900 dark:text-slate-100">Waist/height ratio:</span> <span th:text="${record.waistHeightRatio}"></span></p>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="rounded-xl border border-slate-200 bg-white/70 p-4 dark:border-slate-800 dark:bg-slate-950/30">
                            <h3 class="text-sm font-semibold text-slate-900 dark:text-slate-100">Activity</h3>
                            <p class="mt-3 text-sm text-slate-700 dark:text-slate-200">
                                <span class="font-semibold text-slate-900 dark:text-slate-100">Activity level:</span>
                                <span th:text="${record.activityLevel}"></span>
                            </p>
                        </div>

                        <div class="rounded-xl border border-slate-200 bg-white/70 p-4 dark:border-slate-800 dark:bg-slate-950/30">
                            <h3 class="text-sm font-semibold text-slate-900 dark:text-slate-100">Physical conditions</h3>
                            <ul class="mt-3 list-disc list-inside text-sm text-slate-700 dark:text-slate-200">
                                <li th:each="pc : ${record.physicalConditions}" th:text="${pc.name}"></li>
                            </ul>
                            <p th:if="${#lists.isEmpty(record.physicalConditions)}" class="mt-3 text-sm text-slate-700 dark:text-slate-200">None recorded</p>
                        </div>
                    </div>
                </div>

                <div class="mt-6 pt-4 border-t border-slate-200 dark:border-slate-800">
                    <a href="/health-record/list" class="text-sm font-semibold text-blue-700 hover:underline dark:text-blue-300">Back to list</a>
                </div>
            </section>
        </div>
    </div>
</th:block>
