<th:block xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
          th:replace="~{base :: layout('Leave a Review', null, ~{::content}, ~{::pageScripts})}">

    <div th:fragment="content" class="mx-auto w-full max-w-2xl px-4 py-6 sm:px-6 lg:px-8">
        <div class="rounded-xl bg-white/5 dark:bg-slate-900/40 ring-1 ring-white/10 shadow-sm p-6">
            <h1 class="text-xl font-semibold text-slate-900 dark:text-slate-100">Leave a Review</h1>
            <p class="mt-1 text-sm text-slate-600 dark:text-slate-300" 
               th:text="'Review ' + ${trainer.firstName} + ' ' + ${trainer.lastName}">Review Trainer</p>

            <form th:action="@{/trainers/{id}/review(id=${trainer.id})}" method="post" class="mt-6 space-y-6">
                <!-- Star Rating -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Rating *</label>
                    <div class="mt-2 flex items-center gap-2">
                        <div class="flex gap-1" id="starRating">
                            <button type="button" onclick="setRating(1)" class="star-btn" data-rating="1">
                                <svg class="h-8 w-8 text-slate-300 hover:text-yellow-400 transition-colors" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                                </svg>
                            </button>
                            <button type="button" onclick="setRating(2)" class="star-btn" data-rating="2">
                                <svg class="h-8 w-8 text-slate-300 hover:text-yellow-400 transition-colors" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                                </svg>
                            </button>
                            <button type="button" onclick="setRating(3)" class="star-btn" data-rating="3">
                                <svg class="h-8 w-8 text-slate-300 hover:text-yellow-400 transition-colors" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                                </svg>
                            </button>
                            <button type="button" onclick="setRating(4)" class="star-btn" data-rating="4">
                                <svg class="h-8 w-8 text-slate-300 hover:text-yellow-400 transition-colors" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                                </svg>
                            </button>
                            <button type="button" onclick="setRating(5)" class="star-btn" data-rating="5">
                                <svg class="h-8 w-8 text-slate-300 hover:text-yellow-400 transition-colors" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                                </svg>
                            </button>
                        </div>
                        <span id="ratingText" class="text-sm text-slate-600 dark:text-slate-300"></span>
                    </div>
                    <input type="hidden" name="stars" id="starsInput" required/>
                </div>

                <!-- Tags -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Tags (optional)</label>
                    <p class="mt-1 text-xs text-slate-500">Select qualities that describe this trainer</p>
                    <div class="mt-2 flex flex-wrap gap-2">
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="tag" value="Professional" 
                                   class="rounded border-slate-300 text-blue-600 focus:ring-blue-500"/>
                            <span class="ml-2 text-sm text-slate-700 dark:text-slate-300">Professional</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="tag" value="Responsive" 
                                   class="rounded border-slate-300 text-blue-600 focus:ring-blue-500"/>
                            <span class="ml-2 text-sm text-slate-700 dark:text-slate-300">Responsive</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="tag" value="Knowledgeable" 
                                   class="rounded border-slate-300 text-blue-600 focus:ring-blue-500"/>
                            <span class="ml-2 text-sm text-slate-700 dark:text-slate-300">Knowledgeable</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="tag" value="Motivating" 
                                   class="rounded border-slate-300 text-blue-600 focus:ring-blue-500"/>
                            <span class="ml-2 text-sm text-slate-700 dark:text-slate-300">Motivating</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="tag" value="Supportive" 
                                   class="rounded border-slate-300 text-blue-600 focus:ring-blue-500"/>
                            <span class="ml-2 text-sm text-slate-700 dark:text-slate-300">Supportive</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="tag" value="Patient" 
                                   class="rounded border-slate-300 text-blue-600 focus:ring-blue-500"/>
                            <span class="ml-2 text-sm text-slate-700 dark:text-slate-300">Patient</span>
                        </label>
                    </div>
                    <input type="hidden" name="tags" id="tagsInput"/>
                </div>

                <!-- Comment -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Your Review (optional)</label>
                    <textarea name="comment" rows="4"
                             class="mt-1 block w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 px-3 py-2 text-sm text-slate-900 dark:text-slate-100 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                             placeholder="Share your experience with this trainer..."></textarea>
                </div>

                <!-- Submit -->
                <div class="flex justify-end gap-3">
                    <a th:href="@{/trainers/{id}/profile(id=${trainer.id})}"
                       class="inline-flex min-h-11 items-center justify-center rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2">
                        Cancel
                    </a>
                    <button type="submit"
                           class="inline-flex min-h-11 items-center justify-center rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600/30">
                        Submit Review
                    </button>
                </div>
            </form>
        </div>

    <th:block th:fragment="pageScripts">
    </div>

    <th:block th:fragment="pageScripts">
        <script th:src="@{/js/health/review-form-page.js}"></script>
    </th:block>
</th:block>
