<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Login Required', ~{::pageStyles}, ~{::content}, ~{::pageScripts})}">

    <th:block th:fragment="pageStyles">
        <style>
            .devunauth-wrap {
                min-height: 65vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 40px 16px;
                background:
                    radial-gradient(circle at 20% 20%, rgba(16,185,129,.03) 0%, transparent 50%),
                    radial-gradient(circle at 80% 80%, rgba(52,211,153,.03) 0%, transparent 50%);
            }
            .devunauth-card {
                background: #ffffff;
                border: 1px solid #e5e7eb;
                border-radius: 24px;
                padding: 48px 36px 40px;
                max-width: 480px;
                width: 100%;
                text-align: center;
                box-shadow:
                    0 20px 25px -5px rgba(0,0,0,.05),
                    0 10px 10px -5px rgba(0,0,0,.02),
                    0 0 0 1px rgba(16,185,129,.05);
                position: relative;
                overflow: hidden;
                animation: unauthSlideUp .45s ease-out;
            }
            @keyframes unauthSlideUp {
                from { opacity: 0; transform: translateY(18px); }
                to   { opacity: 1; transform: translateY(0); }
            }
            /* Emerald accent bar */
            .devunauth-card::before {
                content: '';
                position: absolute;
                top: 0; left: 0; right: 0;
                height: 4px;
                border-radius: 24px 24px 0 0;
                background: linear-gradient(90deg, #10b981 0%, #34d399 50%, #10b981 100%);
                background-size: 200% 100%;
                animation: unauthShimmer 3s linear infinite;
            }
            @keyframes unauthShimmer {
                0%   { background-position: -200% 0; }
                100% { background-position:  200% 0; }
            }
            /* Persistent DEV MODE badge */
            .devunauth-env-badge {
                position: fixed;
                top: 72px;
                right: 16px;
                z-index: 50;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                background: #fff;
                border: 1.5px solid #10b981;
                color: #065f46;
                padding: 4px 11px;
                border-radius: 999px;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: .7px;
                text-transform: uppercase;
                box-shadow: 0 2px 8px rgba(16,185,129,.15);
            }
            .devunauth-env-badge-dot {
                width: 6px; height: 6px;
                border-radius: 50%;
                background: #10b981;
                animation: unauthPulse 2s ease-in-out infinite;
                flex-shrink: 0;
            }
            @keyframes unauthPulse { 0%,100%{opacity:1} 50%{opacity:.4} }
            .devunauth-badge {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                background: #ecfdf5;
                border: 1.5px solid #6ee7b7;
                color: #065f46;
                padding: 4px 12px;
                border-radius: 999px;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: .7px;
                text-transform: uppercase;
                margin-bottom: 22px;
            }
            .devunauth-icon { font-size: 52px; margin-bottom: 18px; line-height: 1; }
            .devunauth-card h1 {
                font-size: 22px;
                font-weight: 700;
                color: #111827;
                margin: 0 0 10px;
            }
            .devunauth-card p {
                font-size: 14px;
                color: #6b7280;
                line-height: 1.65;
                margin: 0 0 26px;
            }
            .devunauth-actions {
                display: flex;
                gap: 10px;
                justify-content: center;
                flex-wrap: wrap;
            }
            .devunauth-btn-primary {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 11px 22px;
                background: #10b981;
                color: #fff;
                border-radius: 10px;
                font-weight: 700;
                font-size: 14px;
                text-decoration: none;
                transition: background .2s, transform .15s;
            }
            .devunauth-btn-primary:hover {
                background: #059669;
                transform: translateY(-1px);
                text-decoration: none; color: #fff;
            }
            .devunauth-btn-secondary {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 11px 22px;
                background: #f9fafb;
                border: 1.5px solid #e5e7eb;
                color: #374151;
                border-radius: 10px;
                font-weight: 600;
                font-size: 14px;
                text-decoration: none;
                transition: border-color .2s, color .2s, transform .15s;
            }
            .devunauth-btn-secondary:hover {
                border-color: #d1d5db;
                color: #111827;
                transform: translateY(-1px);
                text-decoration: none;
            }

            /* dark mode */
            html.dark .devunauth-wrap { background: none; }
            html.dark .devunauth-card { background: #1e293b; border-color: #334155; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
            html.dark .devunauth-card h1 { color: #e2e8f0; }
            html.dark .devunauth-card p  { color: #94a3b8; }
            html.dark .devunauth-badge { background: rgba(16,185,129,.1); border-color: rgba(16,185,129,.3); color: #6ee7b7; }
            html.dark .devunauth-env-badge { background: #1e293b; color: #6ee7b7; border-color: rgba(16,185,129,.4); }
            html.dark .devunauth-btn-secondary { background: #0f172a; border-color: #334155; color: #94a3b8; }
            html.dark .devunauth-btn-secondary:hover { border-color: #475569; color: #e2e8f0; }
        </style>
    </th:block>

    <div th:fragment="content" class="devunauth-wrap">

        <!-- Persistent DEV MODE badge -->
        <div class="devunauth-env-badge" aria-label="Development environment">
            <span class="devunauth-env-badge-dot"></span>
            DEV MODE
        </div>

        <div class="devunauth-card">

            <div class="devunauth-badge">
                <span class="devunauth-env-badge-dot"></span>
                Development Environment
            </div>

            <div class="devunauth-icon">🔒</div>
            <h1>Login Required</h1>
            <p>This page needs an authenticated session to display content. Sign in to explore it with real data, or return to the Dev Hub to browse public pages.</p>

            <div class="devunauth-actions">
                <a href="/login?devLogin=1" class="devunauth-btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                    Sign In
                </a>
                <a href="/dev-mode" class="devunauth-btn-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                    Dev Hub
                </a>
            </div>

        </div>
    </div>

    <th:block th:fragment="pageScripts">
    </th:block>

</th:block>
