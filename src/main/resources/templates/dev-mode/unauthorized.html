<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Login Required', ~{::pageStyles}, ~{::content}, ~{::pageScripts})}">

    <th:block th:fragment="pageStyles">
        <style>
            .dev-unauth-wrap {
                min-height: 65vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 40px 20px;
            }

            .dev-unauth-card {
                background: #ffffff;
                border: 1.5px solid #e5e7eb;
                border-radius: 20px;
                padding: 48px 40px 40px;
                max-width: 520px;
                width: 100%;
                text-align: center;
                box-shadow: 0 4px 32px rgba(0,0,0,.07);
            }

            .dev-unauth-badge {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                background: #fef3c7;
                border: 1px solid #fde68a;
                color: #92400e;
                padding: 4px 12px;
                border-radius: 999px;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: .5px;
                text-transform: uppercase;
                margin-bottom: 24px;
            }
            .dev-unauth-badge-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: #f59e0b;
                animation: unaPulse 2s ease-in-out infinite;
            }
            @keyframes unaPulse {
                0%, 100% { opacity: 1; }
                50% { opacity: .4; }
            }

            .dev-unauth-icon {
                font-size: 56px;
                margin-bottom: 20px;
                line-height: 1;
            }

            .dev-unauth-card h1 {
                font-size: 24px;
                font-weight: 700;
                color: #111827;
                margin: 0 0 12px;
            }

            .dev-unauth-card p {
                font-size: 15px;
                color: #6b7280;
                line-height: 1.65;
                margin: 0 0 28px;
            }

            .dev-unauth-actions {
                display: flex;
                gap: 10px;
                justify-content: center;
                flex-wrap: wrap;
            }

            .dev-btn-primary {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 11px 22px;
                background: #10b981;
                color: #ffffff;
                border-radius: 10px;
                font-weight: 600;
                font-size: 14px;
                text-decoration: none;
                transition: background .2s, transform .2s, box-shadow .2s;
            }
            .dev-btn-primary:hover {
                background: #059669;
                transform: translateY(-1px);
                box-shadow: 0 4px 14px rgba(16,185,129,.3);
                text-decoration: none;
                color: #ffffff;
            }

            .dev-btn-secondary {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 11px 22px;
                background: #f3f4f6;
                color: #374151;
                border-radius: 10px;
                font-weight: 600;
                font-size: 14px;
                text-decoration: none;
                transition: background .2s, transform .2s;
            }
            .dev-btn-secondary:hover {
                background: #e5e7eb;
                transform: translateY(-1px);
                text-decoration: none;
                color: #374151;
            }

            /* Dark mode */
            .dark .dev-unauth-card {
                background: #1e293b;
                border-color: #334155;
            }
            .dark .dev-unauth-card h1 { color: #f1f5f9; }
            .dark .dev-unauth-card p  { color: #94a3b8; }
            .dark .dev-btn-secondary  { background: #334155; color: #e2e8f0; }
            .dark .dev-btn-secondary:hover { background: #475569; color: #f1f5f9; }
        </style>
    </th:block>

    <div th:fragment="content" class="dev-unauth-wrap">
        <div class="dev-unauth-card">

            <div class="dev-unauth-badge">
                <span class="dev-unauth-badge-dot"></span>
                Development Mode
            </div>

            <div class="dev-unauth-icon">🔒</div>

            <h1>Login Required</h1>
            <p>This page needs an authenticated session to display content. Sign in to explore it with real data, or return to the Dev Hub to browse open pages.</p>

            <div class="dev-unauth-actions">
                <a href="/login" class="dev-btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                    Sign In
                </a>
                <a href="/dev-mode" class="dev-btn-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                    Dev Hub
                </a>
            </div>

        </div>
    </div>

    <th:block th:fragment="pageScripts">
    </th:block>

</th:block>
