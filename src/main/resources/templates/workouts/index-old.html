<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Workouts', ~{::styles}, ~{::content}, ~{::pageScripts})}">

    <div th:fragment="styles"></div>

    <div th:fragment="content">
        <div class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 lg:px-8">


            <div class="mt-6 grid gap-6 lg:grid-cols-[1.3fr_0.7fr]">
                <section class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
                    <div class="flex items-center justify-between gap-3">
                        <div>
                            <h1 class="text-2xl font-bold text-slate-900">Workout Builder</h1>
                            <p class="mt-1 text-sm text-slate-600">Create templates and launch sessions.</p>
                        </div>
                        <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-700">Templates</span>
                    </div>

                    <div class="mt-5 grid gap-4 sm:grid-cols-2" th:if="${templates != null and !templates.isEmpty()}">
                        <div th:each="template : ${templates}"
                             class="rounded-2xl border border-slate-200 bg-slate-50 p-4 shadow-sm">
                            <div class="flex items-start justify-between gap-3">
                                <div class="min-w-0">
                                    <h2 class="truncate text-lg font-semibold text-slate-900" th:text="${template.name}">Workout</h2>
                                    <p class="mt-1 line-clamp-2 text-sm text-slate-600" th:text="${template.description}">Description</p>
                                </div>
                                <span class="text-xs text-slate-400" th:text="${#temporals.format(template.updatedAt, 'dd MMM')}">Updated</span>
                            </div>
                            <div class="mt-4 flex flex-wrap gap-2">
                                <a class="inline-flex items-center rounded-xl bg-slate-900 px-3 py-1.5 text-xs font-semibold text-white shadow-sm hover:bg-slate-800"
                                   th:href="@{/workouts/{id}/start(id=${template.id})}">Start</a>
                                <a class="inline-flex items-center rounded-xl border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-100"
                                   th:href="@{/workouts/{id}/edit(id=${template.id})}">Edit</a>
                                <form th:action="@{/workouts/{id}/delete(id=${template.id})}" method="post">
                                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button class="inline-flex items-center rounded-xl border border-rose-200 bg-rose-50 px-3 py-1.5 text-xs font-semibold text-rose-700 hover:bg-rose-100" type="submit">Delete</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="mt-6 rounded-2xl border border-dashed border-slate-200 bg-white px-6 py-10 text-center"
                         th:if="${templates == null or templates.isEmpty()}">
                        <p class="text-sm font-semibold text-slate-900">No templates yet.</p>
                        <p class="mt-1 text-sm text-slate-600">Create your first workout to begin logging sessions.</p>
                    </div>
                </section>

                <aside class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
                    <h2 class="text-lg font-semibold text-slate-900">New template</h2>
                    <p class="mt-1 text-sm text-slate-600">Start with a name and description, then add exercises.</p>

                    <form class="mt-5 space-y-4" method="post" th:action="@{/workouts}">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div>
                            <label class="text-xs font-semibold text-slate-600">Name</label>
                            <input name="name" type="text" placeholder="Upper Body Strength" required
                                   class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10" />
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-600">Description</label>
                            <textarea name="description" rows="4" placeholder="Push + pull, 45 minutes" class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10"></textarea>
                        </div>
                        <button class="inline-flex w-full items-center justify-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-slate-800" type="submit">Create and edit</button>
                    </form>
                </aside>
            </div>
        </div>
    </div>

    <div th:fragment="pageScripts"></div>
</th:block>
