<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Home', ~{::pageStyles}, ~{::content}, ~{::pageScripts})}">

    <th:block th:fragment="pageStyles">
        <th:block th:replace="~{home/public :: styles}"></th:block>
    </th:block>

    <div th:fragment="content">
        <!-- Development Mode Banner -->
        <div th:if="${isDevMode}" style="background: #fef2f2; border-bottom: 3px solid #dc2626; padding: 16px; margin-bottom: 24px;">
            <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
                <div style="display: flex; gap: 12px; align-items: center;">
                    <div style="font-size: 24px; line-height: 1;">⚠️</div>
                    <div style="flex: 1;">
                        <strong style="color: #dc2626; font-size: 16px;">DEVELOPMENT MODE</strong>
                        <p style="margin: 4px 0 0 0; color: #991b1b; font-size: 14px;">
                            This application is running in development/demo mode. Authentication is disabled.
                            Set <code style="background: #fee2e2; padding: 2px 6px; border-radius: 4px; font-family: monospace;">DEV_MODE=false</code> to enable login.
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/AccountHomePage :: contentAuthenticated}"></div>
        <div th:replace="~{home/public :: content}"></div>
    </div>

    <th:block th:fragment="pageScripts">
        <th:block th:replace="~{fragments/AccountHomePage :: pageScripts}"></th:block>
        <th:block th:replace="~{home/public :: scripts}"></th:block>
    </th:block>
</th:block>
