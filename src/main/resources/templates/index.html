<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Home', ~{::pageStyles}, ~{::content}, ~{::pageScripts})}">

    <th:block th:fragment="pageStyles">
        <th:block th:replace="~{home/public :: styles}"></th:block>
    </th:block>

    <div th:fragment="content">
        <!-- Development Mode Notification -->
        <div th:if="${isDevMode}" style="background: linear-gradient(90deg,#1a1a2e,#0f3460); border-bottom: 1px solid rgba(251,191,36,.2); padding: 10px 0;">
            <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
                <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                    <span style="display:inline-flex;align-items:center;gap:6px;background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.35);color:#fbbf24;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;">
                        <span style="width:6px;height:6px;border-radius:50%;background:#fbbf24;display:inline-block;"></span>
                        Dev Mode
                    </span>
                    <span style="color:#d1d5db;font-size:13px;">Application is running in development mode.</span>
                    <a href="/dev-mode" style="margin-left:auto;color:#fbbf24;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;">Open Dev Hub →</a>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/AccountHomePage :: contentAuthenticated}"></div>
        <div th:replace="~{home/public :: content}"></div>
    </div>

    <th:block th:fragment="pageScripts">
        <th:block th:replace="~{fragments/AccountHomePage :: pageScripts}"></th:block>
        <th:block th:replace="~{home/public :: scripts}"></th:block>
    </th:block>
</th:block>
