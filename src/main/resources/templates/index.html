<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Home', null, ~{::content}, ~{::pageScripts})}">
    <div th:fragment="content">
        <div th:replace="~{fragments/AccountHomePage :: contentAuthenticated}"></div>
        <div th:replace="~{fragments/AccountHomePage :: contentPublic}"></div>
    </div>

    <th:block th:fragment="pageScripts">
        <th:block th:replace="~{fragments/AccountHomePage :: pageScripts}"></th:block>
    </th:block>
</th:block>
