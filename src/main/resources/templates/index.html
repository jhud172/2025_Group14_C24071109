<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Home', ~{::pageStyles}, ~{::content}, ~{::pageScripts})}">

    <th:block th:fragment="pageStyles">
        <th:block th:replace="~{home/public :: styles}"></th:block>
    </th:block>

    <div th:fragment="content">
        <!-- Development Mode — Immersive Environment Banner -->
        <th:block th:if="${isDevMode}">
            <div class="dev-mode-page-glow"></div>
            <div class="dev-mode-page-glow right"></div>
            <a href="/dev-mode" class="dev-corner-badge" title="Open Dev Hub">
                <span class="dev-dot"></span>
                <span>DEV</span>
                <svg style="width:12px;height:12px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
            </a>
            <div class="dev-mode-env">
                <div class="dev-mode-scanline"></div>
                <div class="relative z-10 max-w-7xl mx-auto px-6 lg:px-8 py-2.5 flex flex-wrap items-center gap-x-6 gap-y-2">
                    <div class="flex items-center gap-3">
                        <span class="dev-badge"><span class="dev-dot"></span>DEV ENV</span>
                        <span style="color:#6b7280;font-size:11px;font-family:'Courier New',monospace;">localhost</span>
                        <span style="color:#374151;font-size:11px;">·</span>
                        <span style="color:#6b7280;font-size:11px;font-family:'Courier New',monospace;">Spring Boot</span>
                    </div>
                    <div class="hidden sm:flex items-center gap-4" style="font-family:'Courier New',monospace;font-size:11px;">
                        <span style="color:#10b981;">▶ server running</span>
                        <span style="color:#374151;">·</span>
                        <span style="color:#6b7280;">hot-reload <span style="color:#fbbf24;">active</span></span>
                    </div>
                    <a href="/dev-mode" style="margin-left:auto;font-family:'Courier New',monospace;font-size:12px;color:#10b981;font-weight:700;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;">
                        $ open dev-hub
                        <svg style="width:12px;height:12px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
                    </a>
                </div>
            </div>
        </th:block>

        <div th:replace="~{dashboard/client-dashboard :: contentMain}"></div>
        <div th:replace="~{home/public :: content}"></div>
    </div>

    <th:block th:fragment="pageScripts">
        <th:block th:replace="~{dashboard/client-dashboard :: pageScripts}"></th:block>
        <th:block th:replace="~{home/public :: scripts}"></th:block>
    </th:block>
</th:block>
