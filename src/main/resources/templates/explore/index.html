<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Explore', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-5xl px-4 py-10 sm:px-6 lg:px-8">
        <div class="rounded-3xl border border-slate-200 bg-white p-6">
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Explore</p>
            <h1 class="mt-1 text-2xl font-semibold text-slate-900">Trainers &amp; gyms</h1>
            <p class="mt-2 text-sm text-slate-600">This area is a placeholder for the verified trainer marketplace.</p>

            <div class="mt-6 flex flex-col gap-3 sm:flex-row">
                <a th:href="@{/inbox}"
                   class="inline-flex min-h-11 items-center justify-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-900/30 focus-visible:ring-offset-2 focus-visible:ring-offset-white">
                    Open inbox
                </a>
                <a th:href="@{/}"
                   class="inline-flex min-h-11 items-center justify-center rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-900 hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-900/30 focus-visible:ring-offset-2 focus-visible:ring-offset-white">
                    Back to home
                </a>
            </div>
        </div>
    </div>

</th:block>
