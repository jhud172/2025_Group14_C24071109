<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Training Vault', ~{::styles}, ~{::content}, ~{::pageScripts})}">

<div th:fragment="styles"></div>

<div th:fragment="content">
    <div class="mx-auto w-full max-w-6xl px-4 sm:px-6 lg:px-8">
        <div th:replace="~{fragments/username-logout :: usernameLogout}"></div>

        <div class="mt-6 flex flex-col gap-6 lg:flex-row">
            <!-- Filters (sidebar) -->
            <aside class="w-full lg:w-72">
                <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
                    <div class="flex items-center justify-between">
                        <h2 class="text-sm font-bold tracking-tight text-slate-900">Filters</h2>
                        <a th:href="@{/vault/new}"
                           class="inline-flex items-center justify-center rounded-md bg-slate-900 px-3 py-2 text-xs font-semibold text-white shadow-sm hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900/20">New</a>
                    </div>

                    <div class="mt-4 space-y-2">
                        <a th:href="@{/vault}"
                           class="block rounded-lg border px-3 py-2 text-sm font-semibold"
                           th:classappend="${selectedType == null} ? ' border-slate-900 bg-slate-50 text-slate-900' : ' border-slate-200 bg-white text-slate-700 hover:bg-slate-50'">
                            All types
                        </a>

                        <a th:each="t : ${noteTypes}"
                           th:href="@{/vault(type=${t.name()})}"
                           class="block rounded-lg border px-3 py-2 text-sm font-semibold"
                           th:classappend="${selectedType != null and selectedType == t} ? ' border-slate-900 bg-slate-50 text-slate-900' : ' border-slate-200 bg-white text-slate-700 hover:bg-slate-50'">
                            <span th:text="${t.name()}">TRAINING</span>
                        </a>
                    </div>

                    <div class="mt-5 text-xs text-slate-600">
                        Keep quick notes on training, nutrition, injuries, goals, and reflections.
                    </div>
                </div>
            </aside>

            <!-- Notes list -->
            <section class="min-w-0 flex-1">
                <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
                    <div class="flex flex-col gap-1 sm:flex-row sm:items-end sm:justify-between">
                        <div>
                            <h1 class="text-xl font-bold tracking-tight text-slate-900">Training Vault</h1>
                            <p class="text-sm text-slate-600" th:if="${selectedType != null}">
                                Filtering by <span class="font-semibold text-slate-900" th:text="${selectedType.name()}">TYPE</span>
                            </p>
                            <p class="text-sm text-slate-600" th:if="${selectedType == null}">All notes</p>
                        </div>
                    </div>

                    <div class="mt-5 grid grid-cols-1 gap-4" th:if="${notes != null and !notes.isEmpty()}">
                        <a th:each="n : ${notes}"
                           th:href="@{/vault/{id}(id=${n.id})}"
                           class="group block rounded-xl border border-slate-200 bg-white p-5 shadow-sm hover:border-slate-300 hover:bg-slate-50">
                            <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
                                <div class="min-w-0">
                                    <div class="flex flex-wrap items-center gap-2">
                                        <span class="inline-flex items-center rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-700"
                                              th:text="${n.noteType != null ? n.noteType.name() : 'NOTE'}">TYPE</span>
                                        <span class="text-xs text-slate-500" th:if="${n.linkedDate != null}" th:text="${'Date: ' + n.linkedDate}">Date</span>
                                        <span class="text-xs text-slate-500" th:if="${n.linkedWorkoutSessionId != null and sessionsById[n.linkedWorkoutSessionId] != null}">
                                            <span th:text="${'Workout: ' + (sessionsById[n.linkedWorkoutSessionId].nameSnapshot != null ? sessionsById[n.linkedWorkoutSessionId].nameSnapshot : (sessionsById[n.linkedWorkoutSessionId].workout != null ? sessionsById[n.linkedWorkoutSessionId].workout.name : 'Session'))}">Workout</span>
                                        </span>
                                    </div>

                                    <h3 class="mt-2 truncate text-lg font-bold text-slate-900 group-hover:underline" th:text="${n.title}">Title</h3>
                                    <p class="mt-1 line-clamp-2 text-sm text-slate-600" th:text="${n.content}">Preview</p>
                                </div>

                                <div class="shrink-0 text-xs text-slate-500" th:if="${n.updatedAt != null}">
                                    <span th:text="${#temporals.format(n.updatedAt, 'dd MMM yyyy HH:mm')}">Updated</span>
                                </div>
                            </div>
                        </a>
                    </div>

                    <div class="mt-5 rounded-xl border border-dashed border-slate-300 bg-white p-8 text-center"
                         th:if="${notes == null or notes.isEmpty()}">
                        <p class="text-sm font-semibold text-slate-900">No notes yet.</p>
                        <p class="mt-1 text-sm text-slate-600">Create your first vault note to start tracking progress.</p>
                        <a th:href="@{/vault/new}"
                           class="mt-4 inline-flex items-center justify-center rounded-md bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900/20">Create a note</a>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

<div th:fragment="pageScripts"></div>

</th:block>
