<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${note != null ? note.title : 'Training Vault'}, ~{::styles}, ~{::content}, ~{::pageScripts})}">

<div th:fragment="styles"></div>

<div th:fragment="content" class="detail-container">
    <div th:replace="~{fragments/username-logout :: usernameLogout}"></div>

    <div th:if="${note != null}">
        <!-- Header with key metadata at top -->
        <div class="detail-header">
            <div class="detail-header-content">
                <div class="detail-header-meta">
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="inline-flex items-center rounded-full bg-slate-100 dark:bg-slate-800 px-2.5 py-1 text-xs font-semibold text-slate-700 dark:text-slate-200"
                              th:text="${note.noteType != null ? note.noteType.name() : 'NOTE'}">TYPE</span>
                        <span class="text-xs text-slate-500 dark:text-slate-400" th:if="${note.linkedDate != null}" th:text="${'Date: ' + note.linkedDate}">Date</span>
                        <span class="text-xs text-slate-500 dark:text-slate-400" th:if="${linkedSession != null}">
                            <span th:text="${'Workout: ' + (linkedSession.nameSnapshot != null ? linkedSession.nameSnapshot : (linkedSession.workout != null ? linkedSession.workout.name : 'Session'))}">Workout</span>
                        </span>
                    </div>
                    <h1 class="detail-title" th:text="${note.title}">Title</h1>
                    <p class="detail-subtitle" th:if="${note.updatedAt != null}" th:text="${#temporals.format(note.updatedAt,'dd MMM yyyy HH:mm')}">Date</p>
                </div>
                <!-- Primary actions - sticky on larger screens -->
                <div class="detail-actions-sticky">
                    <a th:href="@{/vault}" class="detail-btn-secondary">← Back</a>
                    <a class="detail-btn-secondary" th:href="@{/vault/{id}/edit(id=${note.id})}">Edit</a>
                    <form th:action="@{/vault/{id}/delete(id=${note.id})}" method="post"
                          data-confirm data-confirm-title="Delete note?" data-confirm-message="This will permanently remove the vault note.">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="detail-btn-destructive" type="submit">Delete</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Structured content sections -->
        <div class="detail-sections">
            <section class="detail-section">
                <h2 class="detail-section-title">Note content</h2>
                <div class="detail-section-content">
                    <article class="whitespace-pre-wrap text-sm leading-6 text-slate-800 dark:text-slate-200" th:text="${note.content}">
                        Content
                    </article>
                </div>
            </section>

            <section class="detail-section">
                <h2 class="detail-section-title">AI actions</h2>
                <div class="detail-section-content">
                    <p class="text-sm text-slate-600 dark:text-slate-400">Use these to summarise or rewrite your notes.</p>

                    <div class="mt-4 flex flex-col gap-2 sm:flex-row">
                        <form th:action="@{/vault/ai/summarise-week}" method="post">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="noteIds" th:value="${note.id}">
                            <input type="hidden" name="returnTo" th:value="@{/vault/{id}(id=${note.id})}">
                            <button type="submit" class="detail-btn-secondary">Summarise week</button>
                        </form>

                        <form th:action="@{/vault/ai/rewrite-checkin}" method="post">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="noteIds" th:value="${note.id}">
                            <input type="hidden" name="returnTo" th:value="@{/vault/{id}(id=${note.id})}">
                            <button type="submit" class="detail-btn-primary">Rewrite as check-in</button>
                        </form>
                    </div>

                    <div class="mt-5 detail-info-box" th:if="${aiResult != null}">
                        <div class="detail-info-box-title" th:text="${aiResultTitle} ?: 'AI Result'">AI Result</div>
                        <div class="detail-info-box-content whitespace-pre-wrap" th:text="${aiResult}">Result</div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <div class="detail-empty" th:if="${note == null}">
        <div class="rounded-xl border border-dashed border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900/40 p-8 text-center">
            <p class="text-sm font-medium text-slate-900 dark:text-slate-100">Note not found.</p>
            <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">It may have been deleted, or you may not have access.</p>
            <a class="mt-4 detail-btn-secondary" th:href="@{/vault}">Back to vault</a>
        </div>
    </div>

    <!-- Confirm modal -->
    <div id="confirmOverlay"
         class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4 opacity-0 pointer-events-none transition-opacity [&.show]:opacity-100 [&.show]:pointer-events-auto">
        <div class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-6 shadow-xl" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
            <h3 id="confirmTitle" class="text-lg font-semibold text-slate-900">Confirm</h3>
            <p id="confirmMessage" class="mt-2 text-sm text-slate-600">Are you sure?</p>
            <div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
                <button id="confirmCancel" class="inline-flex items-center justify-center rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-900 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900/10" type="button">Cancel</button>
                <button id="confirmOk" class="inline-flex items-center justify-center rounded-md bg-red-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-600/20" type="button">Delete</button>
            </div>
        </div>
    </div>
</div>

<div th:fragment="pageScripts">
    <script src="/js/notes.js" defer></script>
</div>

</th:block>
