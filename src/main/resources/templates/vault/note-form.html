<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${pageTitle} ?: 'Vault Note', ~{::styles}, ~{::content}, ~{::pageScripts})}">

<div th:fragment="styles"></div>

<div th:fragment="content">
    <div class="mx-auto w-full max-w-4xl px-4 sm:px-6 lg:px-8">
        <div th:replace="~{fragments/username-logout :: usernameLogout}"></div>

        <div class="mt-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
            <div class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
                <div class="min-w-0">
                    <a class="text-sm font-semibold text-slate-900 hover:underline" th:href="@{/vault}">← Back</a>
                    <h1 class="mt-2 truncate text-2xl font-bold tracking-tight text-slate-900" th:text="${pageTitle}">Vault Note</h1>
                    <p class="mt-1 text-sm text-slate-600">Capture a detail you don’t want to lose.</p>
                </div>
            </div>

            <form class="mt-6 space-y-5"
                  th:action="${note != null and note.id != null} ? @{/vault/{id}/edit(id=${note.id})} : @{/vault/new}"
                  method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label class="block text-sm font-semibold text-slate-900">Type</label>
                        <select name="noteType"
                                class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-slate-900/10">
                            <option th:each="t : ${noteTypes}"
                                    th:value="${t.name()}"
                                    th:selected="${note != null and note.noteType != null and note.noteType == t}"
                                    th:text="${t.name()}">TRAINING</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-900">Linked date (optional)</label>
                        <input type="date" name="linkedDate"
                               th:value="${note != null and note.linkedDate != null ? note.linkedDate : ''}"
                               class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-slate-900/10">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-900">Title</label>
                    <input name="title" required
                           th:value="${note != null ? note.title : ''}"
                           class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-slate-900/10"
                           placeholder="E.g. Week 3 check-in, shoulder pain, nutrition tweak">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-900">Content</label>
                    <textarea name="content" required rows="10"
                              class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-slate-900/10"
                              placeholder="Write your note..."
                              th:text="${note != null ? note.content : ''}"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-900">Linked workout session (optional)</label>
                    <select name="linkedWorkoutSessionId"
                            class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-slate-900/10">
                        <option value="">— None —</option>
                        <option th:each="s : ${recentSessions}"
                                th:value="${s.id}"
                                th:selected="${note != null and note.linkedWorkoutSessionId != null and note.linkedWorkoutSessionId == s.id}"
                                th:text="${#temporals.format(s.date, 'dd MMM yyyy') + ' — ' + (s.nameSnapshot != null ? s.nameSnapshot : (s.workout != null ? s.workout.name : 'Workout'))}">Session</option>
                    </select>
                    <p class="mt-2 text-xs text-slate-600">Shows your most recent sessions.</p>
                </div>

                <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
                    <a th:href="@{/vault}"
                       class="inline-flex items-center justify-center rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-900 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900/10">Cancel</a>
                    <button type="submit"
                            class="inline-flex items-center justify-center rounded-md bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900/20">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:fragment="pageScripts"></div>

</th:block>
