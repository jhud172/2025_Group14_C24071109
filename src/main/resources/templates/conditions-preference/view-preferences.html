<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Preferences', ~{::styles}, ~{::content}, null)}">

<div th:fragment="styles">
</div>

<div th:fragment="content">
    <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8 space-y-6">
        <div class="rounded-2xl border border-slate-200/70 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-950/40">
            <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
                <div>
                    <h1 class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-slate-100">Your preferences</h1>
                    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">A quick summary of what you’ve saved.</p>
                </div>
                <a href="/select-preferences"
                   class="inline-flex items-center justify-center rounded-lg bg-slate-900 px-3 py-2 text-sm font-medium text-white hover:bg-slate-800 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-white">
                    Edit preferences
                </a>
            </div>
        </div>

        <section class="rounded-xl border border-slate-200/70 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-950/40">
            <h2 class="text-sm font-semibold text-slate-700 dark:text-slate-200">Display settings</h2>
            <div class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-3">
                <div class="rounded-lg border border-slate-200/70 bg-slate-50 p-3 text-sm dark:border-slate-800 dark:bg-slate-900/30">
                    <p class="text-xs text-slate-500">Language</p>
                    <p class="mt-1 font-medium text-slate-700 dark:text-slate-200" th:text="${userSettings != null ? userSettings.language : 'en'}"></p>
                </div>
                <div class="rounded-lg border border-slate-200/70 bg-slate-50 p-3 text-sm dark:border-slate-800 dark:bg-slate-900/30">
                    <p class="text-xs text-slate-500">Theme</p>
                    <p class="mt-1 font-medium text-slate-700 dark:text-slate-200" th:text="${userSettings != null && userSettings.theme != null ? userSettings.theme : 'SYSTEM'}"></p>
                </div>
                <div class="rounded-lg border border-slate-200/70 bg-slate-50 p-3 text-sm dark:border-slate-800 dark:bg-slate-900/30">
                    <p class="text-xs text-slate-500">Easy mode</p>
                    <p class="mt-1 font-medium text-slate-700 dark:text-slate-200" th:text="${userSettings != null && userSettings.easyMode ? 'On' : 'Off'}"></p>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
            <section class="rounded-xl border border-slate-200/70 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-950/40">
                <h2 class="text-sm font-semibold text-slate-700 dark:text-slate-200">Training preferences</h2>
                <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">Grouped by category.</p>

                <div class="mt-4" th:if="${preferencesByCategory == null || preferencesByCategory.isEmpty()}">
                    <div class="rounded-lg border border-slate-200 bg-slate-50 p-4 text-sm text-slate-700 dark:border-slate-800 dark:bg-slate-900/30 dark:text-slate-200">
                        You haven’t selected any preferences yet.
                    </div>
                </div>

                <div class="mt-4 space-y-3" th:if="${preferencesByCategory != null && !preferencesByCategory.isEmpty()}">
                    <div th:each="category : ${preferencesByCategory}" class="rounded-lg border border-slate-200/70 bg-white p-3 dark:border-slate-800 dark:bg-slate-950/40">
                        <p class="text-xs font-semibold text-slate-600 dark:text-slate-300" th:text="${category.key}"></p>
                        <ul class="mt-2 flex flex-wrap gap-2">
                            <li th:each="preference: ${category.value}"
                                class="rounded-full border border-slate-200 bg-slate-50 px-3 py-1 text-xs text-slate-700 dark:border-slate-800 dark:bg-slate-900/30 dark:text-slate-200"
                                th:text="${preference.description}"></li>
                        </ul>
                    </div>
                </div>
            </section>

            <section class="rounded-xl border border-slate-200/70 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-950/40">
                <h2 class="text-sm font-semibold text-slate-700 dark:text-slate-200">Physical conditions</h2>
                <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">From your health record.</p>

                <div class="mt-4" th:if="${physicalConditions.isEmpty()}">
                    <div class="rounded-lg border border-slate-200 bg-slate-50 p-4 text-sm text-slate-700 dark:border-slate-800 dark:bg-slate-900/30 dark:text-slate-200">
                        You don’t have any saved conditions.
                    </div>
                </div>

                <div class="mt-4" th:if="${!physicalConditions.isEmpty()}">
                    <div class="flex flex-wrap gap-2">
                        <span th:each="physicalCondition : ${physicalConditions}"
                              class="rounded-full border border-slate-200 bg-slate-50 px-3 py-1 text-xs text-slate-700 dark:border-slate-800 dark:bg-slate-900/30 dark:text-slate-200"
                              th:text="${physicalCondition.name}"></span>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

</th:block>
