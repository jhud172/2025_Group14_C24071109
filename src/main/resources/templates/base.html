<!DOCTYPE html>
<html lang="en"
    xmlns:th="http://www.thymeleaf.org"
    th:classappend="${userSettings != null and userSettings.theme != null and userSettings.theme.toString() == 'DARK'} ? ' dark'"
    th:attr="lang=${userSettings != null && userSettings.language != null ? userSettings.language : 'en'},
             data-lang=${userSettings != null && userSettings.language != null ? userSettings.language : 'en'},
             data-theme=${userSettings != null && userSettings.theme != null ? userSettings.theme.toString().toLowerCase() : 'light'},
             data-colorblind=${userSettings != null && userSettings.colorBlindMode ? 'on' : 'off'}"
    th:fragment="layout(pageTitle, pageStyles, content, pageScripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} ?: 'One To One'">One To One</title>
    <link rel="shortcut icon" th:href="@{/favicon.ico}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/brand/tab_logo.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/brand/tab_logo.png}">
    <link rel="apple-touch-icon" th:href="@{/img/brand/tab_logo.png}">

    <!-- No-flash theme script: must run before CSS to prevent flash of wrong theme. -->
    <script th:src="@{/js/core/theme-preload.js(v='20260314')}"></script>

    <!-- Core styles (compiled Tailwind + all component styles) -->
    <link rel="stylesheet" th:href="@{/css/app.css(v='20260316d')}">

    <!-- Page-specific styles -->
    <th:block th:if="${pageStyles != null}">
        <th:block th:replace="${pageStyles}"></th:block>
    </th:block>
</head>

<body class="min-h-screen bg-cyber-900 text-slate-100 antialiased"
    th:classappend="${((userSettings != null and userSettings.easyMode) ? ' text-lg leading-relaxed' : ' text-base') + (userSettings != null and userSettings.colorBlindMode ? ' color-blind' : '') + (timeOfDayMoodClass != null ? ' ' + timeOfDayMoodClass : '')}"
    th:attr="data-time-theme=${timeTheme},
             data-chat-history=${disableChatHistory == true ? 'off' : 'on'},
             data-language=${userSettings != null && userSettings.language != null ? userSettings.language : 'en'},
             data-easy-mode=${userSettings != null && userSettings.easyMode ? 'on' : 'off'},
             data-color-blind=${userSettings != null && userSettings.colorBlindMode ? 'on' : 'off'},
             data-disability-hearing=${userSettings != null && userSettings.disabilityHearing ? 'on' : 'off'},
             data-disability-mobility=${userSettings != null && userSettings.disabilityMobility ? 'on' : 'off'},
             data-disability-vision=${userSettings != null && userSettings.disabilityVision ? 'on' : 'off'},
             data-day-mode=${dayMode != null ? dayMode : 'REST_DAY'}">

<!-- NAVBAR -->
<th:block
    th:if="${@environment.getProperty('app.ui.includeNavbar') != 'false'}"
    th:insert="~{fragments/navbar :: navbar}"></th:block>

<!-- MAIN CONTENT -->
<main th:class="${authPageLayout == true ? 'auth-page-main pt-2 sm:pt-3' : 'min-h-[calc(100vh-5rem)] ' + (compactTopContent == true ? 'pt-2 sm:pt-3' : 'pt-16')}">
    <th:block th:replace="${content}"></th:block>
</main>

<!-- FOOTER -->
<th:block th:insert="~{fragments/footer :: footer}"></th:block>

<!-- CHATBOT (global) -->
<div th:if="${@environment.getProperty('app.ui.includeChatbot') != 'false' and disableGlobalChatbot != true}"
    th:replace="~{fragments/chat/chat-widget :: chatWidget}"></div>

<!-- QUICK ACTIONS (global, authenticated only) -->
<div th:if="${#authorization.expression('isAuthenticated()')}"
    th:replace="~{fragments/quick-actions :: quickActionsShelf}"></div>

<!-- Core scripts -->
<script th:if="${@environment.getProperty('app.ui.includeChatbot') != 'false' and disableGlobalChatbot != true}" th:src="@{/js/chat/chat.js(v='20260303')}" defer></script>
<script th:src="@{/js/core/form-auto-submit.js(v='20260320a')}" defer></script>
<script th:src="@{/js/core/confirm-action.js(v='20260320a')}" defer></script>
<script th:src="@{/js/core/back-navigation.js(v='20260320a')}" defer></script>
<script th:src="@{/js/core/health-chart-toggle.js(v='20260320a')}" defer></script>
<script th:if="${#authorization.expression('isAuthenticated()')}" th:src="@{/js/core/quick-actions.js(v='20260303')}" defer></script>
<script th:src="@{/js/core/navbar-premium.js(v='20260316a')}" defer></script>
<script th:src="@{/js/core/floating-profile-card.js(v='20260316c')}" defer></script>
<script th:src="@{/js/core/profile-preview.js(v='20260315a')}" defer></script>

<!-- Page-specific scripts -->
<th:block th:if="${pageScripts != null}">
    <th:block th:replace="${pageScripts}"></th:block>
</th:block>

<!-- Global AI button loading handler -->
<script src="/js/core/ai-loading.js" defer></script>

</body>
</html>
