<!DOCTYPE html>
<html lang="en"
    xmlns:th="http://www.thymeleaf.org"
    th:classappend="${userSettings != null and userSettings.theme != null and userSettings.theme.toString() == 'DARK'} ? ' dark'"
    th:attr="lang=${userSettings != null && userSettings.language != null ? userSettings.language : 'en'},
             data-lang=${userSettings != null && userSettings.language != null ? userSettings.language : 'en'},
             data-theme=${userSettings != null && userSettings.theme != null ? userSettings.theme.toString().toLowerCase() : 'light'},
             data-colorblind=${userSettings != null && userSettings.colorBlindMode ? 'on' : 'off'}"
    th:fragment="layout(pageTitle, pageStyles, content, pageScripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} ?: 'One To One'">One To One</title>
    <link rel="shortcut icon" th:href="@{/favicon.ico}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/tab_logo.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/tab_logo.png}">
    <link rel="apple-touch-icon" th:href="@{/img/tab_logo.png}">

    <!-- No-flash theme script: must run before CSS to prevent flash of wrong theme.
         When theme preference is SYSTEM (the server cannot know OS dark mode),
         this script checks prefers-color-scheme immediately and adds the 'dark'
         class before the browser paints anything. -->
    <script>
    (function () {
        var t = document.documentElement.getAttribute('data-theme');
        if (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
    }());
    </script>

    <!-- Core styles (compiled Tailwind + all component styles) -->
    <link rel="stylesheet" th:href="@{/css/app.css(v='20260303')}">

    <!-- Page-specific styles -->
    <th:block th:if="${pageStyles != null}">
        <th:block th:replace="${pageStyles}"></th:block>
    </th:block>
</head>

<body class="min-h-screen bg-cyber-900 text-slate-100 antialiased"
    th:classappend="${((userSettings != null and userSettings.easyMode) ? ' text-lg leading-relaxed' : ' text-base') + (userSettings != null and userSettings.colorBlindMode ? ' color-blind' : '') + (timeOfDayMoodClass != null ? ' ' + timeOfDayMoodClass : '')}"
    th:attr="data-time-theme=${timeTheme},
             data-chat-history=${disableChatHistory == true ? 'off' : 'on'},
             data-language=${userSettings != null && userSettings.language != null ? userSettings.language : 'en'},
             data-easy-mode=${userSettings != null && userSettings.easyMode ? 'on' : 'off'},
             data-color-blind=${userSettings != null && userSettings.colorBlindMode ? 'on' : 'off'},
             data-disability-hearing=${userSettings != null && userSettings.disabilityHearing ? 'on' : 'off'},
             data-disability-mobility=${userSettings != null && userSettings.disabilityMobility ? 'on' : 'off'},
             data-disability-vision=${userSettings != null && userSettings.disabilityVision ? 'on' : 'off'},
             data-day-mode=${dayMode != null ? dayMode : 'REST_DAY'}">

<!-- NAVBAR -->
<th:block
    th:if="${@environment.getProperty('app.ui.includeNavbar') != 'false'}"
    th:insert="~{fragments/navbar :: navbar}"></th:block>

<!-- MAIN CONTENT -->
<main class="min-h-[calc(100vh-5rem)]"
      th:classappend="${compactTopContent == true ? ' pt-2 sm:pt-3' : ' pt-16'}">
    <th:block th:replace="${content}"></th:block>
</main>

<!-- FOOTER -->
<th:block th:insert="~{fragments/footer :: footer}"></th:block>

<!-- CHATBOT (global) -->
<div th:if="${@environment.getProperty('app.ui.includeChatbot') != 'false'}"
    th:replace="~{fragments/chat/chat-widget :: chatWidget}"></div>

<!-- QUICK ACTIONS (global) -->
<div th:replace="~{fragments/quick-actions :: quickActionsShelf}"></div>

<!-- Core scripts -->
<script th:if="${@environment.getProperty('app.ui.includeChatbot') != 'false'}" th:src="@{/js/chat.js(v='20260303')}" defer></script>
<script th:src="@{/js/quick-actions.js(v='20260303')}" defer></script>
<script th:src="@{/js/navbar-premium.js(v='20260303')}" defer></script>

<!-- Page-specific scripts -->
<th:block th:if="${pageScripts != null}">
    <th:block th:replace="${pageScripts}"></th:block>
</th:block>

<!-- Global AI button loading handler -->
<script>
(function () {
    "use strict";
    var SPINNER_HTML = '<svg class="animate-spin h-4 w-4 mr-1.5 inline shrink-0" fill="none" viewBox="0 0 24 24" aria-hidden="true">'
        + '<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>'
        + '<path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>'
        + '</svg>Loading\u2026';
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll("form[action*='/ai/']").forEach(function (form) {
            form.addEventListener("submit", function () {
                var btn = form.querySelector("button[type='submit'], button:not([type='button']):not([type='reset'])");
                if (!btn || btn.disabled) return;
                btn.disabled = true;
                btn.innerHTML = SPINNER_HTML;
            });
        });
    });
}());
</script>

</body>
</html>
