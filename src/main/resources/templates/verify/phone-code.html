<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('SMS Verification', ~{::styles}, ~{::content}, ~{::pageScripts})}">

    <div th:fragment="styles"></div>

    <div th:fragment="content">
        <div class="mx-auto max-w-md px-4 py-12 sm:px-6 lg:px-8">
            <div class="rounded-3xl border border-slate-200/70 bg-white p-8 shadow-sm dark:border-slate-800 dark:bg-slate-950/40">

                <!-- Icon -->
                <div class="mb-6 flex items-center justify-center">
                    <div class="flex h-16 w-16 items-center justify-center rounded-2xl bg-emerald-100 dark:bg-emerald-900/30">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-emerald-600 dark:text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
                        </svg>
                    </div>
                </div>

                <h1 class="text-center text-2xl font-semibold text-slate-900 dark:text-white">Enter SMS code</h1>
                <p class="mt-2 text-center text-sm text-slate-600 dark:text-slate-300">We sent a 6-digit code to your phone number. Enter it below to verify.</p>

                <!-- Success messages -->
                <div th:if="${verifySuccess}" class="mt-6 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-900 dark:border-emerald-900/40 dark:bg-emerald-900/20 dark:text-emerald-100" th:text="${verifySuccess}">
                    Verification code sent.
                </div>
                <div th:if="${verificationSuccess}" class="mt-6 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-900 dark:border-emerald-900/40 dark:bg-emerald-900/20 dark:text-emerald-100" th:text="${verificationSuccess}">
                    Phone verified successfully.
                </div>

                <!-- Error message -->
                <div th:if="${verifyError}" class="mt-6 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-900 dark:border-rose-900/40 dark:bg-rose-900/20 dark:text-rose-100" th:text="${verifyError}">
                    Verification failed.
                </div>

                <!-- Code input form (only show if not yet verified) -->
                <div th:if="${verificationSuccess == null}">
                    <form th:action="@{/verify/phone/confirm}" method="post" class="mt-6" autocomplete="off">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="returnTo" value="phone-code" />

                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-200">
                            SMS verification code
                        </label>
                        <input type="text"
                               name="code"
                               inputmode="numeric"
                               pattern="[0-9]{6}"
                               maxlength="6"
                               autocomplete="one-time-code"
                               required
                               aria-label="6-digit SMS verification code"
                               class="mt-2 block w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-center text-2xl font-mono tracking-[0.5em] text-slate-900 shadow-sm placeholder-slate-400 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 dark:border-slate-700 dark:bg-slate-900 dark:text-white"
                               placeholder="______" />

                        <button type="submit"
                                class="mt-4 w-full rounded-xl bg-emerald-600 px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 dark:bg-emerald-600 dark:hover:bg-emerald-500">
                            Verify phone
                        </button>
                    </form>

                    <!-- Resend code -->
                    <div class="mt-4 text-center">
                        <form th:action="@{/verify/phone/send}" method="post" class="inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="text-sm text-emerald-600 underline hover:text-emerald-500 dark:text-emerald-400">
                                Resend code
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Back to profile -->
                <div class="mt-6 flex flex-wrap gap-3">
                    <a href="/profile"
                       class="inline-flex items-center justify-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-slate-800 dark:bg-slate-100 dark:text-slate-900">
                        Back to profile
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div th:fragment="pageScripts"></div>
</th:block>
