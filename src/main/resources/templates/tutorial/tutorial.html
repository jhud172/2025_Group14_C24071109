<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:classappend="${userSettings != null and userSettings.theme != null and userSettings.theme.toString() == 'DARK'} ? ' dark'"
      th:attr="data-theme=${userSettings != null && userSettings.theme != null ? userSettings.theme.toString().toLowerCase() : 'system'}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome – One To One</title>
    <link rel="shortcut icon" th:href="@{/favicon.ico}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/tab_logo.png}">
    <script>
    (function () {
        var t = document.documentElement.getAttribute('data-theme');
        if (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
    }());
    </script>
    <link rel="stylesheet" th:href="@{/css/app.css(v='20260303')}">
</head>
<body class="min-h-screen antialiased bg-gradient-to-br from-slate-50 via-emerald-50/40 to-sky-50/70 text-slate-900 dark:from-slate-950 dark:via-slate-900 dark:to-emerald-950/20 dark:text-slate-100">

<!--
  Tutorial overlay: full-screen, role-aware, step-based walkthrough.
  Steps are defined in JS below; role is injected from the server.
-->
<div id="tutorial-backdrop"
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/45 backdrop-blur-sm dark:bg-black/70">

    <div id="tutorial-card"
          class="relative mx-4 w-full max-w-lg overflow-hidden rounded-2xl border border-emerald-200/75
              bg-white/95 shadow-2xl ring-1 ring-slate-900/5 dark:border-emerald-500/30 dark:bg-slate-900/92 dark:ring-white/10"
         role="dialog" aria-modal="true" aria-labelledby="tutorial-title">

        <!-- Progress bar -->
        <div class="h-1 w-full bg-slate-200 dark:bg-slate-700/90">
            <div id="tutorial-progress-bar"
                 class="h-1 bg-emerald-400 transition-all duration-500"
                 style="width: 0%"></div>
        </div>

        <!-- Step counter -->
        <div class="flex items-center justify-between px-6 pt-4 pb-0">
            <span id="tutorial-step-label"
                class="text-xs font-semibold uppercase tracking-widest text-emerald-600 dark:text-emerald-300"></span>
            <!-- Skip button -->
            <form th:action="@{/tutorial/complete}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit"
                        class="text-xs text-slate-500 transition-colors underline underline-offset-2 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200">
                    Skip tutorial
                </button>
            </form>
        </div>

        <!-- Icon area -->
        <div class="flex justify-center mt-6 mb-2">
            <div id="tutorial-icon"
                  class="flex h-16 w-16 items-center justify-center rounded-full border border-emerald-300/70 bg-emerald-50 text-4xl transition-all duration-300 dark:border-emerald-500/30 dark:bg-emerald-900/20">
            </div>
        </div>

        <!-- Text content -->
        <div class="px-8 pb-4 text-center">
            <h2 id="tutorial-title" class="mb-2 text-xl font-bold text-slate-900 transition-all duration-300 dark:text-slate-100"></h2>
            <p id="tutorial-body" class="text-sm leading-relaxed text-slate-600 transition-all duration-300 dark:text-slate-300"></p>
        </div>

        <!-- Navigation buttons -->
        <div class="flex items-center justify-between px-8 pb-8 pt-4 gap-3">
            <button id="tutorial-back-btn"
                    onclick="tutorialBack()"
                    class="hidden rounded-lg border border-slate-300 px-5 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-slate-400 hover:bg-slate-100 dark:border-slate-600 dark:text-slate-300 dark:hover:border-slate-500 dark:hover:bg-slate-800">
                &larr; Back
            </button>
            <div id="tutorial-dots" class="flex gap-2 mx-auto"></div>
            <button id="tutorial-next-btn"
                    onclick="tutorialNext()"
                    class="ml-auto rounded-lg bg-emerald-600 px-6 py-2 text-sm font-bold text-white transition-colors hover:bg-emerald-500 dark:bg-emerald-500 dark:hover:bg-emerald-400">
                Next &rarr;
            </button>
        </div>

        <!-- Hidden finish form (submitted by JS on last step) -->
        <form id="tutorial-finish-form" th:action="@{/tutorial/complete}" method="post" class="hidden">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        </form>
    </div>
</div>

<script th:inline="javascript">var tutorialRole = /*[[${tutorialRole}]]*/ 'CLIENT';</script>
<script src="/js/tutorial-page.js"></script>
</body>
</html>
