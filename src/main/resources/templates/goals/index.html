<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Goals', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
        <div class="flex flex-wrap items-start justify-between gap-4">
            <div>
                <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Goals</p>
                <h1 class="mt-1 text-2xl font-semibold text-slate-900">Goal tracker</h1>
                <p class="mt-1 text-sm text-slate-600" th:if="${client != null}" th:text="${'Viewing goals for ' + client.fullName}"></p>
            </div>
            <a th:href="@{/goals/create(clientId=${clientId})}"
               class="inline-flex items-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">
                Create goal
            </a>
        </div>

        <form class="mt-6 grid gap-3 rounded-2xl border border-slate-200 bg-white p-4 sm:grid-cols-[1fr_1fr_auto_auto]"
              method="get" action="/goals">
            <input type="hidden" name="clientId" th:if="${clientId != null}" th:value="${clientId}" />
            <div>
                <label class="block text-xs font-semibold text-slate-500" for="goal-status">Status</label>
                <select id="goal-status" name="status" class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700">
                    <option value="">All</option>
                    <option th:each="s : ${goalStatuses}" th:value="${s}" th:text="${s}" th:selected="${statusFilter == s}"></option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500" for="goal-type">Type</label>
                <select id="goal-type" name="type" class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700">
                    <option value="">All</option>
                    <option th:each="t : ${goalTypes}" th:value="${t}" th:text="${t}" th:selected="${typeFilter == t}"></option>
                </select>
            </div>
            <label class="mt-5 inline-flex items-center gap-2 text-sm text-slate-600">
                <input type="checkbox" name="archived" value="true" th:checked="${archived != null && archived}" class="h-4 w-4 rounded border-slate-300" />
                Show archived only
            </label>
            <button type="submit" class="mt-4 inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Filter</button>
        </form>

        <div th:if="${#lists.isEmpty(goals)}" class="mt-6 rounded-2xl border border-dashed border-slate-200 bg-white p-8 text-center text-sm text-slate-600">
            No goals found.
        </div>

        <div th:if="${!#lists.isEmpty(goals)}" class="mt-6 grid gap-4 md:grid-cols-2">
            <div th:each="goal : ${goals}" class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                <div class="flex items-start justify-between gap-2">
                    <div>
                        <a th:href="@{/goals/{id}(id=${goal.id})}" class="text-lg font-semibold text-slate-900" th:text="${goal.title}">Goal</a>
                        <p class="mt-1 text-xs text-slate-500" th:text="${goal.goalType}">TYPE</p>
                    </div>
                    <span class="inline-flex items-center rounded-full border border-slate-200 bg-slate-50 px-2 py-0.5 text-[11px] font-semibold text-slate-700" th:text="${goal.status}">ACTIVE</span>
                </div>
                <p class="mt-2 text-sm text-slate-600" th:text="${goal.description}"></p>
                <div class="mt-3 text-xs text-slate-500">
                    <span th:text="${goal.targetMetricName != null ? goal.targetMetricName : 'Target'}"></span>
                    <span th:text="${goal.targetMetricValue != null ? goal.targetMetricValue : '—'}"></span>
                    <span th:text="${goal.targetMetricUnit != null ? goal.targetMetricUnit : ''}"></span>
                </div>
                <div class="mt-4 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs text-slate-600"
                     th:with="adh=${adherenceByGoalId != null ? adherenceByGoalId.get(goal.id) : null}">
                    <span th:text="${adh != null ? (adh.completedCount + '/' + adh.plannedCount) : '0/0'}">0/0</span>
                    <span class="ml-2" th:text="${adh != null ? (adh.percent + '%') : '0%'}">0%</span>
                </div>
            </div>
        </div>
    </div>

</th:block>
