<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Edit Goal', ~{::pageStyles}, ~{::content}, ~{::pageScripts})}">

    <th:block th:fragment="pageStyles">
        <link rel="stylesheet" th:href="@{/css/components/goals/goal-pages.css(v='20260313')}">
    </th:block>

    <div th:fragment="content" class="goal-page">
        <section class="goal-form-shell">
            <div class="goal-head">
                <div>
                    <p class="goal-kicker">Goals</p>
                    <h1 class="goal-title">Edit goal</h1>
                    <p class="goal-copy">Adjust the timeframe, target, and status without losing the structure of the goal.</p>
                </div>
                <a th:href="@{/goals/{id}(id=${goal.id})}" class="goal-secondary-btn">Back</a>
            </div>

            <form class="goal-form-grid" method="post" th:action="@{/goals/{id}/edit(id=${goal.id})}" th:object="${form}">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="goal-field">
                    <label for="title">Title</label>
                    <input id="title" type="text" th:field="*{title}" required />
                </div>

                <div class="goal-field">
                    <label for="description">Description</label>
                    <textarea id="description" rows="4" th:field="*{description}"></textarea>
                </div>

                <div>
                    <label>Timeframe</label>
                    <div class="goal-radio-grid">
                        <label class="goal-radio-card" th:each="frame : ${goalTimeframes}">
                            <input type="radio" th:field="*{timeframe}" th:value="${frame}" />
                            <span class="goal-radio-card__surface">
                                <span class="goal-radio-card__title" th:text="${frame}">WEEK</span>
                                <span class="goal-radio-card__copy"
                                      th:text="${frame.name() == 'WEEK' ? 'Weekly rhythm and short accountability.' : (frame.name() == 'MONTH' ? 'Monthly consistency and habit shaping.' : 'Outcome target with a clearer finish line.')}">Timeframe help</span>
                            </span>
                        </label>
                    </div>
                </div>

                <div class="goal-form-split">
                    <div class="goal-field">
                        <label for="goalType">Goal type</label>
                        <select id="goalType" th:field="*{goalType}">
                            <option th:each="t : ${goalTypes}" th:value="${t}" th:text="${t}"></option>
                        </select>
                    </div>
                    <div class="goal-field">
                        <label for="status">Status</label>
                        <select id="status" th:field="*{status}">
                            <option th:each="s : ${goalStatuses}" th:value="${s}" th:text="${s}"></option>
                        </select>
                    </div>
                </div>

                <div class="goal-panel">
                    <p class="goal-kicker">Target metrics</p>
                    <p class="goal-copy" th:if="${!canEditTargets}">Trainer-owned metrics can only be updated by the trainer.</p>
                    <div class="goal-form-split">
                        <div class="goal-field">
                            <label for="targetMetricName">Target metric</label>
                            <input id="targetMetricName" type="text" th:field="*{targetMetricName}" th:disabled="${!canEditTargets}" />
                        </div>
                        <div class="goal-field">
                            <label for="targetMetricValue">Target value</label>
                            <input id="targetMetricValue" type="number" step="0.1" th:field="*{targetMetricValue}" th:disabled="${!canEditTargets}" />
                        </div>
                        <div class="goal-field">
                            <label for="targetMetricUnit">Unit</label>
                            <input id="targetMetricUnit" type="text" th:field="*{targetMetricUnit}" th:disabled="${!canEditTargets}" />
                        </div>
                    </div>
                </div>

                <div class="goal-form-split">
                    <div class="goal-field">
                        <label for="startDate">Start date</label>
                        <input id="startDate" type="date" th:field="*{startDate}" />
                    </div>
                    <div class="goal-field">
                        <label for="targetDate">Target date</label>
                        <input id="targetDate" type="date" th:field="*{targetDate}" />
                    </div>
                    <div class="goal-field">
                        <label for="priority">Priority</label>
                        <input id="priority" type="number" min="0" th:field="*{priority}" />
                    </div>
                </div>

                <label style="display:flex;align-items:center;gap:.65rem;font-weight:600;color:#475569;">
                    <input type="checkbox" th:field="*{archived}" style="width:auto;margin-top:0;" />
                    Archived
                </label>

                <div>
                    <button type="submit" class="goal-primary-btn">Save changes</button>
                </div>
            </form>
        </section>
    </div>

    <th:block th:fragment="pageScripts">
        <script th:src="@{/js/goals/goal-pages.js(v='20260313')}" defer></script>
    </th:block>
</th:block>
