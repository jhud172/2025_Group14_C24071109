<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Goal Detail', null, ~{::content}, null)}">

    <div th:fragment="content" class="detail-container">
        <!-- Header with key metadata at top -->
        <div class="detail-header">
            <div class="detail-header-content">
                <div class="detail-header-meta">
                    <p class="detail-label">Goal</p>
                    <h1 class="detail-title" th:text="${goal.title}">Goal</h1>
                    <p class="detail-subtitle" th:text="${goal.description}"></p>
                </div>
                <!-- Primary actions - sticky on larger screens -->
                <div class="detail-actions-sticky">
                    <a th:href="@{/goals/{id}/edit(id=${goal.id})}" class="detail-btn-secondary">Edit</a>
                    <a th:href="@{/goals/{id}/checkins(id=${goal.id})}" class="detail-btn-primary">Check-ins</a>
                </div>
            </div>
        </div>

        <!-- Structured content sections -->
        <div class="detail-sections">
            <!-- Main content in grid layout -->
            <div class="detail-grid-sidebar">
                <!-- Goal Summary Section -->
                <section class="detail-section">
                    <h2 class="detail-section-title">Goal summary</h2>
                    <div class="detail-section-content">
                        <div class="detail-metadata">
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label">Type</p>
                                <p class="detail-metadata-value" th:text="${goal.goalType}"></p>
                            </div>
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label">Status</p>
                                <p class="detail-metadata-value" th:text="${goal.status}"></p>
                            </div>
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label">Target</p>
                                <p class="detail-metadata-value"
                                   th:text="${goal.targetMetricName != null ? goal.targetMetricName : 'Target'}"></p>
                                <p class="detail-metadata-value">
                                    <span th:text="${goal.targetMetricValue != null ? goal.targetMetricValue : '—'}"></span>
                                    <span th:text="${goal.targetMetricUnit != null ? goal.targetMetricUnit : ''}"></span>
                                </p>
                            </div>
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label">Dates</p>
                                <p class="detail-metadata-value" th:text="${goal.startDate != null ? goal.startDate : '—'}"></p>
                                <p class="detail-metadata-value" th:text="${goal.targetDate != null ? goal.targetDate : '—'}"></p>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Weekly Adherence Section -->
                <section class="detail-section">
                    <h2 class="detail-section-title">Weekly adherence</h2>
                    <div class="detail-section-content">
                        <div class="space-y-2">
                            <div th:each="week : ${adherenceWeeks}" class="detail-progress-bar">
                                <div class="detail-progress-label" th:text="${week.weekStart}">2025-01-01</div>
                                <div class="detail-progress-track">
                                    <div class="detail-progress-fill" th:style="${'width:' + week.percent + '%'}"></div>
                                </div>
                                <div class="detail-progress-value" th:text="${week.completedCount + '/' + week.plannedCount}">0/0</div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Linked Items Sections -->
            <div class="detail-grid-3">
                <section class="detail-section">
                    <h2 class="detail-section-title">Linked tasks</h2>
                    <div class="detail-section-content">
                        <div th:if="${#lists.isEmpty(linkedItems.tasks)}" class="detail-empty">No tasks linked.</div>
                        <ul th:if="${!#lists.isEmpty(linkedItems.tasks)}" class="detail-list">
                            <li th:each="task : ${linkedItems.tasks}" class="detail-list-item">
                                <span class="detail-list-item-title" th:text="${task.title}">Task</span>
                                <span class="detail-list-item-meta" th:text="${task.date}"></span>
                            </li>
                        </ul>
                    </div>
                </section>

                <section class="detail-section">
                    <h2 class="detail-section-title">Linked occurrences</h2>
                    <div class="detail-section-content">
                        <div th:if="${#lists.isEmpty(linkedItems.occurrences)}" class="detail-empty">No occurrences linked.</div>
                        <ul th:if="${!#lists.isEmpty(linkedItems.occurrences)}" class="detail-list">
                            <li th:each="occ : ${linkedItems.occurrences}" class="detail-list-item">
                                <span class="detail-list-item-title" th:text="${occ.scheduleName}">Occurrence</span>
                                <span class="detail-list-item-meta" th:text="${occ.date}"></span>
                            </li>
                        </ul>
                    </div>
                </section>

                <section class="detail-section">
                    <h2 class="detail-section-title">Linked sessions</h2>
                    <div class="detail-section-content">
                        <div th:if="${#lists.isEmpty(linkedItems.sessions)}" class="detail-empty">No sessions linked.</div>
                        <ul th:if="${!#lists.isEmpty(linkedItems.sessions)}" class="detail-list">
                            <li th:each="session : ${linkedItems.sessions}" class="detail-list-item">
                                <span class="detail-list-item-title" th:text="${session.nameSnapshot}">Session</span>
                                <span class="detail-list-item-meta" th:text="${session.startedAt != null ? #temporals.format(session.startedAt, 'dd MMM yyyy') : ''}"></span>
                            </li>
                        </ul>
                    </div>
                </section>
            </div>

            <!-- Link Items Action Section -->
            <section class="detail-section">
                <h2 class="detail-section-title">Link items</h2>
                <div class="detail-section-content">
                    <div class="grid gap-4 md:grid-cols-2">
                        <form method="post" th:action="@{/goals/{id}/links(id=${goal.id})}" class="space-y-2">
                            <input type="hidden" th:if="${_csrf != null}"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <input type="hidden" name="linkType" value="CALENDAR_TASK" />
                            <label class="detail-metadata-label">Add task link</label>
                            <select name="targetId" class="w-full rounded-xl border border-slate-200 dark:border-white/15 bg-white dark:bg-white/5 px-3 py-2 text-sm text-slate-700 dark:text-slate-200">
                                <option value="" th:if="${#lists.isEmpty(linkableTasks)}">No tasks in range</option>
                                <option th:each="task : ${linkableTasks}" th:value="${task.id}" th:text="${task.title + ' · ' + task.date}"></option>
                            </select>
                            <button type="submit" class="detail-btn-secondary">Link task</button>
                        </form>

                        <form method="post" th:action="@{/goals/{id}/links(id=${goal.id})}" class="space-y-2">
                            <input type="hidden" th:if="${_csrf != null}"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <input type="hidden" name="linkType" value="SCHEDULE_OCCURRENCE" />
                            <label class="detail-metadata-label">Add occurrence link</label>
                            <select name="targetId" class="w-full rounded-xl border border-slate-200 dark:border-white/15 bg-white dark:bg-white/5 px-3 py-2 text-sm text-slate-700 dark:text-slate-200">
                                <option value="" th:if="${#lists.isEmpty(linkableOccurrences)}">No occurrences in range</option>
                                <option th:each="occ : ${linkableOccurrences}" th:value="${occ.id}" th:text="${occ.scheduleName + ' · ' + occ.date}"></option>
                            </select>
                            <button type="submit" class="detail-btn-secondary">Link occurrence</button>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </div>
</th:block>
