<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Goal Detail', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
        <div class="flex flex-wrap items-start justify-between gap-4">
            <div>
                <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Goal</p>
                <h1 class="mt-1 text-2xl font-semibold text-slate-900" th:text="${goal.title}">Goal</h1>
                <p class="mt-1 text-sm text-slate-600" th:text="${goal.description}"></p>
            </div>
            <div class="flex items-center gap-2">
                <a th:href="@{/goals/{id}/edit(id=${goal.id})}"
                   class="inline-flex items-center rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50">Edit</a>
                <a th:href="@{/goals/{id}/checkins(id=${goal.id})}"
                   class="inline-flex items-center rounded-xl bg-slate-900 px-3 py-2 text-xs font-semibold text-white hover:bg-slate-800">Check-ins</a>
            </div>
        </div>

        <div class="mt-6 grid gap-4 lg:grid-cols-[1.2fr_0.8fr]">
            <section class="rounded-2xl border border-slate-200 bg-white p-5">
                <h2 class="text-sm font-semibold text-slate-900">Goal summary</h2>
                <div class="mt-3 grid gap-3 sm:grid-cols-2">
                    <div>
                        <p class="text-xs uppercase text-slate-500">Type</p>
                        <p class="text-sm text-slate-700" th:text="${goal.goalType}"></p>
                    </div>
                    <div>
                        <p class="text-xs uppercase text-slate-500">Status</p>
                        <p class="text-sm text-slate-700" th:text="${goal.status}"></p>
                    </div>
                    <div>
                        <p class="text-xs uppercase text-slate-500">Target</p>
                        <p class="text-sm text-slate-700"
                           th:text="${goal.targetMetricName != null ? goal.targetMetricName : 'Target'}"></p>
                        <p class="text-sm text-slate-700">
                            <span th:text="${goal.targetMetricValue != null ? goal.targetMetricValue : '—'}"></span>
                            <span th:text="${goal.targetMetricUnit != null ? goal.targetMetricUnit : ''}"></span>
                        </p>
                    </div>
                    <div>
                        <p class="text-xs uppercase text-slate-500">Dates</p>
                        <p class="text-sm text-slate-700" th:text="${goal.startDate != null ? goal.startDate : '—'}"></p>
                        <p class="text-sm text-slate-700" th:text="${goal.targetDate != null ? goal.targetDate : '—'}"></p>
                    </div>
                </div>
            </section>

            <section class="rounded-2xl border border-slate-200 bg-white p-5">
                <h2 class="text-sm font-semibold text-slate-900">Weekly adherence</h2>
                <div class="mt-4 space-y-2">
                    <div th:each="week : ${adherenceWeeks}" class="flex items-center gap-3">
                        <div class="w-24 text-xs text-slate-500" th:text="${week.weekStart}">2025-01-01</div>
                        <div class="flex-1 rounded-full bg-slate-100">
                            <div class="h-2 rounded-full bg-emerald-400" th:style="${'width:' + week.percent + '%'}"></div>
                        </div>
                        <div class="text-xs text-slate-600" th:text="${week.completedCount + '/' + week.plannedCount}">0/0</div>
                    </div>
                </div>
            </section>
        </div>

        <div class="mt-6 grid gap-4 lg:grid-cols-3">
            <section class="rounded-2xl border border-slate-200 bg-white p-5">
                <h2 class="text-sm font-semibold text-slate-900">Linked tasks</h2>
                <div th:if="${#lists.isEmpty(linkedItems.tasks)}" class="mt-3 text-sm text-slate-600">No tasks linked.</div>
                <ul th:if="${!#lists.isEmpty(linkedItems.tasks)}" class="mt-3 space-y-2 text-sm text-slate-700">
                    <li th:each="task : ${linkedItems.tasks}">
                        <span th:text="${task.title}">Task</span>
                        <span class="text-xs text-slate-400" th:text="${task.date}"></span>
                    </li>
                </ul>
            </section>

            <section class="rounded-2xl border border-slate-200 bg-white p-5">
                <h2 class="text-sm font-semibold text-slate-900">Linked occurrences</h2>
                <div th:if="${#lists.isEmpty(linkedItems.occurrences)}" class="mt-3 text-sm text-slate-600">No occurrences linked.</div>
                <ul th:if="${!#lists.isEmpty(linkedItems.occurrences)}" class="mt-3 space-y-2 text-sm text-slate-700">
                    <li th:each="occ : ${linkedItems.occurrences}">
                        <span th:text="${occ.scheduleName}">Occurrence</span>
                        <span class="text-xs text-slate-400" th:text="${occ.date}"></span>
                    </li>
                </ul>
            </section>

            <section class="rounded-2xl border border-slate-200 bg-white p-5">
                <h2 class="text-sm font-semibold text-slate-900">Linked sessions</h2>
                <div th:if="${#lists.isEmpty(linkedItems.sessions)}" class="mt-3 text-sm text-slate-600">No sessions linked.</div>
                <ul th:if="${!#lists.isEmpty(linkedItems.sessions)}" class="mt-3 space-y-2 text-sm text-slate-700">
                    <li th:each="session : ${linkedItems.sessions}">
                        <span th:text="${session.nameSnapshot}">Session</span>
                        <span class="text-xs text-slate-400" th:text="${session.startedAt != null ? #temporals.format(session.startedAt, 'dd MMM yyyy') : ''}"></span>
                    </li>
                </ul>
            </section>
        </div>

        <div class="mt-6 rounded-2xl border border-slate-200 bg-white p-5">
            <h2 class="text-sm font-semibold text-slate-900">Link items</h2>
            <div class="mt-4 grid gap-4 md:grid-cols-2">
                <form method="post" th:action="@{/goals/{id}/links(id=${goal.id})}" class="space-y-2">
                    <input type="hidden" th:if="${_csrf != null}"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>
                    <input type="hidden" name="linkType" value="CALENDAR_TASK" />
                    <label class="block text-xs font-semibold text-slate-500">Add task link</label>
                    <select name="targetId" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700">
                        <option value="" th:if="${#lists.isEmpty(linkableTasks)}">No tasks in range</option>
                        <option th:each="task : ${linkableTasks}" th:value="${task.id}" th:text="${task.title + ' · ' + task.date}"></option>
                    </select>
                    <button type="submit" class="inline-flex items-center rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50">Link task</button>
                </form>

                <form method="post" th:action="@{/goals/{id}/links(id=${goal.id})}" class="space-y-2">
                    <input type="hidden" th:if="${_csrf != null}"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>
                    <input type="hidden" name="linkType" value="SCHEDULE_OCCURRENCE" />
                    <label class="block text-xs font-semibold text-slate-500">Add occurrence link</label>
                    <select name="targetId" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700">
                        <option value="" th:if="${#lists.isEmpty(linkableOccurrences)}">No occurrences in range</option>
                        <option th:each="occ : ${linkableOccurrences}" th:value="${occ.id}" th:text="${occ.scheduleName + ' · ' + occ.date}"></option>
                    </select>
                    <button type="submit" class="inline-flex items-center rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50">Link occurrence</button>
                </form>
            </div>
        </div>
    </div>
</th:block>
