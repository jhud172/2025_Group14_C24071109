<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Create Goal', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-3xl px-4 py-6 sm:px-6 lg:px-8">
        <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
            <div class="flex items-start justify-between gap-4">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Goals</p>
                    <h1 class="mt-1 text-2xl font-semibold text-slate-900">Create goal</h1>
                    <p class="mt-1 text-sm text-slate-600" th:if="${client != null}" th:text="${'Assigning to ' + client.fullName}"></p>
                </div>
                <a href="/goals" class="inline-flex items-center rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50">Back</a>
            </div>

            <form class="mt-6 space-y-4" method="post" th:action="@{/goals/create(clientId=${clientId})}" th:object="${form}">
                <input type="hidden" th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <div>
                    <label class="block text-sm font-semibold text-slate-700" for="title">Title</label>
                    <input id="title" type="text" th:field="*{title}" required
                           class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900" />
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700" for="description">Description</label>
                    <textarea id="description" rows="3" th:field="*{description}"
                              class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900"></textarea>
                </div>

                <div class="grid gap-3 sm:grid-cols-2">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700" for="goalType">Goal type</label>
                        <select id="goalType" th:field="*{goalType}"
                                class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900">
                            <option th:each="t : ${goalTypes}" th:value="${t}" th:text="${t}"></option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700" for="status">Status</label>
                        <select id="status" th:field="*{status}"
                                class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900">
                            <option th:each="s : ${goalStatuses}" th:value="${s}" th:text="${s}"></option>
                        </select>
                    </div>
                </div>

                <div class="grid gap-3 sm:grid-cols-3">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700" for="targetMetricName">Target metric</label>
                        <input id="targetMetricName" type="text" th:field="*{targetMetricName}"
                               class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700" for="targetMetricValue">Target value</label>
                        <input id="targetMetricValue" type="number" step="0.1" th:field="*{targetMetricValue}"
                               class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700" for="targetMetricUnit">Unit</label>
                        <input id="targetMetricUnit" type="text" th:field="*{targetMetricUnit}"
                               class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900" />
                    </div>
                </div>

                <div class="grid gap-3 sm:grid-cols-3">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700" for="startDate">Start date</label>
                        <input id="startDate" type="date" th:field="*{startDate}"
                               class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700" for="targetDate">Target date</label>
                        <input id="targetDate" type="date" th:field="*{targetDate}"
                               class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700" for="priority">Priority</label>
                        <input id="priority" type="number" min="0" th:field="*{priority}"
                               class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900" />
                    </div>
                </div>

                <label class="inline-flex items-center gap-2 text-sm text-slate-600">
                    <input type="checkbox" th:field="*{archived}" class="h-4 w-4 rounded border-slate-300" />
                    Archived
                </label>

                <button type="submit" class="inline-flex items-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">Save goal</button>
            </form>
        </div>
    </div>
</th:block>
