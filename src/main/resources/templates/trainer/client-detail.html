<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${pageTitle} ?: 'Client Overview', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        <div class="rounded-2xl bg-white/5 dark:bg-slate-900/40 ring-1 ring-white/10 shadow-sm p-6">
            <div class="flex flex-wrap items-start justify-between gap-4">
                <div>
                    <p class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400">Trainer Dashboard</p>
                    <h1 class="mt-1 text-2xl font-semibold text-slate-900 dark:text-slate-100" th:text="${client.fullName} ?: 'Client'">Client</h1>
                    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300" th:text="${client.username != null ? '@' + client.username : ''}"></p>
                </div>
                <a th:href="@{/trainer/clients}" class="inline-flex min-h-10 items-center justify-center rounded-xl border border-white/20 bg-white/5 px-4 py-2 text-sm font-semibold text-slate-900 dark:text-white hover:bg-slate-800/70">Back to clients</a>
            </div>

            <div class="mt-6 grid gap-4 lg:grid-cols-[1.1fr_0.9fr]">
                <section class="rounded-2xl border border-white/10 bg-white/5 p-5">
                    <h2 class="text-sm font-semibold text-slate-900 dark:text-slate-100">Assign workout</h2>
                    <form class="mt-3 space-y-3" method="post" th:action="@{/trainer/clients/{id}/assign-workout(id=${client.id})}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <select name="templateId" class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100">
                            <option th:if="${#lists.isEmpty(templates)}" value="">No workouts found</option>
                            <option th:each="t : ${templates}" th:value="${t.id}" th:text="${t.name}"></option>
                        </select>
                        <textarea name="trainerNotes" rows="3" placeholder="Trainer notes" class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100"></textarea>
                        <button type="submit" class="inline-flex items-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">Assign workout</button>
                    </form>
                </section>

                <section class="rounded-2xl border border-white/10 bg-white/5 p-5">
                    <h2 class="text-sm font-semibold text-slate-900 dark:text-slate-100">Assign schedule</h2>
                    <form class="mt-3 space-y-3" method="post" th:action="@{/trainer/clients/{id}/assign-schedule(id=${client.id})}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <select name="scheduleId" class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100">
                            <option th:if="${#lists.isEmpty(schedules)}" value="">No schedules found</option>
                            <option th:each="s : ${schedules}" th:value="${s.id}" th:text="${s.name}"></option>
                        </select>
                        <textarea name="trainerNotes" rows="3" placeholder="Schedule notes" class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100"></textarea>
                        <button type="submit" class="inline-flex items-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">Assign schedule</button>
                    </form>
                </section>
            </div>

            <div class="mt-6 grid gap-4 lg:grid-cols-[1fr_1fr_0.6fr]">
                <section class="rounded-2xl border border-white/10 bg-white/5 p-5">
                    <h2 class="text-sm font-semibold text-slate-900 dark:text-slate-100">Assigned workouts</h2>
                    <div th:if="${#lists.isEmpty(assignedWorkouts)}" class="mt-3 text-sm text-slate-600 dark:text-slate-300">No workouts assigned yet.</div>
                    <div th:if="${!#lists.isEmpty(assignedWorkouts)}" class="mt-3 space-y-3">
                        <div th:each="aw : ${assignedWorkouts}" class="rounded-xl border border-white/10 bg-white/5 p-4">
                            <div class="flex items-center justify-between">
                                <div>
                                    <div class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="${aw.workoutTemplate.name}">Workout</div>
                                    <div class="mt-1 text-xs text-slate-500" th:text="${aw.assignedAt != null ? #temporals.format(aw.assignedAt, 'dd MMM yyyy') : ''}"></div>
                                </div>
                                <span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs ring-1 ring-white/10"
                                      th:classappend="${aw.completed} ? ' bg-emerald-400/10 text-emerald-300' : ' bg-slate-400/10 text-slate-300'"
                                      th:text="${aw.completed} ? 'DONE' : 'PENDING'"></span>
                            </div>
                            <p class="mt-2 text-xs text-slate-600 dark:text-slate-300" th:text="${aw.trainerNotes}"></p>
                        </div>
                    </div>
                </section>

                <section class="rounded-2xl border border-white/10 bg-white/5 p-5">
                    <h2 class="text-sm font-semibold text-slate-900 dark:text-slate-100">Assigned schedules</h2>
                    <div th:if="${#lists.isEmpty(assignedSchedules)}" class="mt-3 text-sm text-slate-600 dark:text-slate-300">No schedules assigned yet.</div>
                    <div th:if="${!#lists.isEmpty(assignedSchedules)}" class="mt-3 space-y-3">
                        <div th:each="as : ${assignedSchedules}" class="rounded-xl border border-white/10 bg-white/5 p-4">
                            <div class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="${as.schedule.name}">Schedule</div>
                            <div class="mt-1 text-xs text-slate-500" th:text="${as.assignedAt != null ? #temporals.format(as.assignedAt, 'dd MMM yyyy') : ''}"></div>
                            <p class="mt-2 text-xs text-slate-600 dark:text-slate-300" th:text="${as.trainerNotes}"></p>
                        </div>
                    </div>
                </section>

                <section class="rounded-2xl border border-white/10 bg-white/5 p-5">
                    <h2 class="text-sm font-semibold text-slate-900 dark:text-slate-100">Adherence</h2>
                    <div class="mt-3 rounded-xl border border-white/10 bg-white/5 p-4">
                        <div class="text-xs uppercase text-slate-500">Workouts</div>
                        <div class="mt-2 text-2xl font-semibold text-slate-900 dark:text-slate-100" th:text="${adherence.completedWorkouts} + '/' + ${adherence.assignedWorkouts}">0/0</div>
                        <div class="mt-1 text-xs text-slate-500" th:text="${T(java.lang.Math).round(adherence.adherenceRate * 100)} + '%'">0%</div>
                    </div>
                </section>
            </div>
        </div>
    </div>

</th:block>
