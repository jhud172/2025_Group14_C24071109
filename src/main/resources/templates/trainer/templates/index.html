<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${pageTitle} ?: 'Trainer Templates', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
        <div th:if="${error} == 'trainer-unverified'" class="mb-4 rounded-2xl border border-amber-200/30 bg-amber-500/10 p-4 text-sm text-amber-200">
            Your trainer account needs verification before you can manage templates.
        </div>
        <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
                <p class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400">Trainer toolkit</p>
                <h1 class="mt-1 text-2xl font-semibold text-slate-900 dark:text-slate-100">Schedule templates</h1>
                <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">Build reusable weekly blueprints for clients.</p>
            </div>
            <a th:href="@{/trainer/templates/create}"
               class="inline-flex items-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">New template</a>
        </div>

        <div class="mt-6 grid gap-4 md:grid-cols-2">
            <div th:if="${#lists.isEmpty(templates)}" class="rounded-2xl border border-white/10 bg-white/5 p-6 text-sm text-slate-600 dark:text-slate-300">
                No templates yet. Create one to start.
            </div>
            <div th:each="template : ${templates}" class="rounded-2xl border border-white/10 bg-white/5 p-5">
                <div class="flex items-start justify-between gap-4">
                    <div>
                        <h2 class="text-lg font-semibold text-slate-900 dark:text-slate-100" th:text="${template.name}">Template</h2>
                        <p class="mt-1 text-xs text-slate-500" th:text="${template.tags}"></p>
                        <p class="mt-2 text-sm text-slate-600 dark:text-slate-300" th:text="${template.description}"></p>
                    </div>
                    <span class="inline-flex items-center rounded-full px-2 py-0.5 text-[11px] ring-1 ring-white/10"
                          th:classappend="${template.archived} ? ' bg-slate-500/10 text-slate-400' : ' bg-emerald-400/10 text-emerald-300'"
                          th:text="${template.archived} ? 'ARCHIVED' : 'ACTIVE'"></span>
                </div>
                <div class="mt-4 flex flex-wrap gap-2">
                    <a th:href="@{/trainer/templates/{id}/edit(id=${template.id})}"
                       class="inline-flex items-center rounded-xl border border-white/15 bg-white/5 px-3 py-1.5 text-xs font-semibold text-slate-900 dark:text-white hover:bg-slate-800/70">Edit</a>
                    <a th:href="@{/trainer/templates/{id}/apply(id=${template.id})}"
                       class="inline-flex items-center rounded-xl border border-white/15 bg-white/5 px-3 py-1.5 text-xs font-semibold text-slate-900 dark:text-white hover:bg-slate-800/70">Apply</a>
                    <form th:action="@{/trainer/templates/{id}/clone(id=${template.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="inline-flex items-center rounded-xl border border-white/15 bg-white/5 px-3 py-1.5 text-xs font-semibold text-slate-900 dark:text-white hover:bg-slate-800/70">Clone</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</th:block>
