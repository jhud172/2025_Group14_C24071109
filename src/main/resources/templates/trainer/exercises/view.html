<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${pageTitle} ?: 'Exercise', null, ~{::content}, null)}">

    <div th:fragment="content" class="detail-container">
        <!-- Header with key metadata at top -->
        <div class="detail-header">
            <div class="detail-header-content">
                <div class="detail-header-meta">
                    <p class="detail-label">Exercise</p>
                    <h1 class="detail-title" th:text="${exercise.name}">Exercise</h1>
                    <p class="detail-subtitle" th:text="${exercise.primaryMuscles}">Primary muscles</p>
                </div>
                <!-- Primary actions - sticky on larger screens -->
                <div class="detail-actions-sticky">
                    <a th:href="@{/trainer/library/exercises}" class="detail-btn-secondary">Back</a>
                    <a th:href="@{/trainer/library/exercises/{id}/edit(id=${exercise.id})}" class="detail-btn-primary">Edit</a>
                    <button type="button" class="detail-btn-secondary"
                            onclick="document.getElementById('shareDialog').showModal()">Share</button>
                </div>
            </div>
        </div>

        <!-- Structured content sections -->
        <div class="detail-sections">
            <!-- Main content in grid layout -->
            <div class="detail-grid-2">
                <!-- Exercise Details Section -->
                <section class="detail-section">
                    <h2 class="detail-section-title">Exercise details</h2>
                    <div class="detail-section-content">
                        <div class="detail-metadata">
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label">Equipment</p>
                                <p class="detail-metadata-value" th:text="${exercise.equipment}">Equipment</p>
                            </div>
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label">Difficulty</p>
                                <p class="detail-metadata-value" th:text="${exercise.difficulty}">Difficulty</p>
                            </div>
                        </div>

                        <div class="mt-4" th:if="${exercise.description != null and !#strings.isEmpty(exercise.description)}">
                            <p class="detail-metadata-label">Description</p>
                            <p class="detail-metadata-value mt-1" th:text="${exercise.description}">Description</p>
                        </div>

                        <div class="mt-4" th:if="${exercise.videoUrl != null and !#strings.isEmpty(exercise.videoUrl)}">
                            <p class="detail-metadata-label">Video</p>
                            <a class="detail-metadata-value mt-1 inline-block underline"
                               th:href="${exercise.videoUrl}" th:text="${exercise.videoUrl}" target="_blank" rel="noreferrer">Video URL</a>
                        </div>
                    </div>
                </section>

                <!-- Coaching Notes Section -->
                <section class="detail-section">
                    <h2 class="detail-section-title">Coaching notes</h2>
                    <div class="detail-section-content">
                        <div th:if="${#lists.isEmpty(notes)}" class="detail-empty">No notes.</div>
                        <ul th:if="${!#lists.isEmpty(notes)}" class="detail-list">
                            <li th:each="n : ${notes}" class="detail-list-item">
                                <span class="detail-list-item-description" th:text="${n.noteText}">Note</span>
                            </li>
                        </ul>
                    </div>

                    <!-- Delete Action -->
                    <div class="detail-section-content border-t border-slate-200 dark:border-white/10 pt-4 flex items-center justify-end">
                        <form method="post" th:action="@{/trainer/library/exercises/{id}/delete(id=${exercise.id})}">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="detail-btn-destructive">Delete Exercise</button>
                        </form>
                    </div>
                </section>
            </div>
        </div>

        <dialog id="shareDialog" class="rounded-2xl bg-slate-950/90 text-white p-0 ring-1 ring-white/10">
            <div class="w-[min(92vw,28rem)] p-6">
                <div class="flex items-start justify-between gap-4">
                    <div>
                        <div class="text-sm font-semibold">Share to active client</div>
                        <div class="mt-1 text-sm text-slate-300">Only active clients can be selected.</div>
                    </div>
                    <button type="button" class="rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm hover:bg-white/10"
                            onclick="document.getElementById('shareDialog').close()">Close</button>
                </div>

                <form class="mt-4 space-y-3" method="post" th:action="@{/trainer/library/share}" th:object="${shareForm}">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" th:field="*{templateType}" />
                    <input type="hidden" th:field="*{templateId}" />
                    <input type="hidden" th:field="*{returnUrl}" />

                    <div>
                        <label class="block text-sm font-semibold" for="clientId">Client</label>
                        <select id="clientId" th:field="*{clientId}"
                                class="mt-1 w-full rounded-xl border border-white/15 bg-white/5 px-4 py-2 text-sm text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/30">
                            <option value="" selected>Select a client…</option>
                            <option th:each="c : ${activeClients}" th:value="${c.id}" th:text="${c.username != null ? c.username : ('Client #' + c.id)}">Client</option>
                        </select>
                    </div>

                    <div class="flex items-center justify-end gap-2">
                        <button type="submit"
                                class="inline-flex min-h-11 items-center justify-center rounded-xl bg-white text-slate-900 px-4 py-2 text-sm font-semibold hover:bg-slate-100">
                            Share
                        </button>
                    </div>
                </form>
            </div>
        </dialog>
    </div>

</th:block>
