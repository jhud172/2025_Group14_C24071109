<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${pageTitle} ?: 'Create Exercise', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-3xl px-4 py-6 sm:px-6 lg:px-8">
        <div class="rounded-xl bg-white/5 dark:bg-slate-900/40 ring-1 ring-white/10 shadow-sm p-6">
            <div class="flex items-start justify-between gap-4">
                <div>
                    <h1 class="text-xl font-semibold text-slate-900 dark:text-slate-100">Create Exercise</h1>
                    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">Add an exercise template and coaching notes.</p>
                </div>
                <a th:href="@{/trainer/library/exercises}"
                   class="inline-flex min-h-11 items-center justify-center rounded-xl border border-white/20 bg-white/5 px-4 py-2 text-sm font-semibold text-slate-900 dark:text-white hover:bg-slate-800/70">
                    Back
                </a>
            </div>

            <form class="mt-6 space-y-4" method="post" th:action="@{/trainer/library/exercises/create}" th:object="${form}">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div>
                    <label class="block text-sm font-semibold" for="name">Name</label>
                    <input id="name" type="text" th:field="*{name}"
                           class="mt-1 w-full rounded-xl border border-white/15 bg-white/5 px-4 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/30" />
                    <div class="mt-1 text-sm text-rose-300" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div>
                    <label class="block text-sm font-semibold" for="description">Description</label>
                    <textarea id="description" rows="4" th:field="*{description}"
                              class="mt-1 w-full rounded-xl border border-white/15 bg-white/5 px-4 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/30"></textarea>
                </div>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label class="block text-sm font-semibold" for="primaryMuscles">Primary muscles</label>
                        <input id="primaryMuscles" type="text" th:field="*{primaryMuscles}"
                               class="mt-1 w-full rounded-xl border border-white/15 bg-white/5 px-4 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/30" />
                        <div class="mt-1 text-sm text-rose-300" th:if="${#fields.hasErrors('primaryMuscles')}" th:errors="*{primaryMuscles}"></div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold" for="equipment">Equipment</label>
                        <input id="equipment" type="text" th:field="*{equipment}"
                               class="mt-1 w-full rounded-xl border border-white/15 bg-white/5 px-4 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/30" />
                        <div class="mt-1 text-sm text-rose-300" th:if="${#fields.hasErrors('equipment')}" th:errors="*{equipment}"></div>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label class="block text-sm font-semibold" for="difficulty">Difficulty</label>
                        <input id="difficulty" type="text" th:field="*{difficulty}"
                               class="mt-1 w-full rounded-xl border border-white/15 bg-white/5 px-4 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/30" />
                        <div class="mt-1 text-sm text-rose-300" th:if="${#fields.hasErrors('difficulty')}" th:errors="*{difficulty}"></div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold" for="videoUrl">Video URL (optional)</label>
                        <input id="videoUrl" type="url" th:field="*{videoUrl}"
                               class="mt-1 w-full rounded-xl border border-white/15 bg-white/5 px-4 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/30" />
                        <div class="mt-1 text-sm text-rose-300" th:if="${#fields.hasErrors('videoUrl')}" th:errors="*{videoUrl}"></div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold" for="notesText">Coaching notes (one per line)</label>
                    <textarea id="notesText" rows="5" th:field="*{notesText}"
                              class="mt-1 w-full rounded-xl border border-white/15 bg-white/5 px-4 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/30"></textarea>
                </div>

                <div class="flex items-center justify-end gap-2">
                    <button type="submit"
                            class="inline-flex min-h-11 items-center justify-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>

</th:block>
