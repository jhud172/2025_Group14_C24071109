<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${pageTitle} ?: 'Programme', null, ~{::content}, null)}">

    <div th:fragment="content" class="detail-container">
        <!-- Header with key metadata at top -->
        <div class="detail-header">
            <div class="detail-header-content">
                <div class="detail-header-meta">
                    <p class="detail-label">Programme</p>
                    <h1 class="detail-title" th:text="${programme.title}">Programme</h1>
                    <p class="detail-subtitle" th:text="${programme.weeks != null ? (programme.weeks + ' weeks') : ''}">Weeks</p>
                </div>
                <!-- Primary actions - sticky on larger screens -->
                <div class="detail-actions-sticky">
                    <a th:href="@{/trainer/library/programmes}" class="detail-btn-secondary">Back</a>
                    <a th:href="@{/trainer/library/programmes/{id}/edit(id=${programme.id})}" class="detail-btn-primary">Edit</a>
                    <button type="button" class="detail-btn-secondary"
                            onclick="document.getElementById('shareDialog').showModal()">Share</button>
                </div>
            </div>
        </div>

        <!-- Structured content sections -->
        <div class="detail-sections">
            <div class="detail-grid-2">
                <section class="detail-section">
                    <h2 class="detail-section-title">Programme days</h2>

                    <div class="detail-section-content">
                        <div th:if="${#lists.isEmpty(days)}" class="detail-empty">No days yet.</div>

                        <div th:if="${!#lists.isEmpty(days)}" class="detail-list">
                            <div th:each="d : ${days}" class="detail-list-item">
                                <div class="flex items-start justify-between gap-4">
                                    <div class="min-w-0 flex-1">
                                        <div class="detail-list-item-title" th:text="${d.dayOfWeek}">Day</div>
                                        <div class="detail-list-item-description"
                                             th:text="${workoutsById[d.workoutId] != null ? workoutsById[d.workoutId].title : ('Workout #' + d.workoutId)}">Workout</div>
                                        <div class="detail-list-item-meta" th:text="${'Order: ' + d.orderIndex}">Order</div>
                                    </div>
                                    <form method="post" th:action="@{/trainer/library/programmes/{pid}/days/{did}/delete(pid=${programme.id},did=${d.id})}">
                                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit" class="detail-btn-destructive">Remove</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Add Day Form -->
                    <div class="detail-section-content border-t border-slate-200 dark:border-white/10 pt-4">
                        <h3 class="detail-section-title mb-3">Add day</h3>
                        <form class="grid grid-cols-1 gap-3" method="post" th:action="@{/trainer/library/programmes/{id}/days(id=${programme.id})}" th:object="${dayForm}">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div>
                                <label class="detail-metadata-label" for="dayOfWeek">Day of week</label>
                                <input id="dayOfWeek" type="text" th:field="*{dayOfWeek}"
                                       class="mt-1 w-full rounded-xl border border-slate-200 dark:border-white/15 bg-white dark:bg-white/5 px-4 py-2 text-sm text-slate-700 dark:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400" />
                            </div>

                            <div>
                                <label class="detail-metadata-label" for="workoutId">Workout</label>
                                <select id="workoutId" th:field="*{workoutId}"
                                        class="mt-1 w-full rounded-xl border border-slate-200 dark:border-white/15 bg-white dark:bg-white/5 px-4 py-2 text-sm text-slate-700 dark:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400">
                                    <option value="" selected>Select a workout…</option>
                                    <option th:each="w : ${workouts}" th:value="${w.id}" th:text="${w.title}">Workout</option>
                                </select>
                            </div>

                            <div>
                                <label class="detail-metadata-label" for="orderIndex">Order index</label>
                                <input id="orderIndex" type="number" min="0" th:field="*{orderIndex}"
                                       class="mt-1 w-full rounded-xl border border-slate-200 dark:border-white/15 bg-white dark:bg-white/5 px-4 py-2 text-sm text-slate-700 dark:text-white" />
                            </div>

                            <div class="flex items-center justify-end">
                                <button type="submit" class="detail-btn-primary">Add</button>
                            </div>
                        </form>
                    </div>
                </section>

                <!-- Coaching Notes Section -->
                <section class="detail-section">
                    <h2 class="detail-section-title">Coaching notes</h2>
                    <div class="detail-section-content">
                        <div th:if="${#lists.isEmpty(notes)}" class="detail-empty">No notes.</div>
                        <ul th:if="${!#lists.isEmpty(notes)}" class="detail-list">
                            <li th:each="n : ${notes}" class="detail-list-item">
                                <span class="detail-list-item-description" th:text="${n.noteText}">Note</span>
                            </li>
                        </ul>
                    </div>

                    <!-- Delete Action -->
                    <div class="detail-section-content border-t border-slate-200 dark:border-white/10 pt-4 flex items-center justify-end">
                        <form method="post" th:action="@{/trainer/library/programmes/{id}/delete(id=${programme.id})}">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="detail-btn-destructive">Delete Programme</button>
                        </form>
                    </div>
                </section>
            </div>
        </div>

        <dialog id="shareDialog" class="rounded-2xl bg-slate-950/90 text-white p-0 ring-1 ring-white/10">
            <div class="w-[min(92vw,28rem)] p-6">
                <div class="flex items-start justify-between gap-4">
                    <div>
                        <div class="text-sm font-semibold">Share to active client</div>
                        <div class="mt-1 text-sm text-slate-300">Only active clients can be selected.</div>
                    </div>
                    <button type="button" class="rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm hover:bg-white/10"
                            onclick="document.getElementById('shareDialog').close()">Close</button>
                </div>

                <form class="mt-4 space-y-3" method="post" th:action="@{/trainer/library/share}" th:object="${shareForm}">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" th:field="*{templateType}" />
                    <input type="hidden" th:field="*{templateId}" />
                    <input type="hidden" th:field="*{returnUrl}" />

                    <div>
                        <label class="block text-sm font-semibold" for="clientId">Client</label>
                        <select id="clientId" th:field="*{clientId}"
                                class="mt-1 w-full rounded-xl border border-white/15 bg-white/5 px-4 py-2 text-sm text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/30">
                            <option value="" selected>Select a client…</option>
                            <option th:each="c : ${activeClients}" th:value="${c.id}" th:text="${c.username != null ? c.username : ('Client #' + c.id)}">Client</option>
                        </select>
                    </div>

                    <div class="flex items-center justify-end gap-2">
                        <button type="submit"
                                class="inline-flex min-h-11 items-center justify-center rounded-xl bg-white text-slate-900 px-4 py-2 text-sm font-semibold hover:bg-slate-100">Share</button>
                    </div>
                </form>
            </div>
        </dialog>
    </div>

</th:block>
