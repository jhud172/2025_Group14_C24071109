<div xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
     xmlns:th="http://www.thymeleaf.org"
     th:fragment="usernameLogout"
     class="flex items-center gap-2">

    <span sec:authorize="isAuthenticated()"
          class="hidden sm:inline-flex items-center gap-2 text-sm font-semibold text-slate-700 dark:text-slate-200">
        <span sec:authentication="name">user</span>
        <span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-semibold bg-white/5 dark:bg-slate-900/40 ring-1 ring-white/10">
            <span sec:authorize="hasRole('SUPER_ADMIN')">SUPER_ADMIN</span>
            <span sec:authorize="hasRole('PLATFORM_ADMIN')">PLATFORM_ADMIN</span>
            <span sec:authorize="hasRole('GYM_ADMIN')">GYM_ADMIN</span>
            <span sec:authorize="hasRole('TRAINER')">TRAINER</span>
            <span sec:authorize="hasRole('CLIENT')">CLIENT</span>
            <span sec:authorize="!hasAnyRole('SUPER_ADMIN','PLATFORM_ADMIN','GYM_ADMIN','TRAINER','CLIENT')">USER</span>
        </span>
    </span>

    <span sec:authorize="isAuthenticated()" class="inline-flex">
        <form th:action="@{/logout}" method="post" class="m-0 flex items-center">
            <input type="hidden" th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>
            <button type="submit"
                    class="authbtn bg-slate-900 text-white hover:bg-slate-800 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-slate-200">
                Logout
            </button>
        </form>
    </span>

    <span sec:authorize="!isAuthenticated()" class="inline-flex">
        <a th:href="@{/login}"
           class="authbtn bg-white text-slate-900 ring-1 ring-slate-200 hover:bg-slate-50 dark:bg-slate-900/50 dark:text-slate-100 dark:ring-slate-800 dark:hover:bg-slate-900/70">
            Login
        </a>
    </span>
</div>
