<div xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:fragment="chatWidget"
    id="chatWidget"
    th:with="authUser=${@authHelper.getAuthenticatedUser()}, isPremium=${authUser != null ? @platformSubscriptionService.isPremium(authUser.id, @systemClock) : false}"
    th:attr="data-premium=${isPremium}">

    <!-- CSRF values (blank if not available) -->
    <input type="hidden" id="chat_csrf" name="chat_csrf"
           th:value="${_csrf != null ? _csrf.token : ''}"/>

    <input type="hidden" id="chat_csrf_header" name="chat_csrf_header"
           th:value="${_csrf != null ? _csrf.headerName : ''}"/>

    <!-- Auth marker (chat.js reads this) -->
        <div id="chatAuth" hidden
            th:attr="data-authenticated=${#authorization.expression('isAuthenticated()')}"></div>

    <!-- Floating button -->
    <button type="button"
            class="chat-fab-premium"
            id="chatFab"
            aria-label="Open chat"
            aria-controls="chatPanel"
            aria-expanded="false">
        <span class="chat-fab-notification-dot" id="chatNotificationDot"></span>
        <span id="chatUnreadBadge"
              class="pointer-events-none absolute -right-1 -top-1 hidden min-w-[1.25rem] items-center justify-center rounded-full bg-rose-500 px-1.5 text-[10px] font-semibold text-white shadow-lg"
              aria-live="polite"></span>
        <span class="chat-fab-icon" aria-hidden="true">💬</span>
    </button>

    <div id="chatToastRegion"
         class="fixed bottom-[5rem] right-4 sm:bottom-[6.5rem] sm:right-6 z-50 flex w-[22.5rem] max-w-[calc(100vw-2rem)] sm:max-w-[calc(100vw-3rem)] flex-col gap-2">
    </div>

    <!-- Chat panel -->
    <section id="chatPanel" aria-hidden="true"
             class="chat-panel-premium">
        <header class="chat-header-premium">
            <div class="chat-header-top">
                <div class="chat-title-section">
                    <div class="chat-badge-premium">AI</div>
                    <div class="chat-title-text">
                        <div class="chat-title-main">Coach Bot</div>
                        <div class="chat-title-subtitle">Training, notes, scheduling help</div>
                    </div>
                </div>
                
                <div class="chat-header-actions">
                    <button type="button"
                            class="chat-icon-btn-premium hidden sm:flex"
                            id="chatNotificationsToggle"
                            title="Notifications"
                            aria-label="Toggle notifications">🔔</button>
                    <button type="button"
                            class="chat-icon-btn-premium"
                            id="chatClear"
                            title="Clear"
                            aria-label="Clear chat">🧹</button>
                    <button type="button"
                            class="chat-icon-btn-premium"
                            id="chatClose"
                            title="Close"
                            aria-label="Close chat">✕</button>
                </div>
            </div>
            
            <div class="chat-tabs-premium">
                <a href="/inbox"
                   class="chat-tab-btn">
                    Inbox
                </a>
                <button type="button"
                        id="chatProChatBtn"
                        th:attr="data-locked=${!isPremium}"
                        class="chat-tab-btn active"
                        :class="{ 'active': currentTab === 'chat' }">
                    <span>Pro Chat</span>
                    <span th:if="${!isPremium}" aria-hidden="true" class="ml-1">🔒</span>
                </button>
                <span th:if="${!isPremium}" class="text-[10px] text-slate-400 dark:text-slate-500">Premium feature</span>
            </div>
        </header>

        <div id="chatInlineToast" class="hidden border-b border-slate-200/60 bg-slate-50 px-4 py-2 text-xs text-slate-600 dark:border-slate-700/60 dark:bg-slate-900 dark:text-slate-200"></div>

        <div class="chat-panel-content-wrapper">
            <div id="chatChatView" class="flex h-full flex-col">
                <div class="chat-conversation-premium" id="chatBody">
                    <div class="chat-message-wrapper assistant" sec:authorize="isAuthenticated()">
                        <div class="chat-message-bubble">
                            Ask me anything about your workouts, progress, notes, or what to do today.
                        </div>
                    </div>

                    <div class="chat-message-wrapper assistant" sec:authorize="!isAuthenticated()">
                        <div class="chat-message-bubble">
                            Please log in to use chat.
                        </div>
                    </div>
                </div>

                <form class="chat-input-container" id="chatForm" autocomplete="off">
                    <input id="chatInput" type="text" maxlength="800" required
                           class="chat-input-premium"
                           th:disabled="${!(#authentication != null and #authentication.authenticated)}"
                           th:placeholder="${(#authentication != null and #authentication.authenticated) ? 'Message…' : 'Log in to use chat'}" />

                    <button type="submit"
                            class="chat-send-btn-premium"
                            id="chatSend"
                            th:disabled="${!(#authentication != null and #authentication.authenticated)}">Send</button>
                </form>
            </div>

            <div id="chatNotificationsView" class="chat-notifications-view hidden">
                <div class="flex items-center justify-between border-b border-slate-200/60 px-4 py-3 text-xs dark:border-slate-700/60">
                    <span class="font-semibold text-slate-700 dark:text-slate-200">Notifications</span>
                    <button id="chatNotificationsReadAll"
                            class="chat-icon-btn-premium h-auto w-auto px-3 py-1.5 text-[11px]">
                        Mark all read
                    </button>
                </div>
                <div id="chatNotificationsList" class="flex-1 overflow-auto px-4 py-3 text-sm">
                    <div class="rounded-xl border border-dashed border-slate-200/80 bg-slate-50 px-3 py-4 text-center text-xs text-slate-500 dark:border-slate-700/80 dark:bg-slate-900/40 dark:text-slate-400">
                        No notifications yet.
                    </div>
                </div>
            </div>
        </div>
    </section>

</div>
