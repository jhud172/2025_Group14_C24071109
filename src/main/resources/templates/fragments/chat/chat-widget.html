<div xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:fragment="chatWidget"
    id="chatWidget"
    th:with="authUser=${@authHelper.getAuthenticatedUser()}, isPremium=${authUser != null ? @platformSubscriptionService.isPremium(authUser.id, @systemClock) : false}"
    th:attr="data-premium=${isPremium}">

    <!-- CSRF values (blank if not available) -->
    <input type="hidden" id="chat_csrf" name="chat_csrf"
           th:value="${_csrf != null ? _csrf.token : ''}"/>

    <input type="hidden" id="chat_csrf_header" name="chat_csrf_header"
           th:value="${_csrf != null ? _csrf.headerName : ''}"/>

    <!-- Auth marker (chat.js reads this) -->
        <div id="chatAuth" hidden
            th:attr="data-authenticated=${#authorization.expression('isAuthenticated()')}"></div>

    <!-- Floating button -->
    <button type="button"
            class="fixed bottom-6 right-6 z-50 inline-flex h-14 w-14 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-900 shadow-lg transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900/10 active:translate-y-px dark:border-slate-800 dark:bg-slate-950 dark:text-slate-100 dark:hover:bg-slate-900"
            id="chatFab"
            aria-label="Open chat"
            aria-controls="chatPanel"
            aria-expanded="false">
        <span class="chat-fab-dot absolute right-3 top-3 h-2.5 w-2.5 rounded-full bg-slate-900 opacity-0 shadow-[0_0_0_6px_rgba(15,23,42,0.10)] transition [&.on]:opacity-100 dark:bg-slate-100 dark:shadow-[0_0_0_6px_rgba(226,232,240,0.10)]"></span>
        <span id="chatUnreadBadge"
              class="pointer-events-none absolute -right-1 -top-1 hidden min-w-[1.25rem] items-center justify-center rounded-full bg-rose-500 px-1.5 text-[10px] font-semibold text-white shadow-lg"
              aria-live="polite"></span>
        <span class="text-lg" aria-hidden="true">💬</span>
    </button>

    <div id="chatToastRegion"
         class="fixed bottom-[6.5rem] right-6 z-50 flex w-[22.5rem] max-w-[calc(100vw-3rem)] flex-col gap-2">
    </div>

    <!-- Chat panel -->
    <section id="chatPanel" aria-hidden="true"
             class="fixed bottom-24 right-6 z-50 h-[34rem] w-[22.5rem] max-w-[calc(100vw-3rem)] overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl opacity-0 pointer-events-none translate-y-2 transition duration-200 ease-out [&.open]:opacity-100 [&.open]:pointer-events-auto [&.open]:translate-y-0 dark:border-slate-800 dark:bg-slate-950">
        <header class="flex items-start justify-between gap-3 border-b border-slate-200 px-4 py-3 dark:border-slate-800">
            <div class="flex items-start gap-3">
                <div class="grid h-9 w-9 place-items-center rounded-xl border border-slate-200 bg-slate-50 text-xs font-black tracking-wide text-slate-900 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-100">AI</div>
                <div>
                    <div class="text-sm font-bold text-slate-900 dark:text-slate-100">Coach Bot</div>
                    <div class="text-xs text-slate-600 dark:text-slate-400">Training, notes, scheduling help</div>
                    <div class="mt-2 flex flex-wrap items-center gap-2 text-[11px]">
                        <a href="/inbox"
                           class="inline-flex items-center gap-1 rounded-full border border-slate-200 bg-white px-2.5 py-1 text-slate-700 shadow-sm transition hover:bg-slate-50 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200">
                            Inbox
                        </a>
                        <button type="button"
                                id="chatProChatBtn"
                                th:attr="data-locked=${!isPremium}"
                                class="inline-flex items-center gap-1 rounded-full border border-slate-200 bg-white px-2.5 py-1 text-slate-700 shadow-sm transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-60 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200">
                            <span>Pro Chat</span>
                            <span th:if="${!isPremium}" aria-hidden="true">🔒</span>
                        </button>
                        <span id="chatProChatHint" th:if="${!isPremium}" class="text-[10px] text-slate-400">Premium feature</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button type="button"
                        class="inline-flex h-9 items-center justify-center rounded-xl border border-slate-200 bg-white px-3 text-xs font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900/10 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200 dark:hover:bg-slate-900"
                        id="chatNotificationsToggle">Notifications</button>
                <button type="button"
                        class="inline-flex h-9 w-9 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-900 shadow-sm transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900/10 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-100 dark:hover:bg-slate-900"
                        id="chatClear" title="Clear" aria-label="Clear chat">🧹</button>
                <button type="button"
                        class="inline-flex h-9 w-9 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-900 shadow-sm transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900/10 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-100 dark:hover:bg-slate-900"
                        id="chatClose" title="Close" aria-label="Close chat">✕</button>
            </div>
        </header>

        <div id="chatInlineToast" class="hidden border-b border-slate-200 bg-slate-50 px-4 py-2 text-xs text-slate-600 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-200"></div>

        <div class="flex h-[calc(100%-64px)] flex-col">
            <div id="chatChatView" class="flex h-full flex-col">
                <div class="flex-1 overflow-auto px-4 py-3 text-sm" id="chatBody">
                    <div class="chat-msg flex justify-start" sec:authorize="isAuthenticated()">
                        <div class="bubble max-w-[82%] whitespace-pre-wrap rounded-2xl border border-slate-200 bg-slate-50 px-3 py-2 text-slate-900 shadow-sm dark:border-slate-800 dark:bg-slate-900 dark:text-slate-100">
                            Ask me anything about your workouts, progress, notes, or what to do today.
                        </div>
                    </div>

                    <div class="chat-msg flex justify-start" sec:authorize="!isAuthenticated()">
                        <div class="bubble max-w-[82%] whitespace-pre-wrap rounded-2xl border border-slate-200 bg-slate-50 px-3 py-2 text-slate-900 shadow-sm dark:border-slate-800 dark:bg-slate-900 dark:text-slate-100">
                            Please log in to use chat.
                        </div>
                    </div>
                </div>

                <form class="flex items-center gap-2 border-t border-slate-200 p-3 dark:border-slate-800" id="chatForm" autocomplete="off">
                    <input id="chatInput" type="text" maxlength="800" required
                           class="h-11 flex-1 rounded-xl border border-slate-300 bg-white px-3 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10 disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-500 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-100 dark:placeholder:text-slate-500 dark:disabled:bg-slate-900"
                           th:disabled="${!(#authentication != null and #authentication.authenticated)}"
                           th:placeholder="${(#authentication != null and #authentication.authenticated) ? 'Message…' : 'Log in to use chat'}" />

                    <button type="submit"
                            class="inline-flex h-11 items-center justify-center rounded-xl bg-slate-900 px-4 text-sm font-semibold text-white shadow-sm transition hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900/10 disabled:cursor-not-allowed disabled:opacity-50 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-slate-200"
                            id="chatSend"
                            th:disabled="${!(#authentication != null and #authentication.authenticated)}">Send</button>
                </form>
            </div>

            <div id="chatNotificationsView" class="hidden h-full flex-col">
                <div class="flex items-center justify-between border-b border-slate-200 px-4 py-2 text-xs dark:border-slate-800">
                    <span class="font-semibold text-slate-700 dark:text-slate-200">Notifications</span>
                    <button id="chatNotificationsReadAll"
                            class="inline-flex items-center gap-1 rounded-lg border border-slate-200 bg-white px-2.5 py-1 text-[11px] font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200">
                        Mark all read
                    </button>
                </div>
                <div id="chatNotificationsList" class="flex-1 overflow-auto px-4 py-3 text-sm">
                    <div class="rounded-xl border border-dashed border-slate-200 bg-slate-50 px-3 py-4 text-center text-xs text-slate-500 dark:border-slate-800 dark:bg-slate-900/40 dark:text-slate-400">
                        No notifications yet.
                    </div>
                </div>
            </div>
        </div>
    </section>

</div>
