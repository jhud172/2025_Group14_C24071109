<div xmlns:th="http://www.thymeleaf.org" th:fragment="blockCard(block)">
    <div class="rounded-2xl border border-slate-200 bg-white/90 p-4 shadow-sm dark:border-slate-800 dark:bg-slate-950/80">
        <div class="text-xs font-semibold uppercase tracking-widest text-slate-400" th:text="${block.title}">Block</div>
        <div class="mt-3 space-y-2">
            <div th:each="item : ${block.items}" class="flex items-center justify-between rounded-xl border border-slate-200 px-3 py-2 text-sm dark:border-slate-800">
                <div>
                    <div class="font-semibold text-slate-800 dark:text-slate-100" th:text="${item.label}">Item</div>
                    <div class="text-xs text-slate-500" th:text="${item.value}">Value</div>
                </div>
                <button type="button"
                        class="chat-block-action rounded-lg bg-slate-900 px-2.5 py-1 text-xs font-semibold text-white"
                        th:attr="data-action=${item.status}, data-id=${item.id}">Action</button>
            </div>
        </div>
    </div>
</div>
