<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="editForm(task)">
    <div th:id="'edit-' + ${task.id}"
            class="hidden mt-4 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">

        <form th:action="@{'/calendar/task/' + ${task.id} + '/edit-inline'}"
              method="post"
              class="space-y-5">

            <!-- CSRF (required if Spring Security CSRF is enabled) -->
            <input type="hidden" th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>

            <input type="hidden" name="date" th:value="${task.date}">
            <input type="hidden" name="completed" th:value="${task.completed}">

            <div>
                  <label class="mb-1 block text-sm font-semibold text-slate-700">Title</label>
                <input name="title"
                       th:value="${task.title}"
                      class="w-full rounded-xl border border-slate-300 bg-white p-3 text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10">
            </div>

            <div>
                  <label class="mb-1 block text-sm font-semibold text-slate-700">Time</label>
                <input type="time"
                       name="time"
                       th:value="${task.time != null ? #temporals.format(task.time, 'HH:mm') : ''}"
                      class="w-full rounded-xl border border-slate-300 bg-white p-3 text-slate-900 shadow-sm focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10">
            </div>

            <div>
                <label class="mb-1 block text-sm font-semibold text-slate-700">Notes</label>
                <textarea name="notes"
                          class="h-28 w-full rounded-xl border border-slate-300 bg-white p-3 text-slate-900 shadow-sm focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10"
                          th:text="${task.notes}"></textarea>
            </div>

            <label class="flex items-center gap-3">
                <input type="checkbox"
                       name="exercise"
                       th:checked="${task.exercise}"
                       class="h-4 w-4 rounded border-slate-300 text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-900/10">
                <span class="text-slate-700">Exercise Task</span>
            </label>

            <div class="flex justify-end gap-4 pt-2">
                <button type="submit"
                        class="inline-flex items-center justify-center rounded-xl bg-slate-900 px-6 py-2 text-sm font-semibold text-white shadow-sm hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900/10">
                    Save
                </button>

                <button type="button"
                        th:attr="data-toggle-edit-id=${task.id}"
                        class="inline-flex items-center justify-center rounded-xl border border-slate-300 bg-white px-6 py-2 text-sm font-semibold text-slate-900 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900/10">
                    Cancel
                </button>
            </div>
        </form>

    </div>
</th:block>
