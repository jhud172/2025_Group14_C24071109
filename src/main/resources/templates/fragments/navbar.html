<!-- fragments/navbar.html -->
<th:block xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
          th:fragment="navLinks">

    <!-- ============================================== -->
    <!-- NON-AUTHENTICATED USER NAVIGATION -->
    <!-- ============================================== -->
    <th:block sec:authorize="!isAuthenticated()">
        <a th:href="@{/}"
           class="navlink group"
           th:classappend="${pageTitle != null and pageTitle.contains('Home')} ? ' navlink-active' : ''">
            <span th:text="#{nav.home}">Home</span>
        </a>

        <a th:href="@{/about}"
           class="navlink group"
           th:classappend="${pageTitle != null and pageTitle.contains('About')} ? ' navlink-active' : ''">
            <span th:text="#{nav.about}">About</span>
        </a>

        <a th:href="@{/pricing}"
           class="navlink group"
           th:classappend="${pageTitle != null and pageTitle.contains('Pricing')} ? ' navlink-active' : ''">
            <span th:text="#{nav.pricing}">Pricing</span>
        </a>

        <a th:href="@{/explore}"
           class="navlink group"
           th:classappend="${pageTitle != null and pageTitle.contains('Explore')} ? ' navlink-active' : ''">
            <span th:text="#{nav.trainers}">Trainers</span>
        </a>

        <a th:href="@{/login}"
           class="navlink group">
            <span th:text="#{nav.login}">Login</span>
        </a>
    </th:block>

    <!-- ============================================== -->
    <!-- AUTHENTICATED USER NAVIGATION -->
    <!-- ============================================== -->
    <th:block sec:authorize="isAuthenticated()">

    <!-- ============================================== -->
    <!-- CLIENT NAVBAR: Dashboard, Calendar, Vault, Leaderboard, Trainers, Profile -->
    <!-- ============================================== -->
    <th:block sec:authorize="hasAnyRole('CLIENT','USER') and !hasAnyRole('TRAINER','GYM_ADMIN','PLATFORM_ADMIN','SUPER_ADMIN')">
        <!-- Dashboard -->
        <a th:href="@{/dashboard}"
           class="navlink group"
           th:classappend="${pageTitle != null and pageTitle.contains('Dashboard')} ? ' navlink-active' : ''">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 class="navicon"
                 th:classappend="${pageTitle != null and pageTitle.contains('Dashboard')} ? ' navicon-active' : ''">
                <path d="M3 3h7v7H3z" />
                <path d="M14 3h7v7h-7z" />
                <path d="M14 14h7v7h-7z" />
                <path d="M3 14h7v7H3z" />
            </svg>
            <span>Dashboard</span>
        </a>

        <!-- Calendar -->
        <a th:href="@{/calendar}"
           class="navlink group"
           th:classappend="${pageTitle != null and pageTitle.contains('Calendar')} ? ' navlink-active' : ''">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 class="navicon"
                 th:classappend="${pageTitle != null and pageTitle.contains('Calendar')} ? ' navicon-active' : ''">
                <path d="M8 2v4M16 2v4" />
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <path d="M3 10h18" />
            </svg>
            <span th:text="#{nav.calendar}">Calendar</span>
        </a>

        <!-- Vault -->
        <a th:href="@{/vault}"

           th:classappend="${pageTitle != null and pageTitle.contains('Vault')} ? ' navlink-active' : ''">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 class="navicon"
                 th:classappend="${pageTitle != null and pageTitle.contains('Vault')} ? ' navlink-active' : ''">
                <path d="M4 4h16v16H4z" />
                <path d="M8 8h8" />
                <path d="M8 12h8" />
                <path d="M8 16h6" />
            </svg>
            <span th:text="#{nav.trainingVault}">Vault</span>
        </a>

        <!-- Leaderboard -->
        <a th:href="@{/levels}"
           class="navlink group"

        <!-- Messages -->

                  aria-live="polite"></span>

        <!-- Profile -->
        <a th:href="@{/profile}"
           class="navlink group"
           th:classappend="${pageTitle != null and pageTitle.contains('Profile')} ? ' navlink-active' : ''">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"

<header xmlns:th="http://www.thymeleaf.org"
        th:fragment="navbar"
    class="navheader">
    <!-- Accent strip -->
    <div class="accentstrip"></div>
    <div class="mx-auto w-full px-4 sm:px-6 lg:px-8">
        <div class="flex h-20 items-center gap-4">

            <!-- Brand (left) -->
            <div class="flex items-center shrink-0">
                <a th:href="@{/}"
                   class="flex items-center gap-2 rounded-xl focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-900/20 dark:focus-visible:ring-slate-200/30">
                    <img alt="Healthy Habits Logo" th:src="@{/img/logo.png}" class="h-12 w-auto shrink-0"/>
                    <span class="hidden text-sm font-extrabold tracking-wide sm:inline">One To One</span>
                </a>
            </div>

            <!-- Desktop nav (center) -->
            <div class="desktop-nav flex-1 min-w-0 justify-center">
                <nav aria-label="Primary navigation">
                    <!-- Horizontal scrollbar appears when nav items overflow -->
                    <div class="navsurface max-w-full min-w-0 overflow-x-auto scrollbar-thin scrollbar-thumb-slate-300 dark:scrollbar-thumb-slate-700">
                        <div class="flex items-center flex-nowrap whitespace-nowrap gap-1">
                            <th:block th:replace="~{fragments/navbar :: navLinks}"></th:block>
                        </div>
                    </div>
                </nav>
            </div>

            <!-- Right (auth + toggle) -->
            <div class="ml-auto flex items-center gap-3 shrink-0">
                <!-- Desktop-only status pill (presentational) -->
                <div class="hidden nav:inline-flex h-9 items-center gap-2 rounded-full border border-emerald-200 bg-emerald-50/80 px-3 text-xs font-semibold text-emerald-700 shadow-sm dark:border-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-300">
                    <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>Status: Online</span>
                </div>

                <div class="hidden nav:block">
                    <div class="authsurface">
                        <div th:replace="~{fragments/username-logout :: usernameLogout}"></div>
                    </div>
                </div>

                <!-- Mobile toggle -->
                <button id="siteNavButton" type="button"
                        class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-gray-200 bg-white text-slate-700 shadow-sm transition-all duration-300
                               hover:bg-gray-50 hover:border-emerald-300 hover:text-emerald-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/20
                               dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 dark:hover:border-emerald-700
                           nav:hidden"
                        aria-controls="siteNavMenu"
                        aria-expanded="false"
                        aria-label="Toggle navigation">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
                        <path d="M4 6h16" />
                        <path d="M4 12h16" />
                        <path d="M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile menu -->
    <nav aria-label="Primary navigation" id="siteNavMenu" class="hidden nav:hidden">
        <div class="border-t border-gray-200 bg-white/95 backdrop-blur-md dark:border-slate-800 dark:bg-slate-900/95">
            <div class="mx-auto w-full px-4 py-4 sm:px-6 lg:px-8">
                <div class="overflow-hidden rounded-2xl shadow-lg ring-1 ring-gray-200 dark:ring-slate-700">
                    <div class="accentstrip"></div>
                    <div class="navsurface shadow-none" data-mobile-nav>
                        <!-- Mobile nav: 2 columns by default, 3 columns on screens >= 640px (sm:) -->
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2" data-mobile-links>
                            <th:block th:replace="~{fragments/navbar :: navLinks}"></th:block>
                            
                            <!-- Quick Actions - Only show on mobile for authenticated users -->
                            <button type="button" id="mobileQuickActionsToggle"
                                    sec:authorize="isAuthenticated()"
                                    class="navlink group text-left sm:hidden"
                                    aria-label="Quick Actions">
                                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                     class="navicon">
                                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                                </svg>
                                <span>Quick Actions</span>
                            </button>
                            
                            <!-- Chat - Only show on mobile for authenticated users -->
                            <button type="button" id="mobileChatToggle"
                                    sec:authorize="isAuthenticated()"
                                    class="navlink group text-left sm:hidden"
                                    aria-label="Chat">
                                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                     class="navicon">
                                    <path d="M21 15a4 4 0 0 1-4 4H7l-4 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z" />
                                </svg>
                                <span>Chat</span>
                            </button>
                        </div>
                        <div class="pt-2 mt-2 border-t border-slate-200 dark:border-slate-800">
                            <div class="authsurface w-full justify-center">
                                <div th:replace="~{fragments/username-logout :: usernameLogout}"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Toggle behaviour -->
    <script th:inline="javascript">
        (function () {
            const button = document.getElementById('siteNavButton');
            const menu = document.getElementById('siteNavMenu');
            if (!button || !menu) return;

            const setOpen = (open) => {
                menu.classList.toggle('hidden', !open);
                button.setAttribute('aria-expanded', open ? 'true' : 'false');
            };

            const isOpen = () => button.getAttribute('aria-expanded') === 'true';

            setOpen(false);

            button.addEventListener('click', () => setOpen(!isOpen()));

            const mobileNav = menu.querySelector('[data-mobile-nav]');
            if (mobileNav) {
                mobileNav.addEventListener('click', (e) => {
                    if (e.target.closest('a')) setOpen(false);
                });
            }

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isOpen()) setOpen(false);
            });
            
            // Mobile Quick Actions toggle
            const mobileQuickActionsToggle = document.getElementById('mobileQuickActionsToggle');
            if (mobileQuickActionsToggle) {
                mobileQuickActionsToggle.addEventListener('click', () => {
                    const quickActionsToggle = document.getElementById('quickActionsToggle');
                    if (quickActionsToggle) {
                        quickActionsToggle.click();
                        setOpen(false); // Close mobile menu
                    }
                });
            }
            
            // Mobile Chat toggle
            const mobileChatToggle = document.getElementById('mobileChatToggle');
            if (mobileChatToggle) {
                mobileChatToggle.addEventListener('click', () => {
                    const chatFab = document.getElementById('chatFab');
                    if (chatFab) {
                        chatFab.click();
                        setOpen(false); // Close mobile menu
                    }
                });
            }
        })();
    </script>
</header>
