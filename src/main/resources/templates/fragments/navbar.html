<!-- fragments/navbar.html -->
<th:block xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
          th:fragment="navLinks">

    <th:block sec:authorize="!isAuthenticated()">
        <a th:href="@{/}"
           class="navlink group"
           th:classappend="${pageTitle != null and pageTitle.contains('Home')} ? ' navlink-active' : ''">
            <span th:text="#{nav.home}">Home</span>
        </a>

        <a th:href="@{/about}"
           class="navlink group"
           th:classappend="${pageTitle != null and pageTitle.contains('About')} ? ' navlink-active' : ''">
            <span th:text="#{nav.about}">About</span>
        </a>

        <a th:href="@{/pricing}"
           class="navlink group"
           th:classappend="${pageTitle != null and pageTitle.contains('Pricing')} ? ' navlink-active' : ''">
            <span th:text="#{nav.pricing}">Pricing</span>
        </a>

        <a th:href="@{/explore}"
           class="navlink group"
           th:classappend="${pageTitle != null and pageTitle.contains('Explore')} ? ' navlink-active' : ''">
            <span th:text="#{nav.trainers}">Trainers</span>
        </a>

        <a th:href="@{/login}"
           class="navlink group">
            <span th:text="#{nav.login}">Login</span>
        </a>
    </th:block>

    <th:block sec:authorize="isAuthenticated()">

    <!-- Home -->
    <a th:href="@{/home}"
       class="navlink group"
       th:classappend="${pageTitle != null and pageTitle.contains('Home')} ? ' navlink-active' : ''">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="navicon"
             th:classappend="${pageTitle != null and pageTitle.contains('Home')} ? ' navicon-active' : ''">
            <path d="M3 10.5 12 3l9 7.5" />
            <path d="M5 10v10h14V10" />
            <path d="M9 20v-6h6v6" />
        </svg>
        <span>Home</span>
    </a>

    <!-- Health -->
    <a th:href="@{/health-record}"
       class="navlink group"
       th:classappend="${pageTitle != null and pageTitle.contains('Health')} ? ' navlink-active' : ''">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="navicon"
             th:classappend="${pageTitle != null and pageTitle.contains('Health')} ? ' navicon-active' : ''">
            <path d="M3 3v18h18" />
            <path d="M7 14l4-4 4 3 5-7" />
        </svg>
        <span th:text="#{nav.health}">Health</span>
    </a>

    <!-- Calendar -->
    <a th:href="@{/calendar}"
       class="navlink group"
       th:classappend="${pageTitle != null and pageTitle.contains('Calendar')} ? ' navlink-active' : ''">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="navicon"
             th:classappend="${pageTitle != null and pageTitle.contains('Calendar')} ? ' navicon-active' : ''">
            <path d="M8 2v4M16 2v4" />
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M3 10h18" />
        </svg>
        <span th:text="#{nav.calendar}">Calendar</span>
    </a>

    <!-- Workouts -->
    <a th:href="@{/workout}"
       class="navlink group"
       th:classappend="${pageTitle != null and (pageTitle.contains('Schedule') or pageTitle.contains('Workout') or pageTitle.contains('Workouts'))} ? ' navlink-active' : ''">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="navicon"
             th:classappend="${pageTitle != null and (pageTitle.contains('Schedule') or pageTitle.contains('Workout') or pageTitle.contains('Workouts'))} ? ' navicon-active' : ''">
            <path d="M6 7h2v10H6" />
            <path d="M16 7h2v10h-2" />
            <path d="M8 9h8" />
            <path d="M8 15h8" />
            <path d="M4 10v4" />
            <path d="M20 10v4" />
        </svg>
        <span th:text="#{nav.workouts}">Workouts</span>
    </a>

    <!-- Training Vault -->
    <a th:href="@{/vault}"
       class="navlink group"
       th:classappend="${pageTitle != null and pageTitle.contains('Vault')} ? ' navlink-active' : ''">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="navicon"
             th:classappend="${pageTitle != null and pageTitle.contains('Vault')} ? ' navicon-active' : ''">
            <path d="M4 4h16v16H4z" />
            <path d="M8 8h8" />
            <path d="M8 12h8" />
            <path d="M8 16h6" />
        </svg>
        <span th:text="#{nav.trainingVault}">Training Vault</span>
    </a>

    <!-- Trainer: Requests / Active Clients -->
    <th:block sec:authorize="hasRole('TRAINER')">
        <a th:href="@{/trainer/library}"
           class="navlink group"
           th:classappend="${pageTitle != null and pageTitle.contains('Library')} ? ' navlink-active' : ''">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 class="navicon"
                 th:classappend="${pageTitle != null and pageTitle.contains('Library')} ? ' navicon-active' : ''">
                <path d="M4 19h16" />
                <path d="M4 5h16" />
                <path d="M4 5v14" />
                <path d="M20 5v14" />
                <path d="M8 9h8" />
                <path d="M8 13h8" />
            </svg>
            <span th:text="#{nav.trainerLibrary}">Trainer Library</span>
        </a>

        <a th:href="@{/trainer/clients}"
           class="navlink group"
           th:classappend="${pageTitle != null and pageTitle.contains('Trainer Clients')} ? ' navlink-active' : ''">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 class="navicon"
                 th:classappend="${pageTitle != null and pageTitle.contains('Trainer Clients')} ? ' navicon-active' : ''">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="8.5" cy="7" r="4" />
                <path d="M20 8v6" />
                <path d="M23 11h-6" />
            </svg>
            <span>Clients</span>
        </a>

        <a th:href="@{/trainer/messages}"
           class="navlink group"
           th:classappend="${pageTitle != null and pageTitle.contains('Messages')} ? ' navlink-active' : ''">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 class="navicon"
                 th:classappend="${pageTitle != null and pageTitle.contains('Messages')} ? ' navicon-active' : ''">
                <path d="M21 15a4 4 0 0 1-4 4H7l-4 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z" />
            </svg>
            <span th:text="#{nav.inbox}">Inbox</span>
        </a>
    </th:block>

    <!-- Client: My Trainer -->
    <th:block sec:authorize="hasAnyRole('CLIENT','USER') and !hasAnyRole('TRAINER','GYM_ADMIN','PLATFORM_ADMIN','SUPER_ADMIN')">
        <a th:href="@{/client/messages}"
           class="navlink group"
           th:classappend="${pageTitle != null and pageTitle.contains('Messages')} ? ' navlink-active' : ''">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 class="navicon"
                 th:classappend="${pageTitle != null and pageTitle.contains('Messages')} ? ' navicon-active' : ''">
                <path d="M21 15a4 4 0 0 1-4 4H7l-4 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z" />
            </svg>
            <span th:text="#{nav.inbox}">Inbox</span>
        </a>

        <a th:href="@{/client/assigned-plan}"
           class="navlink group"
           th:classappend="${pageTitle != null and pageTitle.contains('Assigned Plan')} ? ' navlink-active' : ''">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 class="navicon"
                 th:classappend="${pageTitle != null and pageTitle.contains('Assigned Plan')} ? ' navicon-active' : ''">
                <path d="M4 4h16v16H4z" />
                <path d="M8 8h8" />
                <path d="M8 12h8" />
                <path d="M8 16h6" />
            </svg>
            <span th:text="#{nav.assignedPlan}">Assigned Plan</span>
        </a>

        <a th:href="@{/client/trainers}"
           class="navlink group"
           th:classappend="${pageTitle != null and pageTitle.contains('Trainers')} ? ' navlink-active' : ''">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 class="navicon"
                 th:classappend="${pageTitle != null and pageTitle.contains('Trainers')} ? ' navicon-active' : ''">
                <path d="M20 21a8 8 0 0 0-16 0" />
                <circle cx="12" cy="8" r="4" />
            </svg>
            <span>Trainers</span>
        </a>
    </th:block>

    <!-- Profile / Dashboard (role-based) -->
    <th:block sec:authorize="hasAnyRole('TRAINER','GYM_ADMIN','PLATFORM_ADMIN','SUPER_ADMIN')">
        <a th:href="@{/dashboard}"
           class="navlink group"
           th:classappend="${pageTitle != null and pageTitle.contains('Dashboard')} ? ' navlink-active' : ''">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 class="navicon"
                 th:classappend="${pageTitle != null and pageTitle.contains('Dashboard')} ? ' navicon-active' : ''">
                <path d="M3 3h7v7H3z" />
                <path d="M14 3h7v7h-7z" />
                <path d="M14 14h7v7h-7z" />
                <path d="M3 14h7v7H3z" />
            </svg>
            <span th:text="#{nav.dashboard}">Dashboard</span>
        </a>
    </th:block>

    <th:block sec:authorize="!hasAnyRole('TRAINER','GYM_ADMIN','PLATFORM_ADMIN','SUPER_ADMIN')">
        <a th:href="@{/profile}"
           class="navlink group"
           th:classappend="${pageTitle != null and pageTitle.contains('Profile')} ? ' navlink-active' : ''">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 class="navicon"
                 th:classappend="${pageTitle != null and pageTitle.contains('Profile')} ? ' navicon-active' : ''">
                <path d="M20 21a8 8 0 0 0-16 0" />
                <circle cx="12" cy="8" r="4" />
            </svg>
            <span th:text="#{nav.profile}">Profile</span>
        </a>
    </th:block>

    <a th:if="${user != null and (!user.emailVerified or (user.phoneNumber != null and !user.phoneVerified))}"
       th:href="@{/profile}"
       class="navlink group"
       th:attr="aria-label=#{nav.accountIncomplete}">
        <span class="inline-flex items-center gap-2 text-xs font-semibold text-amber-700 dark:text-amber-300">
            <span aria-hidden="true">⚠️</span>
            <span th:text="#{nav.accountIncomplete}">Account incomplete</span>
        </span>
    </a>

    <!-- Leaderboard -->
    <a th:href="@{/levels}"
       class="navlink group"
       th:classappend="${pageTitle != null and (pageTitle.contains('Level') or pageTitle.contains('Leaderboard'))} ? ' navlink-active' : ''">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="navicon"
             th:classappend="${pageTitle != null and (pageTitle.contains('Level') or pageTitle.contains('Leaderboard'))} ? ' navicon-active' : ''">
            <path d="M8 21h8" />
            <path d="M12 17v4" />
            <path d="M7 4h10" />
            <path d="M17 4v5a5 5 0 0 1-10 0V4" />
            <path d="M7 6H5a2 2 0 0 0 2 2" />
            <path d="M17 6h2a2 2 0 0 1-2 2" />
        </svg>
        <span th:text="#{nav.leaderboard}">Leaderboard</span>
    </a>
    </th:block>
</th:block>

<header xmlns:th="http://www.thymeleaf.org"
        th:fragment="navbar"
    class="navheader">
    <!-- Accent strip -->
    <div class="accentstrip"></div>
    <div class="mx-auto w-full px-4 sm:px-6 lg:px-8">
        <div class="flex h-20 items-center gap-4">

            <!-- Brand (left) -->
            <div class="flex items-center shrink-0">
                <a th:href="@{/}"
                   class="flex items-center gap-2 rounded-xl focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-900/20 dark:focus-visible:ring-slate-200/30">
                    <img alt="Healthy Habits Logo" th:src="@{/img/logo.png}" class="h-12 w-auto shrink-0"/>
                    <span class="hidden text-sm font-extrabold tracking-wide sm:inline">One To One</span>
                </a>
            </div>

            <!-- Desktop nav (center) -->
            <div class="hidden nav:flex flex-1 min-w-0 justify-center">
                <nav aria-label="Primary navigation">
                    <div class="navsurface max-w-full min-w-0 overflow-x-auto">
                        <div class="flex items-center flex-nowrap whitespace-nowrap gap-1">
                            <th:block th:replace="~{fragments/navbar :: navLinks}"></th:block>
                        </div>
                    </div>
                </nav>
            </div>

            <!-- Right (auth + toggle) -->
            <div class="ml-auto flex items-center gap-3 shrink-0">
                <!-- Desktop-only status pill (presentational) -->
                <div class="hidden nav:inline-flex h-9 items-center gap-2 rounded-full border border-slate-200 bg-white/70 px-3 text-xs font-semibold text-slate-700 shadow-sm
                            dark:border-slate-800 dark:bg-slate-900/40 dark:text-slate-300">
                    <span class="h-2 w-2 rounded-full bg-emerald-400"></span>
                    <span>Status: Online</span>
                </div>

                <div class="hidden nav:block">
                    <div class="authsurface">
                        <div th:replace="~{fragments/username-logout :: usernameLogout}"></div>
                    </div>
                </div>

                <!-- Mobile toggle -->
                <button id="siteNavButton" type="button"
                        class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-slate-50 text-slate-900 shadow-sm transition
                               hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-900/20
                           nav:hidden dark:border-slate-800 dark:bg-slate-900/40 dark:text-slate-100 dark:hover:bg-slate-800/60 dark:focus-visible:ring-slate-200/30"
                        aria-controls="siteNavMenu"
                        aria-expanded="false"
                        aria-label="Toggle navigation">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
                        <path d="M4 6h16" />
                        <path d="M4 12h16" />
                        <path d="M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile menu -->
    <nav aria-label="Primary navigation" id="siteNavMenu" class="hidden nav:hidden">
        <div class="border-t border-slate-200 bg-gradient-to-r from-slate-50 via-white to-slate-50 dark:border-slate-800 dark:bg-slate-950">
            <div class="mx-auto w-full px-4 py-4 sm:px-6 lg:px-8">
                <div class="overflow-hidden rounded-2xl shadow-lg ring-1 ring-black/5 dark:ring-white/10">
                    <div class="accentstrip"></div>
                    <div class="navsurface shadow-none" data-mobile-nav>
                        <div class="flex flex-wrap justify-center gap-2" data-mobile-links>
                            <th:block th:replace="~{fragments/navbar :: navLinks}"></th:block>
                        </div>
                        <div class="pt-2">
                            <div class="authsurface w-full justify-center">
                                <div th:replace="~{fragments/username-logout :: usernameLogout}"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Toggle behaviour -->
    <script th:inline="javascript">
        (function () {
            const button = document.getElementById('siteNavButton');
            const menu = document.getElementById('siteNavMenu');
            if (!button || !menu) return;

            const setOpen = (open) => {
                menu.classList.toggle('hidden', !open);
                button.setAttribute('aria-expanded', open ? 'true' : 'false');
            };

            const isOpen = () => button.getAttribute('aria-expanded') === 'true';

            setOpen(false);

            button.addEventListener('click', () => setOpen(!isOpen()));

            const mobileNav = menu.querySelector('[data-mobile-nav]');
            if (mobileNav) {
                mobileNav.addEventListener('click', (e) => {
                    if (e.target.closest('a')) setOpen(false);
                });
            }

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isOpen()) setOpen(false);
            });
        })();
    </script>
</header>
