<th:block xmlns:th="http://www.thymeleaf.org">
    <span th:fragment="goalChip(goal)"
          class="inline-flex items-center gap-1 rounded-full border border-slate-200 bg-slate-50 px-2 py-0.5 text-[11px] font-semibold text-slate-700 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200">
        <span th:text="${goal.title}">Goal</span>
        <span class="text-[10px] uppercase tracking-wide text-slate-400" th:text="${goal.goalType}">TYPE</span>
    </span>
</th:block>
