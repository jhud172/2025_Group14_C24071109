<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${pageTitle} ?: 'Assigned Plan', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        <div class="rounded-xl bg-white/5 dark:bg-slate-900/40 ring-1 ring-white/10 shadow-sm p-6">
            <div>
                <h1 class="text-xl font-semibold text-slate-900 dark:text-slate-100">Assigned Plan</h1>
                <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">Workouts and schedules assigned by your trainer.</p>
            </div>

            <div class="mt-8">
                <h2 class="text-sm font-semibold text-slate-900 dark:text-slate-100">Workouts</h2>
                <div th:if="${#lists.isEmpty(assignedWorkouts)}" class="mt-3 text-sm text-slate-600 dark:text-slate-300">No workouts assigned.</div>
                <div th:if="${!#lists.isEmpty(assignedWorkouts)}" class="mt-3 space-y-4">
                    <div th:each="aw : ${assignedWorkouts}" class="rounded-xl border border-white/10 bg-white/5 p-5">
                        <div class="flex flex-wrap items-start justify-between gap-3">
                            <div>
                                <div class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="${aw.workoutTemplate.name}">Workout</div>
                                <div class="mt-1 text-xs text-slate-500" th:text="${aw.assignedAt != null ? #temporals.format(aw.assignedAt, 'dd MMM yyyy') : ''}"></div>
                                <p class="mt-2 text-xs text-slate-600 dark:text-slate-300" th:text="${aw.trainerNotes}"></p>
                            </div>
                            <span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs ring-1 ring-white/10"
                                  th:classappend="${aw.completed} ? ' bg-emerald-400/10 text-emerald-300' : ' bg-slate-400/10 text-slate-300'"
                                  th:text="${aw.completed} ? 'DONE' : 'PENDING'"></span>
                        </div>

                        <form class="mt-4 space-y-3" method="post" th:action="@{/client/plan/workouts/{id}(id=${aw.id})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="grid gap-3 md:grid-cols-2">
                                <div>
                                    <label class="text-xs font-semibold text-slate-500">Notes</label>
                                    <textarea name="clientNotes" rows="3" class="mt-1 w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100" th:text="${aw.clientNotes}"></textarea>
                                </div>
                                <div>
                                    <label class="text-xs font-semibold text-slate-500">Feedback</label>
                                    <textarea name="clientFeedback" rows="3" class="mt-1 w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100" th:text="${aw.clientFeedback}"></textarea>
                                </div>
                            </div>
                            <label class="inline-flex items-center gap-2 text-sm text-slate-600 dark:text-slate-300">
                                <input type="checkbox" name="completed" th:checked="${aw.completed}" class="h-4 w-4 rounded border-white/20">
                                Mark workout done
                            </label>
                            <button type="submit" class="inline-flex items-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">Save</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="mt-10">
                <h2 class="text-sm font-semibold text-slate-900 dark:text-slate-100">Schedules</h2>
                <div th:if="${#lists.isEmpty(assignedSchedules)}" class="mt-3 text-sm text-slate-600 dark:text-slate-300">No schedules assigned.</div>
                <div th:if="${!#lists.isEmpty(assignedSchedules)}" class="mt-3 space-y-4">
                    <div th:each="as : ${assignedSchedules}" class="rounded-xl border border-white/10 bg-white/5 p-5">
                        <div class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="${as.schedule.name}">Schedule</div>
                        <div class="mt-1 text-xs text-slate-500" th:text="${as.assignedAt != null ? #temporals.format(as.assignedAt, 'dd MMM yyyy') : ''}"></div>
                        <p class="mt-2 text-xs text-slate-600 dark:text-slate-300" th:text="${as.trainerNotes}"></p>
                        <a class="mt-3 inline-flex items-center rounded-xl border border-white/20 bg-white/5 px-3 py-2 text-xs font-semibold text-slate-900 dark:text-white hover:bg-slate-800/70"
                           th:href="@{/schedules/{id}(id=${as.schedule.id})}">View schedule</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</th:block>
