<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Chat', null, ~{::content}, ~{::scripts})}">
    <div th:fragment="content">
        <div class="relative overflow-hidden" id="chatV2Root" th:attr="data-thread-id=${thread.id}">
            <div class="pointer-events-none absolute inset-0 bg-gradient-to-br from-violet-500/10 via-sky-400/10 to-indigo-500/10"></div>
            <div class="relative mx-auto w-full max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
                <div class="grid gap-6 lg:grid-cols-[280px_minmax(0,1fr)_260px]">
                    <th:block th:replace="~{fragments/chat/sidebar :: chatSidebar(${folders}, ${threads}, ${icons}, ${activeFolderId}, ${activeThreadId})}"></th:block>

                    <section class="rounded-2xl border border-slate-200/70 bg-white/90 shadow-lg backdrop-blur dark:border-slate-800/60 dark:bg-slate-950/80">
                        <header class="flex items-start justify-between border-b border-slate-200/70 px-6 py-4 dark:border-slate-800/60">
                            <div>
                                <div class="flex items-center gap-3">
                                    <div class="flex h-9 w-9 items-center justify-center rounded-xl text-lg"
                                         th:style="'background-color:' + ${thread.colorHex} + '; color: white'"
                                         th:text="${icons[thread.iconKey]}">💬</div>
                                    <div>
                                        <h1 class="text-lg font-semibold text-slate-900 dark:text-slate-100" th:text="${thread.title}">Chat</h1>
                                        <span id="chatInstructionsBadge" th:classappend="${!hasCustomInstructions} ? ' hidden' : ''" class="mt-1 inline-flex items-center rounded-full bg-emerald-500/10 px-2 py-0.5 text-[11px] font-semibold text-emerald-700">Active instructions</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button id="chatInstructionsToggle" class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-sm hover:bg-slate-50">Instructions</button>
                                <button id="chatSettingsToggle" class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-sm hover:bg-slate-50">⚙ Settings</button>
                            </div>
                        </header>

                        <div class="flex min-h-[60vh] flex-col">
                            <div id="chatMessages" class="flex-1 space-y-4 overflow-auto px-6 py-6 text-sm">
                                <div th:if="${#lists.isEmpty(messages)}" class="rounded-2xl border border-slate-200/70 bg-slate-50 px-4 py-3 text-slate-700 shadow-sm">Start your first message…</div>
                                <div th:each="msg : ${messages}" th:class="${msg.role.name() == 'USER'} ? 'flex justify-end' : 'flex justify-start'">
                                    <div class="max-w-[80%] whitespace-pre-wrap rounded-2xl border px-3 py-2 shadow-sm"
                                         th:classappend="${msg.role.name() == 'USER'} ? ' border-slate-900 bg-slate-900 text-white' : ' border-slate-200 bg-slate-50 text-slate-900'"
                                         th:text="${msg.content}">Message</div>
                                </div>
                            </div>

                            <div class="border-t border-slate-200/70 px-6 py-4">
                                <div class="relative">
                                    <textarea id="chatComposer" rows="3" placeholder="Type / for commands" class="w-full resize-none rounded-2xl border border-slate-200 bg-white/90 px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10"></textarea>
                                    <div id="chatCommandMenu" class="absolute bottom-full left-0 mb-2 hidden w-full rounded-2xl border border-slate-200 bg-white p-2 shadow-lg"></div>
                                </div>
                                <div class="mt-3 flex items-center justify-between gap-2">
                                    <div class="flex items-center gap-2 text-xs text-slate-400">
                                        <span class="rounded-full bg-slate-100 px-2 py-1">/task add</span>
                                        <span class="rounded-full bg-slate-100 px-2 py-1">/note add</span>
                                    </div>
                                    <button id="chatSendBtn" class="inline-flex items-center gap-2 rounded-2xl bg-slate-900 px-6 py-2 text-sm font-semibold text-white shadow-lg hover:bg-slate-800">Send ✨</button>
                                </div>
                            </div>
                        </div>

                        <div id="chatSettingsDrawer" class="hidden border-t border-slate-200/70 bg-slate-50 px-6 py-4">
                            <div class="text-sm font-semibold text-slate-900">Chat settings</div>
                            <div class="mt-3 grid gap-3 sm:grid-cols-2">
                                <input id="chatTitleInput" class="rounded-xl border border-slate-200 px-3 py-2 text-sm" th:value="${thread.title}" />
                                <input id="chatColorInput" class="rounded-xl border border-slate-200 px-3 py-2 text-sm" th:value="${thread.colorHex}" />
                                <select id="chatIconInput" class="rounded-xl border border-slate-200 px-3 py-2 text-sm">
                                    <option th:each="entry : ${icons}" th:value="${entry.key}" th:text="${entry.value}" th:selected="${entry.key == thread.iconKey}"></option>
                                </select>
                                <select id="chatFolderMove" class="rounded-xl border border-slate-200 px-3 py-2 text-sm">
                                    <option value="" th:selected="${thread.folder == null}">No folder</option>
                                    <option th:each="folder : ${folders}" th:value="${folder.id}" th:text="${folder.name}" th:selected="${thread.folder != null and folder.id == thread.folder.id}"></option>
                                </select>
                                <div class="flex items-center gap-2 text-xs">
                                    <label class="flex items-center gap-2"><input id="chatPinnedInput" type="checkbox" th:checked="${thread.pinned}" />Pinned</label>
                                    <label class="flex items-center gap-2"><input id="chatArchivedInput" type="checkbox" th:checked="${thread.archived}" />Archived</label>
                                </div>
                            </div>
                            <div class="mt-3 flex items-center gap-2">
                                <button id="chatInstructionsReset" class="rounded-xl border border-slate-200 px-3 py-2 text-xs font-semibold">Reset to default</button>
                                <button id="chatSettingsSave" class="rounded-xl bg-slate-900 px-3 py-2 text-xs font-semibold text-white">Save settings</button>
                            </div>
                        </div>

                        <div id="chatInstructionsDrawer" class="hidden border-t border-slate-200/70 bg-white px-6 py-4">
                            <div class="flex items-center justify-between">
                                <div>
                                    <div class="text-sm font-semibold text-slate-900">Coach modes</div>
                                    <p class="mt-1 text-xs text-slate-500">Add guidance that shapes how Coach Bot responds in this thread.</p>
                                </div>
                            </div>

                            <div class="mt-3 flex flex-wrap gap-2">
                                <button type="button" class="chat-preset rounded-full border border-slate-200 bg-slate-50 px-3 py-1 text-xs font-semibold text-slate-700" data-preset="fatloss">Fat loss</button>
                                <button type="button" class="chat-preset rounded-full border border-slate-200 bg-slate-50 px-3 py-1 text-xs font-semibold text-slate-700" data-preset="strength">Strength</button>
                                <button type="button" class="chat-preset rounded-full border border-slate-200 bg-slate-50 px-3 py-1 text-xs font-semibold text-slate-700" data-preset="rehab">Rehab</button>
                                <button type="button" class="chat-preset rounded-full border border-slate-200 bg-slate-50 px-3 py-1 text-xs font-semibold text-slate-700" data-preset="motivation">Motivation</button>
                            </div>

                            <textarea id="chatInstructionsInput" rows="5" class="mt-3 w-full rounded-2xl border border-slate-200 px-3 py-2 text-sm" th:text="${thread.customInstructions}" placeholder="Example: Keep responses short. Focus on recovery, pain-free movement, and safe progressions."></textarea>

                            <div class="mt-3 flex flex-wrap items-center gap-2">
                                <button id="chatInstructionsResetBtn" class="rounded-xl border border-slate-200 px-3 py-2 text-xs font-semibold">Clear</button>
                                <button id="chatInstructionsSave" class="rounded-xl bg-slate-900 px-3 py-2 text-xs font-semibold text-white">Save instructions</button>
                            </div>
                        </div>
                    </section>

                    <aside class="rounded-2xl border border-slate-200/70 bg-white/80 p-4 shadow-sm backdrop-blur dark:border-slate-800/60 dark:bg-slate-950/70">
                        <div class="text-sm font-semibold text-slate-900 dark:text-slate-100">Context + Actions</div>
                        <div class="mt-4 space-y-3 text-xs">
                            <div class="rounded-xl border border-slate-200 bg-white/90 px-3 py-2 shadow-sm">
                                <div class="text-[11px] uppercase tracking-widest text-slate-400">Next task</div>
                                <div class="mt-1 text-sm text-slate-700" th:text="${nextTask != null ? nextTask.title : 'No upcoming tasks'}">No upcoming tasks</div>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div class="rounded-xl border border-slate-200 bg-white/90 px-3 py-2 text-center shadow-sm">
                                    <div class="text-[11px] uppercase text-slate-400">Overdue</div>
                                    <div class="text-base font-semibold" th:text="${overdueCount}">0</div>
                                </div>
                                <div class="rounded-xl border border-slate-200 bg-white/90 px-3 py-2 text-center shadow-sm">
                                    <div class="text-[11px] uppercase text-slate-400">Done</div>
                                    <div class="text-base font-semibold" th:text="${completedToday}">0</div>
                                </div>
                            </div>
                            <div th:if="${levelProgress != null}" class="rounded-xl border border-slate-200 bg-white/90 px-3 py-2 shadow-sm">
                                <div class="text-[11px] uppercase text-slate-400">Level</div>
                                <div class="text-sm font-semibold" th:text="${levelProgress.level}">1</div>
                                <div class="text-xs text-slate-500" th:text="${levelProgress.points} + ' pts'">0 pts</div>
                            </div>
                            <div class="space-y-2">
                                <button id="quickAddTask" class="inline-flex w-full items-center justify-center rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-sm hover:bg-slate-50">Add task</button>
                                <a href="/calendar" class="inline-flex w-full items-center justify-center rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-sm hover:bg-slate-50">View calendar</a>
                                <a href="/notes" class="inline-flex w-full items-center justify-center rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-sm hover:bg-slate-50">Open notes</a>
                                <a href="/schedule" class="inline-flex w-full items-center justify-center rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-sm hover:bg-slate-50">View schedules</a>
                            </div>
                        </div>
                    </aside>
                </div>
            </div>
        </div>

        <input type="hidden" id="chat_csrf" th:value="${_csrf != null ? _csrf.token : ''}" />
        <input type="hidden" id="chat_csrf_header" th:value="${_csrf != null ? _csrf.headerName : ''}" />
    </div>

    <th:block th:fragment="scripts">
        <script src="/js/chat/chat-v2.js" defer></script>
    </th:block>
</th:block>
