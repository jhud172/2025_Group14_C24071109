<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Logout', null, ~{::content}, null)}">

    <div th:fragment="content">
        <div class="mx-auto w-full max-w-2xl px-4 py-10 sm:px-6 lg:px-8">
            <div class="rounded-3xl border border-slate-200 bg-white p-6 sm:p-8">
                <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Confirm logout</h1>
                <p class="mt-1 text-sm text-slate-600">You can sign out now, or go back if you changed your mind.</p>

                <div class="mt-6">
                    <div th:replace="~{universal-fragments/layout/username-logout :: usernameLogout}"></div>
                </div>
            </div>
        </div>
    </div>

</th:block>
