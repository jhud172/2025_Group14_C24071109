<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Email Verification', ~{::styles}, ~{::content}, ~{::pageScripts})}">

    <div th:fragment="styles">
        <link rel="stylesheet" th:href="@{/css/components/account/verification.css(v='20260315b')}">
    </div>

    <div th:fragment="content">
        <div class="verify-shell">
            <div class="verify-card">
                <div class="verify-hero">
                    <div class="verify-icon-wrap" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" class="verify-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9 12.75 11.25 15 15 9.75m6 2.25a9 9 0 11-18 0 9 9 0 0118 0Z" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="verify-title" th:text="#{verify.email.title}">Email verification</h1>
                        <p class="verify-copy" th:text="#{verify.email.subtitle}">Confirm your email so you can access all features.</p>
                    </div>
                </div>

                <div th:if="${verificationSuccess}" class="verify-alert verify-alert--success" th:text="${verificationSuccess}">
                    Email verified successfully.
                </div>

                <div th:if="${verificationError}" class="verify-alert verify-alert--error" th:text="${verificationError}">
                    Verification token invalid.
                </div>

                <div class="verify-actions">
                    <a th:href="@{/signup}" class="verify-btn-ghost" th:text="#{verify.email.signup}">
                        Back to sign up
                    </a>
                    <a th:href="@{/login}" class="verify-btn-secondary" th:text="#{verify.email.login}">
                        Go to login
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div th:fragment="pageScripts"></div>
</th:block>
