<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Gym Sign Up', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-3xl px-4 py-10 sm:px-6 lg:px-8">
        <div class="rounded-3xl border border-slate-200 bg-white p-6 sm:p-8">
            <div class="mb-6">
                <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Create your gym account</h1>
                <p class="mt-1 text-sm text-slate-600">Set up your gym profile and admin access.</p>
            </div>

            <form th:action="@{/signup/gym}" th:object="${signupForm}" method="post" class="space-y-5">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div th:if="${#fields.hasAnyErrors()}" class="rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800" role="alert">
                    Please correct the highlighted fields below.
                </div>

                <div>
                    <label for="gymName" class="block text-sm font-medium text-slate-800">Gym name *</label>
                    <input
                        type="text"
                        id="gymName"
                        th:field="*{gymName}"
                        required
                        class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/20"
                        th:classappend="${#fields.hasErrors('gymName')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''" />
                    <div th:if="${#fields.hasErrors('gymName')}" class="mt-1 text-sm text-rose-700">
                        <span th:errors="*{gymName}"></span>
                    </div>
                </div>

                <div>
                    <label for="contactName" class="block text-sm font-medium text-slate-800">Primary contact name *</label>
                    <input
                        type="text"
                        id="contactName"
                        th:field="*{contactName}"
                        required
                        autocomplete="name"
                        class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/20"
                        th:classappend="${#fields.hasErrors('contactName')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''" />
                    <div th:if="${#fields.hasErrors('contactName')}" class="mt-1 text-sm text-rose-700">
                        <span th:errors="*{contactName}"></span>
                    </div>
                </div>

                <div>
                    <label for="adminEmail" class="block text-sm font-medium text-slate-800">Admin email *</label>
                    <input
                        type="email"
                        id="adminEmail"
                        th:field="*{adminEmail}"
                        required
                        autocomplete="email"
                        class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/20"
                        th:classappend="${#fields.hasErrors('adminEmail')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''" />
                    <div th:if="${#fields.hasErrors('adminEmail')}" class="mt-1 text-sm text-rose-700">
                        <span th:errors="*{adminEmail}"></span>
                    </div>
                </div>

                <div>
                    <label for="contactPhone" class="block text-sm font-medium text-slate-800">Contact phone *</label>
                    <input
                        type="tel"
                        id="contactPhone"
                        th:field="*{contactPhone}"
                        required
                        autocomplete="tel"
                        class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/20"
                        th:classappend="${#fields.hasErrors('contactPhone')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''" />
                    <div th:if="${#fields.hasErrors('contactPhone')}" class="mt-1 text-sm text-rose-700">
                        <span th:errors="*{contactPhone}"></span>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label for="address" class="block text-sm font-medium text-slate-800">Street address *</label>
                        <input
                            type="text"
                            id="address"
                            th:field="*{address}"
                            required
                            autocomplete="street-address"
                            class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/20"
                            th:classappend="${#fields.hasErrors('address')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''" />
                        <div th:if="${#fields.hasErrors('address')}" class="mt-1 text-sm text-rose-700">
                            <span th:errors="*{address}"></span>
                        </div>
                    </div>

                    <div>
                        <label for="city" class="block text-sm font-medium text-slate-800">City *</label>
                        <input
                            type="text"
                            id="city"
                            th:field="*{city}"
                            required
                            autocomplete="address-level2"
                            class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/20"
                            th:classappend="${#fields.hasErrors('city')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''" />
                        <div th:if="${#fields.hasErrors('city')}" class="mt-1 text-sm text-rose-700">
                            <span th:errors="*{city}"></span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-800">Password *</label>
                        <input
                            type="password"
                            id="password"
                            th:field="*{password}"
                            required
                            autocomplete="new-password"
                            class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/20"
                            th:classappend="${#fields.hasErrors('password')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''" />
                        <p class="mt-1 text-sm text-slate-600">Min 8, with upper, lower, number, and special character.</p>
                        <div th:if="${#fields.hasErrors('password')}" class="mt-1 text-sm text-rose-700">
                            <span th:errors="*{password}"></span>
                        </div>
                    </div>

                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-slate-800">Confirm Password *</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            th:field="*{confirmPassword}"
                            required
                            autocomplete="new-password"
                            class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/20"
                            th:classappend="${#fields.hasErrors('confirmPassword')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''" />
                        <div th:if="${#fields.hasErrors('confirmPassword')}" class="mt-1 text-sm text-rose-700">
                            <span th:errors="*{confirmPassword}"></span>
                        </div>
                    </div>
                </div>

                <button
                    type="submit"
                    class="inline-flex w-full min-h-11 items-center justify-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-900/30 focus-visible:ring-offset-2 focus-visible:ring-offset-white">
                    Sign up as gym
                </button>

                <p class="text-center text-sm text-slate-600">
                    Already have an account?
                    <a th:href="@{/login}" class="font-semibold text-slate-900 underline underline-offset-4 hover:text-slate-700">Log in</a>
                </p>
            </form>
        </div>
    </div>

</th:block>
