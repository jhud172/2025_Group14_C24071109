<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${workoutSession.nameSnapshot}, null, ~{::content}, ~{::pageScripts})}">

<div th:fragment="content">
    <div class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 lg:px-8">
    <div class="flex items-start justify-between gap-4 mb-6">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900" th:text="${workoutSession.nameSnapshot}">Workout</h1>
            <div class="text-sm text-slate-600" th:text="${workoutSession.date}">2026-01-01</div>
        </div>
        <div class="flex items-center gap-2">
            <a th:href="@{'/calendar/day/' + ${workoutSession.date}}" class="inline-flex items-center justify-center rounded-md border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900/10">Back to day</a>
            <span th:if="${workoutSession.completed}" class="rounded-md bg-emerald-100 px-3 py-2 text-sm font-semibold text-emerald-800">Completed</span>
            <span th:if="${!workoutSession.completed}" class="rounded-md bg-amber-100 px-3 py-2 text-sm font-semibold text-amber-800">In progress</span>
        </div>
    </div>

    <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
        <div class="px-5 py-4 border-b border-slate-200">
            <h2 class="text-lg font-semibold text-slate-900">Exercises</h2>
            <p class="text-sm text-slate-600">Tap an exercise to log sets.</p>
        </div>

        <div class="divide-y divide-slate-200">
            <a th:each="es : ${exerciseSessions}"
               th:href="@{'/exercise-session/' + ${es.id}}"
               class="flex items-center justify-between px-5 py-4 hover:bg-slate-50 transition">
                <div class="min-w-0">
                    <div class="font-semibold text-slate-900" th:text="${es.exercise.name}">Exercise name</div>
                    <div class="text-xs text-slate-500" th:text="'Sets: ' + ${#lists.size(es.setLogs)}">Sets: 0</div>
                </div>
                <div class="flex items-center gap-2">
                    <span th:if="${exerciseStateById[es.id] == 'NOT_STARTED'}" class="rounded-md bg-slate-100 px-2 py-1 text-xs font-semibold text-slate-700">Not started</span>
                    <span th:if="${exerciseStateById[es.id] == 'IN_PROGRESS'}" class="rounded-md bg-amber-100 px-2 py-1 text-xs font-semibold text-amber-800">In progress</span>
                    <span th:if="${exerciseStateById[es.id] == 'COMPLETED'}" class="rounded-md bg-emerald-100 px-2 py-1 text-xs font-semibold text-emerald-800">Completed</span>
                </div>
            </a>
        </div>
    </div>
    </div>
</div>

<div th:fragment="pageScripts"></div>

</th:block>
