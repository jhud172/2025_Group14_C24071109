<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Dashboard', null, ~{::content}, null)}">

    <div th:fragment="content">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">Client dashboard</h1>
                    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">Your day at a glance.</p>
                </div>
            </div>

            <div class="mt-6 grid gap-4 lg:grid-cols-3">
                <div class="rounded-2xl bg-white dark:bg-slate-900/60 ring-1 ring-slate-200 dark:ring-white/10 shadow-sm p-5">
                    <h2 class="text-sm font-semibold text-slate-700 dark:text-slate-200">Today overview</h2>
                    <div class="mt-4 grid gap-3 text-sm">
                        <div class="flex items-center justify-between text-slate-600 dark:text-slate-300">
                            <span>Tasks due</span>
                            <span class="font-semibold text-slate-900 dark:text-white" th:text="${summary.tasksDueToday}">0</span>
                        </div>
                        <div class="flex items-center justify-between text-slate-600 dark:text-slate-300">
                            <span>Workouts due</span>
                            <span class="font-semibold text-slate-900 dark:text-white" th:text="${summary.workoutsDueToday}">0</span>
                        </div>
                    </div>
                    <div class="mt-4 flex flex-wrap gap-2">
                        <a th:href="@{/calendar/day/{date}(date=${#temporals.format(summary.today, 'yyyy-MM-dd')})}"
                           class="inline-flex items-center gap-2 rounded-lg bg-slate-900 px-3 py-2 text-xs font-semibold text-white hover:bg-slate-800">
                            Quick complete
                        </a>
                        <a th:href="@{/calendar/day/{date}(date=${#temporals.format(summary.today, 'yyyy-MM-dd')})}"
                           class="inline-flex items-center gap-2 rounded-lg border border-slate-200 px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50 dark:border-white/10 dark:text-slate-200 dark:hover:bg-white/5">
                            Add task
                        </a>
                    </div>
                </div>

                <div class="rounded-2xl bg-white dark:bg-slate-900/60 ring-1 ring-slate-200 dark:ring-white/10 shadow-sm p-5">
                    <div class="flex items-center justify-between">
                        <h2 class="text-sm font-semibold text-slate-700 dark:text-slate-200">Mini week view</h2>
                        <a th:href="@{/calendar}" class="text-xs font-semibold text-slate-600 hover:text-slate-900 dark:text-slate-300">Open calendar</a>
                    </div>
                    <div class="mt-4 grid grid-cols-7 gap-2">
                        <div th:each="day : ${summary.week}"
                             class="flex flex-col items-center rounded-xl px-2 py-3 text-xs"
                             th:classappend="${day.today} ? ' bg-slate-900 text-white' : ' bg-slate-50 text-slate-700 dark:bg-white/5 dark:text-slate-200'">
                            <span class="font-semibold" th:text="${day.label}">Mon</span>
                            <span class="text-sm font-bold" th:text="${day.dayNumber}">12</span>
                            <span class="mt-1 text-[10px] opacity-80" th:text="${day.tasksCount + day.workoutsCount}">0</span>
                        </div>
                    </div>
                </div>

                <div class="rounded-2xl bg-white dark:bg-slate-900/60 ring-1 ring-slate-200 dark:ring-white/10 shadow-sm p-5">
                    <h2 class="text-sm font-semibold text-slate-700 dark:text-slate-200">Quick buttons</h2>
                    <div class="mt-4 grid gap-2 text-sm">
                        <a th:href="@{/calendar/day/{date}(date=${#temporals.format(summary.today, 'yyyy-MM-dd')})}"
                           class="inline-flex items-center justify-between rounded-lg border border-slate-200 px-3 py-2 font-semibold text-slate-700 hover:bg-slate-50 dark:border-white/10 dark:text-slate-200 dark:hover:bg-white/5">
                            Add Task
                            <span class="text-xs text-slate-400">Today</span>
                        </a>
                        <a th:href="@{/workout}"
                           class="inline-flex items-center justify-between rounded-lg border border-slate-200 px-3 py-2 font-semibold text-slate-700 hover:bg-slate-50 dark:border-white/10 dark:text-slate-200 dark:hover:bg-white/5">
                            Add Workout
                            <span class="text-xs text-slate-400">Program</span>
                        </a>
                        <a th:href="@{/calendar}"
                           class="inline-flex items-center justify-between rounded-lg border border-slate-200 px-3 py-2 font-semibold text-slate-700 hover:bg-slate-50 dark:border-white/10 dark:text-slate-200 dark:hover:bg-white/5">
                            Open Calendar
                            <span class="text-xs text-slate-400">Week</span>
                        </a>
                        <a th:href="@{/vault}"
                           class="inline-flex items-center justify-between rounded-lg border border-slate-200 px-3 py-2 font-semibold text-slate-700 hover:bg-slate-50 dark:border-white/10 dark:text-slate-200 dark:hover:bg-white/5">
                            Open Vault
                            <span class="text-xs text-slate-400">Notes</span>
                        </a>
                        <a th:href="@{/inbox}"
                           class="inline-flex items-center justify-between rounded-lg border border-slate-200 px-3 py-2 font-semibold text-slate-700 hover:bg-slate-50 dark:border-white/10 dark:text-slate-200 dark:hover:bg-white/5">
                            Message
                            <span class="text-xs text-slate-400">Inbox</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</th:block>
