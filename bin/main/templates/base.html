<!DOCTYPE html>
<html lang="en"
    xmlns:th="http://www.thymeleaf.org"
    th:classappend="${userSettings != null and userSettings.theme != null and userSettings.theme.toString() == 'DARK'} ? ' dark'"
    th:attr="lang=${userSettings != null && userSettings.language != null ? userSettings.language : 'en'},
             data-lang=${userSettings != null && userSettings.language != null ? userSettings.language : 'en'},
             data-theme=${userSettings != null && userSettings.theme != null ? userSettings.theme.toString().toLowerCase() : 'system'},
             data-colorblind=${userSettings != null && userSettings.colorBlindMode ? 'on' : 'off'}"
    th:fragment="layout(pageTitle, pageStyles, content, pageScripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} ?: 'Healthy Habits'">Healthy Habits</title>
    <link rel="shortcut icon" th:href="@{/favicon.ico}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/tab_logo.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/tab_logo.png}">
    <link rel="apple-touch-icon" th:href="@{/img/tab_logo.png}">

    <!-- Core styles (compiled Tailwind + all component styles) -->
    <link rel="stylesheet" th:href="@{/css/app.css}">

    <!-- Page-specific styles -->
    <th:block th:if="${pageStyles != null}">
        <th:block th:replace="${pageStyles}"></th:block>
    </th:block>
</head>

<body class="min-h-screen bg-cyber-900 text-slate-100 antialiased"
    th:classappend="${((userSettings != null and userSettings.easyMode) ? ' text-lg leading-relaxed' : ' text-base') + (userSettings != null and userSettings.colorBlindMode ? ' color-blind' : '') + (timeOfDayMoodClass != null ? ' ' + timeOfDayMoodClass : '')}"
    th:attr="data-time-theme=${timeTheme},
             data-chat-history=${disableChatHistory == true ? 'off' : 'on'},
             data-language=${userSettings != null && userSettings.language != null ? userSettings.language : 'en'},
             data-easy-mode=${userSettings != null && userSettings.easyMode ? 'on' : 'off'},
             data-color-blind=${userSettings != null && userSettings.colorBlindMode ? 'on' : 'off'},
             data-disability-hearing=${userSettings != null && userSettings.disabilityHearing ? 'on' : 'off'},
             data-disability-mobility=${userSettings != null && userSettings.disabilityMobility ? 'on' : 'off'},
             data-disability-vision=${userSettings != null && userSettings.disabilityVision ? 'on' : 'off'},
             data-day-mode=${dayMode != null ? dayMode : 'REST_DAY'}">

<!-- NAVBAR -->
<th:block
    th:if="${@environment.getProperty('app.ui.includeNavbar') != 'false'}"
    th:insert="~{fragments/navbar :: navbar}"></th:block>

<!-- MAIN CONTENT -->
<main class="min-h-[calc(100vh-5rem)] pt-16">
    <th:block th:replace="${content}"></th:block>
</main>

<!-- FOOTER -->
<th:block th:insert="~{fragments/footer :: footer}"></th:block>

<!-- CHATBOT (global) -->
<div th:if="${@environment.getProperty('app.ui.includeChatbot') != 'false'}"
    th:replace="~{fragments/chat/chat-widget :: chatWidget}"></div>

<!-- QUICK ACTIONS (global) -->
<div th:replace="~{fragments/quick-actions :: quickActionsShelf}"></div>

<!-- Core scripts -->
<script th:if="${@environment.getProperty('app.ui.includeChatbot') != 'false'}" src="/js/chat.js" defer></script>
<script src="/js/quick-actions.js" defer></script>
<script src="/js/navbar-premium.js" defer></script>

<!-- Page-specific scripts -->
<th:block th:if="${pageScripts != null}">
    <th:block th:replace="${pageScripts}"></th:block>
</th:block>

</body>
</html>
