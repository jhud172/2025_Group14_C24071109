<!-- fragments/footer.html -->
<footer xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
        th:fragment="footer"
        class="bg-slate-950/40 ring-1 ring-white/10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <nav aria-label="Footer" class="flex flex-wrap items-center gap-x-3 gap-y-2 text-sm">
            <a href="/privacy" class="text-slate-400 hover:text-slate-200">Privacy</a>
            <span class="text-slate-600" aria-hidden="true">•</span>
            <a href="/terms" class="text-slate-400 hover:text-slate-200">Terms</a>
            <span class="text-slate-600" aria-hidden="true">•</span>
            <a href="/cookies" class="text-slate-400 hover:text-slate-200">Cookies</a>
            <span class="text-slate-600" aria-hidden="true">•</span>
            <a href="/support" class="text-slate-400 hover:text-slate-200">Support</a>
            <span class="text-slate-600" aria-hidden="true">•</span>
            <a href="/contact" class="text-slate-400 hover:text-slate-200">Contact</a>

            <th:block sec:authorize="isAuthenticated()">
                <span class="text-slate-600" aria-hidden="true">•</span>
                <a href="/report-issue" class="text-slate-400 hover:text-slate-200">Report an issue</a>
                <span class="text-slate-600" aria-hidden="true">•</span>
                <a href="/security" class="text-slate-400 hover:text-slate-200">Security</a>
            </th:block>

            <th:block sec:authorize="hasRole('GYM_ADMIN')">
                <span class="text-slate-600" aria-hidden="true">•</span>
                <a href="/gym-admin/help" class="text-slate-400 hover:text-slate-200">Gym admin help</a>
            </th:block>

            <th:block sec:authorize="hasRole('TRAINER')">
                <span class="text-slate-600" aria-hidden="true">•</span>
                <a href="/trainer/guidelines" class="text-slate-400 hover:text-slate-200">Trainer guidelines</a>
            </th:block>
        </nav>
    </div>
</footer>
