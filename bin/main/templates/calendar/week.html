<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Calendar — Week', ~{::styles}, ~{::content}, ~{::pageScripts})}">

<div th:fragment="styles">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="_csrf_param" th:content="${_csrf.parameterName}">
</div>

<div th:fragment="content">
    <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8 py-6">
        <div class="flex flex-col gap-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex flex-wrap gap-3">
                    <a href="/calendar?view=month" class="btn btn--secondary btn--md">Month view</a>
                    <a href="/calendar?view=week" class="btn btn--primary btn--md">Week view</a>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <button type="button" id="scheduleDrawerButton" class="btn btn--secondary btn--md">Schedules</button>
                    <form method="post" action="/calendar/preferences" class="flex items-center gap-2 rounded-full border border-slate-200 bg-white/70 px-3 py-1 text-xs font-semibold text-slate-700 shadow-sm dark:border-slate-800 dark:bg-slate-900/40 dark:text-slate-200">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" id="week-redirect" name="redirect" th:value="${'/calendar?view=week&week=' + week + '&weekYear=' + weekYear}" />
                        <span class="text-slate-500">Display</span>
                        <button name="layout" value="COMBINED_LIST" type="submit"
                                class="rounded-full px-2 py-1"
                                th:classappend="${calendarLayout == T(uk.ac.cf._5.group14.BehaviourChangeGroupProject.UserSettings.CalendarTaskLayoutPreference).COMBINED_LIST} ? ' bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900' : ' hover:bg-slate-100 dark:hover:bg-slate-800'">Detailed</button>
                        <button name="layout" value="SEPARATED_BY_CATEGORY" type="submit"
                                class="rounded-full px-2 py-1"
                                th:classappend="${calendarLayout == T(uk.ac.cf._5.group14.BehaviourChangeGroupProject.UserSettings.CalendarTaskLayoutPreference).SEPARATED_BY_CATEGORY} ? ' bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900' : ' hover:bg-slate-100 dark:hover:bg-slate-800'">Grouped</button>
                    </form>
                </div>
            </div>

            <div class="mt-2 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <a id="week-prev" th:href="@{/calendar(view='week', week=${prevWeek}, weekYear=${prevWeekYear})}"
                        class="btn btn--secondary btn--md">← Prev week</a>

                <h1 class="text-xl font-semibold tracking-tight text-slate-900 dark:text-slate-100 sm:text-2xl">
                    Week <span id="week-start" th:text="${weekStart}"></span> → <span id="week-end" th:text="${weekEnd}"></span>
                </h1>

                <a id="week-next" th:href="@{/calendar(view='week', week=${nextWeek}, weekYear=${nextWeekYear})}"
                        class="btn btn--secondary btn--md">Next week →</a>
            </div>

            <div class="mt-3 flex flex-wrap items-center gap-2 rounded-2xl border border-white/10 bg-white/60 p-2 text-xs font-semibold text-slate-700 shadow-sm dark:bg-white/5 dark:text-slate-200">
                <span class="px-2 uppercase tracking-widest text-slate-400">Week</span>
                <div id="week-strip" class="flex flex-1 gap-2">
                    <div th:each="day : ${weekDays}" class="flex-1 rounded-xl px-2 py-1 text-center"
                         th:classappend="${day.isEqual(today)} ? ' bg-blue-500/15 text-blue-600' : ''">
                        <div th:text="${day.dayOfWeek}"></div>
                        <div class="text-[10px] text-slate-500" th:text="${day.dayOfMonth}"></div>
                    </div>
                </div>
            </div>

            <div id="week-slider" th:attr="data-week=${week},data-week-year=${weekYear}" class="mt-3 overflow-hidden">
                <div id="week-slider-track" class="flex" style="width:300%; transform: translateX(-33.333333%);">
                    <div class="flex-shrink-0" style="width:33.333333%;" data-week-pane-slot="prev"></div>
                    <div class="flex-shrink-0" style="width:33.333333%;" data-week-pane-slot="current">
                        <div th:fragment="weekPane" th:attr="data-week=${week},data-week-year=${weekYear}" data-week-pane class="min-w-full w-full">
                            <div class="grid w-full grid-cols-7 gap-3 text-center text-xs font-semibold uppercase tracking-widest text-slate-500 dark:text-slate-400 sm:text-sm">
                                <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
                            </div>
                            <div class="mt-3 grid w-full grid-cols-7 gap-3">
                                <div th:each="i : ${#numbers.sequence(0,6)}" th:with="day=${weekDays[i]}"
                                     class="calendar-day-card relative h-72 overflow-hidden rounded-2xl ring-1 ring-white/10 bg-white/70 p-3 shadow-[0_18px_40px_-30px_rgba(15,23,42,0.5)] backdrop-blur transition hover:-translate-y-0.5 hover:shadow-[0_22px_48px_-32px_rgba(15,23,42,0.6)] dark:bg-white/5 sm:h-80 sm:p-4"
                                      th:attr="data-day-link=@{'/calendar/day/' + ${#temporals.format(day,'yyyy-MM-dd')}}"
                                    th:classappend="${(day.isBefore(today) ? ' opacity-60' : '') +
                                    (day.isEqual(today) ? ' ring-2 ring-blue-500/80' : '') +
                                    (isPremium and day.isEqual(today) ? ' bg-blue-500/10' : '') +
                                    (isPremium and day.isEqual(tomorrow) ? ' ring-2 ring-emerald-500/70 bg-emerald-500/10' : '')}">
                                    <div class="mb-2 flex items-center justify-between">
                                        <a th:if="${day != null}" th:href="@{'/calendar/day/' + ${#temporals.format(day,'yyyy-MM-dd')}}"
                                           class="block text-sm font-semibold text-slate-900 hover:underline dark:text-slate-100 sm:text-base">
                                            <span th:text="${day.dayOfMonth}"></span>
                                            <span class="text-slate-600 dark:text-slate-300">•</span>
                                            <span th:text="${day.dayOfWeek}"></span>
                                        </a>
                                        <span th:if="${day.isEqual(today)}" class="rounded-full bg-blue-500/10 px-2 py-0.5 text-[10px] font-semibold text-blue-600">Today</span>
                                        <span th:if="${isPremium and day.isEqual(tomorrow)}" class="rounded-full bg-emerald-500/10 px-2 py-0.5 text-[10px] font-semibold text-emerald-600">Tomorrow</span>
                                    </div>
                                    <div th:with="tasks=${tasksByDate[T(java.time.LocalDate).parse(day.toString())]}, tTotal=${tasks!=null?tasks.size():0}, sched=${occurrences[day]}, sTotal=${sched!=null?sched.size():0}, grouped=${calendarLayout == T(uk.ac.cf._5.group14.BehaviourChangeGroupProject.UserSettings.CalendarTaskLayoutPreference).SEPARATED_BY_CATEGORY}">
                                        <div th:if="${!grouped}" class="space-y-2 overflow-y-auto pr-1" style="max-height:260px;">
                                            <div th:each="task, iter : ${tasks}"
                                                 th:if="${iter.index < 4}"
                                                 class="calendar-item flex items-center justify-between gap-2 rounded-2xl border border-white/10 bg-white/80 p-2 text-xs shadow-sm transition hover:bg-white/90 dark:bg-white/5"
                                                 th:classappend="${task.completed} ? ' border-emerald-400/40 bg-emerald-500/10' : ''"
                                                 th:attr="data-type='task',data-date=${day},data-title=${task.title},data-time=${task.time},data-notes=${task.notes},data-exercise=${task.exercise},data-completed=${task.completed},data-id=${task.id}">
                                                <div class="flex min-w-0 flex-col leading-tight">
                                                    <span class="truncate font-semibold text-slate-900 dark:text-slate-100" th:classappend="${task.completed}?' line-through':''" th:text="${task.title}"></span>
                                                    <span class="truncate text-slate-600 dark:text-slate-300" th:classappend="${task.completed}?' line-through':''" th:text="${task.time!=null?task.time:'—'}"></span>
                                                </div>
                                                <div th:if="${task.completed}" class="flex-shrink-0 text-base font-bold text-emerald-600">✓</div>
                                            </div>
                                            <a th:if="${tTotal > 4}" th:href="@{'/calendar/day/' + ${#temporals.format(day,'yyyy-MM-dd')}}"
                                                      class="block rounded-xl border border-white/10 bg-white/70 p-1 text-center text-xs font-semibold text-slate-700 shadow-sm hover:underline dark:bg-white/5 dark:text-slate-200"
                                               th:text="${'+' + (tTotal - 4) + ' more tasks'}"></a>
                                            <div th:if="${tTotal > 0 and sTotal > 0}" class="my-1 border-t border-white/10"></div>
                                            <div th:each="occ, iter : ${sched}"
                                                 th:if="${iter.index < 3}"
                                                 class="calendar-item flex items-center justify-between gap-2 rounded-2xl border border-white/10 bg-slate-50/70 p-2 text-xs shadow-sm transition hover:bg-blue-100/70 dark:bg-white/5"
                                                 th:attr="data-type='occurrence',data-date=${day},data-title=${occ.exercise!=null?occ.exercise.name:(occ.customExercise!=null?occ.customExercise.name:'Unknown')},data-notes=${occ.scheduleName}">
                                                <div class="flex min-w-0 flex-col leading-tight">
                                                    <span class="truncate font-semibold text-slate-900 dark:text-slate-100" th:text="${occ.exercise!=null?occ.exercise.name:(occ.customExercise!=null?occ.customExercise.name:'Unknown')}"></span>
                                                    <span class="truncate text-slate-700 dark:text-slate-300" th:text="'From: ' + ${occ.scheduleName}"></span>
                                                </div>
                                            </div>
                                            <a th:if="${sTotal > 3}" th:href="@{'/calendar/day/' + ${#temporals.format(day,'yyyy-MM-dd')}}"
                                               class="block rounded-xl border border-white/10 bg-white/60 p-1 text-center text-xs font-semibold text-slate-700 shadow-sm hover:underline dark:bg-white/5 dark:text-slate-200"
                                               th:text="${'+' + (sTotal - 3) + ' more schedules'}"></a>
                                        </div>
                                        <div th:if="${grouped}" class="space-y-3 text-xs">
                                            <div>
                                                <div class="flex items-center justify-between text-[10px] uppercase tracking-widest text-slate-500 dark:text-slate-400">
                                                    <span>Tasks</span><span th:text="${tTotal}"></span>
                                                </div>
                                                <div class="mt-1 space-y-1">
                                                    <div th:each="task,iter : ${tasks}" th:if="${iter.index < 2}"
                                                         class="calendar-item rounded-xl border border-white/10 bg-white/70 px-2 py-1 text-slate-700 dark:bg-white/5 dark:text-slate-200"
                                                         th:classappend="${task.completed} ? ' line-through text-emerald-600' : ''"
                                                         th:attr="data-type='task',data-date=${day},data-title=${task.title},data-time=${task.time},data-notes=${task.notes},data-exercise=${task.exercise},data-completed=${task.completed},data-id=${task.id}">
                                                        <span class="truncate" th:text="${task.title}"></span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div>
                                                <div class="flex items-center justify-between text-[10px] uppercase tracking-widest text-slate-500 dark:text-slate-400">
                                                    <span>Schedules</span><span th:text="${sTotal}"></span>
                                                </div>
                                                <div class="mt-1 space-y-1">
                                                    <div th:each="occ,iter : ${sched}" th:if="${iter.index < 2}"
                                                         class="calendar-item rounded-xl border border-white/10 bg-slate-50/70 px-2 py-1 text-slate-700 dark:bg-white/5 dark:text-slate-200"
                                                         th:attr="data-type='occurrence',data-date=${day},data-title=${occ.exercise!=null?occ.exercise.name:(occ.customExercise!=null?occ.customExercise.name:'Unknown')},data-notes=${occ.scheduleName}">
                                                        <span class="truncate" th:text="${occ.exercise!=null?occ.exercise.name:(occ.customExercise!=null?occ.customExercise.name:'Unknown')}"></span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex-shrink-0" style="width:33.333333%;" data-week-pane-slot="next"></div>
                </div>
            </div>

            <div id="preview-card" class="fixed z-50 hidden max-w-xs rounded-2xl border border-white/10 bg-slate-900/95 p-4 text-slate-100 shadow-2xl opacity-0 transition-opacity duration-150"></div>
        </div>
    </div>

    <div id="scheduleDrawer" class="fixed inset-0 z-40 hidden">
        <div class="absolute inset-0 bg-slate-900/70" data-drawer-overlay></div>
        <div class="absolute left-0 top-0 h-full w-[20rem] max-w-[80vw] overflow-hidden border-r border-white/10 bg-slate-950/95 backdrop-blur">
            <div class="flex items-center justify-between px-4 py-4">
                <h2 class="text-sm font-semibold uppercase tracking-widest text-slate-200">Schedules</h2>
                <button type="button" class="rounded-full border border-white/10 px-3 py-1 text-xs text-slate-200" data-drawer-close>Close</button>
            </div>
            <div class="h-[calc(100%-64px)] overflow-y-auto px-4 pb-6">
                <label class="sr-only" for="schedule-search">Search schedules</label>
                <input id="schedule-search" type="text" placeholder="Search schedules..." class="mt-2 w-full rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-sm text-slate-100 placeholder:text-slate-400" />
                <ul id="schedule-list" class="mt-4 space-y-3">
                    <li th:each="schedule, iter : ${schedules}" th:if="${iter.index < 8}">
                        <div class="rounded-2xl border border-white/10 bg-white/5 p-3 text-slate-100 shadow-sm transition hover:bg-white/10">
                            <p class="font-semibold" th:text="${schedule.name}"></p>
                            <a th:href="@{'/schedules/' + ${schedule.id} + '/apply'}" class="mt-1 inline-block text-xs font-semibold text-slate-300 hover:underline">Apply to calendar</a>
                        </div>
                    </li>
                </ul>
                <a href="/schedules" class="btn btn--primary btn--md mt-4 w-full">View all schedules</a>
                <a href="/schedules/builder" class="btn btn--ghost btn--sm mt-3 w-full">+ Create new schedule</a>
            </div>
        </div>
    </div>
</div>

<div th:fragment="pageScripts">
    <script src="/js/week.js"></script>
    <script src="/js/calendar-ux.js"></script>
</div>

</th:block>
