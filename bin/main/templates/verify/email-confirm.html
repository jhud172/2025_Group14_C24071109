<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Email Verification', ~{::styles}, ~{::content}, ~{::pageScripts})}">

    <div th:fragment="styles"></div>

    <div th:fragment="content">
        <div class="mx-auto max-w-2xl px-4 py-12 sm:px-6 lg:px-8">
            <div class="rounded-3xl border border-slate-200/70 bg-white p-8 shadow-sm dark:border-slate-800 dark:bg-slate-950/40">
                <h1 class="text-2xl font-semibold text-slate-900 dark:text-white" th:text="#{verify.email.title}">Email verification</h1>
                <p class="mt-2 text-sm text-slate-600 dark:text-slate-300" th:text="#{verify.email.subtitle}">Confirm your email so you can access all features.</p>

                <div th:if="${verificationSuccess}" class="mt-6 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-900 dark:border-emerald-900/40 dark:bg-emerald-900/20 dark:text-emerald-100" th:text="${verificationSuccess}">
                    Email verified successfully.
                </div>

                <div th:if="${verificationError}" class="mt-6 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-900 dark:border-rose-900/40 dark:bg-rose-900/20 dark:text-rose-100" th:text="${verificationError}">
                    Verification token invalid.
                </div>

                <div class="mt-6 flex flex-wrap gap-3">
                    <a href="/login" class="inline-flex items-center justify-center rounded-xl border border-slate-300/80 bg-white px-4 py-2 text-sm font-semibold text-slate-900 shadow-sm hover:bg-slate-50 dark:border-slate-800 dark:bg-slate-950/40 dark:text-slate-100" th:text="#{verify.email.login}">
                        Go to login
                    </a>
                    <a href="/profile" class="inline-flex items-center justify-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-slate-800 dark:bg-slate-100 dark:text-slate-900" th:text="#{verify.email.profile}">
                        Back to profile
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div th:fragment="pageScripts"></div>
</th:block>
