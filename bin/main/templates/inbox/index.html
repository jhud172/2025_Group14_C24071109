<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Inbox', ~{::styles}, ~{::content}, ~{::scripts})}">

<div th:fragment="styles"></div>

<div th:fragment="content">
    <input type="hidden" id="inbox_csrf" th:value="${_csrf != null ? _csrf.token : ''}" />
    <input type="hidden" id="inbox_csrf_header" th:value="${_csrf != null ? _csrf.headerName : ''}" />

    <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8 space-y-6">
        <section class="overflow-hidden rounded-2xl border border-slate-200/70 bg-gradient-to-br from-white via-white to-slate-50 shadow-sm dark:border-slate-800 dark:from-slate-950/40 dark:via-slate-950/30 dark:to-slate-900/30">
            <div class="px-6 py-6 sm:px-8">
                <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
                    <div class="min-w-0">
                        <h1 class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-slate-100">Inbox</h1>
                        <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">Messages between you and your trainer/client.</p>
                    </div>
                    <a href="/profile"
                       class="inline-flex items-center justify-center rounded-xl border border-slate-200/70 bg-white px-4 py-2 text-sm font-semibold text-slate-900 shadow-sm hover:bg-slate-50 dark:border-slate-800 dark:bg-slate-950/40 dark:text-slate-100 dark:hover:bg-slate-900/30">
                        Back to dashboard
                    </a>
                </div>
            </div>
        </section>

        <section class="overflow-hidden rounded-2xl border border-slate-200/70 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-950/40">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200/70 px-6 py-4 dark:border-slate-800">
                <div>
                    <h2 class="text-lg font-semibold text-slate-900 dark:text-slate-100">Notifications</h2>
                    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">Updates and nudges tailored to your day.</p>
                </div>
                <button type="button"
                        id="notificationInboxReadAll"
                        class="inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-sm hover:bg-slate-50 dark:border-slate-800 dark:bg-slate-950/40 dark:text-slate-200 dark:hover:bg-slate-900/30">
                    Mark all read
                </button>
            </div>

            <div id="notificationInboxEmpty" class="hidden px-6 py-6 text-sm text-slate-500 dark:text-slate-400">
                No notifications yet.
            </div>

            <div id="notificationInboxList" class="divide-y divide-slate-200/70 dark:divide-slate-800"></div>
        </section>

        <div id="inboxEmptyState" th:classappend="${conversations != null && !conversations.isEmpty()} ? ' hidden' : ''"
             class="rounded-2xl border border-slate-200/70 bg-white p-8 shadow-sm dark:border-slate-800 dark:bg-slate-950/40">
            <div class="flex items-start gap-4">
                <div class="inline-flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-slate-100 text-slate-900 dark:bg-slate-900/60 dark:text-slate-100" aria-hidden="true">💬</div>
                <div class="min-w-0">
                    <p class="text-sm font-semibold text-slate-900 dark:text-slate-100">No conversations yet</p>
                    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">When someone messages you, it will show up here.</p>
                    <a href="/profile" class="mt-4 inline-flex items-center text-sm font-semibold text-slate-900 hover:underline dark:text-slate-100">Go to dashboard</a>
                </div>
            </div>
        </div>

           <div id="inboxThreadList" th:classappend="${conversations == null || conversations.isEmpty()} ? ' hidden' : ''"
               class="overflow-hidden rounded-2xl border border-slate-200/70 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-950/40">
            <ul class="divide-y divide-slate-200/70 dark:divide-slate-800">
                <li th:each="c : ${conversations}">
                    <a th:href="@{/inbox/{id}(id=${c.conversationId})}"
                       class="group flex items-start justify-between gap-4 px-5 py-4 hover:bg-slate-50 dark:hover:bg-slate-900/30">
                        <div class="flex min-w-0 items-start gap-3">
                            <div class="mt-0.5 inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-slate-100 text-sm font-semibold text-slate-900 ring-1 ring-slate-200/70 dark:bg-slate-900/60 dark:text-slate-100 dark:ring-slate-800" aria-hidden="true">
                                <span th:text="${c.title != null ? #strings.toUpperCase(#strings.substring(c.title,0,1)) : '•'}"></span>
                            </div>
                            <div class="min-w-0">
                                <div class="flex items-center gap-2">
                                    <p class="truncate text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="${c.title}"></p>
                                    <span th:if="${c.unreadCount != null && c.unreadCount > 0}"
                                          class="inline-flex items-center rounded-full bg-slate-900 px-2 py-0.5 text-xs font-semibold text-white dark:bg-slate-100 dark:text-slate-900"
                                          th:text="${c.unreadCount}"></span>
                                </div>
                                <p class="mt-1 truncate text-sm text-slate-600 dark:text-slate-300" th:text="${c.lastMessageSnippet}"></p>
                            </div>
                        </div>

                        <div class="flex shrink-0 flex-col items-end gap-2">
                            <span class="text-xs text-slate-500" th:text="${c.lastMessageAt}"></span>
                            <span class="text-xs font-semibold text-slate-400 group-hover:text-slate-600 dark:group-hover:text-slate-300" aria-hidden="true">Open</span>
                        </div>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>

</th:block>

<th:block th:fragment="scripts">
    <script src="/js/inbox.js" defer></script>
</th:block>
