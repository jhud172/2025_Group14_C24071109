# UNAPPLIED STAGING BLUEPRINT
# Apply only to a dedicated One To One staging Render workspace after the
# repository owner has approved the quoted billable cost. Do not sync this
# Blueprint to the workspace that owns production resources.
services:
  - type: web
    name: one-to-one-staging-jhuds
    runtime: docker
    plan: starter
    region: frankfurt
    branch: James/phase4-staging-readiness
    dockerfilePath: ./Web_App/Dockerfile
    dockerContext: ./Web_App
    autoDeploy: false
    healthCheckPath: /login
    disk:
      name: staging-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: APP_BASE_URL
        value: https://one-to-one-staging-jhuds.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: one-to-one-staging-db
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: one-to-one-staging-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: one-to-one-staging-db
          property: password
      - key: DATABASE_DRIVER
        value: org.postgresql.Driver
      - key: PGSSLMODE
        value: require
      - key: SQL_INIT_MODE
        value: never
      - key: APP_STORAGE_PROFILE_DIR
        value: /var/data/uploads/profile
      - key: APP_STORAGE_CHAT_DIR
        value: /var/data/uploads/chat
      - key: APP_STORAGE_MERCH_DIR
        value: /var/data/uploads/merch
      - key: APP_STORAGE_WORKOUT_VIDEO_DIR
        value: /var/data/uploads/workout-videos
      - key: APP_ENCRYPTION_CARD_KEY
        generateValue: true
      - key: APP_EMAIL_PROVIDER
        value: none
      - key: APP_EMAIL_FAIL_ON_ERROR
        value: "true"
      - key: APP_SMS_PROVIDER
        value: console
      - key: APP_SMS_FAIL_ON_ERROR
        value: "true"
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: STRIPE_WEBHOOK_SECRET
        value: ""
      - key: APP_AI_ENABLED
        value: "false"
      - key: APP_OAUTH_GOOGLE_LOGIN_ACTIVE
        value: "false"
      - key: APP_OAUTH_MICROSOFT_LOGIN_ACTIVE
        value: "false"
      - key: APP_OAUTH_APPLE_LOGIN_ACTIVE
        value: "false"

databases:
  - name: one-to-one-staging-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: one_to_one_staging
    user: one_to_one_staging
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    ipAllowList: []
