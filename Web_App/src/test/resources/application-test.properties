spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none

# Use an embedded H2 database for tests (hardcoded to prevent .env DATABASE_URL from contaminating contexts).
# MODE=PostgreSQL enables PostgreSQL-compatible SQL parsing (e.g. INSERT … SELECT … WHERE NOT EXISTS
# without a FROM clause, BIGSERIAL, etc.) which matches the production schema.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Always initialize schema + data from SQL (never Hibernate DDL).
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data/*.sql

spring.security.jdbc.users-by-username-query=select username, password, enabled from users where username=?
spring.security.jdbc.authorities-by-username-query=select username, authority from user_authorities where username=?

# Keep test output quieter.
debug=false
server.port=${PORT:8080}

openai.api.key=${OPENAI_API_KEY:}
app.dev-mode=false
