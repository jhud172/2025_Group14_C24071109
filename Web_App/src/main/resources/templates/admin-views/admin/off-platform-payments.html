<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${pageTitle} ?: #{ui.00060}, null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
        <div class="flex items-start justify-between gap-4">
            <div>
                <p class="text-xs font-semibold uppercase tracking-wide text-slate-500" th:text="#{ui.00049}">Admin</p>
                <h1 class="mt-1 text-2xl font-semibold text-slate-900" th:text="#{ui.00050}">Off-platform payment attempts</h1>
                <p class="mt-2 text-sm text-slate-600" th:text="#{ui.00051}">Flagged messages blocked by payment policy enforcement.</p>
            </div>
        </div>

        <div class="mt-6 rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
            <div th:if="${#lists.isEmpty(attempts)}" class="p-8 text-center text-sm text-slate-600" th:text="#{ui.00052}">
                No payment attempts have been flagged yet.
            </div>

            <div th:if="${!#lists.isEmpty(attempts)}" class="overflow-x-auto" tabindex="0" aria-label="Flagged payment attempts table" th:attr="aria-label=#{ui.00053}">
            <table class="min-w-[48rem] divide-y divide-slate-100 text-sm">
                <caption class="sr-only" th:text="#{ui.00054}">Flagged off-platform payment attempts</caption>
                <thead class="bg-slate-50">
                    <tr>
                        <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500" th:text="#{ui.00055}">Time</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500" th:text="#{ui.00056}">Sender</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500" th:text="#{ui.00057}">Thread</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500" th:text="#{ui.00058}">Match</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500" th:text="#{ui.00059}">Preview</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <tr th:each="attempt : ${attempts}">
                        <td class="px-4 py-3 text-slate-600" th:text="${#temporals.format(attempt.createdAt, 'dd MMM yyyy HH:mm')}">Jan 01 2026 09:00</td>
                        <td class="px-4 py-3">
                            <div class="text-sm font-semibold text-slate-900"
                                 th:text="${usersById.get(attempt.senderUserId) != null ? usersById.get(attempt.senderUserId).fullName : 'Unknown'}">Sender</div>
                            <div class="text-xs text-slate-500"
                                 th:text="${usersById.get(attempt.senderUserId) != null ? '@' + usersById.get(attempt.senderUserId).username : ''}">@user</div>
                        </td>
                        <td class="px-4 py-3 text-slate-600">
                            <span th:text="${attempt.threadId}">123</span>
                        </td>
                        <td class="px-4 py-3">
                            <span class="inline-flex items-center rounded-full bg-amber-100 px-2.5 py-1 text-xs font-semibold text-amber-700"
                                  th:text="${attempt.matchedKeyword}">paypal</span>
                        </td>
                        <td class="px-4 py-3 text-slate-600" th:text="${attempt.bodyText != null && attempt.bodyText.length() > 120 ? attempt.bodyText.substring(0, 120) + '…' : attempt.bodyText}">
                            Preview text
                        </td>
                    </tr>
                </tbody>
            </table>
            </div>
        </div>
    </div>

</th:block>
