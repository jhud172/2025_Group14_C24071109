<th:block xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
          th:replace="~{base :: layout(${pageTitle} ?: 'Trainer Library', null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        <div th:if="${error} == 'trainer-unverified'" class="mb-4 rounded-2xl border border-amber-200/30 bg-amber-500/10 p-4 text-sm text-amber-200">
            Your trainer account needs verification before you can manage the library.
        </div>
        <div class="rounded-xl bg-white/5 dark:bg-slate-900/40 ring-1 ring-white/10 shadow-sm p-6">
            <div class="flex items-start justify-between gap-4" data-site-tour="trainer-library">
                <div>
                    <h1 class="text-xl font-semibold text-slate-900 dark:text-slate-100">Trainer Library</h1>
                    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">Create and share exercises, workouts, and programmes with your active clients.</p>
                </div>
            </div>

            <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
                <a th:href="@{/trainer/library/exercises}"
                   class="rounded-xl border border-white/10 bg-white/5 p-5 hover:bg-slate-800/60">
                    <div class="text-sm font-semibold text-slate-900 dark:text-slate-100">Exercises</div>
                    <div class="mt-1 text-sm text-slate-600 dark:text-slate-300"
                         th:text="${exerciseCount} + ' total'">0 total</div>
                </a>

                <a th:href="@{/trainer/library/workouts}"
                   class="rounded-xl border border-white/10 bg-white/5 p-5 hover:bg-slate-800/60">
                    <div class="text-sm font-semibold text-slate-900 dark:text-slate-100">Workouts</div>
                    <div class="mt-1 text-sm text-slate-600 dark:text-slate-300"
                         th:text="${workoutCount} + ' total'">0 total</div>
                </a>

                <a th:href="@{/trainer/library/programmes}"
                   class="rounded-xl border border-white/10 bg-white/5 p-5 hover:bg-slate-800/60">
                    <div class="text-sm font-semibold text-slate-900 dark:text-slate-100">Programmes</div>
                    <div class="mt-1 text-sm text-slate-600 dark:text-slate-300"
                         th:text="${programmeCount} + ' total'">0 total</div>
                </a>
            </div>
        </div>
    </div>

</th:block>
