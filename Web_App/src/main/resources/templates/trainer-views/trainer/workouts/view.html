<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${pageTitle} ?: 'Workout', null, ~{::content}, ~{::pageScripts})}">

    <div th:fragment="content" class="detail-container">
        <!-- Header with key metadata at top -->
        <div class="detail-header">
            <div class="detail-header-content">
                <div class="detail-header-meta">
                    <h1 class="detail-title" th:text="${workout.title}">Workout</h1>
                    <p class="detail-subtitle" th:text="${workout.summary}">Summary</p>
                </div>
                <!-- Primary actions - sticky on larger screens -->
                <div class="detail-actions-sticky">
                    <a th:href="@{/trainer/library/workouts}" class="detail-btn-secondary">Back</a>
                    <a th:href="@{/trainer/library/workouts/{id}/edit(id=${workout.id})}" class="detail-btn-primary">Edit</a>
                    <button type="button" class="detail-btn-secondary"
                            data-share-dialog-open="shareDialog">Share</button>
                </div>
            </div>
        </div>

        <!-- Structured content sections -->
        <div class="detail-sections">
            <div class="detail-grid-2">
                <!-- Items Section -->
                <section class="detail-section">
                    <div class="detail-section-header">
                        <h2 class="detail-section-title">Items</h2>
                    </div>

                    <div th:if="${#lists.isEmpty(items)}" class="detail-section-content">
                        <div class="detail-empty">No items yet.</div>
                    </div>

                    <div th:if="${!#lists.isEmpty(items)}" class="detail-section-content">
                        <div class="detail-list">
                            <div th:each="item : ${items}" class="detail-list-item">
                                <div class="flex items-start justify-between gap-4">
                                    <div class="min-w-0 flex-1">
                                        <div class="detail-list-item-title"
                                             th:text="${exercisesById[item.exerciseId] != null ? exercisesById[item.exerciseId].name : ('Exercise #' + item.exerciseId)}">Exercise</div>
                                         <div class="detail-list-item-description"
                                             th:text="${item.sets + ' sets × ' + item.reps + ' reps' + (item.rpe != null ? (', RPE ' + item.rpe) : '') + ', rest ' + item.restSeconds + 's'}">Details</div>
                                         <div class="detail-list-item-meta" th:text="${'Order: ' + item.orderIndex}">Order</div>
                                    </div>
                                    <form method="post" th:action="@{/trainer/library/workouts/{wid}/items/{iid}/delete(wid=${workout.id},iid=${item.id})}">
                                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit" class="detail-btn-destructive">Remove</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Add Item Form -->
                    <div class="detail-section-content border-t border-slate-200 dark:border-white/10 pt-4">
                        <h3 class="detail-section-title mb-3">Add item</h3>
                        <form class="grid grid-cols-1 gap-3" method="post" th:action="@{/trainer/library/workouts/{id}/items(id=${workout.id})}" th:object="${itemForm}">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div>
                                <label class="detail-metadata-label" for="exerciseId">Exercise</label>
                                <select id="exerciseId" th:field="*{exerciseId}"
                                        class="mt-1 w-full rounded-xl border border-slate-200 dark:border-white/15 bg-white dark:bg-white/5 px-4 py-2 text-sm text-slate-700 dark:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400">
                                    <option value="" selected>Select an exercise…</option>
                                    <option th:each="ex : ${exercises}" th:value="${ex.id}" th:text="${ex.name}">Exercise</option>
                                </select>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="detail-metadata-label" for="sets">Sets</label>
                                    <input id="sets" type="number" min="1" th:field="*{sets}"
                                           class="mt-1 w-full rounded-xl border border-slate-200 dark:border-white/15 bg-white dark:bg-white/5 px-4 py-2 text-sm text-slate-700 dark:text-white" />
                                </div>
                                <div>
                                    <label class="detail-metadata-label" for="reps">Reps</label>
                                    <input id="reps" type="number" min="1" th:field="*{reps}"
                                           class="mt-1 w-full rounded-xl border border-slate-200 dark:border-white/15 bg-white dark:bg-white/5 px-4 py-2 text-sm text-slate-700 dark:text-white" />
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="detail-metadata-label" for="restSeconds">Rest (seconds)</label>
                                    <input id="restSeconds" type="number" min="0" th:field="*{restSeconds}"
                                           class="mt-1 w-full rounded-xl border border-slate-200 dark:border-white/15 bg-white dark:bg-white/5 px-4 py-2 text-sm text-slate-700 dark:text-white" />
                                </div>
                                <div>
                                    <label class="detail-metadata-label" for="rpe">RPE (optional)</label>
                                    <input id="rpe" type="number" min="1" max="10" th:field="*{rpe}"
                                           class="mt-1 w-full rounded-xl border border-slate-200 dark:border-white/15 bg-white dark:bg-white/5 px-4 py-2 text-sm text-slate-700 dark:text-white" />
                                </div>
                            </div>

                            <div>
                                <label class="detail-metadata-label" for="orderIndex">Order index</label>
                                <input id="orderIndex" type="number" min="0" th:field="*{orderIndex}"
                                       class="mt-1 w-full rounded-xl border border-slate-200 dark:border-white/15 bg-white dark:bg-white/5 px-4 py-2 text-sm text-slate-700 dark:text-white" />
                            </div>

                            <div class="flex items-center justify-end">
                                <button type="submit" class="detail-btn-primary">Add</button>
                            </div>
                        </form>
                    </div>
                </section>

                <!-- Coaching Notes Section -->
                <section class="detail-section">
                    <h2 class="detail-section-title">Coaching notes</h2>
                    <div class="detail-section-content">
                        <div th:if="${#lists.isEmpty(notes)}" class="detail-empty">No notes.</div>
                        <ul th:if="${!#lists.isEmpty(notes)}" class="detail-list">
                            <li th:each="n : ${notes}" class="detail-list-item">
                                <span class="detail-list-item-description" th:text="${n.noteText}">Note</span>
                            </li>
                        </ul>
                    </div>

                    <!-- Delete Action -->
                    <div class="detail-section-content border-t border-slate-200 dark:border-white/10 pt-4 flex items-center justify-end">
                        <form method="post" th:action="@{/trainer/library/workouts/{id}/delete(id=${workout.id})}">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="detail-btn-destructive">Delete Workout</button>
                        </form>
                    </div>
                </section>
            </div>
        </div>
        <th:block th:replace="~{trainer-views/trainer/fragments/library-share-dialog :: libraryShareDialog('shareDialog')}"></th:block>
    </div>



    <div th:fragment="pageScripts">
        <script th:src="@{/js/trainer/trainer-library-share-dialog.js}" defer></script>
    </div>

</th:block>
