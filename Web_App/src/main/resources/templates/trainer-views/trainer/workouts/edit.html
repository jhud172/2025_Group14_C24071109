<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${pageTitle} ?: #{ui.02799}, null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-3xl px-4 py-6 sm:px-6 lg:px-8">
        <div class="rounded-xl bg-white/5 dark:bg-slate-900/40 ring-1 ring-white/10 shadow-sm p-6">
            <div class="flex items-start justify-between gap-4">
                <div>
                    <h1 class="text-xl font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.02799}">Edit Workout</h1>
                </div>
                <a th:href="@{/trainer/library/workouts/{id}(id=${workoutId})}"
                   class="inline-flex min-h-11 items-center justify-center rounded-xl border border-white/20 bg-white/5 px-4 py-2 text-sm font-semibold text-slate-900 dark:text-white hover:bg-slate-800/70" th:text="#{ui.00571}">
                    Back
                </a>
            </div>

            <form class="mt-6 space-y-4" method="post" th:action="@{/trainer/library/workouts/{id}/edit(id=${workoutId})}" th:object="${form}">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div>
                    <label class="block text-sm font-semibold" for="title" th:text="#{ui.00583}">Title</label>
                    <input id="title" type="text" th:field="*{title}"
                           class="mt-1 w-full rounded-xl border border-white/15 bg-white/5 px-4 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/30" />
                    <div class="mt-1 text-sm text-rose-300" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>

                <div>
                    <label class="block text-sm font-semibold" for="summary" th:text="#{ui.02189}">Summary</label>
                    <textarea id="summary" rows="3" th:field="*{summary}"
                              class="mt-1 w-full rounded-xl border border-white/15 bg-white/5 px-4 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/30"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold" for="notesText" th:text="#{ui.02687}">Coaching notes (one per line)</label>
                    <textarea id="notesText" rows="5" th:field="*{notesText}"
                              class="mt-1 w-full rounded-xl border border-white/15 bg-white/5 px-4 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/30"></textarea>
                </div>

                <div class="flex items-center justify-end gap-2">
                    <button type="submit"
                            class="inline-flex min-h-11 items-center justify-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800" th:text="#{ui.00382}">
                        Save changes
                    </button>
                </div>
            </form>
        </div>
    </div>

</th:block>
