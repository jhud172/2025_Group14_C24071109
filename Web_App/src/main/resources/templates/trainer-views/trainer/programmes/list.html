<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${pageTitle} ?: #{ui.02739}, null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        <div class="rounded-xl bg-white/5 dark:bg-slate-900/40 ring-1 ring-white/10 shadow-sm p-6">
            <div class="flex items-start justify-between gap-4">
                <div>
                    <h1 class="text-xl font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.02739}">Library · Programmes</h1>
                    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300" th:text="#{ui.02740}">Your saved programme templates.</p>
                </div>
                <div class="flex items-center gap-2">
                    <a th:href="@{/trainer/library}"
                       class="inline-flex min-h-11 items-center justify-center rounded-xl border border-white/20 bg-white/5 px-4 py-2 text-sm font-semibold text-slate-900 dark:text-white hover:bg-slate-800/70" th:text="#{ui.00571}">
                        Back
                    </a>
                    <a th:href="@{/trainer/library/programmes/create}"
                       class="inline-flex min-h-11 items-center justify-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800" th:text="#{ui.01116}">
                        Create
                    </a>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(programmes)}" class="mt-6 border border-dashed border-white/15 rounded-xl p-8 text-center">
                <h2 class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.02741}">No programmes yet</h2>
                <p class="mt-1 text-sm text-slate-600 dark:text-slate-300" th:text="#{ui.02742}">Create a programme and add days that reference workouts.</p>
            </div>

            <div th:if="${!#lists.isEmpty(programmes)}" class="mt-6 divide-y divide-white/10">
                <div th:each="p : ${programmes}" class="py-4 flex items-center justify-between gap-4">
                    <div class="min-w-0">
                        <div class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="${p.title}">Programme</div>
                        <div class="mt-1 text-sm text-slate-600 dark:text-slate-300" th:text="${p.weeks != null ? (p.weeks + ' weeks') : ''}">Weeks</div>
                    </div>
                    <div class="shrink-0">
                        <a th:href="@{/trainer/library/programmes/{id}(id=${p.id})}"
                           class="inline-flex min-h-11 items-center justify-center rounded-xl border border-white/20 bg-white/5 px-4 py-2 text-sm font-semibold text-slate-900 dark:text-white hover:bg-slate-800/70" th:text="#{ui.00664}">
                            View
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</th:block>
