<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${pageTitle} ?: #{ui.02777}, null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
        <div th:if="${error} == 'trainer-unverified'" class="mb-4 rounded-2xl border border-amber-200/30 bg-amber-500/10 p-4 text-sm text-amber-200" th:text="#{ui.02758}">
            Your trainer account needs verification before you can manage templates.
        </div>
        <div class="flex flex-wrap items-start justify-between gap-4">
            <div>
                <p class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400" th:text="#{ui.02752}">Trainer toolkit</p>
                <h1 class="mt-1 text-2xl font-semibold text-slate-900 dark:text-slate-100" th:text="${template.id != null ? 'Edit template' : 'Create template'}">Edit template</h1>
            </div>
            <div class="flex gap-2">
                <a th:href="@{/trainer/templates}" class="inline-flex items-center rounded-xl border border-white/20 bg-white/5 px-3 py-1.5 text-xs font-semibold text-slate-900 dark:text-white hover:bg-slate-800/70" th:text="#{ui.00668}">Back to list</a>
                <a th:if="${template.id != null}" th:href="@{/trainer/templates/{id}/apply(id=${template.id})}"
                   class="inline-flex items-center rounded-xl bg-slate-900 px-3 py-1.5 text-xs font-semibold text-white hover:bg-slate-800" th:text="#{ui.00925}">Apply</a>
            </div>
        </div>

        <section class="mt-6 rounded-2xl border border-white/10 bg-white/5 p-5">
            <h2 class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.02759}">Template details</h2>
            <form class="mt-4 grid gap-3"
                th:action="${template.id != null} ? @{/trainer/templates/{id}/edit(id=${template.id})} : @{/trainer/templates/create}"
                method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input name="name" placeholder="Template name" required class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100"
                       th:value="${template.name}" th:placeholder="#{ui.02760}">
                <input name="tags" placeholder="Tags (comma-separated)" class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100"
                       th:value="${template.tags}" th:placeholder="#{ui.02761}">
                <textarea name="description" rows="3" placeholder="Description" class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100"
                          th:text="${template.description}" th:placeholder="#{ui.00113}"></textarea>
                <label class="flex items-center gap-2 text-xs text-slate-600 dark:text-slate-300">
                    <input type="checkbox" name="archived" th:checked="${template.archived}">
                    <th:block th:text="#{ui.02762}">Archive template</th:block>
                </label>
                <div class="flex justify-end">
                    <button type="submit" class="inline-flex items-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800" th:text="#{ui.00109}">Save</button>
                </div>
            </form>
        </section>

        <div class="mt-6 grid gap-4 lg:grid-cols-[1.3fr_0.7fr]" th:if="${template.id != null}">
            <section class="rounded-2xl border border-white/10 bg-white/5 p-5">
                <h2 class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.02763}">Entries</h2>
                <div th:if="${#lists.isEmpty(entries)}" class="mt-3 text-sm text-slate-600 dark:text-slate-300" th:text="#{ui.02764}">No entries yet.</div>
                <div th:if="${!#lists.isEmpty(entries)}" class="mt-3 space-y-3">
                    <div th:each="entry : ${entries}" class="rounded-xl border border-white/10 bg-white/5 p-4">
                        <div class="flex items-center justify-between gap-2">
                            <div>
                                <div class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="${entry.title}">Entry</div>
                                <div class="mt-1 text-xs text-slate-500">
                                    <span th:text="${entry.type}">TASK</span>
                                    <span class="ml-2" th:text="${entry.dayOfWeek}">1</span>
                                    <span class="ml-2" th:text="${entry.timeWindowStart}"></span>
                                </div>
                            </div>
                            <form th:action="@{/trainer/templates/{id}/entries/{entryId}/delete(id=${template.id}, entryId=${entry.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="text-xs text-rose-300 hover:text-rose-200" th:text="#{ui.00801}">Remove</button>
                            </form>
                        </div>
                        <p class="mt-2 text-xs text-slate-600 dark:text-slate-300" th:text="${entry.defaultsJson}"></p>
                    </div>
                </div>
            </section>

            <section class="rounded-2xl border border-white/10 bg-white/5 p-5">
                <h2 class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.02765}">Add entry</h2>
                <form class="mt-3 space-y-3" th:action="@{/trainer/templates/{id}/entries(id=${template.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="grid gap-3 sm:grid-cols-2">
                        <input type="number" name="dayOfWeek" min="1" max="7" placeholder="Day (1-7)" required
                               class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100" th:placeholder="#{ui.02766}">
                        <select name="type" class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100">
                            <option value="TASK" th:text="#{ui.01637}">Task</option>
                            <option value="WORKOUT" th:text="#{ui.02748}">Workout</option>
                            <option value="NOTE" th:text="#{ui.02173}">Note</option>
                        </select>
                    </div>
                    <div class="grid gap-3 sm:grid-cols-2">
                        <input type="time" name="timeWindowStart" class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100">
                        <input type="time" name="timeWindowEnd" class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100">
                    </div>
                    <input name="title" placeholder="Title" required class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100" th:placeholder="#{ui.00583}">
                    <textarea name="defaultsJson" rows="2" placeholder="Defaults / notes" class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100" th:placeholder="#{ui.02767}"></textarea>
                    <div class="grid gap-3 sm:grid-cols-2">
                        <input name="intensityLabel" placeholder="Intensity label" class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100" th:placeholder="#{ui.02768}">
                        <input type="number" name="intensityLevel" min="1" max="10" placeholder="Intensity (1-10)" class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100" th:placeholder="#{ui.02769}">
                    </div>
                    <select name="exerciseId" class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100">
                        <option value="" th:text="#{ui.02770}">Workout exercise (optional)</option>
                        <option th:each="ex : ${exercises}" th:value="${ex.id}" th:text="${ex.name}"></option>
                    </select>
                    <select name="customExerciseId" class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100">
                        <option value="" th:text="#{ui.02771}">Custom exercise (optional)</option>
                        <option th:each="ex : ${customExercises}" th:value="${ex.id}" th:text="${ex.name}"></option>
                    </select>
                    <button type="submit" class="inline-flex items-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800" th:text="#{ui.02765}">Add entry</button>
                </form>
            </section>
        </div>

        <section class="mt-6 rounded-2xl border border-white/10 bg-white/5 p-5" th:if="${template.id != null}">
            <h2 class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.02772}">Weekly check-in questions</h2>
            <div th:if="${#lists.isEmpty(questions)}" class="mt-3 text-sm text-slate-600 dark:text-slate-300" th:text="#{ui.02773}">No questions configured.</div>
            <div th:if="${!#lists.isEmpty(questions)}" class="mt-3 space-y-3">
                <div th:each="q : ${questions}" class="flex items-center justify-between rounded-xl border border-white/10 bg-white/5 p-3">
                    <div>
                        <div class="text-sm text-slate-900 dark:text-slate-100" th:text="${q.prompt}">Prompt</div>
                        <div class="text-xs text-slate-500" th:text="${q.required} ? 'Required' : 'Optional'"></div>
                    </div>
                    <form th:action="@{/trainer/templates/{id}/questions/{questionId}/delete(id=${template.id}, questionId=${q.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="text-xs text-rose-300 hover:text-rose-200" th:text="#{ui.00801}">Remove</button>
                    </form>
                </div>
            </div>
            <form class="mt-4 grid gap-3 sm:grid-cols-[1.4fr_0.6fr_auto]" th:action="@{/trainer/templates/{id}/questions(id=${template.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input name="prompt" placeholder="New question" required class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100" th:placeholder="#{ui.02774}">
                <select name="required" class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100">
                    <option value="true" th:text="#{ui.02775}">Required</option>
                    <option value="false" th:text="#{ui.02100}">Optional</option>
                </select>
                <button type="submit" class="inline-flex items-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800" th:text="#{ui.02776}">Add question</button>
            </form>
        </section>
    </div>

</th:block>
