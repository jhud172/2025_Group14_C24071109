<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${pageTitle} ?: #{ui.02554}, null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
        <div class="flex flex-wrap items-start justify-between gap-4">
            <div>
                <p class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400" th:text="#{ui.02752}">Trainer toolkit</p>
                <h1 class="mt-1 text-2xl font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.02753}">Apply template</h1>
                <p class="mt-1 text-sm text-slate-600 dark:text-slate-300" th:text="${template.name}">Template</p>
            </div>
            <a th:href="@{/trainer/templates/{id}/edit(id=${template.id})}" class="inline-flex items-center rounded-xl border border-white/20 bg-white/5 px-3 py-1.5 text-xs font-semibold text-slate-900 dark:text-white hover:bg-slate-800/70" th:text="#{ui.02754}">Back to edit</a>
        </div>

        <section class="mt-6 rounded-2xl border border-white/10 bg-white/5 p-5">
            <h2 class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.02755}">Apply to client</h2>
            <form class="mt-4 grid gap-3 md:grid-cols-4" th:action="@{/trainer/templates/{id}/apply(id=${template.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <select name="clientId" required class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100">
                    <option value="" th:text="#{ui.02756}">Select client</option>
                    <option th:each="link : ${activeLinks}" th:value="${link.clientUserId}" th:text="${'Client #' + link.clientUserId}" th:selected="${selectedClientId != null && link.clientUserId == selectedClientId}"></option>
                </select>
                <input type="date" name="start" required class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100" th:value="${start}">
                <input type="date" name="end" required class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-slate-900 dark:text-slate-100" th:value="${end}">
                <label class="flex items-center gap-2 text-xs text-slate-600 dark:text-slate-300">
                    <input type="checkbox" name="idempotent" value="true" th:checked="${idempotent}">
                    <th:block th:text="#{ui.02757}">Idempotent apply</th:block>
                </label>
                <div class="md:col-span-4 flex justify-end gap-2">
                    <button type="submit" class="inline-flex items-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800" th:text="#{ui.00925}">Apply</button>
                </div>
            </form>
        </section>

        <section class="mt-6 rounded-2xl border border-white/10 bg-white/5 p-5" th:if="${preview != null}">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.00059}">Preview</h2>
                <span class="text-xs text-slate-500" th:text="${#lists.size(preview)} + ' items'"></span>
            </div>
            <div class="mt-4 space-y-2">
                <div th:each="item : ${preview}" class="flex items-center justify-between rounded-xl border border-white/10 bg-white/5 p-3">
                    <div>
                        <div class="text-sm text-slate-900 dark:text-slate-100" th:text="${item.title}">Entry</div>
                        <div class="text-xs text-slate-500">
                            <span th:text="${item.type}"></span>
                            <span class="ml-2" th:text="${item.date}"></span>
                            <span class="ml-2" th:text="${item.timeWindowStart}"></span>
                        </div>
                    </div>
                    <span class="text-[11px]"
                          th:classappend="${item.duplicate} ? ' text-amber-300' : ' text-emerald-300'"
                          th:text="${item.duplicate} ? 'DUPLICATE' : 'NEW'"></span>
                </div>
            </div>
        </section>
    </div>

</th:block>
