<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(#{ui.02381}, null, ~{::content}, null)}">

<div th:fragment="content">
    <section class="error-page" aria-labelledby="error-title">
        <div class="error-card error-card--not-found">
            <div class="error-status">
                <span class="error-status__code">404</span>
                <span class="error-status__label" th:text="#{ui.02375}">Not found</span>
            </div>

            <div class="error-card__body">
                <p class="error-eyebrow" th:text="#{ui.02376}">Missing page</p>
                <h1 id="error-title" class="error-title" th:text="#{ui.02377}">Page not found</h1>
                <p class="error-copy" th:text="#{ui.02378}">The page you requested does not exist or has moved.</p>

                <div th:if="${requestPath}" class="error-mini-panel">
                    <span th:text="#{ui.02379}">Attempted path</span>
                    <code th:text="${requestPath}">/missing-page</code>
                </div>

                <div class="error-actions">
                    <a th:href="@{/dashboard}" class="error-button error-button--primary" th:text="#{ui.00308}">Dashboard</a>
                    <a th:href="@{/}" class="error-button error-button--secondary" th:text="#{ui.01401}">Home</a>
                    <button type="button" data-history-back data-history-fallback="/" class="error-button error-button--ghost" th:text="#{ui.02373}">Go back</button>
                </div>

                <div class="error-link-grid" aria-label="Helpful links" th:attr="aria-label=#{ui.02380}">
                    <a th:href="@{/calendar}" class="error-link" th:text="#{ui.01297}">Calendar</a>
                    <a th:href="@{/profile}" class="error-link" th:text="#{ui.00419}">Profile</a>
                    <a th:href="@{/workouts}" class="error-link" th:text="#{ui.00235}">Workouts</a>
                </div>
            </div>
        </div>
    </section>
</div>

</th:block>
