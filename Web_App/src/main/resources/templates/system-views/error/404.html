<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('404 - Page Not Found', null, ~{::content}, null)}">

<div th:fragment="content">
    <section class="error-page" aria-labelledby="error-title">
        <div class="error-card error-card--not-found">
            <div class="error-status">
                <span class="error-status__code">404</span>
                <span class="error-status__label">Not found</span>
            </div>

            <div class="error-card__body">
                <p class="error-eyebrow">Missing page</p>
                <h1 id="error-title" class="error-title">Page not found</h1>
                <p class="error-copy">The page you requested does not exist or has moved.</p>

                <div th:if="${requestPath}" class="error-mini-panel">
                    <span>Attempted path</span>
                    <code th:text="${requestPath}">/missing-page</code>
                </div>

                <div class="error-actions">
                    <a th:href="@{/dashboard}" class="error-button error-button--primary">Dashboard</a>
                    <a th:href="@{/}" class="error-button error-button--secondary">Home</a>
                    <button type="button" data-history-back data-history-fallback="/" class="error-button error-button--ghost">Go back</button>
                </div>

                <div class="error-link-grid" aria-label="Helpful links">
                    <a th:href="@{/calendar}" class="error-link">Calendar</a>
                    <a th:href="@{/profile}" class="error-link">Profile</a>
                    <a th:href="@{/workouts}" class="error-link">Workouts</a>
                </div>
            </div>
        </div>
    </section>
</div>

</th:block>
