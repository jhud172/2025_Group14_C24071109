<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('404 - Page Not Found', null, ~{::content}, null)}">

<div th:fragment="content">
    <div class="flex items-center justify-center min-h-[60vh] px-4">
        <div class="max-w-md w-full bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-100">
            <div class="p-8 text-center">
                <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i class="fas fa-exclamation-circle text-2xl"></i>
                </div>
                
                <h1 class="text-4xl font-bold text-gray-900 mb-2">404</h1>
                <h2 class="text-xl font-semibold text-gray-700 mb-2">Page Not Found</h2>
                <p class="text-gray-600 mb-6">
                    The page you're looking for doesn't exist or may have been moved.
                    <span th:if="${requestPath}" class="block text-sm text-gray-500 mt-2">
                        Attempted path: <code th:text="${requestPath}" class="bg-gray-100 px-2 py-1 rounded text-xs"></code>
                    </span>
                </p>

                <div class="space-y-3">
                    <a href="/" class="block w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg transition-colors">
                        <i class="fas fa-home mr-2"></i>Go to Dashboard
                    </a>
                    <button type="button" data-history-back class="block w-full py-3 px-4 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium rounded-lg transition-colors">
                        <i class="fas fa-arrow-left mr-2"></i>Go Back
                    </button>
                </div>

                <div class="mt-6 p-4 bg-blue-50 rounded-lg border border-blue-200">
                    <p class="text-xs text-blue-700">
                        <strong>Helpful links:</strong>
                    </p>
                    <div class="mt-2 space-y-1 text-xs text-blue-600">
                        <a href="/calendar" class="block hover:text-blue-800 hover:underline">📅 Calendar</a>
                        <a href="/profile" class="block hover:text-blue-800 hover:underline">👤 Profile</a>
                        <a href="/workouts" class="block hover:text-blue-800 hover:underline">💪 Workouts</a>
                    </div>
                </div>
            </div>
            <div class="bg-gray-50 px-8 py-4 border-t border-gray-100 text-center">
                <p class="text-xs text-gray-500">Error 404 Not Found</p>
            </div>
        </div>
    </div>
</div>

</th:block>
