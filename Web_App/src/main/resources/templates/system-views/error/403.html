<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('403 - Access Denied', null, ~{::content}, null)}">

<div th:fragment="content">
    <section class="error-page" aria-labelledby="error-title">
        <div class="error-card error-card--forbidden">
            <div class="error-status">
                <span class="error-status__code">403</span>
                <span class="error-status__label">Forbidden</span>
            </div>

            <div class="error-card__body">
                <p class="error-eyebrow">Access control</p>
                <h1 id="error-title" class="error-title">Access denied</h1>
                <p class="error-copy">
                    <span th:text="${errorMessage ?: 'You do not have permission to access this page.'}"></span>
                </p>
                <p class="error-support">If this page should be available to your role, return to your dashboard and retry from the correct workflow.</p>

                <div class="error-actions">
                    <a th:href="@{/dashboard}" class="error-button error-button--primary">Dashboard</a>
                    <a th:href="@{/}" class="error-button error-button--secondary">Home</a>
                    <button type="button" data-history-back data-history-fallback="/" class="error-button error-button--ghost">Go back</button>
                </div>
            </div>
        </div>
    </section>
</div>

</th:block>
