<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Error', null, ~{::content}, null)}">

<div th:fragment="content">
    <section class="error-page" aria-labelledby="error-title">
        <div class="error-card error-card--generic">
            <div class="error-status">
                <span class="error-status__code" th:text="${statusCode ?: 'Error'}">Error</span>
                <span class="error-status__label">Request failed</span>
            </div>

            <div class="error-card__body">
                <p class="error-eyebrow">Page unavailable</p>
                <h1 id="error-title" class="error-title" th:text="${statusCode != null ? 'Error ' + statusCode : 'Something went wrong'}">Something went wrong</h1>
                <p class="error-copy" th:text="${errorMessage ?: 'An unexpected error occurred. Please try again later.'}">
                    An unexpected error occurred. Please try again later.
                </p>

                <div class="error-actions">
                    <a th:href="@{/dashboard}" class="error-button error-button--primary">Dashboard</a>
                    <a th:href="@{/}" class="error-button error-button--secondary">Home</a>
                    <button type="button" data-history-back data-history-fallback="/" class="error-button error-button--ghost">Go back</button>
                </div>
            </div>
        </div>
    </section>
</div>

</th:block>
