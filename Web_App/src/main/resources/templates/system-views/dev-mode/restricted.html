<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(#{ui.02363}, ~{::pageStyles}, ~{::content}, ~{::pageScripts})}">

    <th:block th:fragment="pageStyles">
        <link rel="stylesheet" th:href="@{/css/components/dev/dev-mode-pages.css(v='20260315a')}">
    </th:block>

    <div th:fragment="content"
         class="devnotice guest-experience guest-experience--dev-state guest-dev-state"
         data-guest-scene>
        <div class="devnotice-shell">
            <article class="devnotice-card guest-panel" data-guest-reveal>
                <div class="devnotice-card__inner">
                    <div class="devnotice-card__header">
                        <div class="devnotice-card__icon" aria-hidden="true">
                            <th:block th:replace="~{universal-fragments/dev/dev-page-display :: icon(${restrictedNotice.iconKey})}"></th:block>
                        </div>
                        <div class="devnotice-card__copy">
                            <p class="devnotice-eyebrow" th:text="#{ui.02361}">Restricted During Development</p>
                            <h1 class="devnotice-title" th:text="${restrictedNotice.title}">Restricted Feature</h1>
                            <p class="devnotice-card__path" th:text="${restrictedNotice.path}">/path</p>
                        </div>
                    </div>

                    <div class="devnotice-card__body">
                        <th:block th:replace="~{universal-fragments/dev/dev-page-display :: statusBadge('restricted', 'Restricted')}"></th:block>
                        <p class="devnotice-copy" th:text="${restrictedNotice.primaryMessage}">
                            This feature is temporarily unavailable during development. Please check back later.
                        </p>
                        <p class="devnotice-copy" th:text="${restrictedNotice.secondaryMessage}">
                            The requested route is not available in the current development configuration.
                        </p>
                    </div>

                    <div class="devnotice-card__actions">
                        <a th:href="@{/dev-mode}" class="devnotice-button devnotice-button--primary" th:text="#{ui.02362}">Back to Dev Hub</a>
                        <a th:href="@{/}" class="devnotice-button devnotice-button--secondary" th:text="#{ui.01132}">Return Home</a>
                    </div>
                </div>
            </article>
        </div>
    </div>

    <th:block th:fragment="pageScripts"></th:block>

</th:block>
