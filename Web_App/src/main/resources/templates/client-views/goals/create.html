<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(#{ui.00594}, ~{::pageStyles}, ~{::content}, ~{::pageScripts})}">

    <th:block th:fragment="pageStyles">
        <link rel="stylesheet" th:href="@{/css/components/goals/goal-pages.css(v='20260313')}">
    </th:block>

    <div th:fragment="content" class="goal-page">
        <section class="goal-form-shell">
            <div class="goal-head">
                <div>
                    <p class="goal-kicker" th:text="#{ui.00408}">Goals</p>
                    <h1 class="goal-title" th:text="#{ui.00581}">Create goal</h1>
                    <p class="goal-copy" th:if="${client != null}" th:text="${'Assigning to ' + client.fullName}"></p>
                    <p class="goal-copy" th:text="#{ui.00582}">Choose the right horizon first, then shape the metric and finish line.</p>
                </div>
                <a href="/goals" class="goal-secondary-btn" th:text="#{ui.00571}">Back</a>
            </div>

            <form class="goal-form-grid" method="post" th:action="@{/goals/create(clientId=${clientId})}" th:object="${form}">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="goal-field">
                    <label for="title" th:text="#{ui.00583}">Title</label>
                    <input id="title" type="text" th:field="*{title}" required />
                </div>

                <div class="goal-field">
                    <label for="description" th:text="#{ui.00113}">Description</label>
                    <textarea id="description" rows="4" th:field="*{description}"></textarea>
                </div>

                <div>
                    <label th:text="#{ui.00584}">Timeframe</label>
                    <div class="goal-radio-grid">
                        <label class="goal-radio-card" th:each="frame : ${goalTimeframes}">
                            <input type="radio" th:field="*{timeframe}" th:value="${frame}" />
                            <span class="goal-radio-card__surface">
                                <span class="goal-radio-card__title" th:text="${frame}">WEEK</span>
                                <span class="goal-radio-card__copy"
                                      th:text="${frame.name() == 'WEEK' ? 'Use for short weekly wins and near-term behaviour targets.' : (frame.name() == 'MONTH' ? 'Use for monthly consistency and progressive routine building.' : 'Use for outcome-based goals with a specific finish line.')}">Timeframe help</span>
                            </span>
                        </label>
                    </div>
                </div>

                <div class="goal-form-split">
                    <div class="goal-field">
                        <label for="goalType" th:text="#{ui.00585}">Goal type</label>
                        <select id="goalType" th:field="*{goalType}">
                            <option th:each="t : ${goalTypes}" th:value="${t}" th:text="${t}"></option>
                        </select>
                    </div>
                    <div class="goal-field">
                        <label for="status" th:text="#{ui.00006}">Status</label>
                        <select id="status" th:field="*{status}">
                            <option th:each="s : ${goalStatuses}" th:value="${s}" th:text="${s}"></option>
                        </select>
                    </div>
                </div>

                <div class="goal-form-split">
                    <div class="goal-field">
                        <label for="targetMetricName" th:text="#{ui.00586}">Target metric</label>
                        <input id="targetMetricName" type="text" th:field="*{targetMetricName}" />
                    </div>
                    <div class="goal-field">
                        <label for="targetMetricValue" th:text="#{ui.00587}">Target value</label>
                        <input id="targetMetricValue" type="number" step="0.1" th:field="*{targetMetricValue}" />
                    </div>
                    <div class="goal-field">
                        <label for="targetMetricUnit" th:text="#{ui.00588}">Unit</label>
                        <input id="targetMetricUnit" type="text" th:field="*{targetMetricUnit}" />
                    </div>
                </div>

                <div class="goal-form-split">
                    <div class="goal-field">
                        <label for="startDate" th:text="#{ui.00589}">Start date</label>
                        <input id="startDate" type="date" th:field="*{startDate}" />
                    </div>
                    <div class="goal-field">
                        <label for="targetDate" th:text="#{ui.00590}">Target date</label>
                        <input id="targetDate" type="date" th:field="*{targetDate}" />
                    </div>
                    <div class="goal-field">
                        <label for="priority" th:text="#{ui.00591}">Priority</label>
                        <input id="priority" type="number" min="0" th:field="*{priority}" />
                    </div>
                </div>

                <label class="goal-inline-toggle">
                    <input type="checkbox" th:field="*{archived}" class="goal-inline-toggle__input" />
                    <th:block th:text="#{ui.00592}">Archived</th:block>
                </label>

                <div>
                    <button type="submit" class="goal-primary-btn" th:text="#{ui.00593}">Save goal</button>
                </div>
            </form>
        </section>
    </div>

    <th:block th:fragment="pageScripts">
        <script th:src="@{/js/goals/goal-pages.js(v=${assetVersion})}" defer></script>
    </th:block>
</th:block>
