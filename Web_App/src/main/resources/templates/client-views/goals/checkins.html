<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(#{ui.00580}, null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 lg:px-8">
        <div class="flex flex-wrap items-start justify-between gap-4">
            <div>
                <p class="text-xs font-semibold uppercase tracking-wide text-slate-500" th:text="#{ui.00570}">Goal check-ins</p>
                <h1 class="mt-1 text-2xl font-semibold text-slate-900" th:text="${goal.title}">Goal</h1>
            </div>
            <a th:href="@{/goals/{id}(id=${goal.id})}"
               class="inline-flex items-center rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50" th:text="#{ui.00571}">Back</a>
        </div>

        <div class="mt-6 grid gap-6 lg:grid-cols-[1fr_0.8fr]">
            <section class="rounded-2xl border border-slate-200 bg-white p-5">
                <h2 class="text-sm font-semibold text-slate-900" th:text="#{ui.00572}">Check-in history</h2>
                <div th:if="${#lists.isEmpty(checkIns)}" class="mt-4 text-sm text-slate-600" th:text="#{ui.00573}">No check-ins yet.</div>
                <div th:if="${!#lists.isEmpty(checkIns)}" class="mt-4 space-y-3">
                    <div th:each="checkIn : ${checkIns}" class="rounded-xl border border-slate-200 bg-slate-50 p-4">
                        <div class="flex items-center justify-between text-xs text-slate-500">
                            <span th:text="${checkIn.weekStartDate}">Week</span>
                            <span th:text="${checkIn.createdByRole}">ROLE</span>
                        </div>
                        <p class="mt-2 text-sm text-slate-700" th:text="${checkIn.reflection}"></p>
                        <p class="mt-1 text-xs text-slate-500" th:text="${checkIn.confidenceRating != null ? 'Confidence: ' + checkIn.confidenceRating : ''}"></p>
                        <p class="mt-1 text-xs text-slate-500" th:text="${checkIn.trainerComment}"></p>
                    </div>
                </div>
            </section>

            <section class="rounded-2xl border border-slate-200 bg-white p-5">
                <h2 class="text-sm font-semibold text-slate-900" th:text="#{ui.00574}">New check-in</h2>
                <form class="mt-4 space-y-3" method="post" th:action="@{/goals/{id}/checkins(id=${goal.id})}" th:object="${form}">
                    <input type="hidden" th:if="${_csrf != null}"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>
                    <div th:if="${isTrainer}">
                        <label class="block text-sm font-semibold text-slate-700" for="weekStartDate" th:text="#{ui.00575}">Week start</label>
                        <input id="weekStartDate" type="date" th:field="*{weekStartDate}"
                               class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700" for="reflection" th:text="#{ui.00576}">Reflection</label>
                        <textarea id="reflection" rows="3" th:field="*{reflection}"
                                  class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700" for="confidenceRating" th:text="#{ui.00577}">Confidence (1-10)</label>
                        <input id="confidenceRating" type="number" min="1" max="10" th:field="*{confidenceRating}"
                               class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700" for="trainerComment" th:text="#{ui.00578}">Trainer comment</label>
                        <textarea id="trainerComment" rows="2" th:field="*{trainerComment}"
                                  class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900"></textarea>
                    </div>
                    <button type="submit" class="inline-flex items-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800" th:text="#{ui.00579}">Save check-in</button>
                </form>
            </section>
        </div>
    </div>
</th:block>
