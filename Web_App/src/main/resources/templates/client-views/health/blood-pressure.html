<!DOCTYPE html>
<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Blood Pressure', null, ~{::content}, ~{::pageScripts})}">

    <div th:fragment="content">
        <div class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 lg:px-8">

            <!-- Page header -->
            <div class="mb-6 flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Blood Pressure</h1>
                    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Track and monitor your readings over time.</p>
                </div>
            </div>

            <!-- Flash messages -->
            <div th:if="${success}" class="mb-4 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800 dark:border-emerald-800 dark:bg-emerald-950/30 dark:text-emerald-300"
                 th:text="${success}"></div>
            <div th:if="${error}" class="mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800 dark:border-red-800 dark:bg-red-950/30 dark:text-red-300"
                 th:text="${error}"></div>

            <!-- Stats row -->
            <div class="mb-6 grid grid-cols-2 gap-3 sm:grid-cols-4">
                <!-- Avg BP -->
                <div class="rounded-2xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900">
                    <p class="text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400">Avg BP</p>
                    <p class="mt-1 text-xl font-bold text-slate-900 dark:text-slate-100"
                       th:text="${stats.totalReadings > 0} ? ${stats.avgSystolic} + '/' + ${stats.avgDiastolic} : '—'"></p>
                    <p class="text-xs text-slate-500">mmHg</p>
                </div>
                <!-- Streak -->
                <div class="rounded-2xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900">
                    <p class="text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400">Streak</p>
                    <p class="mt-1 text-xl font-bold text-emerald-600 dark:text-emerald-400" th:text="${streak} + ' days'"></p>
                    <p class="text-xs text-slate-500">consecutive days</p>
                </div>
                <!-- Total readings -->
                <div class="rounded-2xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900">
                    <p class="text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400">Readings</p>
                    <p class="mt-1 text-xl font-bold text-slate-900 dark:text-slate-100" th:text="${stats.totalReadings}"></p>
                    <p class="text-xs text-slate-500" th:text="'last ' + ${range} + ' days'"></p>
                </div>
                <!-- Days logged -->
                <div class="rounded-2xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900">
                    <p class="text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400">Days Logged</p>
                    <p class="mt-1 text-xl font-bold text-slate-900 dark:text-slate-100" th:text="${stats.daysLogged}"></p>
                    <p class="text-xs text-slate-500" th:text="'of last ' + ${range} + ' days'"></p>
                </div>
            </div>

            <!-- Quick add form -->
            <div class="mb-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
                <h2 class="mb-4 text-base font-semibold text-slate-900 dark:text-slate-100">Log Reading</h2>
                <form th:action="@{/health/blood-pressure}" method="post" th:object="${quickAdd}">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" name="range" th:value="${range}" />
                    <div class="grid grid-cols-2 gap-3 sm:grid-cols-4">
                        <!-- Date -->
                        <div>
                            <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Date</label>
                            <input type="date" id="readingDate" name="readingDate"
                                   th:value="*{readingDate != null ? #temporals.format(readingDate, 'yyyy-MM-dd') : ''}"
                                   class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 focus:border-emerald-400 focus:outline-none dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100" />
                            <p th:if="${#fields.hasErrors('readingDate')}" th:errors="*{readingDate}" class="mt-1 text-xs text-red-500"></p>
                        </div>
                        <!-- Time -->
                        <div>
                            <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Time <span class="text-slate-400">(optional)</span></label>
                            <input type="time" id="readingTime" name="readingTime"
                                   th:value="*{readingTime != null ? #temporals.format(readingTime, 'HH:mm') : ''}"
                                   class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 focus:border-emerald-400 focus:outline-none dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100" />
                        </div>
                        <!-- Systolic -->
                        <div>
                            <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Systolic</label>
                            <input type="number" th:field="*{systolic}" min="60" max="250" placeholder="120"
                                   class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 focus:border-emerald-400 focus:outline-none dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100" />
                            <p th:if="${#fields.hasErrors('systolic')}" th:errors="*{systolic}" class="mt-1 text-xs text-red-500"></p>
                        </div>
                        <!-- Diastolic -->
                        <div>
                            <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Diastolic</label>
                            <input type="number" th:field="*{diastolic}" min="40" max="150" placeholder="80"
                                   class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 focus:border-emerald-400 focus:outline-none dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100" />
                            <p th:if="${#fields.hasErrors('diastolic')}" th:errors="*{diastolic}" class="mt-1 text-xs text-red-500"></p>
                        </div>
                    </div>

                    <!-- Optional fields toggle -->
                    <div class="mt-3">
                        <button type="button" id="toggleOptional"
                                class="text-xs text-emerald-600 hover:text-emerald-700 dark:text-emerald-400 font-medium">
                            + Show optional fields (pulse, arm, position, notes)
                        </button>
                        <div id="optionalFields" class="hidden mt-3 grid grid-cols-2 gap-3 sm:grid-cols-4">
                            <!-- Pulse -->
                            <div>
                                <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Pulse (bpm)</label>
                                <input type="number" th:field="*{pulse}" min="30" max="220" placeholder="72"
                                       class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 focus:border-emerald-400 focus:outline-none dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100" />
                            </div>
                            <!-- Arm -->
                            <div>
                                <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Arm</label>
                                <select th:field="*{arm}"
                                        class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 focus:border-emerald-400 focus:outline-none dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100">
                                    <option value="">— select —</option>
                                    <option th:each="a : ${arms}" th:value="${a}" th:text="${#strings.capitalize(#strings.toLowerCase(a.name()))}"></option>
                                </select>
                            </div>
                            <!-- Position -->
                            <div>
                                <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Position</label>
                                <select th:field="*{position}"
                                        class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 focus:border-emerald-400 focus:outline-none dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100">
                                    <option value="">— select —</option>
                                    <option th:each="p : ${positions}" th:value="${p}" th:text="${#strings.capitalize(#strings.toLowerCase(p.name()))}"></option>
                                </select>
                            </div>
                            <!-- Notes -->
                            <div class="col-span-2 sm:col-span-4">
                                <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Notes</label>
                                <input type="text" th:field="*{notes}" maxlength="500" placeholder="Any notes…"
                                       class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 focus:border-emerald-400 focus:outline-none dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100" />
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 flex justify-end">
                        <button type="submit"
                                class="rounded-xl bg-emerald-500 px-5 py-2 text-sm font-medium text-white hover:bg-emerald-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/40 transition-colors">
                            Save Reading
                        </button>
                    </div>
                </form>
            </div>

            <!-- Range filter + recent readings -->
            <div class="rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900">
                <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4 dark:border-slate-800">
                    <h2 class="text-base font-semibold text-slate-900 dark:text-slate-100">Recent Readings</h2>
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-slate-500">Range:</span>
                        <a th:href="@{/health/blood-pressure(range=7)}"
                           class="rounded-lg px-2.5 py-1 text-xs font-medium transition-colors"
                           th:classappend="${range == 7} ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300' : 'text-slate-600 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800'">7d</a>
                        <a th:href="@{/health/blood-pressure(range=30)}"
                           class="rounded-lg px-2.5 py-1 text-xs font-medium transition-colors"
                           th:classappend="${range == 30} ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300' : 'text-slate-600 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800'">30d</a>
                        <a th:href="@{/health/blood-pressure(range=90)}"
                           class="rounded-lg px-2.5 py-1 text-xs font-medium transition-colors"
                           th:classappend="${range == 90} ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300' : 'text-slate-600 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800'">90d</a>
                    </div>
                </div>

                <!-- Empty state -->
                <div th:if="${recent.isEmpty()}" class="px-5 py-12 text-center">
                    <p class="text-sm text-slate-500 dark:text-slate-400">No readings yet. Log your first reading above.</p>
                </div>

                <!-- Readings table -->
                <div th:if="${!recent.isEmpty()}" class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                        <tr class="border-b border-slate-100 dark:border-slate-800">
                            <th class="px-5 py-3 text-left text-xs font-medium uppercase tracking-wide text-slate-500">Date</th>
                            <th class="px-5 py-3 text-left text-xs font-medium uppercase tracking-wide text-slate-500">BP</th>
                            <th class="hidden px-5 py-3 text-left text-xs font-medium uppercase tracking-wide text-slate-500 sm:table-cell">Pulse</th>
                            <th class="px-5 py-3 text-left text-xs font-medium uppercase tracking-wide text-slate-500">Category</th>
                            <th class="px-5 py-3 text-right text-xs font-medium uppercase tracking-wide text-slate-500">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${recent}"
                            class="border-b border-slate-50 last:border-0 hover:bg-slate-50/50 dark:border-slate-800/50 dark:hover:bg-slate-800/30">
                            <td class="px-5 py-3 text-slate-700 dark:text-slate-300">
                                <span th:text="${#temporals.format(r.readingDate, 'dd MMM yyyy')}"></span>
                                <span th:if="${r.readingTime != null}" class="ml-1 text-xs text-slate-400" th:text="${#temporals.format(r.readingTime, 'HH:mm')}"></span>
                            </td>
                            <td class="px-5 py-3 font-semibold text-slate-900 dark:text-slate-100">
                                <span th:text="${r.systolic} + '/' + ${r.diastolic}"></span>
                                <span class="ml-1 text-xs font-normal text-slate-400">mmHg</span>
                            </td>
                            <td class="hidden px-5 py-3 text-slate-600 dark:text-slate-400 sm:table-cell"
                                th:text="${r.pulse != null} ? ${r.pulse} + ' bpm' : '—'"></td>
                            <td class="px-5 py-3">
                                <span th:with="cat=${categories[r.id]}"
                                      class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium"
                                      th:classappend="${cat != null} ? ${cat.badgeClass} : 'bg-slate-100 text-slate-600'"
                                      th:text="${cat != null} ? ${cat.label} : '—'"></span>
                            </td>
                            <td class="px-5 py-3 text-right">
                                <a th:href="@{/health/blood-pressure/edit/{id}(id=${r.id})}"
                                   class="mr-2 text-xs text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">Edit</a>
                                <form th:action="@{/health/blood-pressure/delete/{id}(id=${r.id})}" method="post" class="inline"
                                      data-confirm="Delete this reading?">
                                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="text-xs text-red-400 hover:text-red-600"
                                            >Delete</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <div th:fragment="pageScripts">
        <script th:src="@{/js/health/blood-pressure-page.js}"></script>
    </div>

</th:block>
