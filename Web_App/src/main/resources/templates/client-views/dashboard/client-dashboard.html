<th:block xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
          th:replace="~{base :: layout('Client Dashboard', null, ~{::content}, ~{::pageScripts})}">

    <div th:fragment="content">
        <section sec:authorize="isAuthenticated()"
                 class="cd-dashboard-page mx-auto w-full max-w-7xl px-4 pb-6 pt-0 sm:px-6 lg:px-8 2xl:max-w-full 2xl:px-8"
                 data-dashboard-role="CLIENT"
                 th:attrappend="data-dashboard-immersive=${dashboardAmbience != null and dashboardAmbience.enabled ? 'true' : 'false'},
                                data-dashboard-weather=${dashboardAmbience != null ? dashboardAmbience.weather : 'auto'},
                                data-dashboard-temperature-unit=${dashboardAmbience != null ? dashboardAmbience.temperatureUnit : 'CELSIUS'},
                                data-dashboard-weather-display-mode=${dashboardAmbience != null ? dashboardAmbience.displayMode : 'VISUAL'},
                                data-dashboard-time-display-format=${dashboardTimeDisplayFormat != null ? dashboardTimeDisplayFormat : 'TWELVE_HOUR'}">

            <div class="cd-dashboard-drawer-backdrop" data-dashboard-drawer-backdrop aria-hidden="true" hidden></div>

            <div class="cd-dashboard-mobile-dock" aria-label="Dashboard quick panels">
                <div class="cd-dashboard-flyout cd-dashboard-flyout--dock" data-dashboard-flyout="explore">
                    <button type="button"
                            class="cd-dashboard-flyout__handle"
                            data-dashboard-flyout-handle
                            aria-controls="dashboardDrawerExplore"
                            aria-expanded="false"
                            aria-label="Open explore platform panel">
                        <span class="cd-dashboard-flyout__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <circle cx="12" cy="12" r="8"></circle>
                                <path d="M12 4v16M4 12h16"></path>
                            </svg>
                        </span>
                        <span class="cd-dashboard-flyout__label">Explore</span>
                    </button>
                    <aside id="dashboardDrawerExplore" class="cd-dashboard-flyout__panel" aria-label="Explore platform" aria-hidden="true">
                        <div class="cd-dashboard-flyout__panel-inner" tabindex="-1">
                            <div class="cd-dashboard-flyout__header">
                                <div>
                                    <p class="cd-kicker">Explore Platform</p>
                                    <p class="cd-dashboard-flyout__title">Platform shortcuts</p>
                                </div>
                                <button type="button" class="cd-dashboard-flyout__close" data-dashboard-flyout-close aria-label="Close explore platform panel">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                        <path d="M8 8l8 8M16 8l-8 8"></path>
                                    </svg>
                                </button>
                            </div>
                            <div class="cd-dashboard-flyout__body">
                                <th:block th:replace="~{client-views/dashboard/fragments/client-dashboard-shell :: leftRailExplore}"></th:block>
                            </div>
                        </div>
                    </aside>
                </div>

                <div class="cd-dashboard-flyout cd-dashboard-flyout--dock" data-dashboard-flyout="trainer">
                    <button type="button"
                            class="cd-dashboard-flyout__handle"
                            data-dashboard-flyout-handle
                            aria-controls="dashboardDrawerTrainer"
                            aria-expanded="false"
                            aria-label="Open trainer overview panel">
                        <span class="cd-dashboard-flyout__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M20 21a8 8 0 0 0-16 0"></path>
                                <circle cx="12" cy="8" r="4"></circle>
                            </svg>
                        </span>
                        <span class="cd-dashboard-flyout__label">Coach</span>
                    </button>
                    <aside id="dashboardDrawerTrainer" class="cd-dashboard-flyout__panel" aria-label="Trainer overview" aria-hidden="true">
                        <div class="cd-dashboard-flyout__panel-inner" tabindex="-1">
                            <div class="cd-dashboard-flyout__header">
                                <div>
                                    <p class="cd-kicker">Trainer Overview</p>
                                    <p class="cd-dashboard-flyout__title">Coaching snapshot</p>
                                </div>
                                <button type="button" class="cd-dashboard-flyout__close" data-dashboard-flyout-close aria-label="Close trainer overview panel">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                        <path d="M8 8l8 8M16 8l-8 8"></path>
                                    </svg>
                                </button>
                            </div>
                            <div class="cd-dashboard-flyout__body">
                                <th:block th:replace="~{client-views/dashboard/fragments/client-dashboard-shell :: leftRailTrainer('trainer-premium-tooltip-mobile')}"></th:block>
                            </div>
                        </div>
                    </aside>
                </div>

                <div class="cd-dashboard-flyout cd-dashboard-flyout--dock" data-dashboard-flyout="goals">
                    <button type="button"
                            class="cd-dashboard-flyout__handle"
                            data-dashboard-flyout-handle
                            aria-controls="dashboardDrawerGoals"
                            aria-expanded="false"
                            aria-label="Open goals panel">
                        <span class="cd-dashboard-flyout__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M5 19 19 5"></path>
                                <circle cx="7" cy="17" r="2"></circle>
                                <circle cx="17" cy="7" r="2"></circle>
                            </svg>
                        </span>
                        <span class="cd-dashboard-flyout__label">Goals</span>
                    </button>
                    <aside id="dashboardDrawerGoals" class="cd-dashboard-flyout__panel" aria-label="Goals overview" aria-hidden="true">
                        <div class="cd-dashboard-flyout__panel-inner" tabindex="-1">
                            <div class="cd-dashboard-flyout__header">
                                <div>
                                    <p class="cd-kicker">Goals</p>
                                    <p class="cd-dashboard-flyout__title">Progress overview</p>
                                </div>
                                <button type="button" class="cd-dashboard-flyout__close" data-dashboard-flyout-close aria-label="Close goals panel">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                        <path d="M8 8l8 8M16 8l-8 8"></path>
                                    </svg>
                                </button>
                            </div>
                            <div class="cd-dashboard-flyout__body">
                                <th:block th:replace="~{client-views/dashboard/fragments/client-dashboard-shell :: leftRailGoals}"></th:block>
                            </div>
                        </div>
                    </aside>
                </div>

                <div class="cd-dashboard-flyout cd-dashboard-flyout--dock" data-dashboard-flyout="support">
                    <button type="button"
                            class="cd-dashboard-flyout__handle"
                            data-dashboard-flyout-handle
                            aria-controls="dashboardDrawerSupport"
                            aria-expanded="false"
                            aria-label="Open support panel">
                        <span class="cd-dashboard-flyout__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4Z"></path>
                                <path d="m9.5 12 1.8 1.8L15 10"></path>
                            </svg>
                        </span>
                        <span class="cd-dashboard-flyout__label">Help</span>
                    </button>
                    <aside id="dashboardDrawerSupport" class="cd-dashboard-flyout__panel" aria-label="Help and trust" aria-hidden="true">
                        <div class="cd-dashboard-flyout__panel-inner" tabindex="-1">
                            <div class="cd-dashboard-flyout__header">
                                <div>
                                    <p class="cd-kicker">Help and Trust</p>
                                    <p class="cd-dashboard-flyout__title">Support shortcuts</p>
                                </div>
                                <button type="button" class="cd-dashboard-flyout__close" data-dashboard-flyout-close aria-label="Close help and trust panel">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                        <path d="M8 8l8 8M16 8l-8 8"></path>
                                    </svg>
                                </button>
                            </div>
                            <div class="cd-dashboard-flyout__body">
                                <th:block th:replace="~{client-views/dashboard/fragments/client-dashboard-shell :: rightRailSupport}"></th:block>
                            </div>
                        </div>
                    </aside>
                </div>

                <div class="cd-dashboard-flyout cd-dashboard-flyout--dock" data-dashboard-flyout="profile">
                    <button type="button"
                            class="cd-dashboard-flyout__handle"
                            data-dashboard-flyout-handle
                            aria-controls="dashboardDrawerProfile"
                            aria-expanded="false"
                            aria-label="Open profile panel">
                        <span class="cd-dashboard-flyout__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M20 21a8 8 0 0 0-16 0"></path>
                                <circle cx="12" cy="8" r="4"></circle>
                            </svg>
                        </span>
                        <span class="cd-dashboard-flyout__label">Profile</span>
                    </button>
                    <aside id="dashboardDrawerProfile" class="cd-dashboard-flyout__panel" aria-label="Profile overview" aria-hidden="true">
                        <div class="cd-dashboard-flyout__panel-inner" tabindex="-1">
                            <div class="cd-dashboard-flyout__header">
                                <div>
                                    <p class="cd-kicker">Your Profile</p>
                                    <p class="cd-dashboard-flyout__title">Account snapshot</p>
                                </div>
                                <button type="button" class="cd-dashboard-flyout__close" data-dashboard-flyout-close aria-label="Close profile panel">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                        <path d="M8 8l8 8M16 8l-8 8"></path>
                                    </svg>
                                </button>
                            </div>
                            <div class="cd-dashboard-flyout__body">
                                <th:block th:replace="~{client-views/dashboard/fragments/client-dashboard-shell :: rightRailProfile('profile-premium-tooltip-mobile')}"></th:block>
                            </div>
                        </div>
                    </aside>
                </div>
            </div>

            <div id="dashboardRoot" class="cd-dashboard-shell">
                <aside id="dashboardLeftRail"
                       aria-label="Explore platform"
                       data-dashboard-left-rail
                       class="cd-dashboard-rail cd-dashboard-rail--left">
                    <div class="cd-dashboard-rail__panel" tabindex="-1">
                        <div class="cd-dashboard-rail__content">
                            <th:block th:replace="~{client-views/dashboard/fragments/client-dashboard-shell :: leftRail}"></th:block>
                        </div>
                    </div>
                </aside>

                <section class="cd-dashboard-main" aria-label="Dashboard overview">
                    <th:block th:replace="~{client-views/dashboard/fragments/client-dashboard-shell :: mainColumn}"></th:block>
                </section>

                <aside id="dashboardRightRail"
                       aria-label="Help and trust"
                       data-dashboard-right-rail
                       class="cd-dashboard-rail cd-dashboard-rail--right">
                    <div class="cd-dashboard-rail__panel" tabindex="-1">
                        <div class="cd-dashboard-rail__content">
                            <th:block th:replace="~{client-views/dashboard/fragments/client-dashboard-shell :: rightRail}"></th:block>
                        </div>
                    </div>
                </aside>
            </div>
        </section>
    </div>

    <th:block th:fragment="pageScripts">
        <script th:src="@{/js/dashboard/client-dashboard-page.js(v=${uiCssVersion})}" defer></script>
    </th:block>
</th:block>
