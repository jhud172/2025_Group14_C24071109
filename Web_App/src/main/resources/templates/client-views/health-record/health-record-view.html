<th:block th:replace="~{base :: layout(#{ui.00676}, null, ~{::content}, null)}">

    <div th:fragment="content" class="detail-container">
        <!-- Header with key metadata at top -->
        <div class="detail-header">
            <div class="detail-header-content">
                <div class="detail-header-meta">
                    <p class="detail-label" th:text="#{ui.00656}">Health Record</p>
                    <h1 class="detail-title" th:text="#{ui.00666}">Health record details</h1>
                    <p class="detail-subtitle" th:text="#{ui.00667}">Review a specific record.</p>
                </div>
                <!-- Primary actions - sticky on larger screens -->
                <div class="detail-actions-sticky">
                    <a href="/health-record/list" class="detail-btn-secondary" th:text="#{ui.00668}">Back to list</a>
                </div>
            </div>
        </div>

        <!-- Structured content sections -->
        <div class="detail-sections">
            <section class="detail-section">
                <div class="detail-section-content">
                    <p class="detail-metadata-label" th:text="#{ui.00669}">Date recorded</p>
                    <p class="detail-metadata-value" th:text="${record.baselineDate}"></p>
                </div>
            </section>

            <div class="detail-grid-2">
                <section class="detail-section">
                    <h2 class="detail-section-title" th:text="#{ui.00670}">Cardiovascular</h2>
                    <div class="detail-section-content">
                        <div class="detail-metadata">
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label" th:text="#{ui.00661}">Blood pressure</p>
                                <p class="detail-metadata-value">
                                    <span th:text="${record.systolicBloodPressure}"></span> / <span th:text="${record.diastolicBloodPressure}"></span> <th:block th:text="#{ui.00635}">mmHg</th:block>
                                </p>
                            </div>
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label" th:text="#{ui.00639}">Cholesterol</p>
                                <p class="detail-metadata-value"><span th:text="${record.cholesterol}"></span> <th:block th:text="#{ui.00640}">mmol/L</th:block></p>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="detail-section">
                    <h2 class="detail-section-title" th:text="#{ui.00671}">Body measurements</h2>
                    <div class="detail-section-content">
                        <div class="detail-metadata">
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label" th:text="#{ui.00642}">Weight</p>
                                <p class="detail-metadata-value"><span th:text="${record.weightKg}"></span> <th:block th:text="#{ui.00643}">kg</th:block></p>
                            </div>
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label" th:text="#{ui.00645}">Height</p>
                                <p class="detail-metadata-value"><span th:text="${record.heightCm}"></span> <th:block th:text="#{ui.00646}">cm</th:block></p>
                            </div>
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label" th:text="#{ui.00672}">Waist</p>
                                <p class="detail-metadata-value"><span th:text="${record.waistCm}"></span> <th:block th:text="#{ui.00646}">cm</th:block></p>
                            </div>
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label" th:text="#{ui.00673}">BMI</p>
                                <p class="detail-metadata-value" th:text="${record.bmi}"></p>
                            </div>
                            <div class="detail-metadata-item">
                                <p class="detail-metadata-label" th:text="#{ui.00674}">Waist/height ratio</p>
                                <p class="detail-metadata-value" th:text="${record.waistHeightRatio}"></p>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="detail-section">
                    <h2 class="detail-section-title" th:text="#{ui.00662}">Activity</h2>
                    <div class="detail-section-content">
                        <div class="detail-metadata-item">
                            <p class="detail-metadata-label" th:text="#{ui.00650}">Activity level</p>
                            <p class="detail-metadata-value" th:text="${record.activityLevel}"></p>
                        </div>
                    </div>
                </section>

                <section class="detail-section">
                    <h2 class="detail-section-title" th:text="#{ui.00335}">Physical conditions</h2>
                    <div class="detail-section-content">
                        <div th:if="${#lists.isEmpty(record.physicalConditions)}" class="detail-empty" th:text="#{ui.00675}">None recorded</div>
                        <ul th:if="${!#lists.isEmpty(record.physicalConditions)}" class="list-disc list-inside space-y-1 text-sm text-slate-700 dark:text-slate-300">
                            <li th:each="pc : ${record.physicalConditions}" th:text="${pc.name}"></li>
                        </ul>
                    </div>
                </section>
            </div>
        </div>
    </div>
</th:block>
