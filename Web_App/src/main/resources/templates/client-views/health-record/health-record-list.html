<th:block th:replace="~{base :: layout(#{ui.00665}, null, ~{::content}, null)}">

    <div th:fragment="content">
        <div class="mx-auto w-full max-w-6xl px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            <div class="flex items-end justify-between gap-4">
                <div>
                    <h2 class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-slate-100" th:text="#{ui.00657}">All health records</h2>
                    <p class="mt-1 text-sm text-slate-700 dark:text-slate-200" th:text="#{ui.00658}">Review your submitted health records.</p>
                </div>
            </div>

            <div th:if="${param.success}">
                <div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-900 dark:border-emerald-900/50 dark:bg-emerald-950/30 dark:text-emerald-100" th:text="#{ui.00659}">
                    Health record saved successfully!
                </div>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white/80 shadow-sm backdrop-blur dark:border-slate-800 dark:bg-slate-900/50 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-slate-200 dark:divide-slate-800">
                        <thead class="bg-slate-50 dark:bg-slate-950/30">
                        <tr>
                            <th class="px-6 py-3 text-left text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.00660}">Date</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.00661}">Blood pressure</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.00642}">Weight</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.00662}">Activity</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.00663}">Action</th>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200 bg-white dark:divide-slate-800 dark:bg-transparent">
                        <tr th:each="rec : ${records}">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900 dark:text-slate-100" th:text="${rec.baselineDate}"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900 dark:text-slate-100" th:text="${rec.systolicBloodPressure + '/' + rec.diastolicBloodPressure}"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900 dark:text-slate-100" th:text="${rec.weightKg} + ' kg'"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900 dark:text-slate-100" th:text="${rec.activityLevel}"></td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <a th:href="@{'/health-record/' + ${rec.id}}" class="text-sm font-semibold text-blue-700 hover:underline dark:text-blue-300" th:text="#{ui.00664}">View</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</th:block>
