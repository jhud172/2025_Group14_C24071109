<div xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
     xmlns:th="http://www.thymeleaf.org"
     th:fragment="usernameLogout"
     th:with="authUser=${@authHelper.getAuthenticatedUser()},
              isPremium=${authUser != null ? @platformSubscriptionService.isPremium(authUser.id, @systemClock) : false},
              isPremiumVerified=${authUser != null and authUser.emailVerified and authUser.phoneVerified and authUser.profileImageUrl != null and authUser.bio != null and !#strings.isEmpty(authUser.bio) and authUser.username != null and !#strings.isEmpty(authUser.username) and authUser.firstName != null and !#strings.isEmpty(authUser.firstName) and authUser.lastName != null and !#strings.isEmpty(authUser.lastName) and authUser.dateOfBirth != null},
              navSettings=${userSettings},
              navProgress=${navLevelProgress != null ? navLevelProgress : (authUser != null ? authUser.levelProgress : null)},
              navSub=${authUser != null ? @platformSubscriptionService.findByUserId(authUser.id).orElse(null) : null},
              navDaysLeft=${authUser != null ? @platformSubscriptionService.getDaysUntilRenewal(authUser.id, @systemClock) : null},
              navExpired=${authUser != null ? @platformSubscriptionService.hasExpiredSubscription(authUser.id, @systemClock) : false},
              navDaysUnit=${navDaysLeft != null and navDaysLeft == 1 ? 'day' : 'days'},
              displayName=${authUser != null and authUser.firstName != null and !#strings.isEmpty(authUser.firstName) and authUser.lastName != null and !#strings.isEmpty(authUser.lastName) ? authUser.fullName : (authUser != null and authUser.firstName != null and !#strings.isEmpty(authUser.firstName) ? authUser.firstName : (authUser != null and authUser.username != null and !#strings.isEmpty(authUser.username) ? authUser.username : 'Profile'))},
              avatarInitials=${authUser != null and authUser.firstName != null and !#strings.isEmpty(authUser.firstName) ? #strings.toUpperCase(#strings.substring(authUser.firstName, 0, 1)) + (authUser.lastName != null and !#strings.isEmpty(authUser.lastName) ? #strings.toUpperCase(#strings.substring(authUser.lastName, 0, 1)) : '') : (authUser != null and authUser.username != null and !#strings.isEmpty(authUser.username) ? #strings.toUpperCase(#strings.substring(authUser.username, 0, 1)) : 'U')}"
     class="nav-identity-group flex items-center gap-3">

    <div sec:authorize="isAuthenticated()" class="nav-auth-container">
        <section id="floating-profile-card"
                 class="floating-profile-card"
                 data-floating-profile
                 data-profile-preview
                 data-profile-preview-hover="true"
                 data-profile-theme-scope
                 th:with="bannerTheme=${navSettings != null and navSettings.profileBannerTheme != null ? #strings.toLowerCase(navSettings.profileBannerTheme) : 'aurora'},
                          ringTheme=${navSettings != null and navSettings.profileRingStyle != null ? #strings.toLowerCase(navSettings.profileRingStyle) : 'neon_dual'},
                          cardBackTheme=${navSettings != null and navSettings.profileCardBackStyle != null ? #strings.toLowerCase(navSettings.profileCardBackStyle) : 'glass'},
                          selectedMilestones=${navSettings != null and navSettings.profileMilestoneKeys != null and !#strings.isEmpty(navSettings.profileMilestoneKeys) ? #strings.arraySplit(navSettings.profileMilestoneKeys, ',') : null}"
                 th:attr="data-profile-name-color=${navSettings != null ? navSettings.profileTextColor : null},
                          data-profile-copy-color=${navSettings != null ? navSettings.profileBioTextColor : null}"
                 aria-label="User profile card">
            <div class="floating-profile-card__shell"
                 th:classappend="${' profile-card-back-theme--' + cardBackTheme}">
                <header class="floating-profile-card__top"
                        data-profile-preview-trigger
                        tabindex="0"
                        aria-expanded="false"
                        aria-controls="floating-profile-card-panel"
                        th:classappend="${' profile-banner-pill--' + bannerTheme}">
                    <a th:href="@{/profile}" class="floating-profile-card__avatar-wrap" aria-label="Open profile">
                        <span class="floating-profile-card__avatar profile-avatar-ring"
                              th:classappend="${' profile-avatar-ring--' + ringTheme}">
                            <img th:if="${authUser != null and authUser.profileImageUrl != null and !#strings.isEmpty(authUser.profileImageUrl)}"
                                 th:src="${authUser.profileImageUrl}"
                                 alt="Profile photo"
                                 class="h-full w-full object-cover" />
                            <span th:if="${authUser == null or authUser.profileImageUrl == null or #strings.isEmpty(authUser.profileImageUrl)}"
                                  th:text="${avatarInitials}">U</span>
                        </span>
                    </a>

                    <div class="floating-profile-card__identity">
                        <a th:href="@{/profile}"
                           id="floating-profile-card-handle"
                           class="floating-profile-card__handle profile-preview-name"
                           th:text="${displayName}">Profile</a>

                        <div class="floating-profile-card__premium">
                            <div th:if="${isPremium}"
                                 class="nav-premium-badge-group"
                                 data-premium-badge-group
                                 data-open="false"
                                 aria-label="Premium member">
                                <button type="button"
                                        class="nav-premium-badge premium-orb-badge"
                                        data-premium-toggle
                                        aria-label="Premium features enabled"
                                        aria-expanded="false"
                                        aria-controls="premium-tooltip-floating">
                                    <svg class="nav-premium-badge__icon" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                                    </svg>
                                </button>
                                <div id="premium-tooltip-floating" class="nav-premium-tooltip" role="status">
                                    <th:block th:if="${navSub != null and navSub.plan.name() == 'INFINITE'}">Lifetime Premium</th:block>
                                    <th:block th:if="${navSub != null and navSub.plan.name() != 'INFINITE' and navDaysLeft != null and navDaysLeft >= 0 and navDaysLeft <= 5}">
                                        <span th:if="${navSub.status.name() == 'EXPIRES'}">Access ends in <span th:text="${navDaysLeft}">0</span> <span th:text="${navDaysUnit}">days</span></span>
                                        <span th:if="${navSub.status.name() != 'EXPIRES'}">Renews in <span th:text="${navDaysLeft}">0</span> <span th:text="${navDaysUnit}">days</span></span>
                                    </th:block>
                                    <th:block th:if="${navSub == null or (navSub.plan.name() != 'INFINITE' and (navDaysLeft == null or navDaysLeft > 5))}">Premium Active</th:block>
                                </div>
                            </div>

                            <div th:if="${!isPremium and navExpired}"
                                 class="nav-premium-badge-group"
                                 data-premium-badge-group
                                 data-open="false"
                                 aria-label="Subscription ended">
                                <button type="button"
                                        class="nav-premium-badge nav-premium-badge--expired"
                                        data-premium-toggle
                                        aria-label="Subscription ended"
                                        aria-expanded="false"
                                        aria-controls="expired-tooltip-floating">
                                    <svg class="nav-premium-badge__icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                                    </svg>
                                </button>
                                <div id="expired-tooltip-floating" class="nav-premium-tooltip" role="status">Subscription ended</div>
                            </div>
                        </div>
                    </div>

                    <form th:action="@{/logout}" method="post" class="floating-profile-card__logout m-0">
                        <input type="hidden" th:if="${_csrf != null}"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>
                        <button type="submit" class="floating-profile-card__logout-btn">
                            Logout
                        </button>
                    </form>
                </header>

                <div id="floating-profile-card-panel"
                     class="floating-profile-card__bottom"
                     data-floating-content
                     data-profile-preview-panel
                     th:classappend="${' profile-card-back-theme--' + cardBackTheme}"
                     aria-hidden="true">
                    <section class="floating-profile-card__section">
                        <p class="floating-profile-card__section-title profile-preview-copy">Bio</p>
                        <div class="profile-preview-bio-block profile-preview-bio-block--compact"
                             data-profile-bio-block
                             data-bio-scroll-height="160">
                            <p id="floating-profile-card-bio"
                               class="floating-profile-card__bio profile-preview-copy"
                               data-profile-bio
                               th:text="${authUser != null and authUser.bio != null and !#strings.isEmpty(authUser.bio) ? authUser.bio : 'No bio yet.'}">No bio yet.</p>
                            <button type="button"
                                    class="profile-preview-bio__toggle"
                                    data-profile-bio-toggle
                                    hidden
                                    aria-hidden="true"
                                    aria-expanded="false">Read more</button>
                        </div>
                    </section>

                    <section class="floating-profile-card__section floating-profile-card__stats"
                             th:with="pointsVal=${navProgress != null ? navProgress.points : 0}, levelVal=${navProgress != null ? navProgress.level : 1}">
                        <p class="floating-profile-card__section-title profile-preview-copy">Points + Level</p>
                        <p class="floating-profile-card__stats-value profile-preview-copy"><span th:text="${pointsVal}">0</span> points | Level <span th:text="${levelVal}">1</span></p>
                    </section>

                    <section class="floating-profile-card__section">
                        <p class="floating-profile-card__section-title profile-preview-copy">Milestones</p>
                        <div class="profile-preview-milestone-grid profile-preview-milestone-grid--compact">
                            <span class="profile-preview-milestone is-achieved"
                                  th:each="mk,iter : ${selectedMilestones}"
                                  th:if="${iter.index < 3}">
                                <span class="profile-preview-milestone__status">Achieved</span>
                                <span class="profile-preview-milestone__title"
                                      th:text="${mk == 'FIRST_WORKOUT' ? 'First workout logged' : (mk == 'TEN_WORKOUTS' ? '10 workouts' : (mk == 'LEVEL_5' ? 'Reached Level 5' : (mk == 'LEVEL_10' ? 'Reached Level 10' : (mk == 'VERIFIED_EMAIL' ? 'Verified email' : (mk == 'VERIFIED_PHONE' ? 'Verified phone' : (mk == 'PREMIUM_MEMBER' ? 'Premium member' : #strings.replace(mk, '_', ' ')))))))}">Milestone</span>
                            </span>
                            <span class="profile-preview-milestone profile-preview-milestone--empty"
                                  th:if="${selectedMilestones == null or #arrays.length(selectedMilestones) == 0}">
                                <span class="profile-preview-milestone__status">Milestones</span>
                                <span class="profile-preview-milestone__title">No Milestones Displayed</span>
                            </span>
                        </div>
                    </section>
                </div>
            </div>
        </section>
    </div>

    <a sec:authorize="!isAuthenticated()"
       th:href="@{/login}"
       class="nav-login-cta inline-flex h-9 items-center justify-center rounded-lg px-4 text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/20 transition-colors duration-200 shadow-sm">
        Login
    </a>
</div>
