<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(#{ui.01188}, ~{::pageStyles}, ~{::content}, ~{::pageScripts})}">

    <div th:fragment="content" class="auth-container animate-fade-in">
        <div class="auth-card">
            <div class="auth-accent-bar"></div>

            <div class="mb-8 mt-8 text-center">
                <h1 class="auth-heading" th:text="#{auth.reset.title}">Set a new password</h1>
                <p class="auth-subheading" th:text="#{auth.reset.subtitle}">Choose a strong password to secure your account.</p>
            </div>

            <div th:if="${!tokenValid}" class="auth-alert auth-alert--error" role="alert">
                <span th:text="#{auth.reset.invalid}">This reset link is invalid or has expired. Please request a new link.</span>
            </div>

            <form th:if="${tokenValid}" th:action="@{/reset-password(token=${token})}" th:object="${resetPasswordForm}" method="post" class="space-y-4">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div th:if="${#fields.hasAnyErrors()}" class="auth-alert auth-alert--error" role="alert">
                    <span th:text="#{auth.form.fixErrors}">Please correct the highlighted fields below.</span>
                </div>

                <div>
                    <label for="password" class="auth-field__label" th:text="#{auth.reset.password}">New password</label>
                    <div class="auth-field__input-wrapper">
                        <input
                            type="password"
                            id="password"
                            th:field="*{password}"
                            required
                            autocomplete="new-password"
                            class="auth-field__input auth-field__input--with-icon" />
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility" th:attr="aria-label=#{ui.01187}">
                            <svg class="h-5 w-5" id="eyeIcon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                    <p class="mt-1 text-xs text-gray-500" th:text="#{auth.reset.passwordHint}">Min 8, with upper, lower, number, and special character.</p>
                    <div th:if="${#fields.hasErrors('password')}" class="mt-1 text-sm text-red-600">
                        <span th:errors="*{password}"></span>
                    </div>
                </div>

                <div>
                    <label for="confirmPassword" class="auth-field__label" th:text="#{auth.reset.confirm}">Confirm password</label>
                    <div class="auth-field__input-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            th:field="*{confirmPassword}"
                            required
                            autocomplete="new-password"
                            class="auth-field__input auth-field__input--with-icon" />
                        <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Toggle password visibility" th:attr="aria-label=#{ui.01187}">
                            <svg class="h-5 w-5" id="confirmEyeIcon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                    <div th:if="${#fields.hasErrors('confirmPassword')}" class="mt-1 text-sm text-red-600">
                        <span th:errors="*{confirmPassword}"></span>
                    </div>
                </div>

                <button type="submit" class="auth-btn auth-btn--primary">
                    <span th:text="#{auth.reset.submit}">Reset password</span>
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </button>
            </form>

            <div th:if="${!tokenValid}" class="mt-4 text-center text-sm text-gray-600">
                <a th:href="@{/forgot-password}" class="auth-link" th:text="#{auth.reset.requestNew}">Request a new reset link</a>
            </div>
        </div>
    </div>

    <th:block th:fragment="pageStyles">
        <!-- auth.css is now included in app.css via tailwind.css -->
    </th:block>

    <th:block th:fragment="pageScripts">
        <script th:if="${tokenValid}" th:src="@{/js/auth/reset-password-page.js}"></script>
    </th:block>

</th:block>
