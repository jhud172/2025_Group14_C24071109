<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(#{ui.01107}, null, ~{::content}, null)}">

    <div th:fragment="content" class="auth-container guest-experience guest-auth guest-auth--compact" data-guest-scene>
        <div class="guest-auth__stage">
            <header class="guest-auth__assurance">
                <span class="guest-auth__brand-mark" aria-hidden="true"></span>
                <div class="guest-auth__intro">
                    <span class="guest-auth__signal-line" aria-hidden="true"></span>
                    <h1 class="auth-heading" th:text="#{auth.forgot.title}">Reset your password</h1>
                    <p class="auth-subheading" th:text="#{auth.forgot.subtitle}">We'll send a reset link if an account exists.</p>
                </div>
                <span class="guest-auth__assurance-rail" aria-hidden="true"></span>
            </header>

            <div class="auth-card guest-auth__panel">
                <div class="auth-accent-bar"></div>

            <div th:if="${sent}" class="auth-alert auth-alert--success" role="alert">
                <span th:text="#{auth.forgot.sent}">If an account exists for that email, a reset link has been sent.</span>
            </div>

            <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post" class="space-y-4">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div th:if="${#fields.hasAnyErrors()}" class="auth-alert auth-alert--error" role="alert">
                    <span th:text="#{auth.form.fixErrors}">Please correct the highlighted fields below.</span>
                </div>

                <div>
                    <label for="email" class="auth-field__label" th:text="#{auth.email}">Email address</label>
                    <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        required
                        autocomplete="email"
                        class="auth-field__input" />
                    <div th:if="${#fields.hasErrors('email')}" class="mt-1 text-sm text-red-600">
                        <span th:errors="*{email}"></span>
                    </div>
                </div>

                <button type="submit" class="auth-btn auth-btn--primary">
                    <span th:text="#{auth.forgot.submit}">Send reset link</span>
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                    </svg>
                </button>

                <p class="text-center text-sm text-gray-600">
                    <span th:text="#{auth.forgot.remembered}">Remembered your password?</span>
                    <a th:href="@{/login}" class="auth-link" th:text="#{auth.login.submit}">Log in</a>
                </p>
            </form>
            </div>
        </div>
    </div>

</th:block>
