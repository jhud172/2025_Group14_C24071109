<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Gym Application', ~{::pageStyles}, ~{::content}, null)}">

    <div th:fragment="content" class="auth-container auth-container--wide animate-fade-in">
        <div class="auth-card">
            <div class="auth-accent-bar"></div>

            <div class="mb-6 mt-4 text-center">
                <h1 class="auth-heading">Gym application status</h1>
                <p class="auth-subheading">Track the review status and reply when our team requests more information.</p>
            </div>

            <div th:if="${gymApplicationSuccess}" class="auth-alert auth-alert--success" role="alert" th:text="${gymApplicationSuccess}">Saved.</div>
            <div th:if="${gymApplicationError}" class="auth-alert auth-alert--error" role="alert" th:text="${gymApplicationError}">Error.</div>

            <section class="rounded-2xl border border-slate-200 bg-slate-50/80 p-5">
                <div class="flex flex-wrap items-start justify-between gap-3">
                    <div>
                        <p class="text-xs uppercase tracking-[0.22em] text-slate-500">Application</p>
                        <h2 class="mt-2 text-2xl font-semibold text-slate-900" th:text="${application.gymName}">Gym name</h2>
                        <p class="mt-2 text-sm text-slate-600" th:text="${application.adminEmail}">email@example.com</p>
                    </div>
                    <span class="rounded-full bg-emerald-100 px-3 py-1 text-xs font-semibold text-emerald-800" th:text="${application.status}">PENDING</span>
                </div>

                <dl class="mt-5 grid grid-cols-1 gap-3 text-sm text-slate-600 sm:grid-cols-2">
                    <div>
                        <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Gym username</dt>
                        <dd class="mt-1 text-slate-900" th:text="${application.gymUsername}">gym_username</dd>
                    </div>
                    <div>
                        <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Primary contact</dt>
                        <dd class="mt-1 text-slate-900" th:text="${application.contactName}">Contact name</dd>
                    </div>
                    <div>
                        <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Phone</dt>
                        <dd class="mt-1 text-slate-900" th:text="${application.contactPhone}">000</dd>
                    </div>
                    <div>
                        <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Location</dt>
                        <dd class="mt-1 text-slate-900" th:text="${application.address + ', ' + application.city}">Address</dd>
                    </div>
                </dl>
            </section>

            <section class="mt-5 space-y-3">
                <div th:each="message : ${messages}" class="rounded-2xl border border-slate-200 bg-white px-4 py-3">
                    <div class="flex items-center justify-between gap-3">
                        <p class="text-xs font-semibold uppercase tracking-wide text-slate-500" th:text="${message.senderType}">SYSTEM</p>
                        <p class="text-xs text-slate-400" th:text="${#temporals.format(message.createdAt, 'yyyy-MM-dd HH:mm')}">2026-03-30 10:00</p>
                    </div>
                    <p th:if="${message.subject != null}" class="mt-2 text-sm font-semibold text-slate-900" th:text="${message.subject}">Subject</p>
                    <p class="mt-2 whitespace-pre-line text-sm text-slate-700" th:text="${message.body}">Message body.</p>
                </div>
            </section>

            <form th:if="${application.status.name() != 'APPROVED' and application.status.name() != 'DECLINED'}"
                  th:action="@{/signup/gym/application/{token}/reply(token=${application.accessToken})}"
                  method="post"
                  class="mt-5 space-y-3">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div>
                    <label for="applicationReply" class="auth-field__label">Reply to the review team</label>
                    <textarea id="applicationReply" name="message" rows="5" maxlength="5000" class="auth-field__input" placeholder="Add further details, documents, or clarifications for the application review."></textarea>
                </div>
                <button type="submit" class="auth-btn auth-btn--primary">
                    <span>Send update</span>
                </button>
            </form>
        </div>
    </div>

    <th:block th:fragment="pageStyles"></th:block>
</th:block>
