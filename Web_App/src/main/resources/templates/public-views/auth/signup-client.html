<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout('Client Sign Up', ~{::pageStyles}, ~{::content}, ~{::pageScripts})}">

    <div th:fragment="content" class="auth-container auth-container--wide animate-fade-in">
        <div class="auth-card">
            <div class="auth-accent-bar"></div>

            <div class="mb-6 mt-4 text-center">
                <h1 class="auth-heading">Create your client account</h1>
                <p class="auth-subheading">Personalize your profile and start booking trainers.</p>
            </div>

            <th:block th:replace="~{public-views/auth/fragments/social-auth-buttons :: buttons('client', ${socialProviders})}"></th:block>

            <form th:action="@{/signup/client}" th:object="${signupForm}" method="post" class="space-y-5">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div th:if="${#fields.hasAnyErrors()}" class="auth-alert auth-alert--error" role="alert">
                    Please correct the highlighted fields below.
                </div>

                <div>
                    <label for="email" class="auth-field__label">Email Address *</label>
                    <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        required
                        autocomplete="email"
                        class="auth-field__input" />
                    <div th:if="${#fields.hasErrors('email')}" class="mt-1 text-sm text-red-600">
                        <span th:errors="*{email}"></span>
                    </div>
                </div>

                <div>
                    <label for="username" class="auth-field__label">Username *</label>
                    <input
                        type="text"
                        id="username"
                        th:field="*{username}"
                        required
                        autocomplete="username"
                        class="auth-field__input" />
                    <p class="mt-1 text-xs text-gray-500">3–20 characters. Letters, numbers, underscore only.</p>
                    <div th:if="${#fields.hasErrors('username')}" class="mt-1 text-sm text-red-600">
                        <span th:errors="*{username}"></span>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label for="password" class="auth-field__label">Password *</label>
                        <div class="auth-field__input-wrapper">
                            <input
                                type="password"
                                id="password"
                                th:field="*{password}"
                                required
                                autocomplete="new-password"
                                class="auth-field__input auth-field__input--with-icon" />
                            <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                                <svg class="h-5 w-5" id="eyeIcon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                        <p class="mt-1 text-xs text-gray-500">Min 8, with upper, lower, number, and special character.</p>
                        <div th:if="${#fields.hasErrors('password')}" class="mt-1 text-sm text-red-600">
                            <span th:errors="*{password}"></span>
                        </div>
                    </div>

                    <div>
                        <label for="confirmPassword" class="auth-field__label">Confirm Password *</label>
                        <div class="auth-field__input-wrapper">
                            <input
                                type="password"
                                id="confirmPassword"
                                th:field="*{confirmPassword}"
                                required
                                autocomplete="new-password"
                                class="auth-field__input auth-field__input--with-icon" />
                            <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Toggle password visibility">
                                <svg class="h-5 w-5" id="confirmEyeIcon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                        <div th:if="${#fields.hasErrors('confirmPassword')}" class="mt-1 text-sm text-red-600">
                            <span th:errors="*{confirmPassword}"></span>
                        </div>
                    </div>
                </div>

                <div class="auth-actions-row">
                    <a th:href="@{/signup}" class="auth-btn auth-btn--secondary">
                        <span>Choose account type</span>
                    </a>
                    <button type="submit" class="auth-btn auth-btn--primary">
                        <span>Sign up as client</span>
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                        </svg>
                    </button>
                </div>

                <p class="text-center text-sm text-gray-600">
                    Already have an account?
                    <a th:href="@{/login(role=client)}" class="auth-link">Log in</a>
                </p>
            </form>
        </div>
    </div>

    <th:block th:fragment="pageStyles">
        <!-- auth.css is now included in app.css via tailwind.css -->
    </th:block>

    <th:block th:fragment="pageScripts">
    <script th:src="@{/js/auth/signup-client-page.js}"></script>
    </th:block>

</th:block>
