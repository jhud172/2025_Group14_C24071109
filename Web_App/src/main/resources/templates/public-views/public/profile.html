<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${pageTitle}, null, ~{::content}, null)}">

    <div th:fragment="content" class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        <div class="rounded-2xl bg-white/5 dark:bg-slate-900/40 ring-1 ring-white/10 shadow-sm overflow-hidden">
            <div class="h-28 sm:h-36 bg-gradient-to-r from-sky-500 via-indigo-500 to-purple-500"></div>
            <div class="px-6 pb-6">
                <div class="-mt-10 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
                    <div class="flex items-center gap-4">
                        <div class="h-20 w-20 rounded-full bg-slate-900 text-white dark:bg-slate-800 flex items-center justify-center text-2xl font-semibold ring-4 ring-white dark:ring-slate-950">
                            <span th:text="${initials}">TR</span>
                        </div>
                        <div>
                            <h1 class="text-2xl font-semibold text-slate-900 dark:text-slate-100"
                                th:text="${trainer.firstName + ' ' + trainer.lastName}">Trainer Name</h1>
                            <div class="mt-1 flex flex-wrap items-center gap-2">
                                <span class="inline-flex items-center rounded-full bg-indigo-100 px-3 py-1 text-xs font-semibold text-indigo-700" th:text="#{ui.00174}">Trainer</span>
                                <span th:if="${trainer.trainerVerified}" class="inline-flex items-center rounded-full bg-emerald-100 px-3 py-1 text-xs font-semibold text-emerald-700" th:text="#{ui.00564}">Verified</span>
                                <span th:if="${showGymAffiliation}" class="text-xs text-slate-600 dark:text-slate-300">
                                    <th:block th:text="#{ui.01568}">Gym affiliation:</th:block> <span class="font-semibold" th:text="${gymAffiliation}">123</span>
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-wrap items-center gap-3">
                        <a href="#reviews"
                           class="inline-flex min-h-11 items-center justify-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800" th:text="#{ui.01569}">
                            View Reviews
                        </a>
                        <a th:href="@{/signup}"
                           class="inline-flex min-h-11 items-center justify-center rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-800 hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:hover:bg-slate-800" th:text="#{ui.01570}">
                            Start Training
                        </a>
                    </div>
                </div>

                <p th:if="${trainerProfile != null && trainerProfile.bio != null && !trainerProfile.bio.isEmpty()}"
                   class="mt-4 text-sm text-slate-700 dark:text-slate-300"
                   th:text="${trainerProfile.bio}">Trainer bio goes here.</p>

                <div th:if="${trainerProfile != null && trainerProfile.specializations != null && !trainerProfile.specializations.isEmpty()}"
                     class="mt-4 flex flex-wrap gap-2">
                    <th:block th:each="specialization : ${trainerProfile.specializations.split(',')}">
                        <span class="inline-flex items-center rounded-full bg-slate-100 dark:bg-slate-800 px-3 py-1 text-xs font-medium text-slate-800 dark:text-slate-200"
                              th:text="${specialization.trim()}">Specialization</span>
                    </th:block>
                </div>

                <div th:if="${trainerProfile != null}" class="mt-5 flex flex-wrap items-center gap-3">
                    <a th:if="${trainerProfile.showInstagram && trainerProfile.instagramUrl != null && !trainerProfile.instagramUrl.isEmpty()}"
                       th:href="${trainerProfile.instagramUrl}" target="_blank" rel="noopener noreferrer"
                       class="inline-flex items-center gap-2 rounded-full border border-slate-200 px-3 py-1 text-xs font-semibold text-slate-700 hover:border-slate-300 hover:text-slate-900 dark:border-slate-700 dark:text-slate-300">
                        <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                        </svg>
                        <th:block th:text="#{ui.01243}">Instagram</th:block>
                    </a>
                    <a th:if="${trainerProfile.showTikTok && trainerProfile.tiktokUrl != null && !trainerProfile.tiktokUrl.isEmpty()}"
                       th:href="${trainerProfile.tiktokUrl}" target="_blank" rel="noopener noreferrer"
                       class="inline-flex items-center gap-2 rounded-full border border-slate-200 px-3 py-1 text-xs font-semibold text-slate-700 hover:border-slate-300 hover:text-slate-900 dark:border-slate-700 dark:text-slate-300">
                        <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
                        </svg>
                        <th:block th:text="#{ui.01245}">TikTok</th:block>
                    </a>
                    <a th:if="${trainerProfile.showYouTube && trainerProfile.youtubeUrl != null && !trainerProfile.youtubeUrl.isEmpty()}"
                       th:href="${trainerProfile.youtubeUrl}" target="_blank" rel="noopener noreferrer"
                       class="inline-flex items-center gap-2 rounded-full border border-slate-200 px-3 py-1 text-xs font-semibold text-slate-700 hover:border-slate-300 hover:text-slate-900 dark:border-slate-700 dark:text-slate-300">
                        <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                        </svg>
                        <th:block th:text="#{ui.01247}">YouTube</th:block>
                    </a>
                    <a th:if="${trainerProfile.showLinkedIn && trainerProfile.linkedInUrl != null && !trainerProfile.linkedInUrl.isEmpty()}"
                       th:href="${trainerProfile.linkedInUrl}" target="_blank" rel="noopener noreferrer"
                       class="inline-flex items-center gap-2 rounded-full border border-slate-200 px-3 py-1 text-xs font-semibold text-slate-700 hover:border-slate-300 hover:text-slate-900 dark:border-slate-700 dark:text-slate-300">
                        <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                        </svg>
                        <th:block th:text="#{ui.01249}">LinkedIn</th:block>
                    </a>
                    <a th:if="${trainerProfile.showWebsite && trainerProfile.websiteUrl != null && !trainerProfile.websiteUrl.isEmpty()}"
                       th:href="${trainerProfile.websiteUrl}" target="_blank" rel="noopener noreferrer"
                       class="inline-flex items-center gap-2 rounded-full border border-slate-200 px-3 py-1 text-xs font-semibold text-slate-700 hover:border-slate-300 hover:text-slate-900 dark:border-slate-700 dark:text-slate-300">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
                        </svg>
                        <th:block th:text="#{ui.01251}">Website</th:block>
                    </a>
                </div>
            </div>
        </div>

        <div id="reviews" class="mt-6 grid gap-6 lg:grid-cols-3">
            <div class="rounded-xl bg-white/5 dark:bg-slate-900/40 ring-1 ring-white/10 shadow-sm p-6">
                <h2 class="text-lg font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.01571}">Rating Summary</h2>
                <div class="mt-4 flex items-center gap-4">
                    <div class="text-5xl font-bold text-slate-900 dark:text-slate-100"
                         th:text="${#numbers.formatDecimal(averageRating, 1, 1)}">4.5</div>
                    <div>
                        <div class="flex items-center gap-1">
                            <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                                <svg th:if="${i <= averageRating}" class="h-5 w-5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                                </svg>
                                <svg th:if="${i > averageRating}" class="h-5 w-5 text-slate-300" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                                </svg>
                            </th:block>
                        </div>
                        <p class="mt-1 text-sm text-slate-600 dark:text-slate-300"
                           th:text="${reviewCount + ' ' + (reviewCount == 1 ? 'review' : 'reviews')}">0 reviews</p>
                    </div>
                </div>
            </div>

            <div class="rounded-xl bg-white/5 dark:bg-slate-900/40 ring-1 ring-white/10 shadow-sm p-6 lg:col-span-2">
                <h2 class="text-lg font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.01572}">Reviews</h2>

                <div th:if="${#lists.isEmpty(reviews)}" class="mt-6 border border-dashed border-white/15 rounded-xl p-8 text-center">
                    <p class="text-sm text-slate-600 dark:text-slate-300" th:text="#{ui.01573}">No reviews yet.</p>
                </div>

                <div th:if="${!#lists.isEmpty(reviews)}" class="mt-6 divide-y divide-white/10">
                    <div th:each="review : ${reviews}" class="py-6">
                        <div class="flex items-start justify-between gap-4">
                            <div class="flex-1">
                                <div class="flex items-center gap-3">
                                    <span class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.01288}">Client</span>
                                    <div class="flex items-center gap-1">
                                        <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                                            <svg th:if="${i <= review.stars}" class="h-4 w-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                                                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                                            </svg>
                                            <svg th:if="${i > review.stars}" class="h-4 w-4 text-slate-300" fill="currentColor" viewBox="0 0 20 20">
                                                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                                            </svg>
                                        </th:block>
                                    </div>
                                </div>
                                <p class="mt-1 text-xs text-slate-500 dark:text-slate-400"
                                   th:text="${#temporals.format(review.createdAt, 'MMM dd, yyyy')}">Jan 15, 2026</p>

                                <div th:if="${review.tags != null && !review.tags.isEmpty()}" class="mt-2 flex flex-wrap gap-2">
                                    <th:block th:each="tag : ${review.tags.split(',')}">
                                        <span class="inline-flex items-center rounded-full bg-blue-100 px-2.5 py-0.5 text-xs font-medium text-blue-800"
                                              th:text="${tag.trim()}">Professional</span>
                                    </th:block>
                                </div>

                                <p th:if="${review.comment != null && !review.comment.isEmpty()}"
                                   class="mt-3 text-sm text-slate-700 dark:text-slate-300"
                                   th:text="${review.comment}">Great trainer!</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
