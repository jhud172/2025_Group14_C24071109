<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(#{ui.01584}, ~{::styles}, ~{::content}, ~{::pageScripts})}">

    <div th:fragment="styles">
        <link rel="stylesheet" th:href="@{/css/components/account/verification.css(v='20260315b')}">
    </div>

    <div th:fragment="content">
        <div class="verify-shell">
            <div class="verify-card">
                <div class="verify-hero">
                    <div class="verify-icon-wrap" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" class="verify-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="verify-title" th:text="#{ui.01576}">Enter SMS code</h1>
                        <p class="verify-copy" th:text="#{ui.01577}">We sent a 6-digit code to your phone number. Enter it below to verify your account.</p>
                    </div>
                </div>

                <div th:if="${verifySuccess}" class="verify-alert verify-alert--success" th:text="${verifySuccess}">
                    Verification code sent.
                </div>
                <div th:if="${verificationSuccess}" class="verify-alert verify-alert--success" th:text="${verificationSuccess}">
                    Phone verified successfully.
                </div>
                <div th:if="${verifyError}" class="verify-alert verify-alert--error" th:text="${verifyError}">
                    Verification failed.
                </div>

                <div th:if="${verificationSuccess == null}">
                    <form th:action="@{/verify/phone/confirm}" method="post" class="verify-form" autocomplete="off">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="returnTo" value="phone-code" />

                        <label class="verify-label" for="phoneVerificationCode" th:text="#{ui.01578}">
                            SMS verification code
                        </label>
                        <input id="phoneVerificationCode"
                               type="text"
                               name="code"
                               inputmode="numeric"
                               pattern="[0-9]{6}"
                               maxlength="6"
                               autocomplete="one-time-code"
                               required
                               aria-label="6-digit SMS verification code"
                               class="verify-code-input"
                               placeholder="______"  th:attr="aria-label=#{ui.01579}"/>
                        <p class="verify-help" th:text="#{ui.01580}">Use the most recent text message if you requested more than one code.</p>

                        <button type="submit" class="verify-primary" th:text="#{ui.01581}">
                            Verify phone
                        </button>
                    </form>

                    <div class="verify-resend">
                        <form th:action="@{/verify/phone/send}" method="post" class="verify-resend__form">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="verify-resend__button" th:text="#{ui.01582}">
                                Resend code
                            </button>
                        </form>
                    </div>
                </div>

                <div class="verify-actions">
                    <a th:href="@{/profile}" class="verify-btn-secondary" th:text="#{ui.01583}">
                        Back to profile
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div th:fragment="pageScripts"></div>
</th:block>
