<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(#{ui.01519}, null, ~{::content}, null)}">

    <div th:fragment="content"
         class="guest-experience guest-legal"
         data-guest-scene>
        <header class="guest-legal__hero" data-guest-reveal>
            <div class="guest-shell guest-legal__hero-grid">
                <div>
                    <p class="guest-kicker" th:text="#{ui.01472}">Policy</p>
                    <h1 class="guest-title" th:text="#{ui.01511}">Terms of Service</h1>
                    <p class="guest-lead guest-legal__pending-copy">
                        <span th:text="#{ui.02981}">Legal</span>
                        <span aria-hidden="true"> · </span>
                        <span th:text="#{ui.01068}">Awaiting review</span>
                    </p>
                </div>
                <div class="guest-legal__folio guest-legal__folio--terms" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </header>

        <div class="guest-section guest-legal__content" data-guest-reveal>
            <div class="guest-shell guest-legal__layout">
                <nav class="guest-legal__nav" th:attr="aria-label=#{ui.01472}">
                    <a th:href="@{/policies/privacy}"
                       th:text="#{ui.01484}">Privacy Policy</a>
                    <a th:href="@{/policies/payments}"
                       th:text="#{ui.01483}">Payments Policy</a>
                    <a th:href="@{/policies/terms}"
                       aria-current="page"
                       th:text="#{ui.01511}">Terms of Service</a>
                    <a th:href="@{/policies/subscription-terms}"
                       th:text="#{ui.01500}">Subscription Terms</a>
                </nav>

                <article class="guest-legal__document guest-panel guest-legal__unpublished"
                         aria-labelledby="terms-publication-heading">
                    <div class="guest-legal__publication">
                        <span class="guest-legal__publication-signal" aria-hidden="true"></span>
                        <p class="guest-kicker" th:text="#{ui.02981}">Legal</p>
                        <h2 id="terms-publication-heading" th:text="#{ui.01068}">Awaiting review</h2>
                        <p th:text="#{ui.02392}">Page unavailable</p>
                        <div class="guest-legal__actions">
                            <a th:href="@{/support}"
                               class="guest-action guest-action--primary"
                               th:text="#{ui.01470}">Contact support</a>
                            <a th:href="@{/policies/privacy}"
                               class="guest-action guest-action--secondary"
                               th:text="#{ui.01567}">Read privacy information</a>
                        </div>
                    </div>
                </article>
            </div>
        </div>
    </div>

</th:block>
