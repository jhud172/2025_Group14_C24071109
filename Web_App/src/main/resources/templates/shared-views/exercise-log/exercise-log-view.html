<th:block th:replace="~{base :: layout(#{ui.01984}, null, ~{::content}, null)}">

    <div th:fragment="content" class="detail-container">


        <!-- Header with key metadata at top -->
        <div class="detail-header">
            <div class="detail-header-content">
                <div class="detail-header-meta">
                    <p class="detail-label" th:text="#{ui.01984}">Exercise Log</p>
                    <h1 class="detail-title" th:text="#{ui.01996}">Exercise Log Details</h1>
                    <p class="detail-subtitle" th:text="#{ui.01997}">A full view of the selected log entry.</p>
                </div>
                <!-- Primary actions - sticky on larger screens -->
                <div class="detail-actions-sticky">
                    <a href="/exercise-log/list" class="detail-btn-secondary" th:text="#{ui.00668}">Back to list</a>
                </div>
            </div>
        </div>

        <!-- Structured content sections -->
        <div class="detail-sections">
            <section class="detail-section">
                <h2 class="detail-section-title" th:text="#{ui.01998}">Log details</h2>
                <div class="detail-section-content">
                    <div class="detail-metadata">
                        <div class="detail-metadata-item">
                            <p class="detail-metadata-label" th:text="#{ui.00660}">Date</p>
                            <p class="detail-metadata-value" th:text="${log.date}"></p>
                        </div>
                        <div class="detail-metadata-item">
                            <p class="detail-metadata-label" th:text="#{ui.01999}">Mood before</p>
                            <p class="detail-metadata-value" th:text="${log.moodBefore}"></p>
                        </div>
                        <div class="detail-metadata-item">
                            <p class="detail-metadata-label" th:text="#{ui.02000}">Mood after</p>
                            <p class="detail-metadata-value" th:text="${log.moodAfter}"></p>
                        </div>
                        <div class="detail-metadata-item">
                            <p class="detail-metadata-label" th:text="#{ui.02001}">Confidence after</p>
                            <p class="detail-metadata-value" th:text="${log.confidence}"></p>
                        </div>
                    </div>
                </div>
            </section>

            <section class="detail-section" th:if="${log.comments != null && !log.comments.isEmpty()}">
                <h2 class="detail-section-title" th:text="#{ui.01976}">Comments</h2>
                <div class="detail-section-content">
                    <p class="whitespace-pre-wrap text-sm text-slate-700 dark:text-slate-300" th:text="${log.comments}"></p>
                </div>
            </section>
        </div>
    </div>
</th:block>
