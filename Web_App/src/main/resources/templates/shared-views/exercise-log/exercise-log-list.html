<th:block th:replace="~{base :: layout(#{ui.01985}, null, ~{::content}, ~{::pageScripts})}">

    <div th:fragment="content">
        <div class="mx-auto w-full max-w-6xl px-4 sm:px-6 lg:px-8">


            <div class="mt-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
                <div>
                    <h1 class="text-3xl font-bold tracking-tight text-slate-900" th:text="#{ui.01985}">Your Exercise Logs</h1>
                    <p class="mt-1 text-sm text-slate-600" th:text="#{ui.01986}">Search, sort, and click a log to preview details.</p>
                </div>
                <a href="/exercise-log/export/pdf" class="inline-flex items-center justify-center rounded-md bg-emerald-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:ring-offset-2" th:text="#{ui.01987}">
                    Download PDF
                </a>
            </div>

            <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
                    <label for="log-search" class="sr-only" th:text="#{ui.01988}">Search logs</label>
                    <input id="log-search" type="text" placeholder="Search logs..." class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10 sm:w-72" th:placeholder="#{ui.01989}">

                    <label for="sort-select" class="sr-only" th:text="#{ui.01990}">Sort logs</label>
                    <select id="sort-select" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10 sm:w-48">
                        <option value="newest" th:text="#{ui.01991}">Newest First</option>
                        <option value="oldest" th:text="#{ui.01992}">Oldest First</option>
                    </select>
                </div>
            </div>

            <div class="mt-6">
                <div id="log-grid" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
                    <div th:each="log : ${logs}"
                         class="log-card cursor-pointer rounded-xl border border-slate-200 bg-white p-5 shadow-sm transition hover:shadow-md"
                         th:attr="data-date=${log.date},data-before=${log.moodBefore},data-after=${log.moodAfter},data-confidence=${log.confidence},data-id=${log.id}">
                        <h2 class="text-lg font-semibold text-slate-900" th:text="${#temporals.format(log.date,'dd MMM yyyy')}"></h2>
                        <dl class="mt-3 space-y-1 text-sm text-slate-700">
                            <div class="flex items-center justify-between gap-3">
                                <dt class="font-medium" th:text="#{ui.01979}">Mood Before</dt>
                                <dd class="text-slate-900" th:text="${log.moodBefore}"></dd>
                            </div>
                            <div class="flex items-center justify-between gap-3">
                                <dt class="font-medium" th:text="#{ui.01980}">Mood After</dt>
                                <dd class="text-slate-900" th:text="${log.moodAfter}"></dd>
                            </div>
                            <div class="flex items-center justify-between gap-3">
                                <dt class="font-medium" th:text="#{ui.01981}">Confidence</dt>
                                <dd class="text-slate-900" th:text="${log.confidence}"></dd>
                            </div>
                        </dl>
                    </div>
                </div>

                <div id="empty-state" th:if="${#lists.isEmpty(logs)}" class="mt-10 rounded-xl border border-dashed border-slate-300 bg-white p-8 text-center">
                    <p class="text-sm font-medium text-slate-900" th:text="#{ui.01993}">No exercise logs yet.</p>
                    <p class="mt-1 text-sm text-slate-600" th:text="#{ui.01994}">Once you create logs, they’ll show up here.</p>
                </div>

                <div id="pagination-controls" class="mt-6 flex justify-center gap-2"></div>
            </div>

            <div id="preview-panel" class="hidden fixed right-0 top-0 z-50 h-full w-full max-w-md transform translate-x-full border-l border-slate-200 bg-white p-6 shadow-2xl transition-transform duration-300">
                <div class="flex items-start justify-between gap-4">
                    <h2 class="text-lg font-semibold text-slate-900" th:text="#{ui.00059}">Preview</h2>
                    <button id="close-preview" type="button" class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-slate-200 bg-white text-xl leading-none text-slate-700 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900/10">×</button>
                </div>

                <h3 id="preview-date" class="mt-4 text-2xl font-bold tracking-tight text-slate-900"></h3>

                <dl class="mt-6 space-y-3 text-sm">
                    <div class="flex items-center justify-between gap-3">
                        <dt class="font-medium text-slate-700" th:text="#{ui.01979}">Mood Before</dt>
                        <dd id="preview-before" class="text-slate-900"></dd>
                    </div>
                    <div class="flex items-center justify-between gap-3">
                        <dt class="font-medium text-slate-700" th:text="#{ui.01980}">Mood After</dt>
                        <dd id="preview-after" class="text-slate-900"></dd>
                    </div>
                    <div class="flex items-center justify-between gap-3">
                        <dt class="font-medium text-slate-700" th:text="#{ui.01981}">Confidence</dt>
                        <dd id="preview-confidence" class="text-slate-900"></dd>
                    </div>
                </dl>

                <a id="preview-view-btn" class="mt-8 inline-flex w-full items-center justify-center rounded-md bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900/10" th:text="#{ui.01995}">
                    Open Full Log
                </a>
            </div>
        </div>
    </div>

    <div th:fragment="pageScripts">
        <script src="/js/health/logs.js"></script>
    </div>
</th:block>
