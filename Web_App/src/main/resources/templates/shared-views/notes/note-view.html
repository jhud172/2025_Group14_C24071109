<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${note != null ? note.title : 'Note'}, ~{::styles}, ~{::content}, ~{::pageScripts})}">

<div th:fragment="styles">
</div>

<div th:fragment="content" class="detail-container">


        <div class="mt-6" th:if="${note != null}">
            <!-- Header with key metadata at top -->
            <div class="detail-header">
                <div class="detail-header-content">
                    <div class="detail-header-meta">
                        <a class="detail-label hover:underline" th:if="${note.folder != null}" th:href="@{/notes/folders/{id}(id=${note.folder.id})}">← Back to folder</a>
                        <h1 class="detail-title" th:text="${note.title}">Title</h1>
                        <p class="detail-subtitle" th:text="${#temporals.format(note.updatedAt,'dd MMM yyyy HH:mm')}">Date</p>
                    </div>

                    <!-- Primary actions - sticky on larger screens -->
                    <div class="detail-actions-sticky">
                        <a class="detail-btn-secondary" th:href="@{/notes/{id}/edit(id=${note.id})}">Edit</a>
                        <form th:action="@{/notes/{id}/delete(id=${note.id})}" method="post"
                              data-confirm data-confirm-title="Delete note?" data-confirm-message="This will permanently remove the note.">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="detail-btn-destructive" type="submit">Delete</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Structured content sections -->
            <div class="detail-sections">
                <section class="detail-section">
                    <h2 class="detail-section-title">Content</h2>
                    <div class="detail-section-content">
                        <article class="text-sm leading-6 text-slate-800 dark:text-slate-300" th:utext="${note.content}"></article>
                    </div>
                </section>

                <section class="detail-section">
                    <div class="detail-info-box">
                        <p class="detail-info-box-title">Tip</p>
                        <p class="detail-info-box-content">Use headings, lists, and links for readability.</p>
                    </div>
                </section>
            </div>
        </div>

        <div class="mt-6" th:if="${note == null}">
            <div class="detail-section">
                <div class="detail-empty">
                    <p class="text-sm font-medium text-slate-900 dark:text-slate-100">Note not found.</p>
                    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">It may have been deleted, or you may not have access.</p>
                    <a class="detail-btn-secondary mt-4 inline-flex" href="/notes">Back to notes</a>
                </div>
            </div>
        </div>

    <!-- Confirm modal -->
    <div id="confirmOverlay"
         class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4 opacity-0 pointer-events-none transition-opacity [&.show]:opacity-100 [&.show]:pointer-events-auto">
        <div class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-6 shadow-xl" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
            <h3 id="confirmTitle" class="text-lg font-semibold text-slate-900">Confirm</h3>
            <p id="confirmMessage" class="mt-2 text-sm text-slate-600">Are you sure?</p>
            <div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
                <button id="confirmCancel" class="inline-flex items-center justify-center rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-900 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900/10" type="button">Cancel</button>
                <button id="confirmOk" class="inline-flex items-center justify-center rounded-md bg-red-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-600/20" type="button">Delete</button>
            </div>
        </div>
    </div>
</div>

<div th:fragment="pageScripts">
    <script src="/js/notes/notes.js" defer></script>
</div>

</th:block>
