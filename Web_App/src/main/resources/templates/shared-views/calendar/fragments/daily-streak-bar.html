<th:block xmlns:th="http://www.thymeleaf.org">
    <div th:fragment="dailyStreakBar" class="mb-6 rounded-2xl border border-slate-200 bg-white/70 px-5 py-4 shadow-sm backdrop-blur dark:border-slate-800 dark:bg-slate-900/50" data-testid="daily-streak-bar">
        <div class="flex items-center justify-between gap-4">
            <div>
                <p class="text-sm font-medium text-slate-700 dark:text-slate-200" th:text="#{ui.01705}">Day completion</p>
                <p class="mt-0.5 text-sm text-slate-600 dark:text-slate-300" th:text="${dayCompletionSummary}">0/0 completed (0%)</p>
            </div>
            <div class="flex items-center gap-1" aria-label="Daily completion streak" th:attr="title=|Remaining tasks: ${dayCompletionRemainingTasks}, Remaining workouts: ${dayCompletionRemainingWorkouts}|">
                <th:block th:if="${dailyStreakDays != null && !dailyStreakDays.isEmpty()}">
                    <span th:each="day : ${dailyStreakDays}" class="relative inline-flex">
                        <a data-testid="daily-streak-day"
                              th:href="@{'/calendar/day/' + ${day.date}}"
                              class="group relative inline-flex h-2.5 w-5 rounded-full bg-slate-200 dark:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
                              th:classappend="${day.status == T(uk.ac.cf._5.group14.One_To_One.CalendarData.DailyCompletionStatus).GREEN} ? ' bg-emerald-500 dark:bg-emerald-500' : (${day.status == T(uk.ac.cf._5.group14.One_To_One.CalendarData.DailyCompletionStatus).ORANGE} ? ' bg-orange-400 dark:bg-orange-400' : (${day.status == T(uk.ac.cf._5.group14.One_To_One.CalendarData.DailyCompletionStatus).RED} ? ' bg-red-500 dark:bg-red-500' : ''))"
                              th:attr="aria-describedby=|daily-streak-tooltip-${day.date}|">

                            <span role="tooltip"
                                  th:attr="id=|daily-streak-tooltip-${day.date}|"
                                  class="pointer-events-none absolute left-1/2 top-full z-10 mt-2 hidden w-max -translate-x-1/2 rounded-xl border border-slate-200 bg-white/90 px-2 py-1 text-xs text-slate-700 shadow-sm backdrop-blur dark:border-slate-700 dark:bg-slate-950/80 dark:text-slate-200 group-hover:block group-focus:block">
                                <span class="block font-semibold"
                                      th:text="|${day.completedTasks + day.completedWorkouts}/${day.totalTasks + day.totalWorkouts} completed (${day.completionPercentage}%)|">
                                    0/0 completed (0%)
                                </span>
                                <span class="block" th:text="|Tasks left: ${day.totalTasks - day.completedTasks}|"></span>
                                <span class="block" th:text="|Workouts left: ${day.totalWorkouts - day.completedWorkouts}|"></span>
                                <span class="block" th:text="|Logs needed: ${day.logsNeeded}|"></span>
                            </span>
                        </a>
                    </span>
                </th:block>
                <th:block th:unless="${dailyStreakDays != null && !dailyStreakDays.isEmpty()}">
                    <span class="h-2.5 w-5 rounded-full bg-slate-200 dark:bg-slate-800"></span>
                    <span class="h-2.5 w-5 rounded-full bg-slate-200 dark:bg-slate-800"></span>
                    <span class="h-2.5 w-5 rounded-full bg-slate-200 dark:bg-slate-800"></span>
                    <span class="h-2.5 w-5 rounded-full bg-slate-200 dark:bg-slate-800"></span>
                    <span class="h-2.5 w-5 rounded-full bg-slate-200 dark:bg-slate-800"></span>
                    <span class="h-2.5 w-5 rounded-full bg-slate-200 dark:bg-slate-800"></span>
                    <span class="h-2.5 w-5 rounded-full bg-slate-200 dark:bg-slate-800"></span>
                </th:block>
            </div>
        </div>
    </div>
</th:block>
