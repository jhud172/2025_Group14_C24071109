<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(#{ui.02083}, null, ~{::content}, null)}">

    <div th:fragment="content">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div>
                <h1 class="text-2xl font-bold tracking-tight" th:text="#{ui.02101}">Trainer inbox</h1>
                <p class="mt-1 text-sm text-slate-600 dark:text-slate-300" th:text="#{ui.02102}">Threads are scoped to client relationships.</p>
            </div>

            <div class="mt-6 rounded-xl bg-white/5 dark:bg-slate-900/40 ring-1 ring-white/10 shadow-sm">
                <div class="border-b border-white/10 px-5 py-4">
                    <h2 class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.02103}">Threads</h2>
                </div>

                <div th:if="${#lists.isEmpty(threads)}" class="px-5 py-6 text-sm text-slate-600 dark:text-slate-300" th:text="#{ui.02104}">
                    No pending or active client threads.
                </div>

                <div th:if="${!#lists.isEmpty(threads)}" class="divide-y divide-white/10">
                    <a th:each="t : ${threads}"
                       th:href="@{/inbox/{id}(id=${t.id})}"
                       class="block px-5 py-4 hover:bg-white/5">
                        <div class="flex items-start justify-between gap-4">
                            <div class="min-w-0">
                                <div class="flex items-center gap-2">
                                    <span class="text-sm font-semibold text-slate-900 dark:text-slate-100"
                                          th:text="${clientsById[t.clientId] != null ? clientsById[t.clientId].fullName : ('Client #' + t.clientId)}">Client</span>

                                    <span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs ring-1 ring-white/10"
                                          th:classappend="${linksById[t.linkId] != null and linksById[t.linkId].status.name() == 'ACTIVE'} ? ' bg-emerald-400/10 text-emerald-300' : ' bg-amber-400/10 text-amber-300'"
                                          th:text="${linksById[t.linkId] != null ? linksById[t.linkId].status.name() : 'UNKNOWN'}">ACTIVE</span>
                                </div>
                                <p class="mt-1 text-sm text-slate-600 dark:text-slate-300"
                                   th:text="${clientsById[t.clientId] != null ? ('@' + clientsById[t.clientId].username + ' | ' + clientsById[t.clientId].email) : ''}">
                                </p>
                            </div>

                            <div class="shrink-0 text-xs text-slate-500 dark:text-slate-400"
                                 th:text="${#temporals.format(t.createdAt, 'dd MMM yyyy')}">Date</div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</th:block>
