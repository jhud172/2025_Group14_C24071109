<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(#{ui.01934}, null, ~{::content}, ~{::scripts})}">
    <div th:fragment="content">
        <div class="relative overflow-hidden">
            <div class="pointer-events-none absolute inset-0 bg-gradient-to-br from-violet-500/10 via-sky-400/10 to-indigo-500/10"></div>
            <div class="relative mx-auto w-full max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
                <div class="grid gap-6 lg:grid-cols-[280px_minmax(0,1fr)_260px]">
                    <th:block th:replace="~{shared-views/chat/fragments/sidebar :: chatSidebar(${folders}, ${threads}, ${icons}, ${activeFolderId}, ${activeThreadId})}"></th:block>

                    <section class="rounded-2xl border border-slate-200/70 bg-white/90 shadow-lg backdrop-blur dark:border-slate-800/60 dark:bg-slate-950/80">
                        <header class="flex items-center justify-between border-b border-slate-200/70 px-6 py-4 dark:border-slate-800/60">
                            <div>
                                <h1 class="text-xl font-semibold text-slate-900 dark:text-slate-100" th:text="${folder.name}">Folder</h1>
                                <p class="text-sm text-slate-500" th:text="#{ui.01930}">Manage chats in this folder.</p>
                            </div>
                            <form th:action="@{/chatv2/new}" method="post">
                                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <input type="hidden" name="folderId" th:value="${folder.id}" />
                                <button class="inline-flex items-center gap-2 rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-slate-800" th:text="#{ui.01868}">✨ New chat</button>
                            </form>
                        </header>

                        <div class="grid gap-4 p-6 lg:grid-cols-[minmax(0,1fr)_260px]">
                            <div>
                                <div class="grid gap-3 sm:grid-cols-2">
                                    <a th:each="thread : ${threads}"
                                       th:href="@{/chatv2/{id}(id=${thread.id})}"
                                       class="group rounded-2xl border border-slate-200 bg-white/90 p-4 shadow-sm transition hover:-translate-y-0.5 hover:border-slate-300 dark:border-slate-800 dark:bg-slate-950">
                                        <div class="flex items-center gap-3">
                                            <div class="flex h-10 w-10 items-center justify-center rounded-xl text-lg"
                                                 data-chat-accent-badge
                                                 th:attr="data-chat-color=${thread.colorHex}"
                                                 th:text="${icons[thread.iconKey]}">💬</div>
                                            <div>
                                                <div class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="${thread.title}">Chat</div>
                                                <div class="text-xs text-slate-500" th:text="${thread.pinned ? 'Pinned' : 'Recent'}">Recent</div>
                                            </div>
                                        </div>
                                    </a>
                                </div>
                            </div>

                            <aside class="rounded-2xl border border-slate-200 bg-white/90 p-4 shadow-sm dark:border-slate-800 dark:bg-slate-950">
                                <div class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.01931}">Folder settings</div>
                                <form class="mt-4 space-y-3" th:action="@{/chatv2/folder/{id}/settings(id=${folder.id})}" method="post">
                                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <input class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" name="name" th:value="${folder.name}" />
                                    <input class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" name="colorHex" th:value="${folder.colorHex}" />
                                    <select class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" name="iconKey">
                                        <option th:each="entry : ${icons}" th:value="${entry.key}" th:text="${entry.value}" th:selected="${entry.key == folder.iconKey}"></option>
                                    </select>
                                    <button class="inline-flex w-full items-center justify-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white" th:text="#{ui.00109}">Save</button>
                                </form>
                            </aside>
                        </div>
                    </section>

                    <aside class="rounded-2xl border border-slate-200/70 bg-white/80 p-4 shadow-sm backdrop-blur dark:border-slate-800/60 dark:bg-slate-950/70">
                        <div class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.00944}">Quick actions</div>
                        <div class="mt-3 space-y-2">
                            <a href="/calendar" class="inline-flex w-full items-center justify-center rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-sm hover:bg-slate-50" th:text="#{ui.01932}">View calendar</a>
                            <a href="/notes" class="inline-flex w-full items-center justify-center rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-sm hover:bg-slate-50" th:text="#{ui.01933}">Open notes</a>
                        </div>
                    </aside>
                </div>
            </div>
        </div>
    </div>

    <th:block th:fragment="scripts">
        <script src="/js/chat/chat-v2.js" defer></script>
    </th:block>
</th:block>
