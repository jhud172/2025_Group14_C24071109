<div xmlns:th="http://www.thymeleaf.org"
     th:fragment="chatSidebar(folders, threads, icons, activeFolderId, activeThreadId)">
    <aside class="h-full w-full rounded-2xl border border-slate-200/70 bg-white/80 p-4 shadow-sm backdrop-blur dark:border-slate-800/60 dark:bg-slate-950/70">
        <div class="flex items-center justify-between">
            <div class="text-sm font-semibold text-slate-900 dark:text-slate-100" th:text="#{ui.01935}">Chats</div>
            <form th:action="@{/chatv2/new}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-slate-900 px-3 py-1.5 text-xs font-semibold text-white shadow-sm hover:bg-slate-800" th:text="#{ui.01936}">
                    ✨ New
                </button>
            </form>
        </div>

        <div class="mt-4">
            <div class="text-[11px] uppercase tracking-widest text-slate-400" th:text="#{ui.01937}">Folders</div>
            <div class="mt-2 space-y-1">
                <a th:each="folder : ${folders}"
                   th:href="@{/chatv2/folder/{id}(id=${folder.id})}"
                   class="group flex items-center gap-2 rounded-xl border border-transparent px-3 py-2 text-sm text-slate-700 hover:bg-slate-50 dark:text-slate-200 dark:hover:bg-slate-900"
                   th:classappend="${activeFolderId != null and folder.id == activeFolderId} ? ' bg-slate-900 text-white hover:bg-slate-900' : ''">
                    <span class="flex h-6 w-6 items-center justify-center rounded-lg text-xs"
                          data-chat-accent-badge
                          th:attr="data-chat-color=${folder.colorHex}"
                          th:text="${icons[folder.iconKey]}">📁</span>
                    <span class="truncate" th:text="${folder.name}">Folder</span>
                </a>
            </div>
        </div>

        <div class="mt-5">
            <div class="text-[11px] uppercase tracking-widest text-slate-400" th:text="#{ui.01747}">Pinned</div>
            <div class="mt-2 space-y-1">
                <a th:each="thread : ${threads}" th:if="${thread.pinned}"
                   th:href="@{/chatv2/{id}(id=${thread.id})}"
                   class="group flex items-center gap-2 rounded-xl border border-transparent px-3 py-2 text-sm text-slate-700 hover:bg-slate-50 dark:text-slate-200 dark:hover:bg-slate-900"
                   th:classappend="${activeThreadId != null and thread.id == activeThreadId} ? ' bg-slate-900 text-white hover:bg-slate-900' : ''">
                    <span class="flex h-6 w-6 items-center justify-center rounded-lg text-xs"
                          data-chat-accent-badge
                          th:attr="data-chat-color=${thread.colorHex}"
                          th:text="${icons[thread.iconKey]}">💬</span>
                    <span class="truncate" th:text="${thread.title}">Pinned</span>
                </a>
            </div>
        </div>

        <div class="mt-5">
            <div class="text-[11px] uppercase tracking-widest text-slate-400" th:text="#{ui.01748}">Recent</div>
            <div class="mt-2 space-y-1">
                <a th:each="thread : ${threads}" th:if="${!thread.pinned}"
                   th:href="@{/chatv2/{id}(id=${thread.id})}"
                   class="group flex items-center gap-2 rounded-xl border border-transparent px-3 py-2 text-sm text-slate-700 hover:bg-slate-50 dark:text-slate-200 dark:hover:bg-slate-900"
                   th:classappend="${activeThreadId != null and thread.id == activeThreadId} ? ' bg-slate-900 text-white hover:bg-slate-900' : ''">
                    <span class="flex h-6 w-6 items-center justify-center rounded-lg text-xs"
                          data-chat-accent-badge
                          th:attr="data-chat-color=${thread.colorHex}"
                          th:text="${icons[thread.iconKey]}">💬</span>
                    <span class="truncate" th:text="${thread.title}">Chat</span>
                    <span class="ml-auto h-2 w-2 rounded-full bg-slate-200"></span>
                </a>
            </div>
        </div>
    </aside>
</div>
