# Overrides for the Render profile. Shared settings stay in application.properties.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true

spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USER:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=${APP_DATABASE_SCHEMA:public}
server.forward-headers-strategy=native

# Sessions are shared by all instances and survive a service restart.
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m

# Render must never start with an ephemeral saved-card encryption key.
app.encryption.require-persistent-key=${APP_ENCRYPTION_REQUIRE_PERSISTENT_KEY:true}

spring.sql.init.mode=never

# Empty databases run V1. Existing non-empty databases are recorded at V1
# without replaying the baseline, so later migrations can be applied safely.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.default-schema=${APP_DATABASE_SCHEMA:public}
spring.flyway.schemas=${APP_DATABASE_SCHEMA:public}
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
