plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'uk.ac.cf.2025.group14'
version = '0.0.1-SNAPSHOT'
description = 'Group project, building a website to help with behaviour change in a medical context.'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

jacocoTestReport {
	dependsOn test

	reports {
		xml.required = true
		csv.required = false
		html.required = true
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	implementation 'com.github.librepdf:openpdf:1.3.30'
	implementation 'org.jsoup:jsoup:1.18.1'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'com.squareup.okhttp3:okhttp:4.12.0'
	runtimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
	exclude '**/UserRepositoryTest.*'
	exclude '**/UserPreferenceFullContainerMockTests.*'
}

tasks.named('compileTestJava') {
	options.compilerArgs += ['-Xlint:unchecked']
}

tasks.named('bootRun') {
	doFirst {
		def envFile = file('.env')
		if (!envFile.exists()) {
			return
		}

		envFile.eachLine { line ->
			def trimmed = line?.trim()
			if (!trimmed || trimmed.startsWith('#') || !trimmed.contains('=')) {
				return
			}

			def separator = trimmed.indexOf('=')
			def key = trimmed.substring(0, separator).trim()
			def value = trimmed.substring(separator + 1).trim()

			if (key.startsWith('SPRING_MAIL_') || key.startsWith('APP_EMAIL_') || key == 'APP_BASE_URL') {
				environment key, value
			}
		}
	}
}

tasks.register('bcrypt', JavaExec) {
	group = 'help'
	description = 'Prints a BCrypt hash for -Ppw (defaults to Demo123!)'
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(21)
	}
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'uk.ac.cf._5.group14.BehaviourChangeGroupProject.Security.BcryptTool'
	args((project.findProperty('pw') ?: 'Demo123!').toString())
}
